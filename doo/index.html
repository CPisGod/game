<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>두더지 잡기</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1b4d3e; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #board {
    position: relative;
    aspect-ratio: 720 / 800;
    height: min(100vh, 100vw * 800 / 720);
    background: url("assets/background.png") center / 100% 100% no-repeat;
    user-select: none; touch-action: manipulation; overflow: hidden;
  }
  #hud {
    position: absolute; top: 1.5%; left: 3%; right: 3%;
    display: flex; justify-content: space-between; z-index: 5;
    font-weight: 800; font-size: clamp(16px, 4.2vh, 34px); color: #fff;
    text-shadow: 0 2px 0 #0006, 0 0 6px #0008;
  }
  .hole { position: absolute; width: 22%; height: 22%; transform: translateX(-50%); overflow: hidden; }
  .hole img {
    position: absolute; left: 0; bottom: 0; width: 100%;
    transform: translateY(105%); transition: transform .12s ease-out;
    cursor: crosshair; -webkit-user-drag: none; pointer-events: none;
  }
  .hole.up img { transform: translateY(0); pointer-events: auto; }
  .hole.hit img { transform: translateY(105%); transition: none; pointer-events: none; }
  .pop {
    position: absolute; z-index: 6; transform: translate(-50%, 0);
    color: #ffe14d; font-weight: 900; font-size: clamp(20px, 5vh, 40px);
    text-shadow: 0 2px 0 #b34700, 0 0 6px #000a; pointer-events: none;
    animation: pop .7s ease-out forwards;
  }
  @keyframes pop { to { transform: translate(-50%, -60px); opacity: 0; } }
  .overlay {
    position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2vh; text-align: center;
    background: #000a; color: #fff;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(28px, 7vh, 56px); text-shadow: 0 3px 0 #0008; }
  .overlay p { margin: 0; font-size: clamp(16px, 3.5vh, 28px); }
  button {
    font: inherit; font-weight: 800; font-size: clamp(20px, 4.5vh, 36px);
    padding: .5em 1.6em; border: 0; border-radius: 999px; cursor: pointer;
    background: #ffd23f; color: #5a3200; box-shadow: 0 5px 0 #b8861b;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8861b; }
  #count { font-size: clamp(80px, 25vh, 200px); font-weight: 900; text-shadow: 0 6px 0 #0008; }

  /* ===== 최대 효과 ===== */
  .corpse { position: absolute; z-index: 4; pointer-events: none; transform-origin: 50% 80%; animation: die 2.4s cubic-bezier(.45,.05,.55,.95) forwards; }
  .corpse img { width: 100%; display: block; animation: deadtint 2.4s forwards; }
  @keyframes deadtint {
    0% { filter: brightness(2.5) sepia(1) saturate(8) hue-rotate(-30deg); }
    18% { filter: brightness(1) sepia(1) saturate(6) hue-rotate(-30deg); }
    35%,100% { filter: grayscale(1) brightness(.85); }
  }
  @keyframes die {
    0% { transform: translate(0,0) scale(1.25, .75); }
    6% { transform: translate(0,-4%) scale(.9, 1.15); }
    14% { transform: translate(0,0) scale(1.05) rotate(-12deg); }
    22% { transform: translate(0,0) scale(1) rotate(10deg); }
    30% { transform: translate(0,0) scale(1) rotate(-6deg); }
    38% { transform: translate(0,0) scale(1) rotate(0); }
    100% { transform: translate(var(--fx), -300%) scale(.4) rotate(var(--rot)); opacity: 0; }
  }
  .ghost { position: absolute; z-index: 6; pointer-events: none; font-size: clamp(34px, 8vh, 64px);
    transform: translate(-50%, 0); animation: ghost 2.2s ease-out forwards; filter: drop-shadow(0 0 8px #fff); }
  @keyframes ghost {
    0% { opacity: 0; transform: translate(-50%, 0) scale(.4); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--gx)), -190px) scale(1.5) rotate(var(--gr)); }
  }
  .spark { position: absolute; z-index: 6; pointer-events: none; transform: translate(-50%, -50%);
    animation: spark .8s cubic-bezier(.1,.7,.3,1) forwards; }
  @keyframes spark {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(.3) rotate(0); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4) rotate(var(--r)); }
  }
  .ring { position: absolute; z-index: 5; pointer-events: none; border: 6px solid #fff; border-radius: 50%;
    transform: translate(-50%, -50%) scale(0); animation: ring .55s ease-out forwards; }
  @keyframes ring { to { transform: translate(-50%, -50%) scale(1); opacity: 0; border-width: 1px; } }
  .combo { position: absolute; z-index: 8; left: 50%; top: 12%; transform: translateX(-50%);
    font-weight: 900; font-size: clamp(30px, 8vh, 64px); color: #ff4d4d; white-space: nowrap;
    -webkit-text-stroke: 2px #fff; text-shadow: 0 4px 0 #7a0000, 0 0 14px #000a; pointer-events: none;
    animation: combo .9s ease-out forwards; }
  @keyframes combo {
    0% { opacity: 0; transform: translateX(-50%) scale(.2) rotate(-10deg); }
    25% { opacity: 1; transform: translateX(-50%) scale(1.3) rotate(4deg); }
    100% { opacity: 0; transform: translateX(-50%) scale(1) translateY(-40px); }
  }
  .pop { font-size: clamp(28px, 7vh, 56px); animation: pop2 .9s ease-out forwards; -webkit-text-stroke: 1.5px #7a2f00; }
  @keyframes pop2 {
    0% { opacity: 0; transform: translate(-50%, 0) scale(.3); }
    20% { opacity: 1; transform: translate(-50%, -20px) scale(1.5); }
    100% { opacity: 0; transform: translate(-50%, -90px) scale(1); }
  }
  #score.bump { display: inline-block; animation: bump .3s; }
  @keyframes bump { 50% { transform: scale(1.8); color: #ffe14d; } }
</style>
</head>
<body>
<div id="board">
  <div id="hud"><span>점수: <b id="score">0</b></span><span>시간: <b id="time">30</b></span></div>

  <div id="start" class="overlay">
    <h1>두더지 잡기</h1>
    <p>구멍에서 나오는 얼굴을 클릭하세요!<br>30초 안에 최대한 많이 잡기 (1마리 = 10점)</p>
    <button id="startBtn">시작</button>
  </div>
  <div id="countdown" class="overlay hidden"><div id="count">3</div></div>
  <div id="end" class="overlay hidden">
    <h1>게임 종료!</h1>
    <p>최종 점수: <b id="final">0</b>점</p>
    <button id="retryBtn">다시 하기</button>
  </div>
</div>

<script>
(() => {
  const GAME_SECONDS = 30, POINTS = 10;
  // 구멍 중심 좌표(배경 이미지 720x800 기준, %)
  const HOLES = [
    [16.7, 38.5], [50, 38.5], [82.9, 38.5],
    [33.3, 61.5], [66, 61.5],
    [16.7, 85.5], [50, 85.5], [82.9, 85.5],
  ];
  const board = document.getElementById('board');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), timeEl = $('time');

  const holes = HOLES.map(([x, y]) => {
    const h = document.createElement('div');
    h.className = 'hole';
    h.style.left = x + '%';
    h.style.top = (y - 22) + '%'; // 아래쪽 가장자리를 구멍 중심에 맞춤
    const img = document.createElement('img');
    img.src = 'assets/face.png'; img.alt = ''; img.draggable = false;
    h.appendChild(img);
    board.appendChild(h);
    return { el: h, img, x, y, timer: null, deadUntil: 0 };
  });

  // 효과음: 죽음.m4a (여러 번 겹쳐 재생 가능하도록 매번 복제)
  new Image().src = 'assets/face_dead.png';
  const sfx = new Audio(encodeURI('죽음.m4a'));
  sfx.preload = 'auto';
  function playSfx() {
    try { const a = sfx.cloneNode(); a.playbackRate = rnd(0.9, 1.25); a.play().catch(() => {}); } catch (e) {}
  }


  const SPARKS = ['⭐','✨','💥','💫','🌟'];
  let combo = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);

  function add(el, ms) { board.appendChild(el); setTimeout(() => el.remove(), ms); return el; }

  function killEffect(h) {
    const W = board.clientWidth, H = board.clientHeight;
    const cx = h.x / 100 * W, cy = h.y / 100 * H;
    const fw = W * 0.22, fh = fw * 242 / 220;

    // 1) 얼굴 사망 연출: 빨간 번쩍 → 회색으로 변하며 X눈, 빙글빙글 날아감
    const corpse = document.createElement('div');
    corpse.className = 'corpse';
    corpse.style.cssText = `left:${cx - fw / 2}px; top:${cy - fh}px; width:${fw}px;` +
      `--fx:${rnd(-120, 120)}px; --rot:${rnd(-1080, 1080)}deg;`;
    corpse.innerHTML = '<img src="assets/face_dead.png" alt="">';
    add(corpse, 2450);

    // 2) 유령(영혼)이 빠져나감
    for (let i = 0; i < 2; i++) {
      const g = document.createElement('div');
      g.className = 'ghost'; g.textContent = '👻';
      g.style.cssText = `left:${cx + rnd(-30, 30)}px; top:${cy - fh}px; --gx:${rnd(-70, 70)}px; --gr:${rnd(-25, 25)}deg; animation-delay:${i * .3}s`;
      add(g, 2400);
    }

    // 3) 별/불꽃 파티클 폭발
    for (let i = 0; i < 16; i++) {
      const a = Math.PI * 2 * i / 16 + rnd(-.2, .2), d = rnd(80, 190);
      const sp = document.createElement('div');
      sp.className = 'spark';
      sp.textContent = SPARKS[i % SPARKS.length];
      sp.style.cssText = `left:${cx}px; top:${cy - fh / 2}px; font-size:${rnd(20, 38)}px;` +
        `--dx:${Math.cos(a) * d}px; --dy:${Math.sin(a) * d}px; --r:${rnd(-360, 360)}deg;`;
      add(sp, 900);
    }

    // 4) 충격파 링 (2겹)
    [0, 80].forEach(delay => {
      const r = document.createElement('div');
      r.className = 'ring';
      r.style.cssText = `left:${cx}px; top:${cy - fh / 2}px; width:${fw * 2.2}px; height:${fw * 2.2}px; animation-delay:${delay}ms`;
      add(r, 700);
    });


    // 6) 점수 튕김 + 콤보 텍스트
    scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
    combo++;
    if (combo >= 2) {
      const c = document.createElement('div');
      c.className = 'combo';
      c.textContent = combo + ' COMBO! ' + (combo >= 5 ? '🔥' : '💀');
      add(c, 950);
    }
  }

  let score = 0, left = GAME_SECONDS, running = false, tick = null, spawn = null, current = null;

  function show(id, on) { $(id).classList.toggle('hidden', !on); }

  function popText(x, y) {
    const p = document.createElement('div');
    p.className = 'pop'; p.textContent = '+' + POINTS;
    p.style.left = x + '%'; p.style.top = (y - 20) + '%';
    board.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }

  function hideHole(h) {
    clearTimeout(h.timer);
    h.el.classList.remove('up');
    if (current === h) current = null;
  }

  function spawnMole() {
    if (!running) return;
    const now = performance.now();
    const free = holes.filter(h => h !== current && h.deadUntil < now);
    const h = free[Math.floor(Math.random() * free.length)];
    h.el.classList.remove('hit');
    h.el.classList.add('up');
    current = h;
    const elapsed = GAME_SECONDS - left;
    const stay = Math.max(550, 1000 - elapsed * 15); // 시간이 갈수록 빨라짐
    h.timer = setTimeout(() => { combo = 0; hideHole(h); spawn = setTimeout(spawnMole, 250); }, stay);
  }

  holes.forEach(h => {
    h.el.addEventListener('pointerdown', e => {
      if (!running || !h.el.classList.contains('up')) return;
      e.preventDefault();
      clearTimeout(h.timer);
      h.el.classList.remove('up');
      h.el.classList.add('hit');
      if (current === h) current = null;
      killEffect(h);
      h.deadUntil = performance.now() + 2500; // 죽는 연출 동안 이 구멍에서 다시 안 나옴
      score += POINTS; scoreEl.textContent = score;
      popText(h.x, h.y);
      playSfx();
      clearTimeout(spawn);
      spawn = setTimeout(spawnMole, 250);
    });
  });

  function startCountdown() {
    show('start', false); show('end', false); show('countdown', true);
    let n = 3; $('count').textContent = n;
    const iv = setInterval(() => {
      n--;
      if (n > 0) $('count').textContent = n;
      else { clearInterval(iv); show('countdown', false); startGame(); }
    }, 1000);
  }

  function startGame() {
    score = 0; combo = 0; left = GAME_SECONDS; running = true;
    scoreEl.textContent = 0; timeEl.textContent = left;
    tick = setInterval(() => {
      left--; timeEl.textContent = left;
      if (left <= 0) endGame();
    }, 1000);
    spawnMole();
  }

  function endGame() {
    running = false;
    clearInterval(tick); clearTimeout(spawn);
    holes.forEach(hideHole);
    $('final').textContent = score;
    show('end', true);
  }

  $('startBtn').onclick = startCountdown;
  $('retryBtn').onclick = startCountdown;
})();
</script>
</body>
</html>
