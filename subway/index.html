<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>스쿨 서퍼 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0ee; touch-action: none; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .home-btn { position: fixed; right: 12px; bottom: 12px; z-index: 9999; padding: 8px 14px; border-radius: 999px;
    background: #000a; color: #fff; font: 700 14px/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    text-decoration: none; border: 1px solid #fff6; }
  .home-btn:active { transform: translateY(2px); }

  #hud { position: fixed; left: 14px; top: 12px; z-index: 10; display: none; gap: 10px; align-items: baseline; text-shadow: 0 2px 6px #0008; }
  #hud .dist { font-size: 34px; font-weight: 900; letter-spacing: 1px; }
  #hud .unit { font-size: 16px; opacity: .85; font-weight: 700; }
  #hint { position: fixed; left: 0; right: 0; bottom: 16px; z-index: 10; text-align: center; font-size: 14px; font-weight: 700;
    text-shadow: 0 2px 6px #000a; opacity: 0; transition: opacity .6s; pointer-events: none; padding: 0 130px; }

  #intro { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 6vh 16px 9vh; pointer-events: none; transition: opacity .5s; text-align: center; }
  #intro.gone { opacity: 0; }
  #intro h1 { margin: 0; font-size: clamp(34px, 8vw, 72px); font-weight: 900; letter-spacing: 2px;
    text-shadow: 0 4px 0 #2a5bd7, 0 8px 18px #0006; -webkit-text-stroke: 2px #1f3f9e; }
  #intro h1 small { display: block; font-size: .36em; letter-spacing: 6px; color: #ffe27a; -webkit-text-stroke: 0; text-shadow: 0 2px 8px #0008; margin-top: 6px; }
  #startBtn { pointer-events: auto; cursor: pointer; border: 0; padding: 16px 44px; border-radius: 999px;
    font: 900 clamp(20px, 4vw, 26px)/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; letter-spacing: 3px;
    color: #3b2a00; background: linear-gradient(#ffe27a, #ffb938); box-shadow: 0 6px 0 #c47f10, 0 12px 24px #0005; }
  #startBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c47f10, 0 6px 12px #0005; }
  #startBtn[disabled] { filter: grayscale(.8); cursor: default; }
  #intro p { margin: 12px 0 0; font-size: 14px; opacity: .92; text-shadow: 0 2px 6px #000a; line-height: 1.6; }
  #hud .coinbox { display: inline-flex; align-items: center; gap: 7px; margin-left: 18px; align-self: center; }
  #hud .cico { width: 24px; height: 24px; border-radius: 50%; display: inline-block;
    background: radial-gradient(circle at 35% 30%, #fff3b0 0 18%, #ffd23f 45%, #e69a10 100%); border: 2px solid #b8740a; box-shadow: 0 2px 6px #0006; }
  .fly { position: fixed; z-index: 11; width: 28px; height: 28px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #fff8c8 0 15%, #ffd23f 45%, #e69a10 100%); border: 2px solid #b8740a;
    box-shadow: 0 0 10px #ffd23f, 0 0 24px #ffb300aa; }
  #hud .coins { font-size: 26px; font-weight: 900; color: #ffe27a; }
  #warn { position: fixed; left: 0; right: 0; top: 18%; z-index: 12; text-align: center; font: 900 clamp(22px, 5vw, 38px)/1.2 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: #fff; -webkit-text-stroke: 1px #7a1010; text-shadow: 0 3px 0 #c42020, 0 6px 16px #0008; opacity: 0; transform: scale(.8); pointer-events: none; transition: opacity .2s, transform .2s; }
  #warn.show { opacity: 1; transform: scale(1); animation: warnShake .12s infinite alternate; }
  @keyframes warnShake { from { translate: -3px 0; } to { translate: 3px 0; } }

  #over { position: fixed; inset: 0; z-index: 25; display: none; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(#0000 30%, #0008); text-align: center; }
  #over.show { display: flex; animation: overIn .35s ease-out; }
  @keyframes overIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  #over .card { background: #101a2ae6; border: 2px solid #ffffff40; border-radius: 22px; padding: 22px 30px 20px; min-width: min(86vw, 340px);
    box-shadow: 0 16px 50px #0009; }
  #over h2 { margin: 0 0 4px; font-size: clamp(26px, 6vw, 38px); font-weight: 900; color: #ffe27a; text-shadow: 0 3px 0 #a5560a; }
  #over .why { font-size: 15px; opacity: .85; margin-bottom: 14px; }
  #over .stats { display: flex; justify-content: center; gap: 22px; margin-bottom: 18px; }
  #over .stats div { display: flex; flex-direction: column; gap: 4px; }
  #over .stats small { font-size: 12px; opacity: .7; }
  #over .stats b { font-size: 26px; font-weight: 900; }
  #over .newbest { display: none; color: #7dffb0; font-weight: 900; margin: -8px 0 12px; }
  #over .newbest.show { display: block; }
  #retryBtn { cursor: pointer; border: 0; padding: 14px 34px; border-radius: 999px; font: 900 20px/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    letter-spacing: 2px; color: #3b2a00; background: linear-gradient(#ffe27a, #ffb938); box-shadow: 0 5px 0 #c47f10, 0 10px 20px #0005; }
  #retryBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c47f10, 0 5px 10px #0005; }
  #over .tip { margin: 12px 0 0; font-size: 12px; opacity: .6; }
  #skinSel { pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
  #skinSel button { cursor: pointer; width: 52px; height: 52px; border-radius: 50%; border: 2px solid #ffffff90; background: #0e1b3acc; color: #fff; font-size: 22px; line-height: 1;
    box-shadow: 0 4px 12px #0005; }
  #skinSel button:active { transform: scale(.92); }
  #skName { min-width: 170px; padding: 10px 16px; border-radius: 999px; background: #0e1b3acc; border: 2px solid #ffffff60; font-size: 22px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 6px #000a; }
  #skDots { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
  #skDots i { width: 9px; height: 9px; border-radius: 50%; background: #ffffff55; transition: all .2s; }
  #skDots i.on { background: #ffe27a; transform: scale(1.35); }
  #msg { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px;
    background: #101820; font-size: 18px; line-height: 1.7; }
</style>
</head>
<body>
<a class="home-btn" href="../">🏠 메인 메뉴</a>

<canvas id="gl"></canvas>

<div id="hud"><span class="dist" id="dist">0</span><span class="unit">m</span><span class="coinbox"><i class="cico"></i><span class="coins" id="coins">0</span></span></div>

<div id="over">
  <div class="card">
    <h2>앗! 부딪혔어요</h2>
    <div class="why" id="oWhy"></div>
    <div class="stats">
      <div><small>달린 거리</small><b id="oDist">0m</b></div>
      <div><small>코인</small><b id="oCoin">0</b></div>
      <div><small>최고 기록</small><b id="oBest">0m</b></div>
    </div>
    <div class="newbest" id="oNew">🏆 신기록!</div>
    <button id="retryBtn">↻ 캐릭터 선택으로</button>
    <p class="tip">Space / Enter 로도 돌아가요</p>
  </div>
</div>

<div id="intro">
  <h1>스쿨 서퍼<small>3D · 복도 질주</small></h1>
  <div>
    <div id="skinSel"><button id="skPrev" aria-label="이전 캐릭터">◀</button><div id="skName"></div><button id="skNext" aria-label="다음 캐릭터">▶</button></div>
    <div id="skDots"><i></i><i></i><i></i><i></i><i></i></div>
    <button id="startBtn" disabled>로딩 중…</button>
    <p>← → 키나 좌우 스와이프로 캐릭터를 고르고 시작을 누르면 복도를 달려요</p>
  </div>
</div>

<div id="msg"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
const $ = id => document.getElementById(id);
const fail = (text) => { const m = $('msg'); m.style.display = 'flex'; m.innerHTML = text; };

let THREE, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, RoomEnvironment, RoundedBoxGeometry, mergeGeometries;
try {
  THREE = await import('three');
  ({ EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js'));
  ({ RenderPass } = await import('three/addons/postprocessing/RenderPass.js'));
  ({ UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js'));
  ({ OutputPass } = await import('three/addons/postprocessing/OutputPass.js'));
  ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
  ({ RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
  ({ mergeGeometries } = await import('three/addons/utils/BufferGeometryUtils.js'));
} catch (e) {
  fail('3D 엔진(three.js)을 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침 해주세요.');
  throw e;
}

// ───────────────────────── 렌더러 / 씬 ─────────────────────────
const canvas = $('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  fail('이 브라우저에서는 WebGL을 쓸 수 없어요.');
  throw e;
}
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const FOG = 0xd6e4f0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(FOG, 26, 135);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 220);

// 조명: 창문으로 들어오는 햇빛(그림자) + 반구광 + 정면 보조광
scene.add(new THREE.HemisphereLight(0xeaf4ff, 0xb9a98a, 0.55));
const sun = new THREE.DirectionalLight(0xfff0d4, 1.7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const SH = 9;
Object.assign(sun.shadow.camera, { left: -SH, right: SH, top: SH, bottom: -SH, near: 1, far: 50 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xdfeaff, 0.3);
fill.position.set(3, 4, 9);
scene.add(fill);

// 후처리: MSAA + 블룸(형광등) + 톤매핑
let composer = null;
try {
  const rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), 0.3, 0.5, 1.05));
  composer.addPass(new OutputPass());
} catch (e) { composer = null; }

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  if (composer) { composer.setPixelRatio(DPR); composer.setSize(w, h); }
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

// ───────────────────────── 텍스처(캔버스로 그림) ─────────────────────────
const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
function canvasTex(w, h, draw, repeat = [1, 1]) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = MAX_ANISO;
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// 바닥: 민트 회색 체크 리놀륨
const floorTex = canvasTex(512, 512, (g, w, h) => {
  const T = w / 2;
  for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {
    g.fillStyle = (x + y) % 2 ? '#c4d0c6' : '#d6dfd2';
    g.fillRect(x * T, y * T, T, T);
  }
  for (let i = 0; i < 5000; i++) {
    g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '90,110,95'},${rnd(.04, .14)})`;
    g.fillRect(Math.random() * w, Math.random() * h, rnd(1, 3), rnd(1, 3));
  }
  g.strokeStyle = 'rgba(95,115,100,.55)'; g.lineWidth = 3;
  g.strokeRect(1.5, 1.5, w - 3, h - 3);
  g.beginPath(); g.moveTo(T, 0); g.lineTo(T, h); g.moveTo(0, T); g.lineTo(w, T); g.stroke();
}, [9 / 2.4, 36 / 2.4]);

// 벽: 위는 크림색, 아래는 민트색 띠
const wallTex = canvasTex(128, 512, (g, w, h) => {
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#f6efd9'); grad.addColorStop(.62, '#efe6c8'); grad.addColorStop(.63, '#7fb7a4'); grad.addColorStop(1, '#6fa592');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(0,0,0,.06)'; g.fillRect(0, 0, 2, h);
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, h * .622, w, 3);
}, [12, 1]);
wallTex.wrapT = THREE.ClampToEdgeWrapping;

// 사물함 문짝(회색 톤 — 인스턴스 색이 곱해짐)
const lockerTex = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#e9edf0'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
  g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 2; g.strokeRect(10, 10, w - 20, h - 20);
  g.fillStyle = 'rgba(0,0,0,.45)';
  for (let i = 0; i < 7; i++) g.fillRect(48, 34 + i * 15, w - 96, 6);
  for (let i = 0; i < 4; i++) g.fillRect(48, h - 150 + i * 15, w - 96, 6);
  g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(70, 160, 116, 40);
  g.fillStyle = 'rgba(0,0,0,.5)'; g.font = `bold 26px ${FONT}`; g.textAlign = 'center'; g.fillText(String(Math.floor(rnd(100, 999))), 128, 190);
  g.fillStyle = '#444'; g.fillRect(190, 250, 14, 70);
  g.fillStyle = '#999'; g.fillRect(193, 253, 5, 64);
});

// 천장 타일
const ceilTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#f1f1ec'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(120,120,110,${rnd(.03, .09)})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.strokeStyle = 'rgba(110,110,100,.6)'; g.lineWidth = 4; g.strokeRect(0, 0, w, h);
}, [9 / 1.2, 36 / 1.2]);

// 창문 밖 풍경
const skyTex = canvasTex(256, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#6fb4ff'); gr.addColorStop(.7, '#cfe8ff'); gr.addColorStop(1, '#eef7ff');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.9)';
  [[50, 60, 38], [92, 52, 30], [190, 90, 34], [225, 82, 24]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); });
  g.fillStyle = '#5fa85a';
  for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(i * 34 + 8, h - 12, rnd(26, 42), 0, 7); g.fill(); }
  g.fillStyle = '#3f8d46'; g.fillRect(0, h - 14, w, 14);
});

// 게시판 (코르크 + 종이)
const boardTex = canvasTex(512, 300, (g, w, h) => {
  g.fillStyle = '#c28d57'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '90,55,20' : '240,200,150'},${rnd(.05, .2)})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  const papers = [['급식표', '#fff6b0'], ['동아리 모집', '#ffb3c7'], ['시험 D-3', '#b8e6ff'], ['분실물', '#d6f5b8'], ['체육대회', '#ffd6a0']];
  papers.forEach(([t, c], i) => {
    const x = 22 + (i % 3) * 160 + rnd(-6, 6), y = 24 + Math.floor(i / 3) * 140 + rnd(-8, 8);
    g.save(); g.translate(x + 65, y + 55); g.rotate(rnd(-.07, .07));
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(-60, -48, 130, 104);
    g.fillStyle = c; g.fillRect(-65, -52, 130, 104);
    g.fillStyle = '#e33'; g.beginPath(); g.arc(0, -44, 5, 0, 7); g.fill();
    g.fillStyle = '#333'; g.font = `bold 20px ${FONT}`; g.textAlign = 'center'; g.fillText(t, 0, -8);
    g.fillStyle = 'rgba(0,0,0,.25)'; for (let l = 0; l < 3; l++) g.fillRect(-48, 8 + l * 14, 96 - l * 14, 5);
    g.restore();
  });
});

// 교실 문 / 문패 / 포스터
const doorTex = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#9a6a3c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) { g.strokeStyle = `rgba(70,40,15,${rnd(.05, .16)})`; g.lineWidth = rnd(1, 3); g.beginPath(); const x = rnd(0, w); g.moveTo(x, 0); g.lineTo(x + rnd(-6, 6), h); g.stroke(); }
  g.strokeStyle = 'rgba(60,35,10,.7)'; g.lineWidth = 8; g.strokeRect(14, 14, w - 28, h - 28);
  g.fillStyle = 'rgba(60,35,10,.35)'; g.fillRect(34, 300, w - 68, 170);
  g.fillStyle = '#d8d8d8'; g.fillRect(200, 250, 12, 44);
});
const signMats = [];
for (let i = 0; i < 6; i++) {
  const tex = canvasTex(256, 96, (g, w, h) => {
    g.fillStyle = '#2b4c8c'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#fff'; g.lineWidth = 4; g.strokeRect(6, 6, w - 12, h - 12);
    g.fillStyle = '#fff'; g.font = `900 46px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(`${1 + (i % 3)}-${1 + Math.floor(i * 1.7) % 9}반`, w / 2, h / 2 + 3);
  });
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  signMats.push(new THREE.MeshStandardMaterial({ map: tex, roughness: .5 }));
}
const posterMats = ['독서 주간', '안전 제일', '급식 맛있다', '건강 달리기'].map((t, i) => {
  const cols = ['#ff9f43', '#ee5253', '#1dd1a1', '#54a0ff'];
  const tex = canvasTex(200, 280, (g, w, h) => {
    g.fillStyle = cols[i]; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(14, 14, w - 28, h - 28);
    g.fillStyle = cols[i]; g.beginPath(); g.arc(w / 2, 100, 52, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(w / 2, 100, 30, 0, 7); g.fill();
    g.fillStyle = '#333'; g.font = `900 30px ${FONT}`; g.textAlign = 'center'; g.fillText(t, w / 2, 215);
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(40, 235, w - 80, 6);
  });
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  return new THREE.MeshStandardMaterial({ map: tex, roughness: .7 });
});
const dashTex = canvasTex(32, 128, (g, w, h) => {
  g.clearRect(0, 0, w, h); g.fillStyle = 'rgba(255,255,255,.75)'; g.fillRect(0, 10, w, 70);
}, [1, 36 / 3]);

// ───────────────────────── 학교 복도 ─────────────────────────
const L = 36, HALF = 4.5, H = 5.2, PERIOD = 9, SEG_N = 6;
const mFloor = new THREE.MeshStandardMaterial({ map: floorTex, roughness: .42, metalness: 0, envMapIntensity: .45 });
const mWall = new THREE.MeshStandardMaterial({ map: wallTex, roughness: .9 });
const mCeil = new THREE.MeshStandardMaterial({ map: ceilTex, roughness: .95 });
const mLocker = new THREE.MeshStandardMaterial({ map: lockerTex, roughness: .4, metalness: .45, envMapIntensity: .9 });
const mDoor = new THREE.MeshStandardMaterial({ map: doorTex, roughness: .6 });
const mFrame = new THREE.MeshStandardMaterial({ color: 0x4a2f18, roughness: .7 });
const mGlass = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xcfe9ff, emissiveIntensity: .9, roughness: .2 });
const mWindowSky = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: skyTex, emissiveIntensity: 1.15, roughness: .3 });
const mWinFrame = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: .5 });
const mBoard = new THREE.MeshStandardMaterial({ map: boardTex, roughness: .9 });
const mBoardFrame = new THREE.MeshStandardMaterial({ color: 0xb4793a, roughness: .6 });
const mLamp = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
const mLampBox = new THREE.MeshStandardMaterial({ color: 0xbfc4c8, roughness: .5 });
const mDash = new THREE.MeshBasicMaterial({ map: dashTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });

const gLocker = new THREE.BoxGeometry(.58, 2.05, .5);
const gPlane = new THREE.PlaneGeometry(1, 1);
const gBox = new THREE.BoxGeometry(1, 1, 1);
const LOCKER_COLORS = [0x2f7fc1, 0x2fa38a, 0xe0833a, 0xc94b5a, 0x6c63b8, 0xd9b83a].map(c => new THREE.Color(c));

function mesh(geo, mat, x, y, z, sx = 1, sy = 1, sz = 1, ry = 0, shadow = false) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.rotation.y = ry;
  m.castShadow = shadow; m.receiveShadow = true;
  return m;
}

function buildSegment() {
  const seg = new THREE.Group();
  // 바닥 / 천장 / 벽
  const floor = mesh(gPlane, mFloor, 0, 0, -L / 2, HALF * 2, L, 1); floor.rotation.x = -Math.PI / 2; seg.add(floor);
  const ceil = mesh(gPlane, mCeil, 0, H, -L / 2, HALF * 2, L, 1); ceil.rotation.x = Math.PI / 2; ceil.receiveShadow = false; seg.add(ceil);
  const wl = mesh(gPlane, mWall, -HALF, H / 2, -L / 2, L, H, 1, Math.PI / 2); seg.add(wl);
  const wr = mesh(gPlane, mWall, HALF, H / 2, -L / 2, L, H, 1, -Math.PI / 2); seg.add(wr);
  // 레인 점선
  for (const x of [-1.1, 1.1]) { const d = mesh(gPlane, mDash, x, .01, -L / 2, .1, L, 1); d.rotation.x = -Math.PI / 2; d.receiveShadow = false; seg.add(d); }

  // 사물함 (좌우 각 48개 — 인스턴스)
  const per = 6 * 2 * (L / PERIOD);
  const lockers = new THREE.InstancedMesh(gLocker, mLocker, per * 2);
  lockers.castShadow = true; lockers.receiveShadow = true;
  const dummy = new THREE.Object3D();
  let n = 0;
  for (const side of [-1, 1]) {
    for (let p = 0; p < L / PERIOD; p++) for (const start of [0, 5.4]) for (let j = 0; j < 6; j++) {
      dummy.position.set(side * (HALF - .25), 1.025, -(p * PERIOD + start + .3 + j * .6));
      dummy.rotation.set(0, -side * Math.PI / 2, 0);
      dummy.updateMatrix();
      lockers.setMatrixAt(n++, dummy.matrix);
    }
  }
  lockers.instanceMatrix.needsUpdate = true;
  seg.userData.lockers = lockers;
  seg.add(lockers);

  // 형광등 (2줄)
  const lamps = new THREE.InstancedMesh(gBox, mLamp, 12);
  const boxes = new THREE.InstancedMesh(gBox, mLampBox, 12);
  let li = 0;
  for (const x of [-1.8, 1.8]) for (let k = 0; k < 6; k++) {
    dummy.rotation.set(0, 0, 0);
    dummy.position.set(x, H - .04, -(3 + k * 6)); dummy.scale.set(.5, .04, 2.6); dummy.updateMatrix(); lamps.setMatrixAt(li, dummy.matrix);
    dummy.position.set(x, H - .02, -(3 + k * 6)); dummy.scale.set(.64, .06, 2.76); dummy.updateMatrix(); boxes.setMatrixAt(li, dummy.matrix);
    li++;
  }
  seg.add(lamps, boxes);

  seg.userData.signs = [];
  for (let p = 0; p < L / PERIOD; p++) {
    const zc = -(p * PERIOD + 4.5);
    // 오른쪽: 교실 문
    seg.add(mesh(gBox, mFrame, HALF - .05, 1.28, zc, .1, 2.56, 1.5));
    seg.add(mesh(gBox, mDoor, HALF - .12, 1.2, zc, .1, 2.4, 1.2, 0, true));
    const glass = mesh(gPlane, mGlass, HALF - .176, 1.75, zc, .42, .85, 1, -Math.PI / 2); seg.add(glass);
    const sign = mesh(gPlane, signMats[0], HALF - .1, 2.88, zc, .9, .34, 1, -Math.PI / 2); seg.add(sign);
    seg.userData.signs.push(sign);
    // 왼쪽: 게시판
    seg.add(mesh(gBox, mBoardFrame, -HALF + .04, 1.65, zc, .08, 1.5, 2.2));
    seg.add(mesh(gPlane, mBoard, -HALF + .09, 1.65, zc, 2.0, 1.3, 1, Math.PI / 2));
    // 왼쪽: 높은 창문 (사물함 위)
    for (const dz of [-2.6, 2.6]) {
      const zw = zc + dz;
      seg.add(mesh(gBox, mWinFrame, -HALF + .04, 3.45, zw, .08, 1.6, 2.3));
      seg.add(mesh(gPlane, mWindowSky, -HALF + .09, 3.45, zw, 2.14, 1.44, 1, Math.PI / 2));
      seg.add(mesh(gBox, mWinFrame, -HALF + .11, 3.45, zw, .04, 1.44, .06));
      seg.add(mesh(gBox, mWinFrame, -HALF + .11, 3.45, zw, .04, .06, 2.14));
    }
    // 오른쪽 위: 포스터
    for (const dz of [-2.7, 2.7]) {
      const post = mesh(gPlane, pick(posterMats), HALF - .02, 3.3, zc + dz, 1.0, 1.4, 1, -Math.PI / 2);
      seg.add(post);
    }
  }
  return seg;
}

function randomizeSegment(seg) {
  const lk = seg.userData.lockers, c = new THREE.Color();
  for (let i = 0; i < lk.count; i += 6) {
    c.copy(pick(LOCKER_COLORS)).multiplyScalar(rnd(.9, 1.05));
    for (let j = 0; j < 6; j++) lk.setColorAt(i + j, c);
  }
  lk.instanceColor.needsUpdate = true;
  seg.userData.signs.forEach(s => { s.material = pick(signMats); });
}

const segs = [];
for (let i = 0; i < SEG_N; i++) {
  const s = buildSegment();
  s.position.z = L * (1 - i);
  randomizeSegment(s);
  scene.add(s);
  segs.push(s);
}

// ───────────────────────── 스프라이트 기반 입체 캐릭터 ─────────────────────────
// 좌표: 얼굴은 -Z, 등은 +Z. 원본 도트의 계단 실루엣과 색면을 입체 블록으로 재해석.
// 각 캐릭터는 기존 root/rig/torso/head/tail/ears/eyes/arms/legs 계약을 그대로 유지한다.
// 모든 소품은 손 관절 아래, 움직이는 장식은 별도 Group 아래 배치한다.
const SPRITE_BOX = new THREE.BoxGeometry(1, 1, 1);
const SPRITE_MATERIALS = new Map();
function spriteMaterial(color, glow = 0) {
  const key = `${color}:${glow}`;
  if (!SPRITE_MATERIALS.has(key)) {
    SPRITE_MATERIALS.set(key, new THREE.MeshStandardMaterial({
      color, roughness: .92, metalness: 0, flatShading: true,
      emissive: glow ? color : 0x000000, emissiveIntensity: glow,
    }));
  }
  return SPRITE_MATERIALS.get(key);
}
function spriteGroup(parent, name, x = 0, y = 0, z = 0) {
  const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); parent.add(g); return g;
}
function spriteBox(parent, color, x, y, z, w, h, d, name = '', glow = 0) {
  const mesh = new THREE.Mesh(SPRITE_BOX, spriteMaterial(color, glow));
  mesh.name = name; mesh.position.set(x, y, z); mesh.scale.set(w, h, d);
  mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh;
}
// 두 점을 잇는 가는 블록. 뼈·뿌리·꼬리·목도리의 꺾임에 같은 연결 처리를 쓴다.
function spriteBeam(parent, color, from, to, width, depth = width, name = '') {
  const a = new THREE.Vector3(...from), b = new THREE.Vector3(...to);
  const dir = b.clone().sub(a), len = dir.length();
  const mid = a.clone().add(b).multiplyScalar(.5);
  const m = spriteBox(parent, color, mid.x, mid.y, mid.z, width, len + .012, depth, name);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize()); return m;
}
// [밑면 Y, 폭, 깊이, 높이]로 쌓는 계단형 실루엣. 한 덩어리 구체를 사용하지 않는다.
function spriteSteps(parent, rows, palette, z = 0, name = '계단형 볼륨') {
  rows.forEach(([bottom, width, depth, height], i) => {
    const y = bottom + height / 2;
    spriteBox(parent, palette.base, 0, y, z, width, height + .002, depth, name + i);
    // 옆면과 뒷면은 한 톤 짙게, 정면에는 원본의 주조색을 유지한다.
    spriteBox(parent, palette.shade, -width / 2 + .009, y, z, .02, height, depth + .004);
    spriteBox(parent, palette.shade, width / 2 - .009, y, z, .02, height, depth + .004);
    spriteBox(parent, palette.shade, 0, y, z + depth / 2, width - .02, height, .014);
    if (palette.light && i === rows.length - 1)
      spriteBox(parent, palette.light, 0, bottom + height + .003, z, width - .025, .012, depth - .025);
  });
}
// 도트 무늬를 입체 표면에 배치. 공백/점은 투명, 행의 첫 줄이 위쪽이다.
function spritePixels(parent, rows, palette, cell, x, y, z, depth = .024, name = '도트 무늬') {
  const width = Math.max(...rows.map(r => r.length));
  rows.forEach((row, iy) => {
    for (let ix = 0; ix < row.length; ix++) {
      const c = palette[row[ix]];
      if (c === undefined) continue;
      spriteBox(parent, c, x + (ix - (width - 1) / 2) * cell, y - iy * cell, z, cell + .001, cell + .001, depth, name);
    }
  });
}
function spriteEyes(h, parent, { x, y, z, w = .125, height = .17, pupil = 0x25201b, white = 0xfff8e6, look = .012 }) {
  for (const s of [-1, 1]) {
    const eye = spriteGroup(parent, '깜빡이는 네모 눈', s * x, y, z);
    spriteBox(eye, white, 0, 0, 0, w, height, .033);
    spriteBox(eye, pupil, look, -.014, -.024, w * .36, height * .69, .025);
    h.eyes.push(eye);
  }
}
function makeSpriteRig(name, options = {}) {
  const root = new THREE.Group(); root.name = name;
  const rig = spriteGroup(root, '전신 리그');
  const torso = spriteGroup(rig, '몸통');
  const head = spriteGroup(rig, '머리', 0, options.headY || 2.02, 0);
  const tail = spriteGroup(torso, '꼬리 / 보조 장식', 0, 1.02, .30);
  const h = { root, rig, torso, head, tail, ears: [], eyes: [], arms: [], legs: [], secondary: [] };
  for (const s of [-1, 1]) {
    const sh = spriteGroup(torso, s < 0 ? '왼쪽 어깨' : '오른쪽 어깨', s * (options.shoulder || .42), options.shoulderY || 1.51, 0);
    const el = spriteGroup(sh, '팔꿈치', 0, -.30, 0);
    const hand = spriteGroup(el, '손 / 소품 장착점', 0, -.27, -.015);
    h.arms.push({ sh, el, hand, s, carry: 0 });
    const hip = spriteGroup(rig, '고관절', s * (options.hipX || .19), .74, 0);
    const knee = spriteGroup(hip, '무릎', 0, -.30, 0);
    const foot = spriteGroup(knee, '발목', 0, -.30, 0);
    h.legs.push({ hip, knee, foot, s });
  }
  return h;
}
function spriteLimbs(h, p, { arm = .14, leg = .18, shoe = .25, cuff = null } = {}) {
  h.arms.forEach(({ sh, el, hand, s }) => {
    spriteBox(sh, p.arm, 0, -.115, 0, arm, .29, arm, '위팔');
    spriteBox(sh, p.armShade || p.arm, s * arm * .36, -.12, .012, arm * .30, .22, arm);
    spriteBox(el, p.arm, 0, -.105, -.002, arm * .94, .26, arm * .96, '아래팔');
    if (cuff) spriteBox(el, cuff, 0, -.205, -.002, arm * 1.10, .075, arm * 1.09, '소매단');
    spriteBox(hand, p.hand || p.arm, 0, -.015, -.007, arm * 1.22, .13, arm * 1.16, '네모 손');
    spriteBox(hand, p.handShade || p.armShade || p.arm, s * -.065, -.02, -.045, .045, .075, .09, '엄지');
  });
  h.legs.forEach(({ hip, knee, foot, s }) => {
    spriteBox(hip, p.leg, 0, -.14, 0, leg, .30, leg, '허벅지');
    spriteBox(hip, p.legShade || p.leg, s * leg * .38, -.14, .025, leg * .24, .27, leg);
    spriteBox(knee, p.leg, 0, -.125, 0, leg * .88, .27, leg * .92, '정강이');
    spriteBox(foot, p.sole || 0x282127, 0, -.105, -.065, shoe + .025, .065, .38, '검은 밑창');
    spriteBox(foot, p.shoe || p.leg, 0, -.052, -.075, shoe, .105, .35, '발 / 신발');
    if (p.shoeLight) spriteBox(foot, p.shoeLight, 0, -.015, -.19, shoe - .03, .028, .12, '발등 하이라이트');
  });
}
// 같은 관절 아래의 정적 블록만 재질별로 병합한다. 관절/눈/소품의 Group은 유지.
// 외형 디테일은 많지만 수백 개 블록을 개별 draw call로 보내지 않는다.
function finishSprite(h) {
  function batch(group) {
    group.children.filter(c => c.isGroup).forEach(batch);
    const bins = new Map();
    for (const child of group.children) {
      if (!child.isMesh || child.geometry !== SPRITE_BOX) continue;
      const list = bins.get(child.material) || []; list.push(child); bins.set(child.material, list);
    }
    bins.forEach((meshes, mat) => {
      if (meshes.length < 2) return;
      const parts = meshes.map(m => { m.updateMatrix(); return m.geometry.clone().applyMatrix4(m.matrix); });
      const geometry = mergeGeometries(parts, false);
      parts.forEach(g => g.dispose());
      if (!geometry) return;
      geometry.computeBoundingSphere();
      const combined = new THREE.Mesh(geometry, mat); combined.name = '관절별 병합 도트';
      combined.castShadow = true; combined.receiveShadow = true;
      meshes.forEach(m => group.remove(m)); group.add(combined);
    });
  }
  batch(h.rig); return h;
}

// ───────────────────────── 부타: 분홍 피부 / 각진 주둥이 / 파란 바지 ─────────────────────────
function buildButa() {
  const P = { base: 0xee9ab3, shade: 0xc96f8a, light: 0xffb4c9, belly: 0xffcbd6,
    snout: 0xdf849f, nostril: 0x713347, blue: 0x466dcc, blueD: 0x304b99, hoof: 0x734630, ink: 0x2a2027 };
  const h = makeSpriteRig('부타 · 도트 리빌드', { shoulder: .43, shoulderY: 1.48, headY: 2.05 });
  h.tailMotion = { idle: .25, run: .36, pitch: -.20 };
  const { torso, head } = h;
  spriteSteps(torso, [[.79,.69,.53,.15],[.94,.82,.64,.22],[1.16,.78,.63,.23],[1.39,.61,.52,.22],[1.61,.43,.40,.12]], P);
  // 커다란 연분홍 배: 윗부분이 좁고 아래로 넓어지는 픽셀 패치.
  spritePixels(torso, ['...LLL...','..LLLLL..','.LLLLLLL.','LLLLLLLLL','LLLLLLLLL','.LLLLLLL.','..LLLLL..'],
    { L: P.belly }, .066, 0, 1.43, -.332, .033, '연분홍 배');
  spriteBox(torso, P.blueD, 0, .805, 0, .80, .14, .60, '반바지');
  spriteBox(torso, P.blue, 0, .864, -.012, .87, .105, .65, '파란 수평 허리선');
  spriteBox(torso, 0x7b98e8, 0, .91, -.347, .82, .026, .023, '허리선 밝은 테두리');
  spriteBox(torso, P.blueD, 0, .772, -.31, .034, .08, .025, '바지 가운데 솔기');
  for (const s of [-1, 1]) {
    spriteBox(torso, P.blueD, s * .28, .825, .31, .15, .062, .02, '뒤 주머니');
    spriteBox(torso, P.light, s * .32, 1.25, .315, .075, .16, .02, '등 피부 명암');
  }
  spriteSteps(head, [[-.40,.56,.48,.12],[-.28,.84,.65,.18],[-.10,1.00,.73,.22],[.12,.94,.71,.22],[.34,.73,.59,.12]], P);
  // 길게 돌출된 사각 주둥이 + 두 개의 네모 콧구멍.
  spriteBox(head, P.base, 0, -.115, -.45, .53, .35, .27, '주둥이 연결');
  spriteBox(head, P.shade, 0, -.12, -.59, .57, .26, .23, '주둥이 측면');
  spriteBox(head, P.snout, 0, -.105, -.719, .48, .25, .038, '네모 코');
  spriteBox(head, P.light, 0, .025, -.688, .40, .031, .085, '코 윗면');
  for (const s of [-1,1]) spriteBox(head, P.nostril, s*.112, -.102, -.744, .062, .060, .018, '콧구멍');
  spriteBox(head, P.nostril, 0, -.267, -.52, .22, .026, .035, '짧은 입');
  spriteEyes(h, head, { x: .28, y: .15, z: -.378, w: .145, height: .18, look: -.013 });
  // 삼각 원뿔이 아닌 도트식 두 단 귀. 내측 분홍 패치도 독립 배치.
  for (const s of [-1,1]) {
    const ear = spriteGroup(head, '계단 귀', s*.34, .39, -.015);
    spriteBox(ear, P.shade, 0, .095, 0, .235, .25, .17);
    spriteBox(ear, P.base, s*.035, .225, 0, .14, .10, .15);
    spriteBox(ear, 0xf6b5c8, 0, .09, -.092, .12, .16, .021);
    spriteBox(ear, P.ink, s*.055, .28, 0, .11, .023, .16, '귀 끝 외곽선');
    ear.userData.base = s * -.11; ear.userData.baseX = -.08; h.ears.push(ear);
  }
  spriteLimbs(h, { arm:P.base, armShade:P.shade, hand:P.belly, handShade:P.shade,
    leg:P.base, legShade:P.shade, shoe:P.hoof, sole:P.ink, shoeLight:0x9c6547 }, { arm:.155, leg:.17, shoe:.29 });
  h.arms.forEach(({ hand }) => {
    spriteBox(hand, P.shade, -.028, -.079, -.08, .012,.035,.018, '손가락 홈');
    spriteBox(hand, P.shade, .028, -.079, -.08, .012,.035,.018, '손가락 홈');
  });
  h.legs.forEach(({ hip }) => spriteBox(hip, P.blueD, 0, -.025, 0, .23,.11,.23, '반바지 밑단'));
  h.tail.position.set(-.10, 1.13, .31);
  const curl = [[0,0,0],[0,0,.18],[-.15,0,.18],[-.15,.15,.18],[.005,.15,.18],[.005,.075,.18],[-.06,.075,.18]];
  for (let i=1;i<curl.length;i++) spriteBeam(h.tail, i%2 ? P.shade:P.base, curl[i-1],curl[i],.065,.065,'꺾인 돼지 꼬리');
  return finishSprite(h);
}

// ───────────────────────── 척추: 비어 있는 흉곽 / 붉은 눈 / 세 갈래 목도리 ─────────────────────────
function buildChuk() {
  const P = { base:0xf2efd0, shade:0xb7b28b, light:0xfffbe3, ink:0x25211e, red:0xcc4029, redD:0x842a20 };
  const h = makeSpriteRig('척추 · 도트 리빌드', { shoulder:.36, shoulderY:1.55, headY:2.08, hipX:.22 });
  h.tailMotion = { idle: .07, run: .17, pitch: -.16 };
  const { head, torso } = h;
  // 척추뼈는 앞/뒤가 모두 보이도록 마디마다 골체·가로돌기·극돌기를 분리.
  for (let i=0;i<10;i++) {
    const y = .87 + i*.075;
    spriteBox(torso,P.shade,0,y,.115,.135,.054,.12,'척추 골체');
    spriteBox(torso,P.base,0,y+.015,.09,.16,.031,.12,'척추 밝은 마디');
    spriteBox(torso,P.base,0,y,.215,.060,.040,.13,'등 가시돌기');
    if (i>1) spriteBox(torso,P.shade,0,y,.135,.25,.028,.055,'가로돌기');
  }
  // 늑골의 빈 공간은 실제 빈 공간이다. 어두운 몸통 구체로 메우지 않는다.
  const ribs = [[1.49,.56],[1.34,.61],[1.19,.57],[1.04,.48]];
  ribs.forEach(([y,w]) => {
    spriteBox(torso,P.light,0,y,-.177,w,.062,.075,'전면 갈비뼈');
    for (const s of [-1,1]) {

}
function duck() {
  if (state.mode !== 'run') return;
  if (state.air) { state.vy = Math.min(state.vy, -20); state.duckT = .8; return; }   // 공중에서는 빠르게 내려찍으며 바로 구르기
  state.duckT = .8;
}
function laneMove(d) {
  if (state.mode !== 'run') return;
  state.lane = Math.max(-1, Math.min(1, state.lane + d));
}
function start() {
  if (state.mode !== 'intro') return;
  state.mode = 'starting';
  state.camT = 0;
  audio();
  targetSpin = Math.ceil(buta.root.rotation.y / (Math.PI * 2)) * Math.PI * 2;
  $('startBtn').disabled = true;
  $('intro').classList.add('gone');
  setTimeout(() => { $('intro').style.display = 'none'; }, 600);
  $('hud').style.display = 'flex';
}
$('startBtn').addEventListener('click', start);
$('skPrev').addEventListener('click', () => changeSkin(-1));
$('skNext').addEventListener('click', () => changeSkin(1));
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { laneMove(-1); changeSkin(-1); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { laneMove(1); changeSkin(1); }
  else if (k === 'ArrowDown' || k === 's' || k === 'S') { duck(); e.preventDefault(); }
  else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') { jump(); if (state.mode === 'dead') restart(); e.preventDefault(); }
  else if (k === 'Enter') { if (state.mode === 'intro' && !$('startBtn').disabled) start(); else restart(); }
});
let touch = null;
window.addEventListener('touchstart', e => { touch = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
window.addEventListener('touchend', e => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
  if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) { laneMove(dx > 0 ? 1 : -1); changeSkin(dx > 0 ? -1 : 1); }
  else if (dy < -30) jump();
  else if (dy > 30 && Math.abs(dy) > Math.abs(dx)) duck();
  touch = null;
}, { passive: true });

// ───────────────────────── 애니메이션 ─────────────────────────
function animateButa(dt) {
  const s = state, b = buta;
  s.run = damp(s.run, (s.mode === 'intro' || s.mode === 'dead') ? 0 : 1, s.mode === 'dead' ? 10 : 5, dt);
  s.fall = damp(s.fall, s.mode === 'dead' ? 1 : 0, s.mode === 'dead' ? 9 : 20, dt);
  s.jump = damp(s.jump, s.air ? 1 : 0, 16, dt);
  const rate = s.run * (14 + s.speed * .22) + (1 - s.run) * 0;
  s.phase += dt * rate;
  const p = s.phase, rb = s.run, jb = s.jump;
  const it = s.t;

  // 다리: 번갈아 앞뒤로, 무릎 접기
  b.legs.forEach(({ hip, knee, foot, s: side }) => {
    const q = p + (side > 0 ? 0 : Math.PI);
    const runHip = Math.sin(q) * .95;
    const runKnee = .25 + Math.max(0, Math.cos(q)) * 1.35;
    const jumpHip = side > 0 ? .85 : -.45, jumpKnee = side > 0 ? .9 : 1.5;
    const dkk = s.duckK;
    hip.rotation.x = mix(mix(mix(0, runHip, rb), jumpHip, jb), 1.45, dkk);     // 숙이기: 허벅지를 앞으로 접고
    knee.rotation.x = -mix(mix(mix(0, runKnee, rb), jumpKnee, jb), 2.1, dkk);  // 무릎을 깊게 굽혀 쪼그림
    foot.rotation.x = mix(mix(mix(0, -Math.sin(q) * .35 + .2, rb), .3, jb), .65, dkk);
  });
  // 팔: 다리와 반대로 흔들고 팔꿈치 굽힘
  b.arms.forEach(({ sh, el, s: side, carry = 0 }) => {
    const q = p + (side > 0 ? Math.PI : 0);
    const idleSw = Math.sin(it * 1.8 + side) * .05;
    const runSw = Math.sin(q) * 1.0;
    const dkk = s.duckK;
    sh.rotation.x = mix(mix(mix(idleSw, runSw, rb), 2.5, jb), 1.3, dkk);       // 숙이기: 팔을 앞으로 모아 머리 보호
    sh.rotation.z = side * mix(mix(mix(.12, .2, rb), .45, jb), -.15, dkk);
    el.rotation.x = mix(mix(mix(.1, 1.25 + Math.max(0, Math.cos(q)) * .3, rb), .3, jb), 2.0, dkk);
    // 바나나·휴대폰·빵을 쥔 팔은 몸통을 관통하지 않도록 보폭을 줄인다.
    // 점프/숙이기는 원래 포즈를 사용하여 조작과 판정을 바꾸지 않는다.
    const hold = carry * (1 - jb) * (1 - dkk);
    sh.rotation.x = mix(sh.rotation.x, idleSw + Math.sin(q) * .30 * rb, hold);
    sh.rotation.z = mix(sh.rotation.z, side * .20, hold);
    el.rotation.x = mix(el.rotation.x, .16 + Math.max(0, Math.cos(q)) * .16 * rb, hold);
  });
  // 몸: 통통 튀고 앞으로 기울이고 비틀기
  const dk = s.duckK;
  const bounce = Math.abs(Math.sin(p)) * .11 * rb * (1 - jb) * (1 - dk);
  const breath = Math.sin(it * 2.2) * .012 * (1 - rb);
  const squash = s.landT > 0 ? Math.sin(Math.min(1, s.landT / .18) * Math.PI) * .12 : 0;
  b.rig.position.y = bounce + s.y + .32 * s.fall - .18 * dk;
  b.rig.scale.set(1 + squash * .5 + dk * .1, (1 + breath - squash) * (1 - .22 * dk), 1 + squash * .5 + dk * .1);
  b.rig.rotation.x = -.16 * rb + 1.4 * s.fall - 1.0 * dk;
  b.torso.rotation.y = Math.sin(p) * .12 * rb;
  b.head.rotation.y = -Math.sin(p) * .08 * rb;
  b.head.rotation.x = mix(Math.sin(it * 1.3) * .02, Math.abs(Math.sin(p)) * -.05 + .12, rb) + .55 * dk;
  // 차선 바꿀 때 기울기
  const dx = s.x - s.lane * LANE;
  b.rig.rotation.z = THREE.MathUtils.clamp(dx * .16, -.3, .3);
  // 꼬리·귀
  const tm = b.tailMotion || { idle: .15, run: .25, pitch: -.20 };
  b.tail.rotation.z = Math.sin(it * 3 + p) * tm.idle * (1 - rb) + Math.sin(p * 2) * tm.run * rb;
  b.tail.rotation.x = tm.pitch * rb;
  b.ears.forEach((ear, i) => {
    const side = i === 0 ? -1 : 1;
    const flap = Math.sin(p * 2 + 1) * .22 * rb + Math.sin(it * 2.5 + i) * .03;
    const strength = ear.userData.flapScale ?? 1;
    ear.rotation.z = (ear.userData.base || 0) + (side * flap + side * .25 * rb) * strength;
    ear.rotation.x = (ear.userData.baseX ?? -.25) + .21 * rb * strength;
  });
  // 목도리 세 갈래, 앞치마 끈, 손에 든 소품의 작은 2차 움직임.
  (b.secondary || []).forEach(({ node, axis, base = 0, amplitude, speed, phase = 0 }) => {
    node.rotation[axis] = base + Math.sin(it * speed + p * .45 + phase) * amplitude * (.35 + rb * .65) * (1 - dk * .75);
  });
  // 눈 깜빡임
  s.nextBlink -= dt;
  if (s.nextBlink < 0) { s.blink = .14; s.nextBlink = rnd(1.8, 4.2); }
  s.blink = Math.max(0, s.blink - dt);
  const bl = s.blink > 0 ? .1 : 1;
  b.eyes.forEach(e => { e.scale.y = bl; });
}

const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function updateCamera(dt) {
  const s = state;
  const k = ease(Math.min(1, s.camT));
  // 쇼케이스: 부타 정면 클로즈업 / 달리기: 뒤쪽 위에서
  const introPos = new THREE.Vector3(0, 1.5, 8.6), introLook = new THREE.Vector3(0, .62, 0);
  const runPos = new THREE.Vector3(s.x * .6, 3.55 + s.y * .3, 7.4);
  const runLook = new THREE.Vector3(s.x * .45, 1.5 + s.y * .45, -9);
  camPos.lerpVectors(introPos, runPos, k);
  camLook.lerpVectors(introLook, runLook, k);
  camPos.y += Math.sin(s.phase * 2) * .035 * s.run;
  if (s.shake > 0) { camPos.x += (Math.random() - .5) * s.shake * .6; camPos.y += (Math.random() - .5) * s.shake * .4; s.shake = Math.max(0, s.shake - dt * 1.4); }
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  const fov = mix(38, 60 + (s.speed - RUN_SPEED0) * .25, k);
  if (Math.abs(camera.fov - fov) > .01) { camera.fov = fov; camera.updateProjectionMatrix(); }
}

function update(dt) {
  const s = state;
  s.t += dt;
  if (s.mode === 'intro') {
    s.camT = Math.max(0, s.camT - dt / .9);
    buta.root.rotation.y += dt * .8;
    s.speed = 0;
  } else if (s.mode === 'starting') {
    s.camT += dt / 1.5;
    buta.root.rotation.y = damp(buta.root.rotation.y, targetSpin, 7, dt);
    s.speed = RUN_SPEED0 * ease(Math.min(1, s.camT));
    if (s.camT >= 1) { s.mode = 'run'; buta.root.rotation.y = 0; s.nextRow = s.dist + 8; }
  } else if (s.mode === 'run') {
    s.speed = damp(s.speed, Math.min(RUN_SPEED_MAX, RUN_SPEED0 + s.dist / 120), 3, dt);
  } else {
    s.speed = damp(s.speed, 0, 4.5, dt);
    s.deadT += dt;
    if (!s.overShown && s.deadT > .9) showOver();
  }

  // 가로 이동
  s.x = damp(s.x, s.lane * LANE, 14, dt);
  buta.root.position.x = s.x;
  // 점프
  if (s.air) {
    s.vy -= 36 * dt; s.y += s.vy * dt;
    if (s.y <= 0) { s.y = 0; s.vy = 0; s.air = false; s.landT = .18; }
  }
  if (s.landT > 0) s.landT = Math.max(0, s.landT - dt);
  if (s.duckT > 0) s.duckT = Math.max(0, s.duckT - dt);
  s.duckK = damp(s.duckK, s.duckT > 0 && s.mode === 'run' ? 1 : 0, 20, dt);

  // 복도가 달려옴
  if (s.mode !== 'dead') s.dist += s.speed * dt;
  for (const seg of segs) {
    seg.position.z += s.speed * dt;
    if (seg.position.z > L + 14) {
      let minZ = Infinity; for (const o of segs) minZ = Math.min(minZ, o.position.z);
      seg.position.z = minZ - L;
      randomizeSegment(seg);
    }
  }
  updateObstacles(dt);
  updateCoins(dt);
  updateSparks(dt);
  updateRings(dt);
  $('dist').textContent = Math.floor(s.dist);

  animateButa(dt);
  swapT = Math.max(0, swapT - dt);
  buta.root.scale.setScalar(.88 * (1 - .35 * Math.sin(swapT / .28 * Math.PI / 2)));
  updateCamera(dt);

  // 햇빛(그림자)이 부타를 따라다님
  sun.position.set(s.x - 9, 13, 7);
  sun.target.position.set(s.x, 0, -1);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  update(dt);
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

resize();
setSkin(skinIdx, false);
update(0.001);
const btn = $('startBtn');
btn.disabled = false;
btn.textContent = '▶ 달리기 시작';
requestAnimationFrame(frame);
</script>
</body>
</html>
