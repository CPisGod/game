<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>부타 다이어트 시키기</title>
<style>
  :root { --bg:#fff4e0; --ink:#3b2a1a; --pink:#ff9eb5; --pink-d:#e0577d; --green:#3fbf6f; --blue:#3a9bdc; --yellow:#ffc933; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; min-height:100%; }
  body { background: linear-gradient(#ffe9c2, #fff4e0 40%, #d9f2d0); color: var(--ink);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .home-btn { position: fixed; right: 12px; bottom: 12px; z-index: 9999; padding: 8px 14px; border-radius: 999px;
    background: #000a; color: #fff; font: 700 14px/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    text-decoration: none; border: 1px solid #fff6; }
  .home-btn:active { transform: translateY(2px); }

  #app { max-width: 520px; margin: 0 auto; padding: 12px 14px 70px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header h1 { margin:0; font-size:20px; }
  .btn { border:0; border-radius:12px; padding:9px 14px; font:700 14px inherit; font-family:inherit; background:var(--ink); color:#fff; cursor:pointer; }
  .btn.sub { background:#fff; color:var(--ink); border:2px solid var(--ink); }
  .btn:disabled { opacity:.5; }

  .weight { text-align:center; margin:6px 0 2px; }
  .weight b { font-size:52px; line-height:1; }
  .weight span { font-size:20px; margin-left:4px; }
  .sub-info { text-align:center; font-size:13px; opacity:.75; margin-bottom:6px; }
  .bar { height:18px; background:#fff; border:2px solid var(--ink); border-radius:999px; overflow:hidden; position:relative; }
  .bar > i { display:block; height:100%; width:0; transition:width .15s; }
  #wbar > i { background:linear-gradient(90deg,var(--pink),var(--pink-d)); }
  #sbar > i { background:linear-gradient(90deg,#ffd23f,var(--green)); }
  #sbar.low > i { background:#e8504a; }
  .barlabel { display:flex; justify-content:space-between; font-size:12px; margin:8px 2px 3px; font-weight:700; }

  #stage { position:relative; margin-top:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; }
  #stage.exhausted { filter:grayscale(.6); cursor:not-allowed; }
  #pig { width:100%; max-width:340px; height:260px; }
  .float { position:absolute; font-weight:900; font-size:22px; color:var(--pink-d); text-shadow:0 2px 0 #fff; pointer-events:none; animation: up .8s ease-out forwards; }
  @keyframes up { to { transform: translateY(-70px); opacity:0; } }
  #msg { position:absolute; top:6px; width:100%; text-align:center; font-weight:900; color:#d33; min-height:22px; pointer-events:none; }
  #exlabel { width:100%; text-align:center; font-weight:700; font-size:14px; margin-top:8px; pointer-events:none; }

  #exs { display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-top:8px; }
  .ex { background:#fff; border:2px solid #d9c9a8; border-radius:12px; padding:8px 4px; text-align:center; cursor:pointer; font-family:inherit; color:var(--ink); }
  .ex.on { border-color:var(--pink-d); background:#ffe3ea; box-shadow:0 3px 0 var(--pink-d); }
  .ex .ic { font-size:24px; display:block; }
  .ex .nm { font-weight:700; font-size:13px; display:block; }
  .ex .tp { font-size:10px; opacity:.7; display:block; }
  .ex .st { font-size:10px; display:block; margin-top:2px; }
  .tag-a { color:var(--blue); } .tag-b { color:var(--green); } .tag-c { color:#c0612b; }

  .modal { position:fixed; inset:0; background:#000a; z-index:9000; display:none; align-items:center; justify-content:center; padding:16px; }
  .modal.show { display:flex; }
  .card { background:#fff; border-radius:18px; padding:18px; width:min(420px,100%); max-height:85vh; overflow:auto; }
  .card h2 { margin:0 0 10px; }
  .card input { width:100%; padding:10px; font-size:18px; border:2px solid var(--ink); border-radius:10px; font-family:inherit; }
  .card p { font-size:14px; line-height:1.5; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; }
  .tabs .btn { flex:1; }
  .tabs .btn.on { background:var(--pink-d); border-color:var(--pink-d); color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:6px 4px; border-bottom:1px solid #eee; text-align:left; }
  td:last-child, th:last-child { text-align:right; }
  tr.me { background:#ffe3ea; font-weight:900; }
  header > div { display:flex; gap:6px; }
  header h1 { font-size:18px; white-space:nowrap; }
  header .btn { padding:7px 9px; font-size:13px; white-space:nowrap; }
  .badge { display:none; min-width:18px; padding:0 5px; border-radius:9px; background:#e8504a; color:#fff; font-size:12px; line-height:18px; }
  #items { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
  .item { background:#fff; border:2px solid #d9c9a8; border-radius:12px; padding:6px 2px; font-family:inherit; color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; }
  .item:disabled { opacity:.45; cursor:default; }
  .item .ic { font-size:22px; } .item b { font-size:12px; } .item small { font-size:9px; opacity:.7; text-align:center; }
  #toast { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); background:#000c; color:#fff; padding:9px 14px; border-radius:12px; font-size:14px; z-index:9500; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90%; text-align:center; }
  #toast.show { opacity:1; }
  .quest { border:2px solid #eadcc0; border-radius:12px; padding:8px 10px; margin-bottom:8px; }
  .quest.got { opacity:.55; }
  .qh { display:flex; justify-content:space-between; } .qd { font-size:13px; opacity:.8; margin:2px 0 6px; }
  .qf { display:flex; justify-content:space-between; align-items:center; font-size:12px; margin-top:4px; }
  .qf .btn { padding:5px 14px; } .qf em { font-style:normal; color:var(--green); font-weight:700; }
  .bar.sm { height:10px; border-width:1px; } .bar.sm > i { background:var(--green); }
  .note { font-size:12px; color:#b36; margin-top:8px; }
</style>
</head>
<body>
<a class="home-btn" href="../">🏠 메인 메뉴</a>

<div id="app">
  <header>
    <h1>🐷 부타 다이어트</h1>
    <div>
      <button class="btn sub" id="questBtn">🎯 미션 <span id="questBadge" class="badge">0</span></button>

  <div class="weight"><b id="wt">200.00</b><span>kg</span></div>
  <div class="sub-info"><span id="nick">-</span> · 목표 70kg · 지금까지 <span id="lost">0.00</span>kg 감량 · <span id="runinfo">1회차</span></div>
  <div class="bar" id="wbar"><i></i></div>

  <div class="barlabel"><span>💪 체력</span><span id="sval">100 / 100</span></div>

</div>

<!-- 닉네임 -->
<div class="modal" id="nickModal">

    <p style="margin-bottom:0"><button class="btn" id="nickOk" style="width:100%">시작하기</button></p>

</div>

<!-- 클리어 -->
<div class="modal" id="clearModal">
  <div class="card" style="text-align:center">
    <h2>🎉 70kg 달성!</h2>
    <p>부타 다이어트 성공!<br>클리어 시간 <b id="clearTime"></b></p>
    <button class="btn" id="restartBtn" style="width:100%">다시 200kg부터 도전</button>
    <p><button class="btn sub" id="clearRank" style="width:100%">🏆 순위 보기</button></p>
  </div>
</div>

<!-- 미션 -->
<div class="modal" id="questModal">
  <div class="card">
    <h2>🎯 미션</h2>
    <p style="margin-top:0">달성하면 프로틴·닭가슴살·샐러드를 받아요. 위에서 눌러서 먹으면 체력 회복과 보너스 효과가 있어요!</p>
    <div id="questList"></div>
    <p style="margin-bottom:0"><button class="btn sub" id="questClose" style="width:100%">닫기</button></p>
  </div>
</div>
<div id="toast"></div>

<!-- 스코어보드 -->
<div class="modal" id="rankModal">
  <div class="card">
    <h2>🏆 스코어보드</h2>
    <div class="tabs">
      <button class="btn on" id="tabLost">총 감량</button>
      <button class="btn" id="tabClear">클리어 시간</button>
    </div>
    <table id="rankTable"></table>
    <div class="note" id="rankNote"></div>
    <p style="margin-bottom:0"><button class="btn sub" id="rankClose" style="width:100%">닫기</button></p>
  </div>
</div>

<script type="module">
// ===== Firebase 설정: Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)의 firebaseConfig 값을 여기에 붙여넣으세요 =====
const firebaseConfig = {
  apiKey: "AIzaSyBPgoO4EXWFagGEutquysQPmcvFk37eXbU",
  authDomain: "game-81004.firebaseapp.com",
  projectId: "game-81004",
  storageBucket: "game-81004.firebasestorage.app",
  messagingSenderId: "217133907611",
  appId: "1:217133907611:web:a62de72fc5c909390bd03e"
};
// ====================================================================================================

const START_G = 200000, GOAL_G = 70000;       // 그램 단위 정수로 계산
const STAMINA_MAX = 100, RECOVER_AT = 30;      // 탈진하면 체력이 30까지 차야 다시 운동 가능
const REGEN_IDLE = 7, REGEN_ACTIVE = 1.5;      // 초당 체력 회복 (1초 이상 쉬면 IDLE)

// g = 1회 감량(그램), cost = 체력 소모 (모든 운동 동일)
const EXERCISES = [
  { id:'pushup',   ic:'💪', nm:'팔굽혀펴기',     tp:'맨몸',   cls:'a', g:50, cost:3 },
  { id:'squat',    ic:'🦵', nm:'스쿼트',         tp:'맨몸',   cls:'a', g:50, cost:3 },
  { id:'situp',    ic:'🧘', nm:'윗몸일으키기',   tp:'맨몸',   cls:'a', g:50, cost:3 },
  { id:'run',      ic:'🏃', nm:'달리기',         tp:'유산소', cls:'b', g:50, cost:3 },
  { id:'rope',     ic:'🪢', nm:'줄넘기',         tp:'유산소', cls:'b', g:50, cost:3 },
  { id:'climber',  ic:'🧗', nm:'마운틴 클라이머', tp:'유산소', cls:'b', g:50, cost:3 },
  { id:'curl',     ic:'🏋️', nm:'덤벨 컬',        tp:'무산소', cls:'c', g:50, cost:3 },
  { id:'deadlift', ic:'🪨', nm:'데드리프트',     tp:'무산소', cls:'c', g:50, cost:3 },
  { id:'press',    ic:'🙌', nm:'숄더 프레스',    tp:'무산소', cls:'c', g:50, cost:3 },
];

// ---------- 미션 / 아이템 ----------
const ITEMS = {
  protein: { ic:'🥤', nm:'프로틴',   fx:'체력 +40' },
  chicken: { ic:'🍗', nm:'닭가슴살', fx:'체력 +25 · 30회 감량 2배' },
  salad:   { ic:'🥗', nm:'샐러드',   fx:'체력 +15 · 60초 회복 2배' },
};
const QUESTS = [
  { id:'q1',  nm:'워밍업',     desc:'운동 50회',          goal:50,    val:() => S.stats.total,  reward:{ protein:1 } },
  { id:'q2',  nm:'맨몸 입문',  desc:'맨몸 운동 100회',     goal:100,   val:() => S.stats.cat.a,  reward:{ chicken:1 } },
  { id:'q3',  nm:'러너',       desc:'유산소 운동 100회',   goal:100,   val:() => S.stats.cat.b,  reward:{ salad:1 } },
  { id:'q4',  nm:'근육 키우기', desc:'무산소 운동 100회',   goal:100,   val:() => S.stats.cat.c,  reward:{ protein:2 } },
  { id:'q5',  nm:'첫 5kg',     desc:'누적 5kg 감량',       goal:5000,  val:() => S.totalLostG, kg:1, reward:{ chicken:1 } },
  { id:'q6',  nm:'올라운더',   desc:'9가지 운동을 각 10회', goal:9,     val:() => EXERCISES.filter(e => (S.stats.ex[e.id] || 0) >= 10).length, reward:{ protein:1, chicken:1, salad:1 } },
  { id:'q7',  nm:'10kg 돌파',  desc:'누적 10kg 감량',      goal:10000, val:() => S.totalLostG, kg:1, reward:{ salad:2 } },
  { id:'q8',  nm:'꾸준함',     desc:'운동 500회',          goal:500,   val:() => S.stats.total,  reward:{ chicken:2 } },
  { id:'q9',  nm:'절반의 성공', desc:'누적 50kg 감량',      goal:50000, val:() => S.totalLostG, kg:1, reward:{ protein:3 } },
  { id:'q10', nm:'운동 중독',  desc:'운동 1500회',         goal:1500,  val:() => S.stats.total,  reward:{ protein:2, chicken:2, salad:2 } },
];

const $ = id => document.getElementById(id);
const kg = g => (g / 1000).toFixed(2);

// ---------- 상태 ----------
let uid = 'local', db = null, fb = null, online = false;
const newStats = () => ({ total:0, cat:{ a:0, b:0, c:0 }, ex:{} });
let S = { nickname:'', weightG:START_G, totalLostG:0, runs:1, runMs:0, bestClearMs:null, cleared:false,
          stats:newStats(), inv:{ protein:0, chicken:0, salad:0 }, claimed:[], buff:{ chicken:0, saladUntil:0 } };
let stamina = STAMINA_MAX, exhausted = false, lastTap = 0, curEx = EXERCISES[0];
let dirty = false;

const LS_KEY = 'butadiet-local';
function loadLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch { return null; } }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {} }

// ---------- 부타 그리기 (스쿨 서퍼 부타 도트 디자인, 옆모습 뼈대 애니메이션) ----------
const C = { base:'#ee9ab3', shade:'#c96f8a', shadeD:'#a8566f', light:'#ffb4c9', belly:'#ffcbd6', snout:'#df849f', nostril:'#713347',
  blue:'#466dcc', blueD:'#304b99', blueL:'#7b98e8', hoof:'#734630', hoofD:'#4a2c1d', ink:'#2a2027', white:'#fff8e6', earIn:'#f6b5c8' };
const GY = 244, CX = 150;                       // 바닥 높이, 가운데
const LT = 36, LS = 34, UA = 30, FA = 28, TL = 62; // 허벅지, 정강이, 위팔, 아래팔, 몸통 길이
const PI = Math.PI, sin = Math.sin, cos = Math.cos;
const sh = (hip, th) => [hip[0] + TL * sin(th), hip[1] - TL * cos(th)];

// 두 마디 관절(IK): A에서 B로 닿는 팔/다리의 관절 위치. bend=+1 이면 진행방향 오른쪽으로 꺾임
function ik(A, B, l1, l2, bend) {
  let dx = B[0] - A[0], dy = B[1] - A[1];
  let d = Math.hypot(dx, dy) || 1e-3;
  const reach = l1 + l2 - 0.01;
  if (d > reach) { B = [A[0] + dx / d * reach, A[1] + dy / d * reach]; d = reach; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / d, uy = dy / d;
  return [A[0] + ux * a + uy * h * bend, A[1] + uy * a - ux * h * bend, B[0], B[1]];
}
// 포즈 하나 = 관절 좌표 모음 (숫자만 들어 있어서 그대로 보간 가능)
function build(o) {
  const hip = o.hip, th = o.th, s = sh(hip, th);
  const lb = o.legBend ?? 1, ab = o.armBend ?? -1;
  const nl = o.nl || ik(hip, o.nf, LT, LS, lb), fl = o.fl || ik(hip, o.ff, LT, LS, lb);
  const na = o.na || ik(s, o.nh || [s[0] + o.nhr[0], s[1] + o.nhr[1]], UA, FA, ab);
  const fa = o.fa || ik(s, o.fh || [s[0] + o.fhr[0], s[1] + o.fhr[1]], UA, FA, ab);
  return { hx:hip[0], hy:hip[1], sx:s[0], sy:s[1], th, ha:o.ha || 0,
    nkx:nl[0], nky:nl[1], nax:nl[2], nay:nl[3], fkx:fl[0], fky:fl[1], fax:fl[2], fay:fl[3],
    nex:na[0], ney:na[1], nhx:na[2], nhy:na[3], fex:fa[0], fey:fa[1], fhx:fa[2], fhy:fa[3], db:o.db || 0, rope:o.rope || 0 };
}
const wave = ph => (1 - cos(2 * PI * ph)) / 2;     // 0→1→0 (정수 위상에서 0)
const FOOT_Y = GY - 7, STAND_Y = GY - 7 - 66;

// 플랭크 자세: 발끝(toe)을 고정하고 어깨 높이 H 에 맞춰 몸이 일직선으로 기울어짐
function plank(H) {
  const toe = [46, GY - 14], L = LT + LS + TL, dy = (GY - 8 - H) - toe[1];
  const ux = Math.sqrt(L*L - dy*dy) / L, uy = dy / L;
  return { toe, s:[toe[0] + ux*L, toe[1] + uy*L], hip:[toe[0] + ux*(LT+LS), toe[1] + uy*(LT+LS)], th:Math.atan2(ux, -uy) };
}
const POSES = {
  stand() {
    return build({ hip:[CX, STAND_Y], th:.04, nf:[CX+8, FOOT_Y], ff:[CX-6, FOOT_Y], nhr:[8,56], fhr:[-4,56] });
  },
  tired() {
    return build({ hip:[CX-8, STAND_Y+8], th:.38, ha:.55, nf:[CX+14, FOOT_Y], ff:[CX+2, FOOT_Y], nhr:[16,52], fhr:[6,54] });
  },
  // 스쿼트: 엉덩이를 뒤로 빼며 앉고, 팔은 앞으로 뻗기
  squat(ph) {
    const d = wave(ph), hip = [CX - 24*d, STAND_Y + 38*d];
    return build({ hip, th:.04 + .75*d, ha:-.1*d, nf:[CX+14, FOOT_Y], ff:[CX+2, FOOT_Y],
      nhr:[8 + 50*d, 56 - 54*d], fhr:[-2 + 50*d, 56 - 54*d] });
  },
  // 팔굽혀펴기: 발끝을 고정하고 몸 전체가 판자처럼 내려갔다 올라옴
  pushup(ph, T) {
    const d = wave(ph), hUp = 54, hDn = Math.max(22, T * .45 + 4), pl = plank(hUp + (hDn - hUp) * d);
    return build({ hip:pl.hip, th:pl.th, ha:.3 - .15*d, nf:pl.toe, ff:[pl.toe[0]-4, pl.toe[1]], nh:[pl.s[0]+2, GY-8], fh:[pl.s[0]-9, GY-8] });
  },
  // 마운틴 클라이머: 플랭크 자세에서 무릎을 번갈아 가슴쪽으로 끌어당김
  climber(ph) {
    const w = 2*PI*ph, q1 = Math.max(0, sin(w)), q2 = Math.max(0, -sin(w)), pl = plank(54);
    const drive = (q, off) => [pl.toe[0] + off + (pl.hip[0] - 22 - pl.toe[0] - off) * q, pl.toe[1] - 10*q];
    const hip = [pl.hip[0], pl.hip[1] - 2*(q1 + q2)];
    return build({ hip, th:pl.th, ha:.3, nf:drive(q1, 0), ff:drive(q2, -4), nh:[pl.s[0]+2, GY-8], fh:[pl.s[0]-9, GY-8] });
  },
  // 윗몸일으키기: 누워서 팔짱 끼고 상체를 일으킴
  situp(ph, T) {
    const d = wave(ph), th = -1.5 + 1.78*d, hip = [184, GY - 6 - T/2];
    const s = sh(hip, th), dir = [sin(th), -cos(th)], pr = [cos(th), sin(th)];
    return build({ hip, th, ha:th, nf:[240, FOOT_Y], ff:[252, FOOT_Y],
      nh:[s[0] - dir[0]*14 + pr[0]*(T*.35), s[1] - dir[1]*14 + pr[1]*(T*.35)],
      fh:[s[0] - dir[0]*22 + pr[0]*(T*.3), s[1] - dir[1]*22 + pr[1]*(T*.3)] });
  },
  // 달리기: 다리와 팔을 번갈아 크게 휘두르는 제자리 달리기
  run(ph) {
    const w = 2*PI*ph, hipX = CX, th = .18;
    const leg = off => {
      const f = .75*sin(w + off), k = .2 + .85*Math.max(0, cos(w + off)), g = f - k;
      return { kn:[LT*sin(f), LT*cos(f)], an:[LT*sin(f) + LS*sin(g), LT*cos(f) + LS*cos(g)] };
    };
    const a = leg(0), b = leg(PI), hy = FOOT_Y - Math.max(a.an[1], b.an[1]), hip = [hipX, hy], s = sh(hip, th);
    const arm = off => {
      const al = -.95*sin(w + off), be = al + 1.35;
      const e = [s[0] + UA*sin(al), s[1] + UA*cos(al)];
      return [e[0], e[1], e[0] + FA*sin(be), e[1] + FA*cos(be)];
    };
    return build({ hip, th, ha:-.05,
      nl:[hipX + a.kn[0], hy + a.kn[1], hipX + a.an[0], hy + a.an[1]], fl:[hipX + b.kn[0], hy + b.kn[1], hipX + b.an[0], hy + b.an[1]],
      na:arm(PI), fa:arm(0) });
  },
  // 줄넘기: 제자리 점프 + 손목으로 줄 돌리기
  rope(ph) {
    const j = 26*sin(PI*(ph % 1)), hip = [CX, STAND_Y - j], s = sh(hip, .02), r = 2*PI*ph;
    return build({ hip, th:.02, nf:[CX+8, FOOT_Y - j*1.35], ff:[CX-6, FOOT_Y - j*1.35],
      nh:[s[0] + 22 + 7*cos(r), s[1] + 46 + 7*sin(r)], fh:[s[0] + 14 + 7*cos(r), s[1] + 46 + 7*sin(r)], rope:1 });
  },
  // 덤벨 컬: 팔꿈치를 고정하고 아령을 들어올림
  curl(ph) {
    const c = wave(ph), th = -.08*c, hip = [CX, STAND_Y + 2*c], s = sh(hip, th), fa = 2.45*c;
    const arm = (dx, k) => { const e = [s[0] + dx, s[1] + 29], p = fa*k; return [e[0], e[1], e[0] + FA*sin(p), e[1] + FA*cos(p)]; };
    return build({ hip, th, ha:.08*c, nf:[CX+8, FOOT_Y], ff:[CX-6, FOOT_Y], na:arm(-1, 1), fa:arm(-9, .97), db:1 });
  },
  // 데드리프트: 엉덩이를 뒤로 빼고 상체를 숙여 바벨을 정강이 높이까지 내렸다 일어남
  deadlift(ph) {
    const d = wave(ph), hip = [CX - 26*d, STAND_Y + 14*d];
    return build({ hip, th:.04 + 1.05*d, ha:-.35*d, nf:[CX+14, FOOT_Y], ff:[CX+2, FOOT_Y], nhr:[4, 58], fhr:[-2, 58], db:2 });
  },
  // 숄더 프레스: 어깨 높이의 덤벨을 머리 위로 밀어 올림
  press(ph) {
    const d = wave(ph), th = -.05*d, hip = [CX, STAND_Y];
    const lerp = (a, b) => a + (b - a) * d;
    return build({ hip, th, ha:-.1*d, nf:[CX+8, FOOT_Y], ff:[CX-6, FOOT_Y],
      nhr:[lerp(16, 6), lerp(6, -58)], fhr:[lerp(8, -2), lerp(6, -58)], db:1 });
  },
};

// 운동 한 번 = 위상 per 만큼 진행, 초당 spd 위상만큼 움직임 (터치가 빠르면 동작이 조금 밀려서 이어짐)
const EX_ANIM = { pushup:{per:1, spd:2.6}, squat:{per:1, spd:2.6}, situp:{per:1, spd:2.4},
                  run:{per:.5, spd:2.4}, rope:{per:1, spd:3}, climber:{per:.5, spd:2.4},
                  curl:{per:1, spd:2.6}, deadlift:{per:1, spd:2.2}, press:{per:1, spd:2.4} };
const anim = { ph:0, tg:0, mv:0, cur:null, ex:'', last:performance.now(), drawn:0 };

function pigPose() {
  const T = 40 + 52 * fatness();
  if (exhausted) return POSES.tired();
  const p = POSES[curEx.id](anim.ph, T);
  return p;
}
const fatness = () => Math.max(0, Math.min(1, (S.weightG - GOAL_G) / (START_G - GOAL_G)));

function drawPig(p, time) {
  const t = fatness(), br = 1 + .025 * sin(time * (exhausted ? 9 : 3));
  const T = (40 + 52*t) * br, lw = 14 + 6*t, hf = 1 + .15*t;
  const n = v => v.toFixed(1), pt = (x, y) => n(x) + ',' + n(y);
  const th = p.th, dir = [sin(th), -cos(th)], pr = [cos(th), sin(th)];
  const hip = [p.hx, p.hy], s = [p.sx, p.sy];
  let o = '';
  const poly = (pts, w, col, ol) => {
    const P = pts.map(q => pt(q[0], q[1])).join(' ');
    o += `<polyline points="${P}" fill="none" stroke="${ol}" stroke-width="${n(w + 4)}" stroke-linecap="round" stroke-linejoin="round"/>`
       + `<polyline points="${P}" fill="none" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  };
  const seg = (a, b, w, col, ol, cap = 'butt') => {
    if (ol) o += `<line x1="${n(a[0])}" y1="${n(a[1])}" x2="${n(b[0])}" y2="${n(b[1])}" stroke="${ol}" stroke-width="${n(w + 4)}" stroke-linecap="${cap}"/>`;
    o += `<line x1="${n(a[0])}" y1="${n(a[1])}" x2="${n(b[0])}" y2="${n(b[1])}" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="${cap}"/>`;
  };
  const hoof = (k, a) => {
    let dx = a[0] - k[0], dy = a[1] - k[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const f = [dy, -dx];
    seg([a[0] - f[0]*2, a[1] - f[1]*2], [a[0] + f[0]*16, a[1] + f[1]*16], lw*.95, C.hoof, C.hoofD);
  };
  const leg = (kx, ky, ax, ay, col, ol) => { poly([hip, [kx, ky], [ax, ay]], lw, col, ol); hoof([kx, ky], [ax, ay]); };
  const hand = (x, y, col) => { o += `<circle cx="${n(x)}" cy="${n(y)}" r="${n(lw*.62)}" fill="${col}" stroke="${C.shadeD}" stroke-width="2"/>`; };
  const arm = (ex, ey, hx, hy, col, ol, hc) => { poly([s, [ex, ey], [hx, hy]], lw*.9, col, ol); hand(hx, hy, hc); };

  // 바닥 + 그림자
  const mid = (p.hx + p.nax) / 2;
  o += `<line x1="8" y1="${GY+3}" x2="292" y2="${GY+3}" stroke="#c9b18a" stroke-width="4" stroke-linecap="round"/>`;
  o += `<ellipse cx="${n(mid)}" cy="${GY+2}" rx="${n(56 + Math.abs(p.nax - p.hx)/2 + T*.5)}" ry="5" fill="#0002"/>`;

  // 뒤쪽 팔/다리
  arm(p.fex, p.fey, p.fhx, p.fhy, C.shade, C.shadeD, C.light);
  leg(p.fkx, p.fky, p.fax, p.fay, C.shade, C.shadeD);

  // 꼬리 (엉덩이 뒤쪽)
  const tb = [hip[0] - pr[0]*T*.42 + dir[0]*6, hip[1] - pr[1]*T*.42 + dir[1]*6];
  const tp = [[0,0],[-12,0],[-12,-10],[-2,-10],[-2,-5],[-7,-5]].map(([x, y]) => [tb[0] + x*pr[0] + y*dir[0], tb[1] + x*pr[1] + y*dir[1]]);
  poly(tp, 4, C.base, C.shadeD);

  // 몸통 + 배 + 반바지
  const a = [hip[0] + dir[0]*T*.28, hip[1] + dir[1]*T*.28], b = [s[0] - dir[0]*T*.05, s[1] - dir[1]*T*.05];
  seg(a, b, T, C.base, C.shadeD, 'round');
  const bm = [(a[0] + b[0])/2 + pr[0]*T*.14, (a[1] + b[1])/2 + pr[1]*T*.14], bl = Math.hypot(b[0]-a[0], b[1]-a[1]);
  o += `<ellipse transform="translate(${n(bm[0])} ${n(bm[1])}) rotate(${n(th*180/PI)})" rx="${n(T*.32)}" ry="${n(bl*.42 + T*.08)}" fill="${C.belly}"/>`;
  const sa = [hip[0] + dir[0]*T*.36, hip[1] + dir[1]*T*.36], sb = [hip[0] - dir[0]*T*.12, hip[1] - dir[1]*T*.12];
  seg(sb, sa, T + 2, C.blue, C.blueD, 'butt');
  seg([sa[0] - dir[0]*3, sa[1] - dir[1]*3], sa, T + 2, C.blueL, null, 'butt');

  // 앞쪽 다리 (반바지 밑단 포함)
  leg(p.nkx, p.nky, p.nax, p.nay, C.base, C.shadeD);
  const kd = Math.hypot(p.nkx - hip[0], p.nky - hip[1]) || 1;
  seg(hip, [hip[0] + (p.nkx - hip[0])/kd*17, hip[1] + (p.nky - hip[1])/kd*17], lw + 4, C.blue, C.blueD, 'butt');

  // 머리: 각진 주둥이, 계단 귀, 네모 눈
  const hc = [s[0] + dir[0]*26 + pr[0]*8, s[1] + dir[1]*26 + pr[1]*8];
  let hd = `<g transform="translate(${n(hc[0])} ${n(hc[1])}) rotate(${n(p.ha*180/PI)}) scale(${n(hf)})">`;
  const rc = (x, y, w, h, f, st) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${st ? ` stroke="${st}" stroke-width="2"` : ''}/>`;
  hd += rc(-18, -42, 14, 8, C.base, C.shadeD) + rc(-22, -36, 20, 12, C.shade, C.shadeD) + rc(-19, -33, 8, 6, C.earIn) + rc(-18, -43, 14, 3, C.ink);
  hd += rc(-26, -24, 50, 46, C.base, C.shadeD);
  hd += rc(18, -6, 30, 22, C.shade, C.shadeD) + rc(22, -8, 26, 20, C.snout, C.shadeD) + rc(26, -6, 18, 3, C.light);
  hd += rc(38, 0, 5, 6, C.nostril) + rc(24, 14, 14, 3, C.nostril);
  if (exhausted) hd += `<path d="M2 -14L14 -2M14 -14L2 -2" stroke="${C.ink}" stroke-width="3.5"/>`;
  else hd += rc(3, -16, 12, 15, C.white, C.shadeD) + rc(8, -14, 6, 11, C.ink);
  hd += '</g>';
  o += hd;

  // 앞쪽 팔 + 덤벨
  arm(p.nex, p.ney, p.nhx, p.nhy, C.base, C.shadeD, C.belly);
  if (p.db > .5) {
    const dr = p.db > 1.5 ? 19 : 12;
    const dbs = (x, y) => `<circle cx="${n(x)}" cy="${n(y)}" r="${dr}" fill="#3a3a46" stroke="${C.ink}" stroke-width="2"/><circle cx="${n(x)}" cy="${n(y)}" r="${n(dr*.42)}" fill="#9aa0b4"/>`;
    o += dbs(p.nhx, p.nhy);
    hand(p.nhx + 5, p.nhy - 1, C.belly);
  }

  // 줄넘기 줄
  if (p.rope > .5) {
    const hnd = [p.nhx, p.nhy], C0 = [CX + 4, GY - 98], r = anim.ra;
    const tip = [C0[0] + 96*sin(r), C0[1] - 96*cos(r)];
    const m = [(hnd[0] + tip[0])/2, (hnd[1] + tip[1])/2], d = Math.hypot(tip[0]-hnd[0], tip[1]-hnd[1]) || 1;
    const nx = -(tip[1]-hnd[1])/d*26, ny = (tip[0]-hnd[0])/d*26;
    o += `<path d="M${pt(hnd[0], hnd[1])} Q${pt(m[0]+nx, m[1]+ny)} ${pt(tip[0], tip[1])} Q${pt(m[0]-nx, m[1]-ny)} ${pt(hnd[0], hnd[1])}" fill="none" stroke="#f2c14e" stroke-width="3.5" stroke-linecap="round"/>`;
  }
  // 땀
  if (exhausted || stamina < 35) {
    for (let i = 0; i < 2; i++) {
      const q = ((time*40 + i*18) % 36), x = hc[0] - 24 + i*12 + dir[0]*(-10), y = hc[1] - 36 + q;
      o += `<path d="M${n(x)} ${n(y-6)}Q${n(x+5)} ${n(y+1)} ${n(x)} ${n(y+3)}Q${n(x-5)} ${n(y+1)} ${n(x)} ${n(y-6)}" fill="#6ec6ff" opacity="${n(1 - q/36)}"/>`;
    }
  }
  $('pig').innerHTML = o;
}

function pigLoop(now) {
  const dt = Math.min(.05, (now - anim.last) / 1000); anim.last = now;
  requestAnimationFrame(pigLoop);
  if (document.hidden) return;
  if (anim.ex !== curEx.id) { anim.ex = curEx.id; anim.ph = anim.tg = 0; }
  const cfg = EX_ANIM[curEx.id];
  if (exhausted) anim.tg = anim.ph;
  const gap = anim.tg - anim.ph;
  if (gap > 1e-4) anim.ph += Math.min(gap, cfg.spd * dt * (gap > 2*cfg.per ? 1.6 : 1));
  const moving = gap > 1e-3;
  anim.mv += ((moving ? 1 : 0) - anim.mv) * (1 - Math.exp(-dt * (moving ? 18 : 6)));
  anim.ra = 2*PI*anim.ph + PI*(1 - anim.mv);

  const tgt = pigPose();
  if (!anim.cur) anim.cur = { ...tgt };
  let diff = 0;
  const k = 1 - Math.exp(-dt * 26);
  for (const key in tgt) { const d = tgt[key] - anim.cur[key]; diff += Math.abs(d); anim.cur[key] += d * k; }
  // 움직일 때는 매 프레임, 가만히 있을 땐 숨쉬기만 가볍게
  if (moving || diff > .3 || now - anim.drawn > 90) { anim.drawn = now; drawPig(anim.cur, now / 1000); }
}

// ---------- 화면 갱신 ----------
function render() {
  $('wt').textContent = kg(S.weightG);
  $('lost').textContent = kg(S.totalLostG);
  $('nick').textContent = S.nickname;
  $('runinfo').textContent = S.runs + '회차';
  const prog = (START_G - S.weightG) / (START_G - GOAL_G);
  $('wbar').firstElementChild.style.width = Math.min(100, prog * 100) + '%';
  $('sval').textContent = Math.floor(stamina) + ' / ' + STAMINA_MAX + (exhausted ? ' · 탈진! ' + RECOVER_AT + ' 이상 회복 필요' : '');
  $('sbar').firstElementChild.style.width = (stamina / STAMINA_MAX * 100) + '%';
  $('sbar').classList.toggle('low', exhausted || stamina < 20);
  $('stage').classList.toggle('exhausted', exhausted);
  renderItems();
  $('exlabel').textContent = curEx.ic + ' ' + curEx.nm + ' · 터치 1회 -' + (curEx.g / 1000).toFixed(2) + 'kg / 체력 -' + curEx.cost;
}

function buildExercises() {
  $('exs').innerHTML = EXERCISES.map(e => `
    <button class="ex ${e.id === curEx.id ? 'on' : ''}" data-id="${e.id}">
      <span class="ic">${e.ic}</span><span class="nm">${e.nm}</span>
      <span class="tp tag-${e.cls}">${e.tp}</span>
      <span class="st">-${(e.g/1000).toFixed(2)}kg · ⚡${e.cost}</span>
    </button>`).join('');
  $('exs').querySelectorAll('.ex').forEach(b => b.onclick = () => {
    curEx = EXERCISES.find(e => e.id === b.dataset.id);
    buildExercises(); render();
  });
}

// ---------- 아이템 / 미션 ----------
let lastReady = 0;
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2200); }
const done = q => q.val() >= q.goal;
const claimable = () => QUESTS.filter(q => done(q) && !S.claimed.includes(q.id)).length;

function renderItems() {
  $('items').innerHTML = Object.entries(ITEMS).map(([k, it]) =>
    `<button class="item" data-k="${k}" ${S.inv[k] > 0 ? '' : 'disabled'}><span class="ic">${it.ic}</span><b>${it.nm} ×${S.inv[k]}</b><small>${it.fx}</small></button>`).join('');
  $('items').querySelectorAll('.item').forEach(b => b.onclick = () => useItem(b.dataset.k));
  const buffs = [];
  if (S.buff.chicken > 0) buffs.push(`🍗 감량 2배 ${S.buff.chicken}회`);
  const left = Math.ceil((S.buff.saladUntil - Date.now()) / 1000);
  if (left > 0) buffs.push(`🥗 회복 2배 ${left}초`);
  $('buffs').textContent = buffs.join(' · ');
  const n = claimable();
  $('questBadge').textContent = n; $('questBadge').style.display = n ? 'inline-block' : 'none';
}
function useItem(k) {
  if (S.inv[k] <= 0 || S.cleared) return;
  if (stamina >= STAMINA_MAX - 1 && k === 'protein') { toast('체력이 이미 가득 차 있어요'); return; }
  S.inv[k]--;
  if (k === 'protein') stamina = Math.min(STAMINA_MAX, stamina + 40);
  if (k === 'chicken') { stamina = Math.min(STAMINA_MAX, stamina + 25); S.buff.chicken += 30; }
  if (k === 'salad') { stamina = Math.min(STAMINA_MAX, stamina + 15); S.buff.saladUntil = Math.max(Date.now(), S.buff.saladUntil) + 60000; }
  if (exhausted && stamina >= RECOVER_AT) exhausted = false;
  toast(ITEMS[k].ic + ' ' + ITEMS[k].nm + ' 섭취! ' + ITEMS[k].fx);
  dirty = true; save(); render();
}
function openQuests() {
  const rw = r => Object.entries(r).map(([k, n]) => ITEMS[k].ic + '×' + n).join(' ');
  $('questList').innerHTML = QUESTS.map(q => {
    const v = Math.min(q.val(), q.goal), ok = done(q), got = S.claimed.includes(q.id);
    const txt = q.kg ? kg(v) + ' / ' + kg(q.goal) + 'kg' : v + ' / ' + q.goal;
    return `<div class="quest ${got ? 'got' : ''}"><div class="qh"><b>${q.nm}</b><span>${rw(q.reward)}</span></div>
      <div class="qd">${q.desc}</div><div class="bar sm"><i style="width:${v / q.goal * 100}%"></i></div>
      <div class="qf"><span>${txt}</span>${got ? '<em>받음 ✓</em>' : `<button class="btn" data-id="${q.id}" ${ok ? '' : 'disabled'}>받기</button>`}</div></div>`;
  }).join('');
  $('questList').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => {
    const q = QUESTS.find(x => x.id === b.dataset.id);
    if (!done(q) || S.claimed.includes(q.id)) return;
    S.claimed.push(q.id);
    for (const [k, n] of Object.entries(q.reward)) S.inv[k] += n;
    lastReady = claimable(); dirty = true; save(); render(); openQuests();
    toast('🎁 ' + q.nm + ' 보상: ' + rw(q.reward));
  });
  $('questModal').classList.add('show');
}
$('questBtn').onclick = openQuests;
$('questClose').onclick = () => $('questModal').classList.remove('show');

// ---------- 운동 ----------
function showMsg(t) { $('msg').textContent = t; clearTimeout(showMsg.t); showMsg.t = setTimeout(() => $('msg').textContent = '', 900); }

$('stage').addEventListener('pointerdown', ev => {
  if (S.cleared || !S.nickname) return;
  if (exhausted) { showMsg('💤 너무 지쳤어요! 쉬어야 해요'); return; }
  if (stamina < curEx.cost) {
    exhausted = true; stamina = Math.max(0, stamina); showMsg('😵 체력 바닥! 휴식 필요'); render(); return;
  }
  stamina -= curEx.cost;
  lastTap = Date.now();
  const boost = S.buff.chicken > 0 ? 2 : 1;
  if (boost > 1) S.buff.chicken--;
  const g = Math.min(curEx.g * boost, S.weightG - GOAL_G);
  S.weightG -= g; S.totalLostG += g; dirty = true;
  S.stats.total++; S.stats.cat[curEx.cls]++; S.stats.ex[curEx.id] = (S.stats.ex[curEx.id] || 0) + 1;
  const ready = claimable();
  if (ready > lastReady) toast('🎯 미션 달성! 🎯 버튼에서 보상을 받으세요');
  lastReady = ready;

  const ea = EX_ANIM[curEx.id];
  anim.tg = Math.min(anim.tg + ea.per, anim.ph + ea.per * 2.5);
  const r = $('stage').getBoundingClientRect();
  const f = document.createElement('div'); f.className = 'float';
  f.textContent = '-' + (g / 1000).toFixed(2);
  f.style.left = (ev.clientX - r.left - 20) + 'px'; f.style.top = (ev.clientY - r.top - 20) + 'px';
  $('stage').appendChild(f); setTimeout(() => f.remove(), 800);

  if (S.weightG <= GOAL_G) return clearGame();
  render();
});


// 체력 회복 + 플레이 시간
let lastFrame = performance.now();
setInterval(() => {
  const now = performance.now(), dt = (now - lastFrame) / 1000; lastFrame = now;
  if (!S.nickname || S.cleared) return;
  const idle = Date.now() - lastTap > 1000;
  const regenX = Date.now() < S.buff.saladUntil ? 2 : 1;
  stamina = Math.min(STAMINA_MAX, stamina + (idle ? REGEN_IDLE : REGEN_ACTIVE) * regenX * dt);
  if (exhausted && stamina >= RECOVER_AT) exhausted = false;
  if (!document.hidden) S.runMs += dt * 1000;
  render();
}, 100);

// ---------- 클리어 ----------
function fmt(ms) {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (h ? h + '시간 ' : '') + m + '분 ' + ss + '초';
}
function clearGame() {
  S.cleared = true; S.runMs = Math.round(S.runMs);
  if (S.bestClearMs == null || S.runMs < S.bestClearMs) S.bestClearMs = S.runMs;
  $('clearTime').textContent = fmt(S.runMs);
  render(); dirty = true; save();
  $('clearModal').classList.add('show');
}
$('restartBtn').onclick = () => {
  S.runs++; S.weightG = START_G; S.runMs = 0; S.cleared = false;
  stamina = STAMINA_MAX; exhausted = false;
  $('clearModal').classList.remove('show'); render(); dirty = true; save();
};
$('clearRank').onclick = () => openRank();

// ---------- 저장 ----------
async function save() {
  saveLocal();
  if (!online || !dirty) return;
  dirty = false;
  try {
    await fb.setDoc(fb.doc(db, 'buta', uid), {
      nickname: S.nickname, weightG: S.weightG, totalLostG: S.totalLostG, runs: S.runs,
      runMs: Math.round(S.runMs), bestClearMs: S.bestClearMs, cleared: S.cleared,
      stats: S.stats, inv: S.inv, claimed: S.claimed, buff: S.buff,
      updatedAt: fb.serverTimestamp()
    });
  } catch (e) { console.warn('저장 실패', e); dirty = true; }
}
setInterval(save, 5000);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ---------- 스코어보드 ----------
let tab = 'lost';
function setTab(t) { tab = t; $('tabLost').classList.toggle('on', t === 'lost'); $('tabClear').classList.toggle('on', t === 'clear'); openRank(); }
$('tabLost').onclick = () => setTab('lost');
$('tabClear').onclick = () => setTab('clear');
$('rankBtn').onclick = () => openRank();
$('rankClose').onclick = () => $('rankModal').classList.remove('show');

async function openRank() {
  $('rankModal').classList.add('show');
  const tbl = $('rankTable'), note = $('rankNote');
  note.textContent = '';
  tbl.innerHTML = '<tr><td>불러오는 중...</td></tr>';
  let rows = [];
  if (online) {
    try {
      const q = tab === 'lost'
        ? fb.query(fb.collection(db, 'buta'), fb.orderBy('totalLostG', 'desc'), fb.limit(30))
        : fb.query(fb.collection(db, 'buta'), fb.where('bestClearMs', '>', 0), fb.orderBy('bestClearMs', 'asc'), fb.limit(30));
      const snap = await fb.getDocs(q);
      rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) { tbl.innerHTML = '<tr><td>스코어보드를 불러오지 못했어요.</td></tr>'; console.warn(e); return; }
  } else {
    if (tab === 'lost' || S.bestClearMs) rows = [{ id: uid, ...S }];
    note.textContent = 'Firebase가 연결되지 않아 내 기록만 보여요. (firebaseConfig를 설정하세요)';
  }
  if (!rows.length) { tbl.innerHTML = '<tr><td>아직 기록이 없어요.</td></tr>'; return; }
  const head = tab === 'lost' ? '<th>#</th><th>닉네임</th><th>총 감량</th>' : '<th>#</th><th>닉네임</th><th>최단 클리어</th>';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  tbl.innerHTML = '<tr>' + head + '</tr>' + rows.map((r, i) =>
    `<tr class="${r.id === uid ? 'me' : ''}"><td>${i + 1}</td><td>${esc(r.nickname)}${r.cleared ? ' ✅' : ''}</td><td>${
      tab === 'lost' ? kg(r.totalLostG) + 'kg' : fmt(r.bestClearMs)}</td></tr>`).join('');
}

// ---------- 시작 ----------
async function initFirebase() {
  if (firebaseConfig.apiKey.startsWith('YOUR_')) return;
  try {
    const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
    const [app, auth, fs] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const a = app.initializeApp(firebaseConfig);
    const au = auth.getAuth(a);
    await new Promise(res => { const un = auth.onAuthStateChanged(au, u => { if (u) { un(); res(); } }); auth.signInAnonymously(au).catch(res); });
    if (!au.currentUser) throw new Error('익명 로그인 실패');
    uid = au.currentUser.uid; db = fs.getFirestore(a); fb = fs; online = true;
  } catch (e) { console.warn('Firebase 사용 불가, 로컬 모드로 실행', e); online = false; }
}

function askNick() {
  return new Promise(res => {
    $('nickModal').classList.add('show');
    const ok = () => { const v = $('nickInput').value.trim().slice(0, 10); if (!v) return; $('nickModal').classList.remove('show'); res(v); };
    $('nickOk').onclick = ok;
    $('nickInput').onkeydown = e => { if (e.key === 'Enter') ok(); };
  });
}

(async () => {
  buildExercises(); render(); requestAnimationFrame(pigLoop);
  await initFirebase();
  let loaded = null;
  if (online) {
    try { const d = await fb.getDoc(fb.doc(db, 'buta', uid)); if (d.exists()) loaded = d.data(); } catch (e) { console.warn(e); }
  } else loaded = loadLocal();
  if (loaded) {
    S = { ...S, nickname: loaded.nickname || '', weightG: loaded.weightG ?? START_G, totalLostG: loaded.totalLostG ?? 0,
          runs: loaded.runs ?? 1, runMs: loaded.runMs ?? 0, bestClearMs: loaded.bestClearMs ?? null, cleared: !!loaded.cleared,
          stats: { ...newStats(), ...(loaded.stats || {}), cat: { a:0, b:0, c:0, ...(loaded.stats?.cat || {}) }, ex: { ...(loaded.stats?.ex || {}) } },
          inv: { ...S.inv, ...(loaded.inv || {}) }, claimed: loaded.claimed || [], buff: { ...S.buff, ...(loaded.buff || {}) } };
  }
  if (!S.nickname) { S.nickname = await askNick(); dirty = true; save(); }
  lastReady = claimable();
  if (S.cleared) { $('clearTime').textContent = fmt(S.runMs); $('clearModal').classList.add('show'); }
  render();
})();
</script>
</body>
</html>
