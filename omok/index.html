<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>온라인 오목</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: #1b1410; color: #fff;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
  h1 { margin: 0 0 10px; font-size: 26px; }
  .panel { width: min(420px, 100%); background: #2b2018; border: 1px solid #5a4636; border-radius: 14px; padding: 18px; text-align: center; }
  .panel button, .panel input { font: inherit; font-size: 18px; border-radius: 10px; border: 0; padding: 12px; width: 100%; margin-top: 10px; }
  .panel button { background: #e8b04a; color: #2b1a05; font-weight: 700; }
  .panel button.sub { background: #4a3a2c; color: #fff; }
  .panel input { background: #fff; color: #000; text-align: center; letter-spacing: 6px; text-transform: uppercase; }
  .code { font-size: 48px; font-weight: 800; letter-spacing: 8px; color: #e8b04a; margin: 10px 0; }
  .msg { color: #cbb7a3; font-size: 14px; min-height: 20px; margin-top: 8px; }
  .panel input.nick { letter-spacing: 0; text-transform: none; margin-top: 0; }
  .rooms { margin-top: 14px; text-align: left; }
  .rooms h3 { margin: 0 0 6px; font-size: 15px; color: #cbb7a3; display: flex; justify-content: space-between; }
  .room { display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin-top: 6px; background: #3a2c20; border-radius: 10px; }
  .room b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room small { color: #9c8a78; }
  .panel .room button { width: auto; margin: 0; padding: 8px 16px; font-size: 15px; }
  .empty { color: #9c8a78; font-size: 14px; padding: 14px 0; text-align: center; }
  #game { display: none; flex-direction: column; align-items: center; width: 100%; }
  #status { font-size: 18px; font-weight: 700; margin-bottom: 8px; min-height: 26px; text-align: center; }
  #status .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 4px; }
  canvas { width: min(96vw, 78vh, 640px); height: auto; aspect-ratio: 1; touch-action: manipulation; border-radius: 6px; }
  #again { display: none; margin-top: 12px; padding: 12px 28px; font: inherit; font-size: 18px; font-weight: 700; border: 0; border-radius: 10px; background: #e8b04a; color: #2b1a05; }
  .home-btn { position: fixed; right: 12px; bottom: 12px; z-index: 9999; padding: 8px 14px; border-radius: 999px;
    background: #000a; color: #fff; font: 700 14px/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    text-decoration: none; border: 1px solid #fff6; }
  .home-btn:active { transform: translateY(2px); }
</style>
</head>
<body>
<a class="home-btn" href="../">🏠 메인 메뉴</a>

<h1>⚫⚪ 온라인 오목</h1>

<div id="lobby" class="panel">
  <input id="nick" class="nick" maxlength="10" placeholder="닉네임" autocomplete="off">
  <button id="createBtn">방 만들기</button>
  <div class="rooms">
    <h3><span>대기 중인 방</span><span id="roomCount"></span></h3>
    <div id="roomList"><div class="empty">방 목록 불러오는 중…</div></div>
  </div>
  <input id="codeIn" maxlength="4" placeholder="코드로 입장 (선택)" autocapitalize="characters" autocomplete="off">
  <button id="joinBtn" class="sub">코드로 입장</button>
  <div class="msg" id="lobbyMsg">렌주룰: 흑 3-3·4-4·장목 금지</div>
</div>

<div id="wait" class="panel" style="display:none">
  <div>친구에게 이 코드를 알려주세요</div>
  <div class="code" id="roomCode">----</div>
  <div class="msg">상대가 입장하길 기다리는 중…</div>
  <button id="cancelBtn" class="sub">방 닫기</button>
</div>

<div id="game">
  <div id="status"></div>
  <canvas id="cv" width="600" height="600"></canvas>
  <button id="again">다시 하기</button>
</div>

<script>
(() => {
  const N = 15, SIZE = 600, CELL = SIZE / (N + 1);
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const PREFIX = 'cpisgod-omok-';
  const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  let peer, conn, myColor = 0, isHost = false;   // 1 = 흑(선공), 2 = 백
  let board, turn, last, winner, winLine, started = false;

  function show(id) {
    ['lobby', 'wait'].forEach(x => $(x).style.display = x === id ? 'block' : 'none');
    $('game').style.display = id === 'game' ? 'flex' : 'none';
  }
  const lobbyMsg = t => $('lobbyMsg').textContent = t;

  // ---------- 연결 ----------
  function newCode() { return Array.from({length: 4}, () => CHARS[Math.random() * CHARS.length | 0]).join(''); }

  // ---------- 로비 (Firestore 방 목록) ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBPgoO4EXWFagGEutquysQPmcvFk37eXbU",
    authDomain: "game-81004.firebaseapp.com",
    projectId: "game-81004",
    storageBucket: "game-81004.firebasestorage.app",
    messagingSenderId: "217133907611",
    appId: "1:217133907611:web:a62de72fc5c909390bd03e"
  };
  const ROOM_TTL = 25000, HB_MS = 8000;
  let db = null, fs = null, rooms = [], myCode = null, hbTimer = null;
  const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  try { $('nick').value = localStorage.getItem('omokNick') || ''; } catch (e) {}
  const nick = () => {
    const n = $('nick').value.trim().slice(0, 10) || '손님' + (Math.random() * 900 + 100 | 0);
    try { localStorage.setItem('omokNick', $('nick').value.trim()); } catch (e) {}
    return n;
  };

  async function initLobby() {
    try {
      const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [app, f] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
      db = f.getFirestore(app.initializeApp(firebaseConfig, 'omok')); fs = f;
      fs.onSnapshot(fs.collection(db, 'omok_rooms'), snap => {
        rooms = snap.docs.map(d => ({code: d.id, ...d.data()}));
        const dead = rooms.filter(r => Date.now() - r.hb > 120000);   // 오래된 방 정리
        dead.forEach(r => fs.deleteDoc(fs.doc(db, 'omok_rooms', r.code)).catch(() => {}));
        renderRooms();
      }, () => { db = null; $('roomList').innerHTML = '<div class="empty">방 목록을 불러올 수 없어요. 코드로 입장하세요.</div>'; });
    } catch (e) { $('roomList').innerHTML = '<div class="empty">방 목록을 불러올 수 없어요. 코드로 입장하세요.</div>'; }
  }
  function renderRooms() {
    const live = rooms.filter(r => Date.now() - r.hb < ROOM_TTL && r.code !== myCode)
                      .sort((a, b) => b.hb - a.hb);
    $('roomCount').textContent = live.length ? live.length + '개' : '';
    $('roomList').innerHTML = live.length ? live.map(r =>
      `<div class="room"><b>${esc(r.name)}</b><small>${esc(r.code)}</small><button data-c="${esc(r.code)}">입장</button></div>`).join('')
      : '<div class="empty">열린 방이 없어요. 방을 만들어 보세요!</div>';
  }
  $('roomList').addEventListener('click', e => {
    const c = e.target.dataset && e.target.dataset.c;
    if (c) joinRoom(c);
  });
  setInterval(renderRooms, 5000);

  const roomRef = () => fs.doc(db, 'omok_rooms', myCode);
  function publishRoom(name) {
    if (!db) return;
    const put = () => fs.setDoc(roomRef(), {name, hb: Date.now()}).catch(() => {});
    put(); hbTimer = setInterval(put, HB_MS);
  }
  function unpublishRoom() {
    clearInterval(hbTimer); hbTimer = null;
    if (db && myCode) fs.deleteDoc(roomRef()).catch(() => {});
  }
  addEventListener('pagehide', unpublishRoom);

  // ---------- 연결 ----------
  function newCode() { return Array.from({length: 4}, () => CHARS[Math.random() * CHARS.length | 0]).join(''); }

  $('createBtn').onclick = () => {
    isHost = true; lobbyMsg('방 만드는 중…');
    const name = nick();
    const tryCreate = () => {
      const code = newCode();
      peer = new Peer(PREFIX + code);
      peer.on('open', () => { myCode = code; $('roomCode').textContent = code; show('wait'); publishRoom(name); });
      peer.on('error', e => {
        if (e.type === 'unavailable-id') { peer.destroy(); tryCreate(); }
        else { lobbyMsg('오류: ' + e.type); unpublishRoom(); show('lobby'); }
      });
      peer.on('connection', c => {
        if (conn) { c.close(); return; }
        conn = c; wire(); c.on('open', () => { unpublishRoom(); startGame(true); });
      });
    };
    tryCreate();
  };

  $('cancelBtn').onclick = () => {
    unpublishRoom(); myCode = null;
    if (peer) peer.destroy();
    peer = conn = null; isHost = false;
    lobbyMsg('렌주룰: 흑 3-3·4-4·장목 금지'); show('lobby'); renderRooms();
  };

  function joinRoom(code) {
    isHost = false; lobbyMsg('접속 중…');
    if (peer) peer.destroy();
    peer = new Peer();
    peer.on('error', e => { lobbyMsg(e.type === 'peer-unavailable' ? '방이 사라졌어요' : '오류: ' + e.type); });
    peer.on('open', () => {
      conn = peer.connect(PREFIX + code, {reliable: true});
      wire();
      setTimeout(() => { if (!started) lobbyMsg('연결 시간 초과. 다른 방을 시도하세요'); }, 10000);
    });
  }
  $('joinBtn').onclick = () => {
    const code = $('codeIn').value.trim().toUpperCase();
    if (code.length !== 4) { lobbyMsg('4자리 코드를 입력하세요'); return; }
    joinRoom(code);
  };
  initLobby();

  function wire() {
    conn.on('data', onData);
    conn.on('close', () => { if (started) { winner = winner || -1; setStatus('상대 연결이 끊겼어요'); $('again').style.display = 'none'; } });
  }
  const send = m => conn && conn.open && conn.send(m);

  function onData(m) {
    if (m.t === 'start') { myColor = m.color; reset(); started = true; show('game'); draw(); updateStatus(); }
    else if (m.t === 'move') place(m.x, m.y, false);
    else if (m.t === 'again') { // 호스트가 색을 바꿔 재시작
      myColor = m.color; reset(); draw(); updateStatus();
    }
  }

  function startGame() {
    myColor = Math.random() < .5 ? 1 : 2;
    send({t: 'start', color: 3 - myColor});
    reset(); started = true; show('game'); draw(); updateStatus();
  }

  $('again').onclick = () => {
    if (isHost) {
      myColor = 3 - myColor;
      send({t: 'again', color: 3 - myColor});
      reset(); draw(); updateStatus();
    }
  };

  // ---------- 게임 ----------
  function reset() {
    board = Array.from({length: N}, () => Array(N).fill(0));
    turn = 1; last = null; winner = 0; winLine = null;
    $('again').style.display = 'none';
  }

  // ---------- 렌주룰 (흑: 3-3, 4-4, 장목 금지 / 정확히 5목만 승리) ----------
  const DIRS = [[1,0],[0,1],[1,1],[1,-1]];
  const inB = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
  const at = (x, y) => inB(x, y) ? board[y][x] : -1;   // 판 밖은 -1(막힘)

  // (x,y)에 c가 놓여 있다고 보고 dir 방향 연속 길이
  function run(x, y, dx, dy, c) {
    let n = 1;
    for (const s of [1, -1]) {
      let nx = x + dx * s, ny = y + dy * s;
      while (at(nx, ny) === c) { n++; nx += dx * s; ny += dy * s; }
    }
    return n;
  }
  // 임시로 c를 놓고 fn 실행
  function tryPut(x, y, c, fn) {
    board[y][x] = c;
    try { return fn(); } finally { board[y][x] = 0; }
  }
  // 방향 d에서 e에 흑을 두면 정확히 5목이 되는 빈칸 목록
  function fiveSpots(x, y, d) {
    const out = [];
    for (let k = -5; k <= 5; k++) {
      const ex = x + d[0] * k, ey = y + d[1] * k;
      if (at(ex, ey) !== 0) continue;
      if (tryPut(ex, ey, 1, () => run(ex, ey, d[0], d[1], 1) === 5)) out.push(k);
    }
    return out;
  }
  // 방향 d에 열린 3이 있는가 (한 수로 '진짜 열린 4'를 만들 수 있음)
  function hasOpenThree(x, y, d) {
    for (let k = -4; k <= 4; k++) {
      const ex = x + d[0] * k, ey = y + d[1] * k;
      if (at(ex, ey) !== 0) continue;
      const ok = tryPut(ex, ey, 1, () => {
        if (run(ex, ey, d[0], d[1], 1) !== 4) return false;
        if (isForbidden(ex, ey)) return false;
        // 4개 양 끝이 모두 비어 있고, 어느 쪽으로 이어도 정확히 5목이어야 함
        let a = 0; while (at(ex + d[0] * (a + 1), ey + d[1] * (a + 1)) === 1) a++;
        let b = 0; while (at(ex - d[0] * (b + 1), ey - d[1] * (b + 1)) === 1) b++;
        const e1x = ex + d[0] * (a + 1), e1y = ey + d[1] * (a + 1);
        const e2x = ex - d[0] * (b + 1), e2y = ey - d[1] * (b + 1);
        if (at(e1x, e1y) !== 0 || at(e2x, e2y) !== 0) return false;
        return tryPut(e1x, e1y, 1, () => run(e1x, e1y, d[0], d[1], 1) === 5)
            && tryPut(e2x, e2y, 1, () => run(e2x, e2y, d[0], d[1], 1) === 5);
      });
      if (ok) return true;
    }
    return false;
  }
  // 흑이 (x,y)에 이미 놓인 상태에서 금수인가
  function isForbidden(x, y) {
    if (DIRS.some(d => run(x, y, d[0], d[1], 1) === 5)) return false;   // 5목 완성이면 금수 아님
    if (DIRS.some(d => run(x, y, d[0], d[1], 1) >= 6)) return true;     // 장목
    let fours = 0, threes = 0;
    for (const d of DIRS) {
      const sp = fiveSpots(x, y, d);
      if (sp.length >= 2) fours += (sp.length === 2 && Math.abs(sp[0] - sp[1]) === 5) ? 1 : 2;
      else fours += sp.length;
      if (hasOpenThree(x, y, d)) threes++;
    }
    return fours >= 2 || threes >= 2;
  }
  // 빈칸 (x,y)가 흑의 금수 자리인가
  function forbiddenAt(x, y) {
    if (board[y][x]) return false;
    return tryPut(x, y, 1, () => isForbidden(x, y));
  }

  function checkWin(x, y, c) {
    for (const d of DIRS) {
      const n = run(x, y, d[0], d[1], c);
      if (c === 1 ? n === 5 : n >= 5) {
        const line = [[x, y]];
        for (const s of [1, -1]) {
          let nx = x + d[0] * s, ny = y + d[1] * s;
          while (at(nx, ny) === c) { line.push([nx, ny]); nx += d[0] * s; ny += d[1] * s; }
        }
        return line;
      }
    }
    return null;
  }

  function place(x, y, mine) {
    if (winner || board[y][x]) return;
    const c = turn;
    board[y][x] = c; last = [x, y];
    const line = checkWin(x, y, c);
    if (line) { winner = c; winLine = line; }
    else if (board.every(r => r.every(v => v))) winner = 3;
    else turn = 3 - turn;
    if (mine) send({t: 'move', x, y});
    draw(); updateStatus();
    if (winner && isHost) $('again').style.display = 'inline-block';
  }

  cv.addEventListener('pointerdown', e => {
    if (!started || winner || turn !== myColor) return;
    const r = cv.getBoundingClientRect();
    const px = (e.clientX - r.left) * SIZE / r.width, py = (e.clientY - r.top) * SIZE / r.height;
    const x = Math.round(px / CELL) - 1, y = Math.round(py / CELL) - 1;
    if (x < 0 || y < 0 || x >= N || y >= N) return;
    if (board[y][x]) return;
    if (myColor === 1 && forbiddenAt(x, y)) { flash('금수 자리예요 (3-3 / 4-4 / 장목)'); return; }
    place(x, y, true);
  });

  let flashT;
  function flash(t) {
    setStatus(`<span style="color:#ff7070">${t}</span>`);
    clearTimeout(flashT); flashT = setTimeout(updateStatus, 1500);
  }

  const dot = c => `<span class="dot" style="background:${c === 1 ? '#000' : '#fff'};border:1px solid #888"></span>`;
  function setStatus(t) { $('status').innerHTML = t; }
  function updateStatus() {
    const me = `나: ${dot(myColor)}${myColor === 1 ? '흑(선공)' : '백'}`;
    if (winner === 3) setStatus('무승부!' + (isHost ? '' : ' (방장이 다시 시작)'));
    else if (winner) setStatus(winner === myColor ? '🎉 승리!' : '😢 패배' + (isHost ? '' : ' (방장이 다시 시작)'));
    else setStatus(`${me} · ${turn === myColor ? '내 차례' : '상대 차례'}`);
  }

  function draw() {
    ctx.fillStyle = '#e0b060'; ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.strokeStyle = '#5a3d12'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const p = (i + 1) * CELL;
      ctx.moveTo(CELL, p); ctx.lineTo(N * CELL, p);
      ctx.moveTo(p, CELL); ctx.lineTo(p, N * CELL);
    }
    ctx.stroke();
    ctx.fillStyle = '#5a3d12';
    for (const [x, y] of [[3,3],[11,3],[7,7],[3,11],[11,11]]) {
      ctx.beginPath(); ctx.arc((x + 1) * CELL, (y + 1) * CELL, 4, 0, 7); ctx.fill();
    }
    if (!board) return;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const c = board[y][x]; if (!c) continue;
      const cx = (x + 1) * CELL, cy = (y + 1) * CELL, r = CELL * .45;
      const g = ctx.createRadialGradient(cx - r * .3, cy - r * .3, r * .1, cx, cy, r);
      if (c === 1) { g.addColorStop(0, '#666'); g.addColorStop(1, '#000'); }
      else { g.addColorStop(0, '#fff'); g.addColorStop(1, '#bbb'); }
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    }
    if (started && !winner && myColor === 1 && turn === 1) {
      ctx.strokeStyle = '#d22'; ctx.lineWidth = 3;
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        if (!forbiddenAt(x, y)) continue;
        const cx = (x + 1) * CELL, cy = (y + 1) * CELL, r = CELL * .22;
        ctx.beginPath(); ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
        ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r); ctx.stroke();
      }
    }
    if (last) {
      ctx.strokeStyle = '#e22'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc((last[0] + 1) * CELL, (last[1] + 1) * CELL, CELL * .2, 0, 7); ctx.stroke();
    }
    if (winLine) {
      ctx.strokeStyle = '#e22'; ctx.lineWidth = 4;
      for (const [x, y] of winLine) {
        ctx.beginPath(); ctx.arc((x + 1) * CELL, (y + 1) * CELL, CELL * .45, 0, 7); ctx.stroke();
      }
    }
  }
  draw();
})();
</script>
</body>
</html>
