<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>온라인 오목</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: #1b1410; color: #fff;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
  h1 { margin: 0 0 10px; font-size: 26px; }
  .panel { width: min(420px, 100%); background: #2b2018; border: 1px solid #5a4636; border-radius: 14px; padding: 18px; text-align: center; }
  .panel button, .panel input { font: inherit; font-size: 18px; border-radius: 10px; border: 0; padding: 12px; width: 100%; margin-top: 10px; }
  .panel button { background: #e8b04a; color: #2b1a05; font-weight: 700; }
  .panel button.sub { background: #4a3a2c; color: #fff; }
  .panel input { background: #fff; color: #000; text-align: center; letter-spacing: 6px; text-transform: uppercase; }
  .code { font-size: 48px; font-weight: 800; letter-spacing: 8px; color: #e8b04a; margin: 10px 0; }
  .msg { color: #cbb7a3; font-size: 14px; min-height: 20px; margin-top: 8px; }
  #game { display: none; flex-direction: column; align-items: center; width: 100%; }
  #status { font-size: 18px; font-weight: 700; margin-bottom: 8px; min-height: 26px; text-align: center; }
  #status .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 4px; }
  canvas { width: min(96vw, 78vh, 640px); height: auto; aspect-ratio: 1; touch-action: manipulation; border-radius: 6px; }
  #again { display: none; margin-top: 12px; padding: 12px 28px; font: inherit; font-size: 18px; font-weight: 700; border: 0; border-radius: 10px; background: #e8b04a; color: #2b1a05; }
  .home-btn { position: fixed; right: 12px; bottom: 12px; z-index: 9999; padding: 8px 14px; border-radius: 999px;
    background: #000a; color: #fff; font: 700 14px/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    text-decoration: none; border: 1px solid #fff6; }
  .home-btn:active { transform: translateY(2px); }
</style>
</head>
<body>
<a class="home-btn" href="../">🏠 메인 메뉴</a>

<h1>⚫⚪ 온라인 오목</h1>

<div id="lobby" class="panel">
  <button id="createBtn">방 만들기</button>
  <input id="codeIn" maxlength="4" placeholder="방 코드" autocapitalize="characters" autocomplete="off">
  <button id="joinBtn" class="sub">코드로 입장</button>
  <div class="msg" id="lobbyMsg">두 대의 폰에서 같은 코드로 접속하세요</div>
</div>

<div id="wait" class="panel" style="display:none">
  <div>친구에게 이 코드를 알려주세요</div>
  <div class="code" id="roomCode">----</div>
  <div class="msg">상대가 입장하길 기다리는 중…</div>
</div>

<div id="game">
  <div id="status"></div>
  <canvas id="cv" width="600" height="600"></canvas>
  <button id="again">다시 하기</button>
</div>

<script>
(() => {
  const N = 15, SIZE = 600, CELL = SIZE / (N + 1);
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const PREFIX = 'cpisgod-omok-';
  const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  let peer, conn, myColor = 0, isHost = false;   // 1 = 흑(선공), 2 = 백
  let board, turn, last, winner, winLine, started = false;

  function show(id) {
    ['lobby', 'wait'].forEach(x => $(x).style.display = x === id ? 'block' : 'none');
    $('game').style.display = id === 'game' ? 'flex' : 'none';
  }
  const lobbyMsg = t => $('lobbyMsg').textContent = t;

  // ---------- 연결 ----------
  function newCode() { return Array.from({length: 4}, () => CHARS[Math.random() * CHARS.length | 0]).join(''); }

  $('createBtn').onclick = () => {
    isHost = true; lobbyMsg('방 만드는 중…');
    const tryCreate = () => {
      const code = newCode();
      peer = new Peer(PREFIX + code);
      peer.on('open', () => { $('roomCode').textContent = code; show('wait'); });
      peer.on('error', e => {
        if (e.type === 'unavailable-id') { peer.destroy(); tryCreate(); }
        else { lobbyMsg('오류: ' + e.type); show('lobby'); }
      });
      peer.on('connection', c => {
        if (conn) { c.close(); return; }
        conn = c; wire(); c.on('open', () => startGame(true));
      });
    };
    tryCreate();
  };

  $('joinBtn').onclick = () => {
    const code = $('codeIn').value.trim().toUpperCase();
    if (code.length !== 4) { lobbyMsg('4자리 코드를 입력하세요'); return; }
    isHost = false; lobbyMsg('접속 중…');
    peer = new Peer();
    peer.on('error', e => { lobbyMsg(e.type === 'peer-unavailable' ? '해당 코드의 방이 없어요' : '오류: ' + e.type); });
    peer.on('open', () => {
      conn = peer.connect(PREFIX + code, {reliable: true});
      wire();
      setTimeout(() => { if (!started) lobbyMsg('연결 시간 초과. 코드를 확인하세요'); }, 10000);
    });
  };

  function wire() {
    conn.on('data', onData);
    conn.on('close', () => { if (started) { winner = winner || -1; setStatus('상대 연결이 끊겼어요'); $('again').style.display = 'none'; } });
  }
  const send = m => conn && conn.open && conn.send(m);

  function onData(m) {
    if (m.t === 'start') { myColor = m.color; reset(); started = true; show('game'); draw(); updateStatus(); }
    else if (m.t === 'move') place(m.x, m.y, false);
    else if (m.t === 'again') { // 호스트가 색을 바꿔 재시작
      myColor = m.color; reset(); draw(); updateStatus();
    }
  }

  function startGame() {
    myColor = Math.random() < .5 ? 1 : 2;
    send({t: 'start', color: 3 - myColor});
    reset(); started = true; show('game'); draw(); updateStatus();
  }

  $('again').onclick = () => {
    if (isHost) {
      myColor = 3 - myColor;
      send({t: 'again', color: 3 - myColor});
      reset(); draw(); updateStatus();
    }
  };

  // ---------- 게임 ----------
  function reset() {
    board = Array.from({length: N}, () => Array(N).fill(0));
    turn = 1; last = null; winner = 0; winLine = null;
    $('again').style.display = 'none';
  }

  function checkWin(x, y, c) {
    for (const [dx, dy] of [[1,0],[0,1],[1,1],[1,-1]]) {
      const line = [[x, y]];
      for (const s of [1, -1]) {
        let nx = x + dx * s, ny = y + dy * s;
        while (nx >= 0 && ny >= 0 && nx < N && ny < N && board[ny][nx] === c) { line.push([nx, ny]); nx += dx * s; ny += dy * s; }
      }
      if (line.length >= 5) return line;
    }
    return null;
  }

  function place(x, y, mine) {
    if (winner || board[y][x]) return;
    const c = turn;
    board[y][x] = c; last = [x, y];
    const line = checkWin(x, y, c);
    if (line) { winner = c; winLine = line; }
    else if (board.every(r => r.every(v => v))) winner = 3;
    else turn = 3 - turn;
    if (mine) send({t: 'move', x, y});
    draw(); updateStatus();
    if (winner && isHost) $('again').style.display = 'inline-block';
  }

  cv.addEventListener('pointerdown', e => {
    if (!started || winner || turn !== myColor) return;
    const r = cv.getBoundingClientRect();
    const px = (e.clientX - r.left) * SIZE / r.width, py = (e.clientY - r.top) * SIZE / r.height;
    const x = Math.round(px / CELL) - 1, y = Math.round(py / CELL) - 1;
    if (x < 0 || y < 0 || x >= N || y >= N) return;
    place(x, y, true);
  });

  const dot = c => `<span class="dot" style="background:${c === 1 ? '#000' : '#fff'};border:1px solid #888"></span>`;
  function setStatus(t) { $('status').innerHTML = t; }
  function updateStatus() {
    const me = `나: ${dot(myColor)}${myColor === 1 ? '흑(선공)' : '백'}`;
    if (winner === 3) setStatus('무승부!' + (isHost ? '' : ' (방장이 다시 시작)'));
    else if (winner) setStatus(winner === myColor ? '🎉 승리!' : '😢 패배' + (isHost ? '' : ' (방장이 다시 시작)'));
    else setStatus(`${me} · ${turn === myColor ? '내 차례' : '상대 차례'}`);
  }

  function draw() {
    ctx.fillStyle = '#e0b060'; ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.strokeStyle = '#5a3d12'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const p = (i + 1) * CELL;
      ctx.moveTo(CELL, p); ctx.lineTo(N * CELL, p);
      ctx.moveTo(p, CELL); ctx.lineTo(p, N * CELL);
    }
    ctx.stroke();
    ctx.fillStyle = '#5a3d12';
    for (const [x, y] of [[3,3],[11,3],[7,7],[3,11],[11,11]]) {
      ctx.beginPath(); ctx.arc((x + 1) * CELL, (y + 1) * CELL, 4, 0, 7); ctx.fill();
    }
    if (!board) return;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const c = board[y][x]; if (!c) continue;
      const cx = (x + 1) * CELL, cy = (y + 1) * CELL, r = CELL * .45;
      const g = ctx.createRadialGradient(cx - r * .3, cy - r * .3, r * .1, cx, cy, r);
      if (c === 1) { g.addColorStop(0, '#666'); g.addColorStop(1, '#000'); }
      else { g.addColorStop(0, '#fff'); g.addColorStop(1, '#bbb'); }
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    }
    if (last) {
      ctx.strokeStyle = '#e22'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc((last[0] + 1) * CELL, (last[1] + 1) * CELL, CELL * .2, 0, 7); ctx.stroke();
    }
    if (winLine) {
      ctx.strokeStyle = '#e22'; ctx.lineWidth = 4;
      for (const [x, y] of winLine) {
        ctx.beginPath(); ctx.arc((x + 1) * CELL, (y + 1) * CELL, CELL * .45, 0, 7); ctx.stroke();
      }
    }
  }
  draw();
})();
</script>
</body>
</html>
