<!DOCTYPE html>

<title>블록 월드 (마크 인디브)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .slot.sel { border-color: #fff; background: #fff3; transform: scale(1.1); z-index: 1; }

  #overlay button.sub { font-size: 13px; padding: 6px 14px; background: #7a2f2f; border-width: 2px; }

  #overlay .opts div { display: flex; gap: 6px; align-items: center; font-size: 14px; }
  #overlay .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

  #overlay button.opt.on { background: #5a9a3a; border-color: #fff; }
  #overlay button.sub.ok { background: #2f5f7a; }

  #inv { position: fixed; inset: 0; z-index: 15; display: none; align-items: center; justify-content: center; background: #0007; padding-bottom: 80px; }
  #inv.show { display: flex; }
  #inv .panel { background: #c6c6c6; border: 4px solid #333; padding: 12px 14px; max-width: min(96vw, 560px); max-height: 80vh; overflow: auto; color: #222; text-align: center; }

  #bJump { right: 22px; bottom: 150px; }
  #bBreak { right: 96px; bottom: 100px; }
  #bPlace { right: 22px; bottom: 70px; }

    background: #000a; color: #fff; font: 700 14px/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    text-decoration: none; border: 1px solid #fff6; }

  body.touch .home-btn { bottom: auto; top: 10px; }

<body>
<a class="home-btn" href="../">🏠 메인 메뉴</a>

<canvas id="view"></canvas>
<div id="cross"></div>
<div id="hud"></div>
<div id="toast"></div>
<div id="fx"><div id="water" class="fx" style="position:absolute;inset:0"></div><div id="hurt" style="position:absolute;inset:0"></div></div>
<div id="hearts"></div>

<div id="touch">

  <div class="tbtn" id="bJump">점프</div>

  <div class="tbtn" id="bDown">하강</div>
  <div class="tbtn" id="bInv">🎒</div>
</div>

<div id="overlay">
  <h1>⛏️ 블록 월드</h1>
  <p>
    <b>WASD</b> 이동 · <b>마우스</b> 시점 · <b>Space</b> 점프(크리에이티브: <b>두 번</b> 눌러 비행, <b>Shift</b> 하강)<br>
    <b>좌클릭</b> 부수기/공격 · <b>우클릭</b> 설치 · <b>1~9 / 휠</b> 블록 선택 · <b>E</b> 인벤토리 · <b>ESC</b> 일시정지<br>
    <span id="touchHelp" style="display:none">📱 왼쪽 조이스틱 이동 · 화면 드래그 시점 · 점프 버튼 두 번 = 비행</span>
  </p>
  <div class="opts">

    <div>모드 <button class="opt" data-gm="creative">크리에이티브</button><button class="opt" data-gm="survival">서바이벌</button></div>
  </div>

  <div class="row">

    <button id="importBtn" class="sub ok">📥 가져오기</button>
    <button id="soundBtn" class="sub ok">🔊 효과음 ON</button>
    <button id="resetBtn" class="sub">월드 초기화</button>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <p id="loadMsg">불러오는 중…</p>
</div>

<script type="module">
import * as THREE from 'three';

/* ================= 상수 / 블록 정의 ================= */
const CS = 16, MINY = -4, H = 48, R = 6, SEA = 1, SEED = 0x5bd1e995 | 0;
const TOPY = MINY + H - 1;
const DAY_LEN = 360;
const GRASS = 1, DIRT = 2, STONE = 3, PLANKS = 4, LOG = 5, BRICK = 6, SAND = 7, GLASS = 8, WOOL_R = 9, BEDROCK = 10,
  LEAVES = 11, SNOW = 12, WATER = 13, GLOW = 14, COBBLE = 20, SANDSTONE = 21, ICE = 22;
// t: [위, 옆, 아래] 타일, h: 부수는 시간(초), s: 소리 종류
const BLK = {
  1: { n: '잔디', t: [0, 1, 2], h: 0.6, s: 'soft', drop: DIRT },
  2: { n: '흙', t: [2, 2, 2], h: 0.5, s: 'soft' },
  3: { n: '돌', t: [3, 3, 3], h: 1.6, s: 'stone', drop: COBBLE },
  4: { n: '나무 판자', t: [4, 4, 4], h: 0.9, s: 'wood' },
  5: { n: '통나무', t: [6, 5, 6], h: 1.0, s: 'wood' },
  6: { n: '벽돌', t: [7, 7, 7], h: 1.6, s: 'stone' },
  7: { n: '모래', t: [8, 8, 8], h: 0.5, s: 'soft' },
  8: { n: '유리', t: [9, 9, 9], h: 0.4, s: 'glass', trans: 1 },
  9: { n: '붉은 양털', t: [10, 10, 10], h: 0.6, s: 'wool' },
  10: { n: '기반암', t: [11, 11, 11], h: 0, s: 'stone' },
  11: { n: '나뭇잎', t: [12, 12, 12], h: 0.25, s: 'soft' },
  12: { n: '눈', t: [13, 13, 13], h: 0.3, s: 'soft' },
  13: { n: '물', t: [14, 14, 14], h: 0, s: 'water', trans: 1, water: 1 },
  14: { n: '발광석', t: [15, 15, 15], h: 0.5, s: 'glass', emit: 1 },
  15: { n: '흰 양털', t: [16, 16, 16], h: 0.6, s: 'wool' },
  16: { n: '파란 양털', t: [17, 17, 17], h: 0.6, s: 'wool' },
  17: { n: '노란 양털', t: [18, 18, 18], h: 0.6, s: 'wool' },
  18: { n: '초록 양털', t: [19, 19, 19], h: 0.6, s: 'wool' },
  19: { n: '검은 양털', t: [20, 20, 20], h: 0.6, s: 'wool' },
  20: { n: '조약돌', t: [21, 21, 21], h: 1.6, s: 'stone' },
  21: { n: '사암', t: [22, 22, 22], h: 1.0, s: 'stone' },
  22: { n: '얼음', t: [23, 23, 23], h: 0.5, s: 'glass', trans: 1 },
};
const TRANS = new Uint8Array(32), EMIT = new Uint8Array(32);
for (const id in BLK) { TRANS[id] = BLK[id].trans ? 1 : 0; EMIT[id] = BLK[id].emit ? 1 : 0; }
const INV_ORDER = [1, 2, 3, 20, 21, 4, 5, 11, 6, 7, 12, 8, 22, 14, 9, 15, 16, 17, 18, 19, 13];
const NT = 24, TS = 16;

/* ================= 해시 / 노이즈 ================= */
function hash2(x, z, salt = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(z | 0, 668265263) ^ SEED ^ Math.imul(salt, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, z) => vnoise(x, z) * 0.55 + vnoise(x * 2.1 + 17, z * 2.1 + 5) * 0.3 + vnoise(x * 4.3 + 3, z * 4.3 + 11) * 0.15;

/* ================= 텍스처 아틀라스 (절차 생성) ================= */
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const atlas = document.createElement('canvas');
atlas.width = NT * TS; atlas.height = TS;
const actx = atlas.getContext('2d', { willReadFrequently: true });
function tile(i, fn) {
  const r = rng(i * 977 + 13);
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const c = fn(x, y, r);
    actx.fillStyle = `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${c[3] === undefined ? 1 : c[3]})`;
    actx.fillRect(i * TS + x, y, 1, 1);
  }
}
const noisy = (base, amp) => (x, y, r) => { const n = (r() - 0.5) * amp; return [base[0] + n, base[1] + n, base[2] + n]; };
const wool = base => (x, y, r) => { const n = (r() - 0.5) * 12 + (((x + y) & 1) ? -7 : 0); return [base[0] + n, base[1] + n, base[2] + n]; };
tile(0, (x, y, r) => { const n = (r() - 0.5) * 30; const edge = x === 0 || y === 0 || x === 15 || y === 15; const k = edge ? -22 : 0; return [90 + n + k, 160 + n + k, 55 + n + k]; });
tile(1, (x, y, r) => { const n = (r() - 0.5) * 24; const depth = 3 + ((x * 7 + 3) % 3); if (y < depth) return [90 + n, 160 + n, 55 + n]; return [134 + n, 96 + n, 67 + n]; });
tile(2, noisy([134, 96, 67], 28));
tile(3, noisy([125, 125, 125], 34));
tile(4, (x, y, r) => { const n = (r() - 0.5) * 12; const line = y % 5 === 0; return [(line ? 130 : 180) + n, (line ? 98 : 142) + n, (line ? 58 : 88) + n]; });
tile(5, (x, y, r) => { const n = (r() - 0.5) * 14; const s = (x % 4 === 0) ? -18 : 0; return [104 + n + s, 82 + n + s, 50 + n + s]; });
tile(6, (x, y, r) => { const n = (r() - 0.5) * 10; const d = Math.max(Math.abs(x - 7.5), Math.abs(y - 7.5)); const ring = (d | 0) % 3 === 0 ? -26 : 0; return [180 + n + ring, 144 + n + ring, 90 + n + ring]; });
tile(7, (x, y, r) => { const n = (r() - 0.5) * 14; const row = (y / 4) | 0; const off = row % 2 ? 4 : 0; const mortar = y % 4 === 3 || (x + off) % 8 === 7; return mortar ? [190 + n, 188 + n, 180 + n] : [150 + n, 66 + n, 52 + n]; });
tile(8, noisy([219, 207, 142], 20));
tile(9, (x, y, r) => { const edge = x === 0 || y === 0 || x === 15 || y === 15; if (edge) return [200, 230, 240, 0.9]; if ((x === 3 && y >= 3 && y <= 6) || (y === 3 && x >= 3 && x <= 6)) return [255, 255, 255, 0.8]; return [190, 225, 240, 0.18]; });
tile(10, wool([196, 40, 40]));
tile(11, noisy([50, 50, 55], 40));
tile(12, (x, y, r) => { const n = (r() - 0.5) * 36; const spot = r() < 0.22 ? -42 : 0; return [38 + n + spot, 112 + n + spot, 34 + n + spot]; });
tile(13, noisy([244, 247, 252], 10));
tile(14, (x, y, r) => { const n = (r() - 0.5) * 20; const streak = ((x + y * 2) % 9 < 1) ? 30 : 0; return [40 + n + streak, 95 + n + streak, 205 + n + streak, 0.6]; });
tile(15, (x, y, r) => { const n = (r() - 0.5) * 60; const spot = ((x >> 2) + (y >> 2)) % 2 ? 20 : -15; return [250 + n * 0.1, 205 + n * 0.6 + spot, 110 + n * 0.8 + spot]; });
tile(16, wool([235, 235, 235]));
tile(17, wool([48, 70, 190]));
tile(18, wool([240, 205, 50]));
tile(19, wool([70, 160, 50]));
tile(20, wool([30, 30, 34]));
tile(21, (x, y, r) => { const cell = hash2(x >> 2, y >> 2, 7); const edge = (x & 3) === 3 || (y & 3) === 3; const k = (cell - 0.5) * 40 + (edge ? -34 : 0) + (r() - 0.5) * 14; return [122 + k, 122 + k, 122 + k]; });
tile(22, (x, y, r) => { const n = (r() - 0.5) * 12; const band = (y === 4 || y === 11) ? -24 : 0; return [214 + n + band, 200 + n + band, 150 + n + band]; });
tile(23, (x, y, r) => { const n = (r() - 0.5) * 14; const streak = ((x * 3 + y) % 11 < 1) ? 40 : 0; return [150 + n + streak, 200 + n + streak, 240 + streak, 0.72]; });

// 블록별 평균 색 (파티클용)
const blockColor = {};
for (const id in BLK) {
  const d = actx.getImageData(BLK[id].t[1] * TS, 0, TS, TS).data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 40) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  blockColor[id] = ((r / n | 0) << 16) | ((g / n | 0) << 8) | (b / n | 0);
}

/* ================= 렌더러 / 씬 ================= */
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const sky = new THREE.Color(0x87ceeb);
scene.background = sky.clone();
scene.fog = new THREE.Fog(0x87ceeb, 28, (R - 0.6) * CS);
const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 320);
camera.rotation.order = 'YXZ';
scene.add(camera);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const tex = new THREE.CanvasTexture(atlas);
tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
tex.colorSpace = THREE.SRGBColorSpace; tex.generateMipmaps = false;
const matO = new THREE.MeshBasicMaterial({ map: tex, vertexColors: true });
const matT = new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, transparent: true, depthWrite: false });
const matW = new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide });
const matE = new THREE.MeshBasicMaterial({ map: tex, vertexColors: true });

/* ================= 월드 상태 ================= */
let terrain = 'flat';
const chunks = new Map();
const edits = new Map();
const idx = (lx, y, lz) => ((y - MINY) * CS + lz) * CS + lx;
const isHills = () => terrain === 'hills';

function surfAt(x, z) {
  if (!isHills()) return 0;
  const n = fbm(x / 42, z / 42);
  return Math.max(-2, Math.min(24, Math.round(5 + (n - 0.5) * 55)));
}
function hasTree(x, z, s) { return s > SEA + 1 && s < 14 && hash2(x, z, 91) < 0.011; }

function genChunk(cx, cz, data) {
  const x0 = cx * CS, z0 = cz * CS;
  let maxY = 0;
  for (let lz = 0; lz < CS; lz++) for (let lx = 0; lx < CS; lx++) {
    const s = surfAt(x0 + lx, z0 + lz);
    const hills = isHills();
    const top = !hills ? GRASS : s <= SEA + 1 ? SAND : s >= 18 ? SNOW : GRASS;
    for (let y = MINY; y <= s; y++) {
      data[idx(lx, y, lz)] = y === MINY ? BEDROCK : y === s ? top : y >= s - 2 ? (top === SAND ? SAND : DIRT) : STONE;
    }
    if (hills) for (let y = s + 1; y <= SEA; y++) data[idx(lx, y, lz)] = WATER;
    maxY = Math.max(maxY, s, hills && s < SEA ? SEA : s);
  }
  if (isHills()) {
    for (let wx = x0 - 2; wx < x0 + CS + 2; wx++) for (let wz = z0 - 2; wz < z0 + CS + 2; wz++) {
      const s = surfAt(wx, wz);
      if (!hasTree(wx, wz, s)) continue;
      const th = 4 + (hash2(wx, wz, 5) * 2 | 0);
      const put = (x, y, z, b, onlyAir) => {
        const lx = x - x0, lz = z - z0;
        if (lx < 0 || lx >= CS || lz < 0 || lz >= CS || y > TOPY) return;
        const i = idx(lx, y, lz);
        if (onlyAir && data[i] !== 0) return;
        data[i] = b; if (y > maxY) maxY = y;

});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== canvas) return;
  player.yaw -= e.movementX * 0.0023;
  player.pitch = Math.max(-1.55, Math.min(1.55, player.pitch - e.movementY * 0.0023));
});
canvas.addEventListener('mousedown', e => {
  if (paused || isTouch) return;
  e.preventDefault();
  if (e.button === 0) mouse[0] = true;
  if (e.button === 2) { mouse[2] = true; doPlace(); placeCd = 0.28; }
});
addEventListener('mouseup', e => { if (e.button === 0 || e.button === 2) mouse[e.button] = false; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => { if (!paused) select(sel + (e.deltaY > 0 ? 1 : -1)); }, { passive: true });

/* ---- 터치 ---- */
const touchIn = { f: 0, s: 0, jump: false, brk: false, plc: false, down: false };
function setupTouch() {
  isTouch = true;
  document.body.classList.add('touch');
  document.getElementById('touchHelp').style.display = 'inline';
  const joy = document.getElementById('joy'), knob = joy.firstElementChild;
  let jid = null;
  const jmove = t => {
    const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = t.clientX - cx, dy = t.clientY - cy; const m = Math.hypot(dx, dy), max = r.width / 2;
    if (m > max) { dx = dx / m * max; dy = dy / m * max; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    touchIn.s = dx / max; touchIn.f = -dy / max;
  };
  joy.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; jid = t.identifier; jmove(t); }, { passive: false });
  joy.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === jid) jmove(t); }, { passive: false });
  const jend = e => { for (const t of e.changedTouches) if (t.identifier === jid) { jid = null; touchIn.s = touchIn.f = 0; knob.style.transform = ''; } };
  joy.addEventListener('touchend', jend); joy.addEventListener('touchcancel', jend);
  const hold = (id, key, onDown) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); touchIn[key] = true; el.classList.add('on'); onDown && onDown(); }, { passive: false });
    const up = e => { e.preventDefault(); touchIn[key] = false; el.classList.remove('on'); };
    el.addEventListener('touchend', up); el.addEventListener('touchcancel', up);
  };
  hold('bJump', 'jump', () => { const n = performance.now(); if (n - lastSpace < 300) toggleFly(); lastSpace = n; });
  hold('bBreak', 'brk');
  hold('bPlace', 'plc', () => { doPlace(); placeCd = 0.3; });
  hold('bDown', 'down');
  document.getElementById('bInv').addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); if (invOpen) closeInv(); else if (!paused) openInv(); }, { passive: false });
  let lid = null, lx = 0, ly = 0;
  canvas.addEventListener('touchstart', e => { if (lid !== null) return; const t = e.changedTouches[0]; lid = t.identifier; lx = t.clientX; ly = t.clientY; }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === lid) {
      player.yaw -= (t.clientX - lx) * 0.006;
      player.pitch = Math.max(-1.55, Math.min(1.55, player.pitch - (t.clientY - ly) * 0.006));
      lx = t.clientX; ly = t.clientY;
    }
  }, { passive: false });
  const lend = e => { for (const t of e.changedTouches) if (t.identifier === lid) lid = null; };
  canvas.addEventListener('touchend', lend); canvas.addEventListener('touchcancel', lend);
}
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) setupTouch();

/* ================= 월드 불러오기 / 옵션 UI ================= */
function findSpawn() {
  if (!isHills()) return { x: 0.5, y: 1.001, z: 0.5 };
  for (let r = 0; r < 80; r += 2) for (let dx = -r; dx <= r; dx += 2) for (let dz = -r; dz <= r; dz += 2) {
    if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
    const s = surfAt(dx, dz);
    if (s > SEA + 1 && s < 12 && getBlock(dx, s + 1, dz) === 0 && getBlock(dx, s + 2, dz) === 0) return { x: dx + 0.5, y: s + 1.001, z: dz + 0.5 };
  }
  return { x: 0.5, y: 20, z: 0.5 };
}
function refreshOptsUI() {
  document.querySelectorAll('.opt[data-terrain]').forEach(b => b.classList.toggle('on', b.dataset.terrain === terrain));
  document.querySelectorAll('.opt[data-gm]').forEach(b => b.classList.toggle('on', b.dataset.gm === gm));
  document.getElementById('soundBtn').textContent = soundOn ? '🔊 효과음 ON' : '🔇 효과음 OFF';
}
function loadWorld(t) {
  terrain = t;
  for (const c of chunks.values()) disposeMesh(c);
  chunks.clear(); edits.clear(); clearMobs(); pending = []; lastCx = 1e9;
  hotbar = [1, 2, 3, 4, 5, 6, 7, 8, 9]; inv = {}; sel = 0; gm = 'creative'; hp = MAXHP; tod = 0.12;
  spawn = findSpawn();
  Object.assign(player, { x: spawn.x, y: spawn.y, z: spawn.z, vx: 0, vy: 0, vz: 0, yaw: 0, pitch: 0, fly: false });
  try {
    const d = JSON.parse(localStorage.getItem(saveKey(t)) || (t === 'flat' ? localStorage.getItem('blockworld_v1') : null));
    if (d && Array.isArray(d.e)) {
      for (const [x, y, z, b] of d.e) {
        const k = (x >> 4) + ',' + (z >> 4);
        let m = edits.get(k); if (!m) edits.set(k, m = new Map());
        m.set(idx(x & 15, y, z & 15), b);
      }
      if (Array.isArray(d.p)) [player.x, player.y, player.z, player.yaw, player.pitch] = d.p;
      if (Array.isArray(d.hb) && d.hb.length === 9 && d.hb.every(id => BLK[id])) hotbar = d.hb;
      if (d.inv && typeof d.inv === 'object') inv = d.inv;
      if (d.gm === 'survival') gm = 'survival';
      if (typeof d.t === 'number') tod = d.t;
      if (typeof d.hp === 'number') hp = Math.max(1, d.hp);
      sel = Math.max(0, Math.min(8, d.s | 0));
    }
  } catch (err) {}
  ready = false; startBtn.disabled = true; loadMsg.style.display = '';
  refreshHotbar(); refreshHearts(); refreshOptsUI(); select(sel, true);
  document.getElementById('bDown').style.display = 'none';
  try { localStorage.setItem('blockworld_meta', JSON.stringify({ terrain })); } catch (e) {}
}
document.querySelectorAll('.opt[data-terrain]').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.terrain === terrain) return;
  save(); loadWorld(b.dataset.terrain);
}));
document.querySelectorAll('.opt[data-gm]').forEach(b => b.addEventListener('click', () => {
  gm = b.dataset.gm; if (gm !== 'creative') player.fly = false;
  hp = MAXHP; refreshHotbar(); refreshHearts(); refreshOptsUI(); save();
}));
document.getElementById('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn; try { localStorage.setItem('blockworld_sound', soundOn ? '1' : '0'); } catch (e) {}
  refreshOptsUI();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('이 지형 월드의 모든 블록/인벤토리가 초기화됩니다. 계속할까요?')) return;
  try { localStorage.removeItem(saveKey(terrain)); if (terrain === 'flat') localStorage.removeItem('blockworld_v1'); } catch (e) {}
  loadWorld(terrain);
});
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(snapshot())], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `blockworld-${terrain}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
const importFile = document.getElementById('importFile');
document.getElementById('importBtn').addEventListener('click', () => importFile.click());
importFile.addEventListener('change', async () => {
  const f = importFile.files[0]; importFile.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || d.game !== 'blockworld' || !Array.isArray(d.e)) throw new Error('bad');
    const t = d.terrain === 'hills' ? 'hills' : 'flat';
    localStorage.setItem(saveKey(t), JSON.stringify(d));
    loadWorld(t);
    alert('월드를 불러왔어요! (' + (t === 'hills' ? '산과 호수' : '평지') + ')');
  } catch (err) { alert('올바른 블록 월드 파일이 아니에요.'); }
});

/* ================= 메인 루프 ================= */
const hud = document.getElementById('hud');
hud.style.whiteSpace = 'pre';
let last = performance.now(), hudT = 0, fps = 60, stride = 0, autoSaveT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fps += (1 / Math.max(dt, 1e-3) - fps) * 0.05;
  const left = updateChunks(player.x, player.z, ready ? 3 : 12);
  if (!ready && !left) {
    ready = true;
    while (collides(player.x, player.y, player.z) && player.y < TOPY - 3) player.y += 1;
    loadMsg.style.display = 'none'; startBtn.disabled = false;
  }
  if (!paused && ready) {
    const input = {
      f: (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + touchIn.f,
      s: (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + touchIn.s,
      sprint: (keys.ShiftLeft || keys.ShiftRight) && !player.fly,
      down: (keys.ShiftLeft || keys.ShiftRight || touchIn.down) && player.fly,
      jump: keys.Space || touchIn.jump,
    };
    const px = player.x, pz = player.z;
    const n = Math.ceil(dt / (1 / 90));
    for (let i = 0; i < n; i++) stepPhysics(dt / n, input);
    if (player.y < MINY - 20) { player.y = 5; player.vy = 0; }
    // 발소리
    if (player.onGround && !player.fly) {
      stride += Math.hypot(player.x - px, player.z - pz);
      if (stride > 2.3) { stride = 0; blockSound(getBlock(Math.floor(player.x), Math.floor(player.y - 0.1), Math.floor(player.z)) || GRASS, 'step'); }
    }
    tod = (tod + dt / DAY_LEN) % 1;
    updateMobs(dt);
    if (gm === 'survival' && hp < MAXHP) { regenT += dt; if (regenT > 4) { regenT = 0; hp++; refreshHearts(); } }
    autoSaveT += dt; if (autoSaveT > 20) { autoSaveT = 0; save(); }
  }
  updateParts(dt);
  camera.position.set(player.x, player.y + EYE, player.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  eyeV.copy(camera.position); camera.getWorldDirection(dirV);
  target = ready ? raycast(eyeV, dirV) : null;
  mobHit = ready ? mobRay(eyeV, dirV, 4.5) : null;
  if (target && !(mobHit && mobHit.t < target.t)) { outline.visible = true; outline.position.set(target.x + 0.5, target.y + 0.5, target.z + 0.5); }
  else outline.visible = false;

  if (!paused) {
    mineStep(dt, mouse[0] || touchIn.brk);
    if ((mouse[2] || touchIn.plc) && placeCd <= 0) doPlace();
  }
  updateSky();

  hudT += dt;
  if (hudT > 0.25) {
    hudT = 0;
    const clk = daylight > 0.5 ? '🌞 낮' : '🌙 밤';
    hud.textContent = `X ${player.x.toFixed(1)}  Y ${player.y.toFixed(1)}  Z ${player.z.toFixed(1)}\n${fps.toFixed(0)} FPS  ${clk}  ${gm === 'creative' ? '크리에이티브' : '서바이벌'}${player.fly ? '  ✈' : ''}`;
  }
  renderer.render(scene, camera);
}
startBtn.disabled = true;
let startTerrain = 'flat';
try { const m = JSON.parse(localStorage.getItem('blockworld_meta')); if (m && m.terrain === 'hills') startTerrain = 'hills'; } catch (e) {}
loadWorld(startTerrain);
requestAnimationFrame(frame);
window.__bw = { mine, mouse, player, getBlock, setBlock, chunks, mobs, spawnMob, hurtPlayer, loadWorld, snapshot, save,
  get target() { return target; }, get gm() { return gm; }, set gm(v) { gm = v; refreshHotbar(); refreshHearts(); },
  get inv() { return inv; }, get terrain() { return terrain; }, set tod(v) { tod = v; }, get daylight() { return daylight; }, get hp() { return hp; }, get paused() { return paused; }, set paused(v) { paused = v; }, toggleFly };
</script>
