<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>블록 월드 (마크 인디브)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #cross { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; z-index: 5; mix-blend-mode: difference; }

  #cross::after { top: 10px; left: 0; height: 2px; width: 22px; }

  #hotbar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; background: #0008; border: 2px solid #000; z-index: 16; }
  #hearts { position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); z-index: 6; font-size: 17px; letter-spacing: 1px; text-shadow: 1px 1px 0 #000; pointer-events: none; display: none; }
  #hearts .h { color: #e22; } #hearts .e { color: #444; }
  #fx { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
  #water { background: #1c4fa055; display: none; }
  #hurt { background: #f002; opacity: 0; transition: opacity .35s; }

  .slot canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .slot .n { position: absolute; left: 2px; top: 0; font: 700 11px/1.2 monospace; color: #fff; text-shadow: 1px 1px 0 #000; }
  .slot .c { position: absolute; right: 2px; bottom: 0; font: 700 12px/1.2 monospace; color: #fff; text-shadow: 1px 1px 0 #000; }
  .slot.dim canvas { opacity: .25; }
  .slot.sel { border-color: #fff; background: #fff3; transform: scale(1.1); z-index: 1; }

  #hud { position: fixed; left: 10px; top: 10px; z-index: 6; color: #fff; font: 700 13px/1.5 monospace; text-shadow: 1px 1px 0 #000; pointer-events: none; }
  #toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); color: #fff; font: 700 16px/1 sans-serif; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; z-index: 6; opacity: 0; transition: opacity .3s; pointer-events: none; }

  #overlay { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000a; color: #fff; text-align: center; padding: 16px; }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: 34px; text-shadow: 3px 3px 0 #000; }
  #overlay p { margin: 0; font-size: 14px; line-height: 1.7; color: #ddd; }
  #overlay button { font: 700 18px "Malgun Gothic", sans-serif; padding: 12px 40px; background: #5a9a3a; color: #fff; border: 3px solid #fff; cursor: pointer; }
  #overlay button.sub { font-size: 13px; padding: 6px 14px; background: #7a2f2f; border-width: 2px; }

  #overlay .opts { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #overlay .opts div { display: flex; gap: 6px; align-items: center; font-size: 14px; }
  #overlay .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #overlay button.opt { font-size: 14px; padding: 6px 14px; background: #333; border: 2px solid #888; }
  #overlay button.opt.on { background: #5a9a3a; border-color: #fff; }
  #overlay button.sub.ok { background: #2f5f7a; }
  #overlay button:disabled { opacity: .5; cursor: default; }

  #inv { position: fixed; inset: 0; z-index: 15; display: none; align-items: center; justify-content: center; background: #0007; padding-bottom: 80px; }
  #inv.show { display: flex; }
  #inv .panel { background: #c6c6c6; border: 4px solid #333; padding: 12px 14px; max-width: min(96vw, 560px); max-height: 80vh; overflow: auto; color: #222; text-align: center; }
  #inv h2 { margin: 0 0 8px; font-size: 18px; }
  #invGrid { display: grid; grid-template-columns: repeat(auto-fill, 52px); gap: 4px; justify-content: center; }
  #invGrid .cell { position: relative; width: 52px; height: 52px; background: #8b8b8b; border: 3px solid #555; cursor: pointer; }
  #invGrid .cell:hover { border-color: #fff; background: #aaa; }
  #invGrid .cell canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #invGrid .cell .c { position: absolute; right: 2px; bottom: 0; font: 700 12px monospace; color: #fff; text-shadow: 1px 1px 0 #000; }
  #inv .hint { margin: 8px 0 0; font-size: 12px; color: #444; }
  #inv .close { margin-top: 8px; padding: 6px 18px; font: 700 14px sans-serif; cursor: pointer; }

  #touch { display: none; }
  body.touch #touch { display: block; }
  #joy { position: fixed; left: 24px; bottom: 28px; width: 130px; height: 130px; border-radius: 50%; background: #fff3; border: 2px solid #fff6; z-index: 7; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: #fffa; }
  .tbtn { position: fixed; z-index: 7; width: 62px; height: 62px; border-radius: 50%; background: #0007; border: 2px solid #fff8; color: #fff; font: 700 13px sans-serif; display: flex; align-items: center; justify-content: center; }
  .tbtn.on { background: #fff6; }
  #bJump { right: 22px; bottom: 150px; }
  #bBreak { right: 96px; bottom: 100px; }
  #bPlace { right: 22px; bottom: 70px; }
  #bDown { right: 96px; bottom: 175px; display: none; }
  #bInv { right: 12px; top: 54px; width: 44px; height: 44px; font-size: 20px; }
  body.touch #hotbar { bottom: auto; top: 10px; }
  body.touch .slot { width: 38px; height: 38px; }
  body.touch #hud { top: 62px; }
  body.touch #hearts { bottom: auto; top: 58px; }

  .home-btn { position: fixed; right: 12px; bottom: 12px; z-index: 9999; padding: 8px 14px; border-radius: 999px;
    background: #000a; color: #fff; font: 700 14px/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    text-decoration: none; border: 1px solid #fff6; }
  .home-btn:active { transform: translateY(2px); }
  body.touch .home-btn { bottom: auto; top: 10px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }

</head>
<body>
<a class="home-btn" href="../">🏠 메인 메뉴</a>

<canvas id="view"></canvas>
<div id="cross"></div>
<div id="hud"></div>
<div id="toast"></div>
<div id="fx"><div id="water" class="fx" style="position:absolute;inset:0"></div><div id="hurt" style="position:absolute;inset:0"></div></div>
<div id="hearts"></div>
<div id="hotbar"></div>
<div id="inv"><div class="panel"><h2>🎒 인벤토리</h2><div id="invGrid"></div><p class="hint" id="invHint"></p><button class="close" id="invClose">닫기 (E)</button></div></div>

<div id="touch">
  <div id="joy"><i></i></div>
  <div class="tbtn" id="bJump">점프</div>
  <div class="tbtn" id="bBreak">부수기</div>
  <div class="tbtn" id="bPlace">설치</div>
  <div class="tbtn" id="bDown">하강</div>
  <div class="tbtn" id="bInv">🎒</div>
</div>

<div id="overlay">
  <h1>⛏️ 블록 월드</h1>
  <p>
    <b>WASD</b> 이동 · <b>마우스</b> 시점 · <b>Space</b> 점프(크리에이티브: <b>두 번</b> 눌러 비행, <b>Shift</b> 하강)<br>
    <b>좌클릭</b> 부수기/공격 · <b>우클릭</b> 설치 · <b>1~9 / 휠</b> 블록 선택 · <b>E</b> 인벤토리 · <b>ESC</b> 일시정지<br>
    <span id="touchHelp" style="display:none">📱 왼쪽 조이스틱 이동 · 화면 드래그 시점 · 점프 버튼 두 번 = 비행</span>
  </p>
  <div class="opts">
    <div>지형 <button class="opt" data-terrain="flat">평지</button><button class="opt" data-terrain="hills">산과 호수</button></div>
    <div>모드 <button class="opt" data-gm="creative">크리에이티브</button><button class="opt" data-gm="survival">서바이벌</button></div>
  </div>
  <button id="startBtn">▶ 시작</button>
  <div class="row">
    <button id="exportBtn" class="sub ok">📤 내보내기</button>
    <button id="importBtn" class="sub ok">📥 가져오기</button>
    <button id="soundBtn" class="sub ok">🔊 효과음 ON</button>
    <button id="resetBtn" class="sub">월드 초기화</button>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <p id="loadMsg">불러오는 중…</p>
</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 상수 / 블록 정의 ================= */
const CS = 16, MINY = -4, H = 48, R = 6, SEA = 1, SEED = 0x5bd1e995 | 0;
const TOPY = MINY + H - 1;
const DAY_LEN = 360;
const GRASS = 1, DIRT = 2, STONE = 3, PLANKS = 4, LOG = 5, BRICK = 6, SAND = 7, GLASS = 8, WOOL_R = 9, BEDROCK = 10,
  LEAVES = 11, SNOW = 12, WATER = 13, GLOW = 14, COBBLE = 20, SANDSTONE = 21, ICE = 22;
// t: [위, 옆, 아래] 타일, h: 부수는 시간(초), s: 소리 종류
const BLK = {
  1: { n: '잔디', t: [0, 1, 2], h: 0.6, s: 'soft', drop: DIRT },
  2: { n: '흙', t: [2, 2, 2], h: 0.5, s: 'soft' },
  3: { n: '돌', t: [3, 3, 3], h: 1.6, s: 'stone', drop: COBBLE },
  4: { n: '나무 판자', t: [4, 4, 4], h: 0.9, s: 'wood' },
  5: { n: '통나무', t: [6, 5, 6], h: 1.0, s: 'wood' },
  6: { n: '벽돌', t: [7, 7, 7], h: 1.6, s: 'stone' },
  7: { n: '모래', t: [8, 8, 8], h: 0.5, s: 'soft' },
  8: { n: '유리', t: [9, 9, 9], h: 0.4, s: 'glass', trans: 1 },
  9: { n: '붉은 양털', t: [10, 10, 10], h: 0.6, s: 'wool' },
  10: { n: '기반암', t: [11, 11, 11], h: 0, s: 'stone' },
  11: { n: '나뭇잎', t: [12, 12, 12], h: 0.25, s: 'soft' },
  12: { n: '눈', t: [13, 13, 13], h: 0.3, s: 'soft' },
  13: { n: '물', t: [14, 14, 14], h: 0, s: 'water', trans: 1, water: 1 },
  14: { n: '발광석', t: [15, 15, 15], h: 0.5, s: 'glass', emit: 1 },
  15: { n: '흰 양털', t: [16, 16, 16], h: 0.6, s: 'wool' },
  16: { n: '파란 양털', t: [17, 17, 17], h: 0.6, s: 'wool' },
  17: { n: '노란 양털', t: [18, 18, 18], h: 0.6, s: 'wool' },
  18: { n: '초록 양털', t: [19, 19, 19], h: 0.6, s: 'wool' },
  19: { n: '검은 양털', t: [20, 20, 20], h: 0.6, s: 'wool' },
  20: { n: '조약돌', t: [21, 21, 21], h: 1.6, s: 'stone' },
  21: { n: '사암', t: [22, 22, 22], h: 1.0, s: 'stone' },
  22: { n: '얼음', t: [23, 23, 23], h: 0.5, s: 'glass', trans: 1 },
};
const TRANS = new Uint8Array(32), EMIT = new Uint8Array(32);
for (const id in BLK) { TRANS[id] = BLK[id].trans ? 1 : 0; EMIT[id] = BLK[id].emit ? 1 : 0; }
const INV_ORDER = [1, 2, 3, 20, 21, 4, 5, 11, 6, 7, 12, 8, 22, 14, 9, 15, 16, 17, 18, 19, 13];
const NT = 24, TS = 16;

/* ================= 해시 / 노이즈 ================= */
function hash2(x, z, salt = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(z | 0, 668265263) ^ SEED ^ Math.imul(salt, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, z) => vnoise(x, z) * 0.55 + vnoise(x * 2.1 + 17, z * 2.1 + 5) * 0.3 + vnoise(x * 4.3 + 3, z * 4.3 + 11) * 0.15;

/* ================= 텍스처 아틀라스 (절차 생성) ================= */
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const atlas = document.createElement('canvas');
atlas.width = NT * TS; atlas.height = TS;
const actx = atlas.getContext('2d', { willReadFrequently: true });
function tile(i, fn) {
  const r = rng(i * 977 + 13);
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const c = fn(x, y, r);
    actx.fillStyle = `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${c[3] === undefined ? 1 : c[3]})`;
    actx.fillRect(i * TS + x, y, 1, 1);
  }
}
const noisy = (base, amp) => (x, y, r) => { const n = (r() - 0.5) * amp; return [base[0] + n, base[1] + n, base[2] + n]; };
const wool = base => (x, y, r) => { const n = (r() - 0.5) * 12 + (((x + y) & 1) ? -7 : 0); return [base[0] + n, base[1] + n, base[2] + n]; };
tile(0, (x, y, r) => { const n = (r() - 0.5) * 30; const edge = x === 0 || y === 0 || x === 15 || y === 15; const k = edge ? -22 : 0; return [90 + n + k, 160 + n + k, 55 + n + k]; });
tile(1, (x, y, r) => { const n = (r() - 0.5) * 24; const depth = 3 + ((x * 7 + 3) % 3); if (y < depth) return [90 + n, 160 + n, 55 + n]; return [134 + n, 96 + n, 67 + n]; });
tile(2, noisy([134, 96, 67], 28));
tile(3, noisy([125, 125, 125], 34));
tile(4, (x, y, r) => { const n = (r() - 0.5) * 12; const line = y % 5 === 0; return [(line ? 130 : 180) + n, (line ? 98 : 142) + n, (line ? 58 : 88) + n]; });
tile(5, (x, y, r) => { const n = (r() - 0.5) * 14; const s = (x % 4 === 0) ? -18 : 0; return [104 + n + s, 82 + n + s, 50 + n + s]; });
tile(6, (x, y, r) => { const n = (r() - 0.5) * 10; const d = Math.max(Math.abs(x - 7.5), Math.abs(y - 7.5)); const ring = (d | 0) % 3 === 0 ? -26 : 0; return [180 + n + ring, 144 + n + ring, 90 + n + ring]; });
tile(7, (x, y, r) => { const n = (r() - 0.5) * 14; const row = (y / 4) | 0; const off = row % 2 ? 4 : 0; const mortar = y % 4 === 3 || (x + off) % 8 === 7; return mortar ? [190 + n, 188 + n, 180 + n] : [150 + n, 66 + n, 52 + n]; });
tile(8, noisy([219, 207, 142], 20));
tile(9, (x, y, r) => { const edge = x === 0 || y === 0 || x === 15 || y === 15; if (edge) return [200, 230, 240, 0.9]; if ((x === 3 && y >= 3 && y <= 6) || (y === 3 && x >= 3 && x <= 6)) return [255, 255, 255, 0.8]; return [190, 225, 240, 0.18]; });
tile(10, wool([196, 40, 40]));
tile(11, noisy([50, 50, 55], 40));
tile(12, (x, y, r) => { const n = (r() - 0.5) * 36; const spot = r() < 0.22 ? -42 : 0; return [38 + n + spot, 112 + n + spot, 34 + n + spot]; });
tile(13, noisy([244, 247, 252], 10));
tile(14, (x, y, r) => { const n = (r() - 0.5) * 20; const streak = ((x + y * 2) % 9 < 1) ? 30 : 0; return [40 + n + streak, 95 + n + streak, 205 + n + streak, 0.6]; });
tile(15, (x, y, r) => { const n = (r() - 0.5) * 60; const spot = ((x >> 2) + (y >> 2)) % 2 ? 20 : -15; return [250 + n * 0.1, 205 + n * 0.6 + spot, 110 + n * 0.8 + spot]; });
tile(16, wool([235, 235, 235]));
tile(17, wool([48, 70, 190]));
tile(18, wool([240, 205, 50]));
tile(19, wool([70, 160, 50]));
tile(20, wool([30, 30, 34]));
tile(21, (x, y, r) => { const cell = hash2(x >> 2, y >> 2, 7); const edge = (x & 3) === 3 || (y & 3) === 3; const k = (cell - 0.5) * 40 + (edge ? -34 : 0) + (r() - 0.5) * 14; return [122 + k, 122 + k, 122 + k]; });
tile(22, (x, y, r) => { const n = (r() - 0.5) * 12; const band = (y === 4 || y === 11) ? -24 : 0; return [214 + n + band, 200 + n + band, 150 + n + band]; });
tile(23, (x, y, r) => { const n = (r() - 0.5) * 14; const streak = ((x * 3 + y) % 11 < 1) ? 40 : 0; return [150 + n + streak, 200 + n + streak, 240 + streak, 0.72]; });

// 블록별 평균 색 (파티클용)
const blockColor = {};
for (const id in BLK) {
  const d = actx.getImageData(BLK[id].t[1] * TS, 0, TS, TS).data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 40) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  blockColor[id] = ((r / n | 0) << 16) | ((g / n | 0) << 8) | (b / n | 0);
}

/* ================= 렌더러 / 씬 ================= */
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const sky = new THREE.Color(0x87ceeb);
scene.background = sky.clone();
scene.fog = new THREE.Fog(0x87ceeb, 28, (R - 0.6) * CS);
const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 320);
camera.rotation.order = 'YXZ';
scene.add(camera);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const ambLight = new THREE.AmbientLight(0xffffff, 1.2), sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
scene.add(ambLight, sunLight);

const tex = new THREE.CanvasTexture(atlas);
tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
tex.colorSpace = THREE.SRGBColorSpace; tex.generateMipmaps = false;
const matO = new THREE.MeshBasicMaterial({ map: tex, vertexColors: true });
const matT = new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, transparent: true, depthWrite: false });
const matW = new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide });
const matE = new THREE.MeshBasicMaterial({ map: tex, vertexColors: true });

/* ================= 월드 상태 ================= */
let terrain = 'flat';
const chunks = new Map();
const edits = new Map();
const idx = (lx, y, lz) => ((y - MINY) * CS + lz) * CS + lx;
const isHills = () => terrain === 'hills';

function surfAt(x, z) {
  if (!isHills()) return 0;
  const n = fbm(x / 42, z / 42);
  return Math.max(-2, Math.min(24, Math.round(5 + (n - 0.5) * 55)));
}
function hasTree(x, z, s) { return s > SEA + 1 && s < 14 && hash2(x, z, 91) < 0.011; }

function genChunk(cx, cz, data) {
  const x0 = cx * CS, z0 = cz * CS;
  let maxY = 0;
  for (let lz = 0; lz < CS; lz++) for (let lx = 0; lx < CS; lx++) {
    const s = surfAt(x0 + lx, z0 + lz);
    const hills = isHills();
    const top = !hills ? GRASS : s <= SEA + 1 ? SAND : s >= 18 ? SNOW : GRASS;
    for (let y = MINY; y <= s; y++) {
      data[idx(lx, y, lz)] = y === MINY ? BEDROCK : y === s ? top : y >= s - 2 ? (top === SAND ? SAND : DIRT) : STONE;
    }
    if (hills) for (let y = s + 1; y <= SEA; y++) data[idx(lx, y, lz)] = WATER;
    maxY = Math.max(maxY, s, hills && s < SEA ? SEA : s);
  }
  if (isHills()) {
    for (let wx = x0 - 2; wx < x0 + CS + 2; wx++) for (let wz = z0 - 2; wz < z0 + CS + 2; wz++) {
      const s = surfAt(wx, wz);
      if (!hasTree(wx, wz, s)) continue;
      const th = 4 + (hash2(wx, wz, 5) * 2 | 0);

  return player.x + HW > bx && player.x - HW < bx + 1 && player.y + PH > by && player.y < by + 1 && player.z + HW > bz && player.z - HW < bz + 1;
}
function boxOverlapsMob(bx, by, bz) {
  for (const m of mobs) { const d = MOB[m.type]; if (m.x + d.hw > bx && m.x - d.hw < bx + 1 && m.y + d.h > by && m.y < by + 1 && m.z + d.hw > bz && m.z - d.hw < bz + 1) return true; }
  return false;
}
function stepPhysics(dt, input) {
  const fx = Math.floor(player.x), fz = Math.floor(player.z);
  const feetW = getBlock(fx, Math.floor(player.y + 0.3), fz) === WATER;
  const headW = getBlock(fx, Math.floor(player.y + EYE), fz) === WATER;
  if (feetW && !player.inWater && player.vy < -4) sfx.splash();
  player.inWater = feetW; player.headWater = headW;
  const fly = player.fly;
  let sp = fly ? 10 : input.sprint ? 6.4 : 4.4;
  if (feetW && !fly) sp *= 0.55;
  if (player.slowT > 0) { sp *= 0.5; player.slowT -= dt; }
  let f = input.f, s = input.s;
  const len = Math.hypot(f, s); if (len > 1) { f /= len; s /= len; }
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  const tvx = (-sy * f + cy * s) * sp, tvz = (-cy * f - sy * s) * sp;
  const k = 1 - Math.exp(-dt * (player.onGround || fly ? 20 : feetW ? 8 : 6));
  player.vx += (tvx - player.vx) * k; player.vz += (tvz - player.vz) * k;
  if (fly) {
    const tvy = ((input.jump ? 1 : 0) - (input.down ? 1 : 0)) * 8;
    player.vy += (tvy - player.vy) * (1 - Math.exp(-dt * 10));
  } else if (feetW) {
    player.vy = Math.max(player.vy - 9 * dt, -3.5);
    if (input.jump) { player.vy = Math.min(player.vy + 26 * dt, 3.6); if (!headW) player.vy = Math.max(player.vy, 5); }
  } else {
    if (input.jump && player.onGround) { player.vy = 9; player.onGround = false; sfx.jump(); }
    player.vy = Math.max(player.vy - 28 * dt, -50);
  }
  const nx = player.x + player.vx * dt;
  if (collides(nx, player.y, player.z)) player.vx = 0; else player.x = nx;
  const nz = player.z + player.vz * dt;
  if (collides(player.x, player.y, nz)) player.vz = 0; else player.z = nz;
  const ny = player.y + player.vy * dt, impact = player.vy;
  player.onGround = false;
  if (collides(player.x, ny, player.z)) {
    if (player.vy < 0) {
      player.y = Math.floor(ny + EPS) + 1; player.onGround = true;
      if (!fly && !feetW) {
        if (impact < -6) sfx.land();
        if (impact < -14 && gm === 'survival') hurtPlayer(Math.max(1, Math.round((-impact - 13) / 1.8)));
      }
    } else player.y = Math.floor(ny + PH) - PH - 0.001;
    player.vy = 0;
  } else player.y = ny;
}

const bgeo = (w, h, d) => { const k = w + ',' + h + ',' + d; let g = geoCache.get(k); if (!g) { g = new THREE.BoxGeometry(w, h, d); geoCache.set(k, g); } return g; };

// ---- 서브웨이(subway/index.html)에서 가져온 스프라이트 입체 캐릭터 빌더 ----
// ───────────────────────── 스프라이트 기반 입체 캐릭터 ─────────────────────────
// 좌표: 얼굴은 -Z, 등은 +Z. 원본 도트의 계단 실루엣과 색면을 입체 블록으로 재해석.
// 각 캐릭터는 기존 root/rig/torso/head/tail/ears/eyes/arms/legs 계약을 그대로 유지한다.
// 모든 소품은 손 관절 아래, 움직이는 장식은 별도 Group 아래 배치한다.
const SPRITE_BOX = new THREE.BoxGeometry(1, 1, 1);
const SPRITE_MATERIALS = new Map();
function spriteMaterial(color, glow = 0) {
  const key = `${color}:${glow}`;
  if (!SPRITE_MATERIALS.has(key)) {
    SPRITE_MATERIALS.set(key, new THREE.MeshStandardMaterial({
      color, roughness: .92, metalness: 0, flatShading: true,
      emissive: glow ? color : 0x000000, emissiveIntensity: glow,
    }));
  }
  return SPRITE_MATERIALS.get(key);
}
function spriteGroup(parent, name, x = 0, y = 0, z = 0) {
  const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); parent.add(g); return g;
}
function spriteBox(parent, color, x, y, z, w, h, d, name = '', glow = 0) {
  const mesh = new THREE.Mesh(SPRITE_BOX, spriteMaterial(color, glow));
  mesh.name = name; mesh.position.set(x, y, z); mesh.scale.set(w, h, d);
  mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh;
}
// 두 점을 잇는 가는 블록. 뼈·뿌리·꼬리·목도리의 꺾임에 같은 연결 처리를 쓴다.
function spriteBeam(parent, color, from, to, width, depth = width, name = '') {
  const a = new THREE.Vector3(...from), b = new THREE.Vector3(...to);
  const dir = b.clone().sub(a), len = dir.length();
  const mid = a.clone().add(b).multiplyScalar(.5);
  const m = spriteBox(parent, color, mid.x, mid.y, mid.z, width, len + .012, depth, name);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize()); return m;
}
// [밑면 Y, 폭, 깊이, 높이]로 쌓는 계단형 실루엣. 한 덩어리 구체를 사용하지 않는다.
function spriteSteps(parent, rows, palette, z = 0, name = '계단형 볼륨') {
  rows.forEach(([bottom, width, depth, height], i) => {
    const y = bottom + height / 2;
    spriteBox(parent, palette.base, 0, y, z, width, height + .002, depth, name + i);
    // 옆면과 뒷면은 한 톤 짙게, 정면에는 원본의 주조색을 유지한다.
    spriteBox(parent, palette.shade, -width / 2 + .009, y, z, .02, height, depth + .004);
    spriteBox(parent, palette.shade, width / 2 - .009, y, z, .02, height, depth + .004);
    spriteBox(parent, palette.shade, 0, y, z + depth / 2, width - .02, height, .014);
    if (palette.light && i === rows.length - 1)
      spriteBox(parent, palette.light, 0, bottom + height + .003, z, width - .025, .012, depth - .025);
  });
}
// 도트 무늬를 입체 표면에 배치. 공백/점은 투명, 행의 첫 줄이 위쪽이다.
function spritePixels(parent, rows, palette, cell, x, y, z, depth = .024, name = '도트 무늬') {
  const width = Math.max(...rows.map(r => r.length));
  rows.forEach((row, iy) => {
    for (let ix = 0; ix < row.length; ix++) {
      const c = palette[row[ix]];
      if (c === undefined) continue;
      spriteBox(parent, c, x + (ix - (width - 1) / 2) * cell, y - iy * cell, z, cell + .001, cell + .001, depth, name);
    }
  });
}
function spriteEyes(h, parent, { x, y, z, w = .125, height = .17, pupil = 0x25201b, white = 0xfff8e6, look = .012 }) {
  for (const s of [-1, 1]) {
    const eye = spriteGroup(parent, '깜빡이는 네모 눈', s * x, y, z);
    spriteBox(eye, white, 0, 0, 0, w, height, .033);
    spriteBox(eye, pupil, look, -.014, -.024, w * .36, height * .69, .025);
    h.eyes.push(eye);
  }
}
function makeSpriteRig(name, options = {}) {
  const root = new THREE.Group(); root.name = name;
  const rig = spriteGroup(root, '전신 리그');
  const torso = spriteGroup(rig, '몸통');
  const head = spriteGroup(rig, '머리', 0, options.headY || 2.02, 0);
  const tail = spriteGroup(torso, '꼬리 / 보조 장식', 0, 1.02, .30);
  const h = { root, rig, torso, head, tail, ears: [], eyes: [], arms: [], legs: [], secondary: [] };
  for (const s of [-1, 1]) {
    const sh = spriteGroup(torso, s < 0 ? '왼쪽 어깨' : '오른쪽 어깨', s * (options.shoulder || .42), options.shoulderY || 1.51, 0);
    const el = spriteGroup(sh, '팔꿈치', 0, -.30, 0);
    const hand = spriteGroup(el, '손 / 소품 장착점', 0, -.27, -.015);
    h.arms.push({ sh, el, hand, s, carry: 0 });
    const hip = spriteGroup(rig, '고관절', s * (options.hipX || .19), .74, 0);
    const knee = spriteGroup(hip, '무릎', 0, -.30, 0);
    const foot = spriteGroup(knee, '발목', 0, -.30, 0);

function spriteLimbs(h, p, { arm = .14, leg = .18, shoe = .25, cuff = null } = {}) {
  h.arms.forEach(({ sh, el, hand, s }) => {
    spriteBox(sh, p.arm, 0, -.115, 0, arm, .29, arm, '위팔');
    spriteBox(sh, p.armShade || p.arm, s * arm * .36, -.12, .012, arm * .30, .22, arm);
    spriteBox(el, p.arm, 0, -.105, -.002, arm * .94, .26, arm * .96, '아래팔');
    if (cuff) spriteBox(el, cuff, 0, -.205, -.002, arm * 1.10, .075, arm * 1.09, '소매단');
    spriteBox(hand, p.hand || p.arm, 0, -.015, -.007, arm * 1.22, .13, arm * 1.16, '네모 손');
    spriteBox(hand, p.handShade || p.armShade || p.arm, s * -.065, -.02, -.045, .045, .075, .09, '엄지');
  });
  h.legs.forEach(({ hip, knee, foot, s }) => {
    spriteBox(hip, p.leg, 0, -.14, 0, leg, .30, leg, '허벅지');
    spriteBox(hip, p.legShade || p.leg, s * leg * .38, -.14, .025, leg * .24, .27, leg);
    spriteBox(knee, p.leg, 0, -.125, 0, leg * .88, .27, leg * .92, '정강이');
    spriteBox(foot, p.sole || 0x282127, 0, -.105, -.065, shoe + .025, .065, .38, '검은 밑창');
    spriteBox(foot, p.shoe || p.leg, 0, -.052, -.075, shoe, .105, .35, '발 / 신발');
    if (p.shoeLight) spriteBox(foot, p.shoeLight, 0, -.015, -.19, shoe - .03, .028, .12, '발등 하이라이트');
  });
}
// 같은 관절 아래의 정적 블록만 재질별로 병합한다. 관절/눈/소품의 Group은 유지.
// 외형 디테일은 많지만 수백 개 블록을 개별 draw call로 보내지 않는다.
function finishSprite(h) {
  function batch(group) {
    group.children.filter(c => c.isGroup).forEach(batch);
    const bins = new Map();
    for (const child of group.children) {
      if (!child.isMesh || child.geometry !== SPRITE_BOX) continue;
      const list = bins.get(child.material) || []; list.push(child); bins.set(child.material, list);
    }
    bins.forEach((meshes, mat) => {
      if (meshes.length < 2) return;
      const parts = meshes.map(m => { m.updateMatrix(); return m.geometry.clone().applyMatrix4(m.matrix); });
      const geometry = mergeGeometries(parts, false);
      parts.forEach(g => g.dispose());
      if (!geometry) return;
      geometry.computeBoundingSphere();
      const combined = new THREE.Mesh(geometry, mat); combined.name = '관절별 병합 도트';
      combined.castShadow = true; combined.receiveShadow = true;
      meshes.forEach(m => group.remove(m)); group.add(combined);
    });
  }
  batch(h.rig); return h;
}

// 스트리트파이터 성격: 근접(부타 깔아뭉개기 / 제빵사 바게트) · 원거리(척추 / 원숭이 / 청사과나무)
const MOB = {
  buta:   { n: '부타',       build: buildButa,   hw: 0.38, h: 1.8,  hp: 18, speed: 3.4, style: 'slam',   cd: 3.4, col: 0xee9ab3 },
  chuk:   { n: '척추',       build: buildChuk,   hw: 0.32, h: 1.8,  hp: 12, speed: 3.0, style: 'ranged', cd: 2.6, band: [7, 13], proj: 'bone',   col: 0xf2efd0 },
  monkey: { n: '원숭이',     build: buildMonkey, hw: 0.32, h: 1.7,  hp: 12, speed: 4.6, style: 'ranged', cd: 2.2, band: [5, 10], proj: 'banana', col: 0x8b5b2b },
  apple:  { n: '청사과나무', build: buildApple,  hw: 0.42, h: 1.9,  hp: 24, speed: 2.2, style: 'ranged', cd: 1.9, band: [6, 12], proj: 'apple',  col: 0x3da641 },
  baker:  { n: '제빵사',     build: buildBaker,  hw: 0.34, h: 1.85, hp: 15, speed: 3.2, style: 'melee',  cd: 1.2, reach: 2.7,        col: 0xffffff },
};
const MOB_TYPES = Object.keys(MOB);
const MOB_SCALE = 0.72;
function spawnMob(type, x, y, z) {
  const rig = MOB[type].build();
  rig.root.scale.setScalar(MOB_SCALE);
  const g = new THREE.Group(); g.add(rig.root); g.position.set(x, y, z); scene.add(g);
  mobs.push({ type, x, y, z, vx: 0, vy: 0, vz: 0, yaw: Math.random() * 6.28, want: 0, wt: 0, walk: false, hp: MOB[type].hp, g, rig,
    phase: Math.random() * 6, t: Math.random() * 10, runK: 0, atk: 0, cd: 2 + Math.random() * 2, wind: 0, windMax: 1, rec: 0, armUp: 0, crouch: 0,
    leaping: false, leapV: [0, 0], hurt: 0, onGround: false, strafe: Math.random() < 0.5 ? 1 : -1, strafeT: 2, say: 3 + Math.random() * 8, blink: 0, nextBlink: 2 });
}
function removeMob(m) {
  scene.remove(m.g); const i = mobs.indexOf(m); if (i >= 0) mobs.splice(i, 1);
}
function clearMobs() { while (mobs.length) removeMob(mobs[0]); for (const p of projs) scene.remove(p.mesh); projs.length = 0; }
function surfaceY(x, z) {
  for (let y = TOPY; y >= MINY; y--) { const b = getBlock(x, y, z); if (b === WATER) return -999; if (b && b !== LEAVES) return y + 1; }
  return -999;
}
let mobSpawnT = 1;
function trySpawnMobs(dt) {
  mobSpawnT -= dt; if (mobSpawnT > 0) return;
  mobSpawnT = 2;
  if (daylight > 0.35 || mobs.length >= 6) return;
  const a = Math.random() * 6.28, d = 14 + Math.random() * 16;
  const x = Math.floor(player.x + Math.cos(a) * d), z = Math.floor(player.z + Math.sin(a) * d);
  const y = surfaceY(x, z); if (y < MINY) return;
  spawnMob(MOB_TYPES[Math.random() * MOB_TYPES.length | 0], x + 0.5, y + 0.01, z + 0.5);
}
function moveMob(m, dt) {
  const d = MOB[m.type];
  m.vy = Math.max(m.vy - 24 * dt, -30);
  const wet = getBlock(Math.floor(m.x), Math.floor(m.y + 0.3), Math.floor(m.z)) === WATER;
  if (wet) m.vy = Math.min(m.vy + 40 * dt, 2);
  m.bx = false;
  const nx = m.x + m.vx * dt; if (collidesBox(nx, m.y, m.z, d.hw, d.h)) m.bx = true; else m.x = nx;
  const nz = m.z + m.vz * dt; if (collidesBox(m.x, m.y, nz, d.hw, d.h)) m.bx = true; else m.z = nz;
  const ny = m.y + m.vy * dt; m.onGround = false;
  if (collidesBox(m.x, ny, m.z, d.hw, d.h)) { if (m.vy < 0) { m.y = Math.floor(ny + EPS) + 1; m.onGround = true; } m.vy = 0; } else m.y = ny;
}

// ---- 투사체: 척추(뼈) / 원숭이(바나나) / 청사과나무(초록사과) ----
const PROJ = {
  bone:   { speed: 15, g: 0,  dmg: 4, col: 0xf2efd0, size: [0.12, 0.12, 0.55], slow: 0 },
  banana: { speed: 10, g: 12, dmg: 2, col: 0xf2d33a, size: [0.16, 0.16, 0.42], slow: 2.5 },
  apple:  { speed: 12, g: 2,  dmg: 3, col: 0xb5eb47, size: [0.26, 0.26, 0.26], slow: 0 },
};
function fireProj(m, kind) {
  const P = PROJ[kind], d = MOB[m.type];
  const ox = m.x + Math.sin(m.yaw) * 0.4, oy = m.y + d.h * 0.8, oz = m.z + Math.cos(m.yaw) * 0.4;
  const tx = player.x - ox, ty = player.y + 1.1 - oy, tz = player.z - oz;
  const dist = Math.hypot(tx, tz) || 1, t = dist / P.speed;
  const vy = (ty + 0.5 * P.g * t * t) / t;
  const mesh = new THREE.Group();
  const body = new THREE.Mesh(bgeo(...P.size), partMat(P.col)); mesh.add(body);
  if (kind === 'bone') for (const s of [-1, 1]) for (const k of [-1, 1]) { const kn = new THREE.Mesh(bgeo(0.1, 0.1, 0.1), partMat(P.col)); kn.position.set(k * 0.07, 0, s * 0.28); mesh.add(kn); }
  if (kind === 'apple') { const c = new THREE.Mesh(bgeo(0.1, 0.34, 0.1), partMat(P.col)); mesh.add(c); }
  mesh.position.set(ox, oy, oz); scene.add(mesh);
  projs.push({ kind, mesh, x: ox, y: oy, z: oz, vx: tx / dist * P.speed, vy, vz: tz / dist * P.speed, life: 4, spin: Math.random() * 6 });
  tone(500, 900, 0.12, 0.2, 'triangle');
}
function updateProjs(dt) {
  for (let i = projs.length - 1; i >= 0; i--) {
    const p = projs[i], P = PROJ[p.kind];
    let dead = false;
    const steps = Math.ceil(Math.hypot(p.vx, p.vy, p.vz) * dt / 0.25);
    for (let s = 0; s < steps && !dead; s++) {
      const sd = dt / steps;
      p.vy -= P.g * sd; p.x += p.vx * sd; p.y += p.vy * sd; p.z += p.vz * sd;
      if (isSolid(Math.floor(p.x), Math.floor(p.y), Math.floor(p.z))) { dead = true; burst(p.x, p.y, p.z, P.col, 6, 0.3, 2.5); sfx.hit(); }
      else if (p.x > player.x - HW - 0.15 && p.x < player.x + HW + 0.15 && p.y > player.y - 0.1 && p.y < player.y + PH + 0.1 && p.z > player.z - HW - 0.15 && p.z < player.z + HW + 0.15) {
        dead = true; burst(p.x, p.y, p.z, P.col, 8, 0.3, 3);
        hurtPlayer(P.dmg);
        if (gm === 'survival' && P.slow) player.slowT = P.slow;
      }
    }
    p.life -= dt; p.spin += dt * 12;
    p.mesh.position.set(p.x, p.y, p.z);
    p.mesh.rotation.y = Math.atan2(p.vx, p.vz);
    if (p.kind === 'bone') p.mesh.rotation.z = p.spin; else if (p.kind === 'banana') p.mesh.rotation.x = p.spin * 0.5;
    if (dead || p.life <= 0) { scene.remove(p.mesh); projs.splice(i, 1); }
  }
}

// ---- 몹 AI ----
function startWind(m, t) { m.wind = t; m.windMax = t; }
function updateMobs(dt) {
  trySpawnMobs(dt);
  for (let i = mobs.length - 1; i >= 0; i--) {
    const m = mobs[i], d = MOB[m.type];
    const dx = player.x - m.x, dz = player.z - m.z, dist = Math.hypot(dx, dz) || 0.001;
    if (dist > 64 || m.y < MINY - 5) { removeMob(m); continue; }
    if (daylight > 0.8 && Math.random() < dt * 0.4) { burst(m.x, m.y + 1, m.z, d.col, 14, 0.7); removeMob(m); continue; }
    m.cd -= dt; m.rec = Math.max(0, m.rec - dt);
    const aggro = dist < 26;
    const nx = dx / dist, nz = dz / dist;
    let tvx = 0, tvz = 0, moving = false, face = null;
    if (m.wind > 0) {
      // 공격 준비 동작: 제자리에서 플레이어를 바라본다
      m.wind -= dt; face = Math.atan2(dx, dz);
      m.armUp = 1 - m.wind / m.windMax; m.crouch = d.style === 'slam' ? m.armUp : 0;
      if (m.wind <= 0) {
        m.crouch = 0; m.armUp = 0;
        if (d.style === 'ranged') { fireProj(m, d.proj); m.cd = d.cd * (0.85 + Math.random() * 0.3); m.rec = 0.35; }
        else if (d.style === 'melee') {
          m.rec = 0.35; m.cd = d.cd; noise(900, 0.8, 0.12, 0.35);
          if (dist < d.reach + 0.5 && Math.abs(player.y - m.y) < 1.8) { hurtPlayer(3); player.vx += nx * 7; player.vz += nz * 7; player.vy = Math.max(player.vy, 4.5); sfx.hit(); }
        } else if (d.style === 'slam') {
          const spd = Math.min(10, dist / 0.75);
          m.leaping = true; m.vy = 9.5; m.leapV = [nx * spd, nz * spd]; m.cd = d.cd;
        }
      }
    } else if (m.leaping) {
      tvx = m.leapV[0]; tvz = m.leapV[1]; m.vx = tvx; m.vz = tvz; moving = true; face = Math.atan2(dx, dz);
    } else if (aggro) {
      face = Math.atan2(dx, dz);
      const speed = d.speed;
      if (d.style === 'ranged') {
        const [lo, hi] = d.band;
        m.strafeT -= dt; if (m.strafeT <= 0) { m.strafeT = 1.5 + Math.random() * 2.5; m.strafe = -m.strafe; }
        if (dist < lo) { tvx = -nx * speed; tvz = -nz * speed; }
        else if (dist > hi) { tvx = nx * speed; tvz = nz * speed; }
        else { tvx = -nz * m.strafe * speed * 0.6; tvz = nx * m.strafe * speed * 0.6; }
        moving = true;
        if (m.cd <= 0 && dist < hi + 4) startWind(m, 0.5);
      } else if (d.style === 'melee') {
        if (dist > d.reach * 0.7) { tvx = nx * speed; tvz = nz * speed; moving = true; }
        if (m.cd <= 0 && dist < d.reach) startWind(m, 0.35);
      } else { // slam
        if (dist > 3.2) { tvx = nx * speed; tvz = nz * speed; moving = true; }
        if (m.cd <= 0 && dist < 8 && dist > 2.2) startWind(m, 0.6);
      }
    } else {
      m.wt -= dt;
      if (m.wt <= 0) { m.wt = 2 + Math.random() * 4; m.walk = Math.random() < 0.55; m.want = Math.random() * 6.28; }
      if (m.walk) { tvx = Math.sin(m.want) * d.speed * 0.4; tvz = Math.cos(m.want) * d.speed * 0.4; moving = true; face = m.want; }
    }
    if (face !== null) { let da = face - m.yaw; da = Math.atan2(Math.sin(da), Math.cos(da)); m.yaw += da * Math.min(1, dt * 9); }
    if (!m.leaping) { const k = 1 - Math.exp(-dt * (m.onGround ? 10 : 2)); m.vx += (tvx - m.vx) * k; m.vz += (tvz - m.vz) * k; }
    moveMob(m, dt);
    if (m.bx && m.onGround && moving && !m.leaping) m.vy = 8;
    if (m.leaping && m.onGround && m.vy <= 0) {
      m.leaping = false; m.vx = m.vz = 0; sfx.land(); noise(250, 0.7, 0.25, 0.6, 'lowpass');
      burst(m.x, m.y + 0.1, m.z, 0x8b6b3b, 16, 1.8, 4);
      const px = player.x - m.x, pz = player.z - m.z, pd = Math.hypot(px, pz) || 1;
      if (pd < 2.6 && Math.abs(player.y - m.y) < 1.8) { hurtPlayer(4); player.vx += px / pd * 7; player.vz += pz / pd * 7; player.vy = Math.max(player.vy, 5); if (gm === 'survival') player.slowT = 1.5; }
    }
    m.say -= dt;
    if (m.say <= 0) { m.say = 6 + Math.random() * 10; if (dist < 18) sfx.voice(m.type); }
    animMob(m, dt, moving);
  }
}
// 서브웨이 animateButa를 몹용으로 축약: 달리기/점프 포즈 + 공격 동작
function animMob(m, dt, moving) {
  const h = m.rig, d = MOB[m.type];
  m.t += dt;
  const spd = Math.hypot(m.vx, m.vz);
  m.runK = damp(m.runK, moving && m.onGround ? Math.min(1, spd / 3) : 0, 8, dt);
  const air = m.onGround ? 0 : 1;
  m.phase += dt * m.runK * (7 + spd * 1.4);
  const p = m.phase, rb = m.runK, it = m.t;
  h.legs.forEach(({ hip, knee, foot, s }) => {
    const q = p + (s > 0 ? 0 : Math.PI);
    const rHip = Math.sin(q) * 0.95, rKnee = 0.25 + Math.max(0, Math.cos(q)) * 1.35;
    hip.rotation.x = mix(rHip * rb, s > 0 ? 0.85 : -0.45, air) + (m.crouch ? 1.0 * m.crouch : 0);
    knee.rotation.x = -(mix(rKnee * rb, s > 0 ? 0.9 : 1.5, air) + m.crouch * 1.6);
    foot.rotation.x = mix((-Math.sin(q) * 0.35 + 0.2) * rb, 0.3, air) + m.crouch * 0.5;
  });
  const raise = m.armUp;
  h.arms.forEach(({ sh, el, s: side, carry = 0 }, ai) => {
    const q = p + (side > 0 ? Math.PI : 0);
    let sx = Math.sin(it * 1.8 + side) * 0.05 * (1 - rb) + Math.sin(q) * 1.0 * rb;

  if (mobHit && (!target || mobHit.t <= target.t + 0.01)) {

    if (attackCd <= 0) { attackMob(mobHit.mob); attackCd = 0.45; }

  }
  if (!target) { mine.prog = 0; mine.has = false; crack.visible = false; return; }
  const b = getBlock(target.x, target.y, target.z);

  let jid = null;

    const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = t.clientX - cx, dy = t.clientY - cy; const m = Math.hypot(dx, dy), max = r.width / 2;
    if (m > max) { dx = dx / m * max; dy = dy / m * max; }

  const jend = e => { for (const t of e.changedTouches) if (t.identifier === jid) { jid = null; touchIn.s = touchIn.f = 0; knob.style.transform = ''; } };

  for (let r = 0; r < 80; r += 2) for (let dx = -r; dx <= r; dx += 2) for (let dz = -r; dz <= r; dz += 2) {
    if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;

    if (s > SEA + 1 && s < 12 && getBlock(dx, s + 1, dz) === 0 && getBlock(dx, s + 2, dz) === 0) return { x: dx + 0.5, y: s + 1.001, z: dz + 0.5 };
  }

}

    loadMsg.style.display = 'none'; startBtn.disabled = false;
  }

      if (stride > 2.3) { stride = 0; blockSound(getBlock(Math.floor(player.x), Math.floor(player.y - 0.1), Math.floor(player.z)) || GRASS, 'step'); }
    }
    tod = (tod + dt / DAY_LEN) % 1;

    autoSaveT += dt; if (autoSaveT > 20) { autoSaveT = 0; save(); }
  }

  camera.position.set(player.x, player.y + EYE, player.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  eyeV.copy(camera.position); camera.getWorldDirection(dirV);
  target = ready ? raycast(eyeV, dirV) : null;
  mobHit = ready ? mobRay(eyeV, dirV, 4.5) : null;
  if (target && !(mobHit && mobHit.t < target.t)) { outline.visible = true; outline.position.set(target.x + 0.5, target.y + 0.5, target.z + 0.5); }
  else outline.visible = false;

    if ((mouse[2] || touchIn.plc) && placeCd <= 0) doPlace();
  }
  updateSky();

  hudT += dt;
  if (hudT > 0.25) {
    hudT = 0;
    const clk = daylight > 0.5 ? '🌞 낮' : '🌙 밤';
    hud.textContent = `X ${player.x.toFixed(1)}  Y ${player.y.toFixed(1)}  Z ${player.z.toFixed(1)}\n${fps.toFixed(0)} FPS  ${clk}  ${gm === 'creative' ? '크리에이티브' : '서바이벌'}${player.fly ? '  ✈' : ''}`;
  }

}
