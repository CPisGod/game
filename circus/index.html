<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9822b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">
<title>원숭이 서커스</title>
<style>
  :root { --bg:#fff4e0; --ink:#3b2a1a; --pink:#ff9eb5; --pink-d:#e0577d; --green:#3fbf6f; --blue:#3a9bdc; --yellow:#ffc933; --acc:#d9822b; --acc-l:#ffe6c7; --red:#e8504a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; min-height:100%; overscroll-behavior:none; }
  body { background: linear-gradient(#ffe9c2, #fff4e0 40%, #d9f2d0); color: var(--ink);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .home-btn { position: fixed; right: 12px; bottom: 12px; z-index: 9999; padding: 8px 14px; border-radius: 999px;
    background: #000a; color: #fff; font: 700 14px/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    text-decoration: none; border: 1px solid #fff6; }
  .home-btn:active { transform: translateY(2px); }

  #app { max-width: 520px; margin: 0 auto; padding: 12px 14px 46px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; white-space:nowrap; }
  header > div { display:flex; gap:6px; }
  .btn { border:0; border-radius:12px; padding:9px 14px; font:700 14px inherit; font-family:inherit; background:var(--ink); color:#fff; cursor:pointer; }
  .btn.sub { background:#fff; color:var(--ink); border:2px solid var(--ink); }
  .btn:disabled { opacity:.5; cursor:default; }
  header .btn { padding:7px 9px; font-size:13px; white-space:nowrap; }

  .money { text-align:center; margin:6px 0 2px; }
  .money b { font-size:46px; line-height:1; }
  .money span { font-size:20px; margin-left:4px; }
  .sub-info { text-align:center; font-size:13px; opacity:.75; margin-bottom:6px; }
  .bar { height:18px; background:#fff; border:2px solid var(--ink); border-radius:999px; overflow:hidden; position:relative; }
  .bar > i { display:block; height:100%; width:0; transition:width .15s; background:linear-gradient(90deg,#ffd23f,var(--acc)); }
  .barlabel { display:flex; justify-content:space-between; font-size:12px; margin:8px 2px 3px; font-weight:700; }

  #stage { position:relative; margin-top:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; }
  #mk { width:min(100%, 340px, calc(34vh * 1.1538)); height:auto; aspect-ratio:300/260; border:3px solid var(--ink); border-radius:16px; background:#fff; display:block; }
  .float { position:absolute; font-weight:900; font-size:22px; color:var(--acc); text-shadow:0 2px 0 #fff, 0 0 4px #fff; pointer-events:none; animation: up .8s ease-out forwards; white-space:nowrap; }
  .puff { position:absolute; font-size:16px; pointer-events:none; animation: puff .9s ease-out forwards; z-index:3; }
  @keyframes puff { from { transform:translate(0,0) scale(.6); opacity:1; } to { transform:translate(var(--dx), var(--dy)) scale(1.1) rotate(40deg); opacity:0; } }
  @keyframes up { to { transform: translateY(-70px); opacity:0; } }
  #msg { position:absolute; top:10px; width:100%; text-align:center; font-weight:900; color:#fff; text-shadow:0 2px 0 var(--ink), 0 0 6px var(--ink); min-height:22px; pointer-events:none; z-index:2; }
  #exlabel { width:100%; text-align:center; font-weight:700; font-size:14px; margin-top:6px; pointer-events:none; min-height:20px; }

  #crew { display:flex; flex-wrap:wrap; justify-content:center; gap:2px 8px; min-height:30px; margin-top:4px; }
  .pet { font-size:22px; display:inline-flex; align-items:flex-end; gap:1px; animation: hop 1s ease-in-out infinite; }
  .pet small { font-size:11px; font-weight:700; opacity:.7; }
  @keyframes hop { 0%,100% { transform:translateY(0); } 40% { transform:translateY(-8px); } }

  .tabs5 { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
  .tab { background:#fff; border:2px solid #d9c9a8; border-radius:12px; padding:7px 2px; text-align:center; cursor:pointer; font-family:inherit; color:var(--ink); }
  .tab.on { border-color:var(--acc); background:var(--acc-l); box-shadow:0 3px 0 var(--acc); }
  .tab .ic { font-size:20px; display:block; } .tab .nm { font-size:11px; font-weight:700; display:block; }

  body.modal-open { overflow:hidden; }
  #panelModal .card { display:flex; flex-direction:column; padding:0; max-height:82vh; max-height:82dvh; overflow:hidden; }
  .phead { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:2px solid #eee; flex:0 0 auto; }
  .phead b { font-size:18px; }
  .phead .btn { padding:6px 12px; }
  #panelBody { flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:12px 12px 56px; touch-action:pan-y; }
  .row { display:flex; align-items:center; gap:10px; background:#fff; border:2px solid #d9c9a8; border-radius:12px; padding:8px 10px; margin-bottom:6px; }
  .row.lock { opacity:.55; }
  .row.on { border-color:var(--acc); background:var(--acc-l); }
  .row .ic { font-size:28px; flex:0 0 36px; text-align:center; }
  .row .tx { flex:1; min-width:0; }
  .row .tx b { display:block; font-size:14px; }
  .row .tx small { display:block; font-size:12px; opacity:.75; line-height:1.35; }
  .row .btn { padding:8px 11px; font-size:13px; flex:0 0 auto; white-space:nowrap; }
  .row .btn.go { background:var(--acc); }
  .row .btn.sell { background:var(--blue); }
  .row .btn.buy { background:var(--red); }
  .bulk { display:flex; gap:6px; margin-bottom:8px; }
  .bulk .btn { flex:1; padding:6px; font-size:13px; }
  .bulk .btn.on { background:var(--acc); border-color:var(--acc); color:#fff; }

  .stock { background:#fff; border:2px solid #d9c9a8; border-radius:12px; padding:10px 12px; }
  .stock .top { display:flex; justify-content:space-between; align-items:baseline; }
  .stock .price { font-size:30px; font-weight:900; }
  .up { color:var(--red); } .down { color:var(--blue); }
  #stChart { width:100%; height:auto; background:#fff9ec; border-radius:8px; margin:6px 0 2px; display:block; }
  .linkbtn { background:none; border:0; padding:2px 4px; font:inherit; font-size:12px; color:var(--ink); opacity:.65; text-decoration:underline; cursor:pointer; }
  .stock .hold { font-size:13px; line-height:1.6; }
  .trade { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
  .trade .btn { padding:9px 4px; font-size:13px; }
  .trade .btn.buy { background:var(--red); } .trade .btn.sell { background:var(--blue); }
  .note { font-size:12px; color:#b36; margin-top:8px; }
  .note.gray { color:#777; }

  .modal { overscroll-behavior:contain; position:fixed; inset:0; background:#000a; z-index:9000; display:none; align-items:center; justify-content:center; padding:16px; }
  .modal.show { display:flex; }
  .card { background:#fff; border-radius:18px; padding:18px; width:min(420px,100%); max-height:85vh; overflow:auto; overscroll-behavior:contain; }
  .card h2 { margin:0 0 10px; }
  .card input { width:100%; padding:10px; font-size:18px; border:2px solid var(--ink); border-radius:10px; font-family:inherit; }
  .card p { font-size:14px; line-height:1.5; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; }
  .tabs .btn { flex:1; }
  .tabs .btn.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:6px 4px; border-bottom:1px solid #eee; text-align:left; }
  td:last-child, th:last-child { text-align:right; }
  tr.me { background:var(--acc-l); font-weight:900; }
  #toast { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); background:#000c; color:#fff; padding:9px 14px; border-radius:12px; font-size:14px; z-index:9500; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90%; text-align:center; }
  #toast.show { opacity:1; }
  header .btn.off { opacity:.45; }
  #wx { text-align:center; font-size:12px; font-weight:700; opacity:.8; margin:2px 0; }
  #buffs { display:flex; flex-wrap:wrap; justify-content:center; gap:4px; min-height:4px; margin:4px 0; }
  .chip { background:#fff3c4; border:2px solid var(--yellow); border-radius:999px; padding:2px 9px; font-size:12px; font-weight:800; }
  .chip.bad { background:#e3ecff; border-color:var(--blue); }
  #combo { position:absolute; top:34px; right:8px; z-index:3; font-weight:900; font-size:18px; color:#fff; text-shadow:0 2px 0 var(--red), 0 0 6px var(--red); pointer-events:none; opacity:0; transition:opacity .2s; text-align:right; }
  .gold { position:absolute; z-index:5; width:48px; height:48px; font-size:38px; line-height:48px; text-align:center; cursor:pointer; filter:drop-shadow(0 0 8px #ffd23f); animation: goldfloat 1.4s ease-in-out infinite alternate, goldin .3s ease-out; }
  @keyframes goldfloat { from { transform:translateY(0) rotate(-8deg); } to { transform:translateY(-14px) rotate(8deg); } }
  @keyframes goldin { from { opacity:0; scale:.2; } to { opacity:1; scale:1; } }
  #showBtn { display:none; margin:8px auto 0; width:100%; padding:10px; animation: pulse .8s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform:scale(1.03); box-shadow:0 0 14px #ffc933; } }
  #crowd { display:flex; justify-content:center; flex-wrap:wrap; gap:0 2px; min-height:28px; margin-top:6px; font-size:20px; }
  #crowd span { display:inline-block; animation: sway 1.6s ease-in-out infinite alternate; }
  @keyframes sway { from { transform:rotate(-4deg); } to { transform:rotate(4deg); } }
  #crowd.cheer span { animation: jump .22s ease-in-out infinite alternate; }
  @keyframes jump { to { transform:translateY(-9px); } }
  .tab { position:relative; }
  .tab .dot { position:absolute; top:3px; right:5px; width:10px; height:10px; border-radius:50%; background:var(--red); border:2px solid #fff; }
  .dex { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .dx { background:#fff; border:2px solid var(--acc); border-radius:10px; text-align:center; padding:4px 1px; }
  .dx.lock { border-color:#d9c9a8; opacity:.55; }
  .dx span { font-size:26px; display:block; } .dx small { font-size:10px; line-height:1.2; display:block; }
  .g-hud { text-align:center; font-weight:900; font-size:18px; margin-bottom:8px; }
  .g-field { position:relative; height:300px; overflow:hidden; border:3px solid var(--ink); border-radius:14px; background:linear-gradient(#cfeaff,#fff4e0); touch-action:none; }
  .g-item { position:absolute; top:-44px; font-size:36px; cursor:pointer; animation: gfall linear forwards; }
  @keyframes gfall { to { transform:translateY(350px); } }
  .g-bar { position:relative; height:46px; border:3px solid var(--ink); border-radius:14px; background:#fff; margin-top:34px; touch-action:none; }
  .g-zone { position:absolute; top:0; bottom:0; background:#3fbf6f88; border-left:3px solid var(--green); border-right:3px solid var(--green); }
  .g-mark { position:absolute; top:3px; font-size:30px; line-height:34px; transform:translateX(-50%); }
</style>
</head>
<body>
<a class="home-btn" id="homeBtn" href="../">🏠 메인 메뉴</a>

<div id="app">
  <header>
    <h1>🐵 원숭이 서커스</h1>
    <div>
      <button class="btn sub" id="sndBtn">🔊</button><button class="btn sub" id="bgmBtn">🎵</button><button class="btn sub" id="rankBtn">🏆 순위</button>
    </div>
  </header>

  <div class="money"><b id="money">0</b><span>원</span></div>
  <div class="sub-info"><span id="nick">-</span> · <b id="runinfo">1회차</b> · 초당 <span id="rate">+0</span>원 · 누적 <span id="earned">0</span>원 · <a href="#" id="logoutBtn" style="display:none;color:inherit">로그아웃</a></div>

  <div class="sub-info" id="fansInfo" style="margin-top:-4px"></div>
  <div id="wx"></div>
  <div id="buffs"></div>

  <div class="barlabel"><span id="nextLabel">🎯 다음 묘기 해금</span><span id="nextVal"></span></div>
  <div class="bar" id="nbar"><i></i></div>

  <div id="stage">
    <div id="msg"></div>
    <div id="combo"></div>
    <svg id="mk" viewBox="0 0 300 260"><g id="bg"></g><g id="fx"></g><g id="fg"></g></svg>
    <div id="exlabel">원숭이를 터치하면 춤을 춰요! (컴퓨터는 스페이스바)</div>
  </div>
  <button class="btn go" id="showBtn" style="background:var(--acc)">🎪 특별 공연이 열렸어요! 도전하기</button>
  <div id="crowd"></div>
  <div id="crew"></div>

  <div class="tabs5" id="tabs"></div>
</div>

<!-- 메뉴 팝업 (묘기/알바/강화/주식/무대/부동산) -->
<div class="modal" id="panelModal">
  <div class="card">
    <div class="phead"><b id="panelTitle"></b><button class="btn sub" id="panelClose">✕ 닫기</button></div>
    <div id="panelBody"><div id="panel"></div></div>
  </div>
</div>

<!-- 특별 공연(미니게임) -->
<div class="modal" id="gameModal">
  <div class="card">
    <h2 id="gameTitle"></h2>
    <div id="gameArea"></div>
    <p style="margin-bottom:0"><button class="btn sub" id="gameClose" style="width:100%;display:none">닫기</button></p>
  </div>
</div>

<!-- 접속 환영 (출석 / 오프라인 수입) -->
<div class="modal" id="welcomeModal">
  <div class="card">
    <h2>🐵 어서 와요!</h2>
    <div id="wBody"></div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
      <button class="btn" id="wBonus" style="background:var(--acc)">🎪 보너스 게임 (성공하면 한 번 더!)</button>
      <button class="btn sub" id="wOk">받기</button>
    </div>
  </div>
</div>

<!-- 로그인 -->
<div class="modal" id="loginModal">
  <div class="card">
    <h2>🐵 서커스 접속</h2>
    <p id="loginNote" style="margin-top:0">아이디와 비밀번호로 접속해요. 아이디가 곧 닉네임이에요. (부타 다이어트와 같은 계정을 써요)</p>
    <input id="loginId" maxlength="10" placeholder="아이디 (10자 이하)" autocomplete="username">
    <input id="loginPw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" style="margin-top:8px">
    <div class="note" id="loginErr" style="min-height:18px"></div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn" id="loginBtn" style="flex:1">로그인</button>
      <button class="btn sub" id="signupBtn" style="flex:1">가입</button>
    </div>
  </div>
</div>

<!-- 닉네임 (오프라인 모드용) -->
<div class="modal" id="nickModal">
  <div class="card">
    <h2>닉네임을 정해주세요</h2>
    <p>내 서커스의 이름이자 스코어보드에 표시될 이름이에요. (최대 10자)</p>
    <input id="nickInput" maxlength="10" placeholder="예: 윤재" autocomplete="off">
    <p style="margin-bottom:0"><button class="btn" id="nickOk" style="width:100%">시작하기</button></p>
  </div>
</div>

<!-- 스코어보드 -->
<div class="modal" id="rankModal">
  <div class="card">
    <h2>🏆 스코어보드</h2>
    <div class="tabs">
      <button class="btn on" id="tabEarn">누적 수입</button>
      <button class="btn" id="tabWeek">이번 주</button>
      <button class="btn" id="tabNet">순자산</button>
    </div>
    <table id="rankTable"></table>
    <div class="note" id="rankNote"></div>
    <p style="margin-bottom:0"><button class="btn sub" id="rankClose" style="width:100%">닫기</button></p>
  </div>
</div>
<div id="toast"></div>

<script type="module">
// ===== Firebase 설정 (부타 다이어트와 같은 프로젝트) =====
const firebaseConfig = {
  apiKey: "AIzaSyBPgoO4EXWFagGEutquysQPmcvFk37eXbU",

  projectId: "game-81004",
  storageBucket: "game-81004.firebasestorage.app",
  messagingSenderId: "217133907611",
  appId: "1:217133907611:web:a62de72fc5c909390bd03e"
};
// =======================================================

const PI = Math.PI, sin = Math.sin, cos = Math.cos;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- 숫자 표시 (만/억/조/경/해/자) ----------
const UNITS = [[1e48, '극'], [1e44, '재'], [1e40, '정'], [1e36, '간'], [1e32, '구'], [1e28, '양'], [1e24, '자'], [1e20, '해'], [1e16, '경'], [1e12, '조'], [1e8, '억'], [1e4, '만']];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  n = Math.max(0, n);
  if (n < 1e4) return Math.floor(n).toLocaleString('ko-KR');
  if (n >= 1e48 * 1e4) return n.toExponential(2).replace('e+', '×10^');
  for (const [v, u] of UNITS) if (n >= v) { const x = n / v; return (x >= 100 ? Math.floor(x) : x >= 10 ? x.toFixed(1) : x.toFixed(2)) + u; }
}
const fmtRate = r => r < 1 ? r.toFixed(2) : r < 10 ? r.toFixed(1) : fmt(r);
const fmtP = v => v >= 1000 ? Math.round(v).toLocaleString() : v.toFixed(v >= 100 ? 1 : 2);
const fmtSh = s => s < 1e4 ? (s >= 100 ? s.toFixed(1) : s >= 1 ? s.toFixed(3) : s.toFixed(6)) : fmt(s);

// ---------- 게임 데이터 ----------
// 묘기는 모두 같은 금액(TAP_PAY)을 줘요. need = 이 묘기를 해금하는 누적 수입 (고른 묘기 하나만 보여줌)
const TAP_PAY = 3;
const DANCES = [
  { id:'sway',   ic:'💃', nm:'덩실덩실 춤',       need:0,    dur:1100 },
  { id:'tree',   ic:'🌴', nm:'나무에서 춤추기',   need:1e2,  dur:1200 },
  { id:'hang',   ic:'🙃', nm:'거꾸로 매달리기',   need:1e3,  dur:1400 },
  { id:'hand',   ic:'🤸', nm:'물구나무 서기',     need:1e4,  dur:1300 },
  { id:'ball',   ic:'⚽', nm:'공 위에서 균형 잡기', need:1e5,  dur:1500 },
  { id:'cycle',  ic:'🚲', nm:'외발자전거',        need:1e6,  dur:1500 },
  { id:'hula',   ic:'⭕', nm:'훌라후프',          need:1e7,  dur:1300 },
  { id:'juggle', ic:'🍌', nm:'바나나 저글링',     need:1e8,  dur:1500 },
  { id:'swing',  ic:'🎪', nm:'공중그네',          need:1e9,  dur:1700 },
  { id:'fire',   ic:'🔥', nm:'불붙은 링 통과',    need:1e10, dur:1200 },
  { id:'rope',   ic:'🪢', nm:'외줄타기',          need:1e11, dur:1800 },
  { id:'magic',  ic:'🎩', nm:'마술쇼',            need:1e12, dur:1700 },
  { id:'cannon', ic:'💥', nm:'인간 대포',        need:1e13, dur:1600 },
  { id:'guitar', ic:'🎸', nm:'기타 공연',         need:1e14, dur:1600 },
  { id:'tramp',  ic:'🤾', nm:'트램펄린 공중제비', need:1e15, dur:1900 },
];
// 알바(동물 친구들): cost = 기본 가격(고용할 때마다 15%씩 비싸짐), inc = 1마리당 초당 수입
const CREW = [
  { id:'parrot',   ic:'🦜', nm:'앵무새 호객꾼',    cost:15,    inc:.08 },
  { id:'penguin',  ic:'🐧', nm:'펭귄 표 판매원',   cost:120,   inc:.6 },
  { id:'elephant', ic:'🐘', nm:'코끼리 짐꾼',      cost:1100,  inc:3.6 },
  { id:'lion',     ic:'🦁', nm:'사자 조련 쇼',     cost:12e3,  inc:22 },

// 묘기 소품 (back = 원숭이 뒤, front = 앞)
const R = (x, y, w, h, f, st) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${st ? ` stroke="${st}" stroke-width="2"` : ''}/>`;
const CI = (x, y, r, f, st) => `<circle cx="${x.toFixed ? x.toFixed(1) : x}" cy="${y.toFixed ? y.toFixed(1) : y}" r="${r}" fill="${f}"${st ? ` stroke="${st}" stroke-width="2"` : ''}/>`;
const LN = (x1, y1, x2, y2, w, c) => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
function banana(x, y, r) { return `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(0)}) scale(1.5)" d="M-10,-5 Q0,12 10,-5 Q0,4 -10,-5Z" fill="#ffd84a" stroke="#8a6a1a" stroke-width="2" stroke-linejoin="round"/>`; }
const PROPS = {
  tree: { back() {

      + `<path d="M232 ${TB + 5} L70 ${TB + 5}" stroke="${C.ink}" stroke-width="15" stroke-linecap="round"/><path d="M232 ${TB + 5} L70 ${TB + 5}" stroke="#7a4a2b" stroke-width="11" stroke-linecap="round"/>`
      + CI(76, TB - 2, 10, '#4cc07a', C.ink) + CI(90, TB - 6, 8, '#3fae6a', C.ink); } },
  hang: { back() {

      + CI(34, BY - 6, 18, '#3fae6a', C.ink) + CI(268, BY - 6, 18, '#3fae6a', C.ink) + CI(60, BY - 10, 10, '#4cc07a', C.ink) + CI(240, BY - 10, 10, '#4cc07a', C.ink); } },
  ball: { back(ph) {
    const bx = CX + 22 * sin(2 * PI * ph), cy = GY - 26, rot = -(bx - CX) / 26 * 57.3 * 1.2;
    return `<clipPath id="bc"><circle cx="${bx.toFixed(1)}" cy="${cy}" r="26"/></clipPath>` + CI(bx, cy, 26, '#e8504a')
      + `<g clip-path="url(#bc)"><g transform="rotate(${rot.toFixed(0)} ${bx.toFixed(1)} ${cy})">${R((bx - 30).toFixed(1), cy - 5, 60, 10, '#fff3c4')}${R((bx - 5).toFixed(1), cy - 30, 10, 60, '#fff3c4')}</g></g>`
      + CI(bx, cy, 26, 'none', C.ink).replace('stroke-width="2"', 'stroke-width="3"'); } },
  cycle: { back(ph) {

    for (let i = 0; i < 4; i++) { const a = c + i * PI / 4; o += LN(wx - 16 * cos(a), WY - 16 * sin(a), wx + 16 * cos(a), WY + 16 * sin(a), 2, '#9aa0b4'); }

  hula: { back(ph, p) { return hoop(ph, p, true); }, front(ph, p) { return hoop(ph, p, false); } },
  juggle: { front(ph, p) {
    let o = '';

    for (let i = 0; i < 3; i++) {

  swing: { back(ph, p) {

  fire: { back(ph) { return ring(true); }, front(ph) { return ring(false); } },
  rope: { back() {

      + R(0, fy + 2, 20, GY + 14 - fy - 2, '#7a4a2b', C.ink) + R(280, fy + 2, 20, GY + 14 - fy - 2, '#7a4a2b', C.ink) + CI(10, fy - 2, 6, C.red, C.ink) + CI(290, fy - 2, 6, C.red, C.ink); } },
  magic: { front(ph) {
    const u = smooth(Math.abs(sin(PI * ph * 3 / 2))), hx = CX - 70, ry = GY - 28 - 34 * u;
    let o = `<text x="${hx - 11}" y="${ry.toFixed(1)}" font-size="26">🐇</text>`;
    o += R(hx - 17, GY - 30, 34, 30, '#2a2027', C.ink) + R(hx - 17, GY - 14, 34, 5, C.red) + `<ellipse cx="${hx}" cy="${GY - 30}" rx="22" ry="5" fill="#3a3040" stroke="${C.ink}" stroke-width="2"/>`;
    for (let i = 0; i < 5; i++) { const a = performance.now() / 300 + i * 1.26; o += CI(hx + 24 * cos(a), GY - 56 - 14 * u + 14 * sin(a), 2, i % 2 ? '#ffd23f' : '#ff8ad8'); }

  cannon: { back() {

  guitar: { front(ph, p) {
    const bx = p.sx + 6, by = p.sy + 38;
    return LN(bx, by, p.fhx, p.fhy, 6, C.ink) + LN(bx, by, p.fhx, p.fhy, 3, '#7a4a2b')
      + `<g transform="translate(${bx.toFixed(1)} ${by.toFixed(1)}) rotate(-24)"><ellipse rx="22" ry="15" fill="#d9822b" stroke="${C.ink}" stroke-width="2"/><ellipse cx="-4" rx="9" ry="9" fill="#d9822b" stroke="${C.ink}" stroke-width="2"/><circle cx="0" r="5" fill="${C.ink}"/><rect x="8" y="-4" width="10" height="8" fill="#7a4a2b"/></g>`
      + [0, 1, 2].map(i => { const k = (ph * 2 + i / 3) % 1; return `<text x="${(190 + 30 * i + 10 * sin(k * 6)).toFixed(0)}" y="${(160 - k * 90).toFixed(1)}" font-size="20" font-weight="900" fill="#7a4ab8" stroke="#fff" stroke-width="2" paint-order="stroke" opacity="${(1 - k).toFixed(2)}">${i % 2 ? '♪' : '♫'}</text>`; }).join(''); } },
  tramp: { back() {
    const ty = GY - 26;
    return LN(CX - 56, ty + 6, CX - 64, GY + 6, 5, C.ink) + LN(CX + 56, ty + 6, CX + 64, GY + 6, 5, C.ink)
      + `<ellipse cx="${CX}" cy="${ty + 4}" rx="74" ry="9" fill="${C.ink}"/><ellipse cx="${CX}" cy="${ty + 3}" rx="70" ry="7" fill="#e8504a"/><ellipse cx="${CX}" cy="${ty + 2}" rx="60" ry="4.5" fill="#3a9bdc"/>`; } },
};
function hoop(ph, p, back) {
  const w = 2 * PI * ph * 3, cx = p.hx, cy = p.hy - 8, rx = 32 + 6 * cos(w), ry = 8, rot = 12 * sin(w);
  const d = back ? `M${(cx - rx).toFixed(1)} ${cy.toFixed(1)} A${rx.toFixed(1)} ${ry} 0 0 1 ${(cx + rx).toFixed(1)} ${cy.toFixed(1)}` : `M${(cx - rx).toFixed(1)} ${cy.toFixed(1)} A${rx.toFixed(1)} ${ry} 0 0 0 ${(cx + rx).toFixed(1)} ${cy.toFixed(1)}`;
  return `<g transform="rotate(${rot.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})"><path d="${d}" fill="none" stroke="${C.ink}" stroke-width="8"/><path d="${d}" fill="none" stroke="#ff5fa8" stroke-width="5"/><path d="${d}" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="6 8"/></g>`;

function ring(back) {

  const half = (left) => `M${cx} ${cy - ry} A${rx} ${ry} 0 0 ${left ? 0 : 1} ${cx} ${cy + ry}`;
  let o = `<path d="${half(!back)}" fill="none" stroke="${C.ink}" stroke-width="9"/><path d="${half(!back)}" fill="none" stroke="#ff8a1f" stroke-width="6"/>`;

function drawMonkey(p, time, ph, id) {
  const lw = 11, T = 34, n = v => v.toFixed(1), pt = (x, y) => n(x) + ',' + n(y);
  const th = p.th, dir = [sin(th), -cos(th)], pr = [cos(th), sin(th)];
  const hip = [p.hx, p.hy], s = [p.sx, p.sy], sk = curSkin();
  const at = (c, w) => [c[0] + pr[0] * w, c[1] + pr[1] * w];
  let o = '';
  const poly = (pts, w, col, ol) => {
    const P = pts.map(q => pt(q[0], q[1])).join(' ');
    o += `<polyline points="${P}" fill="none" stroke="${ol}" stroke-width="${n(w + 4)}" stroke-linecap="round" stroke-linejoin="round"/>`
       + `<polyline points="${P}" fill="none" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  };
  const seg = (a, b, w, col, ol, cap = 'butt') => {
    if (ol) o += `<line x1="${n(a[0])}" y1="${n(a[1])}" x2="${n(b[0])}" y2="${n(b[1])}" stroke="${ol}" stroke-width="${n(w + 4)}" stroke-linecap="${cap}"/>`;
    o += `<line x1="${n(a[0])}" y1="${n(a[1])}" x2="${n(b[0])}" y2="${n(b[1])}" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="${cap}"/>`;
  };
  // 정면: 발끝은 바깥쪽(sd)으로 향함
  const leg = (A, kx, ky, ax, ay, sd) => { poly([A, [kx, ky], [ax, ay]], lw, C.base, C.shadeD); seg([ax - pr[0] * sd * 2, ay - pr[1] * sd * 2], [ax + pr[0] * sd * 9, ay + pr[1] * sd * 9], lw * .9, C.face2, C.shadeD, 'round'); };
  const hand = (x, y) => { o += `<circle cx="${n(x)}" cy="${n(y)}" r="6.5" fill="${C.face}" stroke="${C.shadeD}" stroke-width="2"/>`; };
  const arm = (A, ex, ey, hx, hy) => { poly([A, [ex, ey], [hx, hy]], lw * .85, C.base, C.shadeD); hand(hx, hy); };

  o += `<path d="M${pt(tb[0], tb[1])} Q${pt(tc[0], tc[1])} ${pt(tip[0], tip[1])}" fill="none" stroke="${C.shadeD}" stroke-width="9" stroke-linecap="round"/>`
     + `<path d="M${pt(tb[0], tb[1])} Q${pt(tc[0], tc[1])} ${pt(tip[0], tip[1])}" fill="none" stroke="${C.base}" stroke-width="5" stroke-linecap="round"/>`;

  // 망토
  if (sk.cape) {
    const w = 6 * sin(time * 4) + p.tw * 4, tl = [s[0] - dir[0] * 4 - pr[0] * 18, s[1] - dir[1] * 4 - pr[1] * 18], tr = [s[0] - dir[0] * 4 + pr[0] * 18, s[1] - dir[1] * 4 + pr[1] * 18];
    const bl = [hip[0] - dir[0] * 20 - pr[0] * (30 + w), hip[1] - dir[1] * 20 - pr[1] * (30 + w)], br = [hip[0] - dir[0] * 20 + pr[0] * (30 - w), hip[1] - dir[1] * 20 + pr[1] * (30 - w)];
    o += `<polygon points="${pt(tl[0], tl[1])} ${pt(tr[0], tr[1])} ${pt(br[0], br[1])} ${pt(bl[0], bl[1])}" fill="${sk.cape[0]}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`
       + `<line x1="${n(bl[0])}" y1="${n(bl[1])}" x2="${n(br[0])}" y2="${n(br[1])}" stroke="${sk.cape[1]}" stroke-width="5" stroke-linecap="round"/>`;

  const a = [hip[0] + dir[0] * T * .3, hip[1] + dir[1] * T * .3], b = [s[0] - dir[0] * T * .05, s[1] - dir[1] * T * .05];

  o += `<ellipse transform="translate(${n(bm[0])} ${n(bm[1])}) rotate(${n(th * 180 / PI)})" rx="${n(T * .34)}" ry="${n(bl * .46 + T * .06)}" fill="${C.face2}"/>`;
  // 조끼: 가운데가 트인 빨간 조끼 두 쪽 + 금단추
  const v0 = [a[0] + (b[0] - a[0]) * .25, a[1] + (b[1] - a[1]) * .25];
  for (const sd of [-1, 1]) seg(at(v0, sd * T * .3), at(b, sd * T * .32), T * .36, sk.vest[0], sk.vest[1], 'round');
  for (const f of [.45, .7]) o += CI(a[0] + (b[0] - a[0]) * f + pr[0] * T * .12, a[1] + (b[1] - a[1]) * f + pr[1] * T * .12, 2.4, sk.btn);
  if (sk.star) o += `<text x="${n(a[0] + (b[0] - a[0]) * .5 - pr[0] * T * .2)}" y="${n(a[1] + (b[1] - a[1]) * .5 - pr[1] * T * .2 + 5)}" font-size="14" text-anchor="middle" fill="#ffd23f" stroke="#8d6a00" stroke-width="1">★</text>`;

const anim = { id:null, start:0, dur:1000, cur:null, drawn:0, last:performance.now(), queue:0 };

function startDance() {
  const d = curDance();
  anim.id = d.id; anim.start = performance.now(); anim.dur = d.dur;
  $('exlabel').textContent = d.ic + ' ' + d.nm;
  showMsg(d.ic + ' ' + d.nm + '!');
}
let fxDrawn = 0;
function loop(now) {
  const dt = Math.min(.05, (now - anim.last) / 1000); anim.last = now;
  requestAnimationFrame(loop);
  if (document.hidden) return;
  let ph = 0, id = null;
  if (anim.id) {
    ph = (now - anim.start) / anim.dur;
    if (ph >= 1 && anim.queue > 0) { anim.queue--; startDance(); ph = 0; }   // 밀린 터치가 있으면 끊김 없이 다음 동작
    if (ph >= 1) { anim.id = null; anim.cur = null; } else id = anim.id;
  }
  const time = now / 1000;
  const tgt = id ? POSES[id](ph) : POSES.idle(time);
  if (!anim.cur) anim.cur = { ...tgt };
  const k = 1 - Math.exp(-dt * 22);
  let diff = 0;
  for (const key in tgt) { const d = tgt[key] - anim.cur[key]; diff += Math.abs(d); anim.cur[key] += d * k; }
  if (now - fxDrawn > 45) { fxDrawn = now; $('fx').innerHTML = fxSvg(S.venue, time) + weatherSvg(time); }
  if (id || diff > .3 || now - anim.drawn > 90) { anim.drawn = now; $('fg').innerHTML = drawMonkey(anim.cur, time, ph, id); }
}

function drawChart() {
  const svg = $('stChart'); if (!svg) return;
  const hist = mk().hist;
  const W = 340, H = 170, L = 64, Rm = 10, Tm = 10, B = 26, pw = W - L - Rm, ph = H - Tm - B;
  let o = `<text x="${L}" y="${H / 2}" font-size="11" fill="#999">시세를 모으는 중… (${stk().ivl / 1000}초마다 한 점)</text>`;
  if (hist.length > 1) {
    const vs = hist.map(h => h.v), t0 = hist[0].t, t1 = hist[hist.length - 1].t, ts = Math.max(1, t1 - t0);
    let mn = Math.min(...vs), mx = Math.max(...vs);
    const mid = (mn + mx) / 2, span = Math.max(mx - mn, mid * 2e-4), pad = span * .12;
    mn = mid - span / 2 - pad; mx = mid + span / 2 + pad;
    const X = t => L + (t - t0) / ts * pw, Y = v => Tm + (1 - (v - mn) / (mx - mn)) * ph;
    o = '';
    for (let i = 0; i <= 4; i++) {                       // y축: 가격 눈금 + 가로 보조선
      const v = mn + (mx - mn) * i / 4, y = Y(v);

         + `<text x="${L - 5}" y="${(y + 3).toFixed(1)}" font-size="9.5" fill="#6b5a45" text-anchor="end">${fmtP(v)}</text>`;
    }
    const fmtT = t => new Date(t).toLocaleTimeString('ko-KR', { hour12:false });
    for (let i = 0; i <= 2; i++) {                       // x축: 시각 눈금
      const t = t0 + ts * i / 2, x = X(t);
      o += `<line x1="${x.toFixed(1)}" y1="${Tm}" x2="${x.toFixed(1)}" y2="${Tm + ph}" stroke="#eadcc0" stroke-width="1"/>`
         + `<text x="${x.toFixed(1)}" y="${H - 9}" font-size="9.5" fill="#6b5a45" text-anchor="${i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}">${fmtT(t)}</text>`;
    }
    o += `<line x1="${L}" y1="${Tm}" x2="${L}" y2="${Tm + ph}" stroke="#6b5a45" stroke-width="1.5"/><line x1="${L}" y1="${Tm + ph}" x2="${W - Rm}" y2="${Tm + ph}" stroke="#6b5a45" stroke-width="1.5"/>`;
    const col = vs[vs.length - 1] >= vs[0] ? '#e8504a' : '#3a9bdc';

       + `<circle cx="${X(t1).toFixed(1)}" cy="${Y(vs[vs.length - 1]).toFixed(1)}" r="4" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
  }
  svg.innerHTML = o;
}

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (AC.state === 'suspended') AC.resume().catch(() => {});

}
function tone(f, dur = .12, type = 'triangle', vol = .07, when = 0, slide = 0) {
  const c = ac(); if (!c) return;
  const t0 = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function sfx(k, n = 0) {
  if (!S.sound) return;

    case 'perfect': tone(880, .12, 'sine', .07); tone(1320, .16, 'sine', .06, .06); break;
    case 'coin': tone(988, .08, 'square', .04); tone(1319, .18, 'square', .04, .07); break;
    case 'gold': [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .08, i * .07)); break;
    case 'fanfare': [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, .28, 'square', .05, i * .1)); tone(1047, .6, 'triangle', .07, .5); break;

}

function changeWeather(first) {

function renderWx() {

function weatherSvg(t) {
  const f = x => x.toFixed(1), ph = dayPhase(), ty = weather.type;
  let o = ph === 'night' ? '<rect width="300" height="260" fill="#0a1a5a" opacity=".3"/>' : ph === 'dusk' ? '<rect width="300" height="260" fill="#ff8a3c" opacity=".16"/>' : '';
  if (ty === 'rain') for (let i = 0; i < 26; i++) { const x = (i * 37 + t * 40) % 320 - 10, y = (t * 420 + i * 53) % 270 - 10; o += `<line x1="${f(x)}" y1="${f(y)}" x2="${f(x - 4)}" y2="${f(y + 12)}" stroke="#6aa8e8" stroke-width="1.6" opacity=".7"/>`; }
  else if (ty === 'snow') for (let i = 0; i < 24; i++) { const x = (i * 41 + 12 * sin(t + i)) % 300, y = (t * 40 + i * 47) % 270; o += `<circle cx="${f(x)}" cy="${f(y)}" r="${1.8 + i % 3}" fill="#fff" opacity=".9"/>`; }
  else if (ty === 'wind') for (let i = 0; i < 7; i++) { const x = ((t * 140 + i * 90) % 400) - 60, y = 30 + i * 28; o += `<path d="M${f(x)} ${y} q18 -6 36 0 t30 0" fill="none" stroke="#fff" stroke-width="2" opacity=".6" stroke-linecap="round"/>`; }
  else if (ty === 'rainbow') ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#4dabf7', '#9775fa'].forEach((c, i) => { o += `<path d="M${30 + i * 7} ${GY - 10} A${120 - i * 7} ${120 - i * 7} 0 0 1 ${270 - i * 7} ${GY - 10}" fill="none" stroke="${c}" stroke-width="7" opacity=".4"/>`; });
  return o;
}

// ---------- 특별 공연 (미니게임) ----------
let gameOpen = false, gameDone = null, gameTimers = [];
const gClear = () => { gameTimers.forEach(t => { clearInterval(t); clearTimeout(t); }); gameTimers = []; cancelAnimationFrame(gameRaf); };
let gameRaf = 0;
function openGame(kind, onDone) {
  if (gameOpen || !ready) return;
  gameOpen = true; gameDone = onDone || null; kind = kind || (Math.random() < .5 ? 'catch' : 'ring');
  $('showBtn').style.display = 'none'; showUntil = 0; nextShow = Date.now() + rand(150, 240) * 1000;
  $('gameTitle').textContent = kind === 'catch' ? '🍌 바나나를 받아라!' : '⭕ 불붙은 링을 통과하라!';
  $('gameModal').classList.add('show');
  (kind === 'catch' ? gameCatch : gameRing)($('gameArea'), finishGame);
}
function finishGame(score) {
  gClear();
  const tier = score >= 30 ? 3 : score >= 20 ? 2 : score >= 10 ? 1 : 0, mins = [30, 120, 240, 480][tier], g = bonusBase() * mins;
  earn(g); S.games++; qAdd('game'); dirty = true;
  sfx(tier >= 2 ? 'fanfare' : tier ? 'gold' : 'ok');
  $('gameArea').innerHTML = `<div style="text-align:center;padding:26px 8px"><div style="font-size:54px">${['😅', '👍', '🎉', '🏆'][tier]}</div>
    <h2 style="margin:6px 0">${['아쉬워요', '좋아요!', '훌륭해요!', '대박 공연!'][tier]}</h2><p>점수 <b>${score}</b>점 · 보상 <b>${fmt(g)}원</b></p></div>`;
  $('gameClose').style.display = '';
  const cb = gameDone; gameDone = null; if (cb) cb(tier);
  save(); render();
}
$('gameClose').onclick = () => { gClear(); gameOpen = false; $('gameModal').classList.remove('show'); };
function gameCatch(area, done) {
  let score = 0, left = 15;
  $('gameClose').style.display = 'none';
  area.innerHTML = '<div class="g-hud"></div><div class="g-field"></div><div class="note gray" style="text-align:center">🍌 +1 · 🌟 +3 · 🥥 −2 (터치해서 받아요)</div>';
  const hud = area.querySelector('.g-hud'), field = area.querySelector('.g-field');
  const upd = () => hud.textContent = `⏱ ${Math.ceil(left)}초 · 점수 ${score}`; upd();
  const types = [{ ic:'🍌', p:1, w:6 }, { ic:'🌟', p:3, w:1.4 }, { ic:'🥥', p:-2, w:2.6 }];
  gameTimers.push(setInterval(() => {
    const t = pickW(types), e = document.createElement('div'); e.className = 'g-item'; e.textContent = t.ic;
    e.style.left = rand(3, 82).toFixed(0) + '%'; e.style.animationDuration = rand(1.5, 2.6).toFixed(2) + 's';
    e.addEventListener('pointerdown', ev => { ev.preventDefault(); score = Math.max(0, score + t.p); sfx(t.p > 0 ? 'coin' : 'bad'); e.remove(); upd(); });
    e.addEventListener('animationend', () => e.remove()); field.appendChild(e);
  }, 330));
  gameTimers.push(setInterval(() => { left -= .1; upd(); if (left <= 0) done(score); }, 100));
}
function gameRing(area, done) {
  let round = 0, hits = 0, stopped = false, zone = 0, zw = 0, t0 = performance.now(), x = 0;
  $('gameClose').style.display = 'none';
  area.innerHTML = '<div class="g-hud"></div><div class="g-bar"><div class="g-zone"></div><div class="g-mark">🐵</div></div><button class="btn go" id="ringBtn" style="width:100%;margin-top:14px;padding:14px;font-size:18px">🔥 지금!</button><div class="note gray" style="text-align:center">움직이는 원숭이가 초록 구간에 있을 때 눌러요 (5번)</div>';
  const hud = area.querySelector('.g-hud'), zEl = area.querySelector('.g-zone'), mk2 = area.querySelector('.g-mark');
  const speeds = [1.6, 2.0, 2.5, 3.0, 3.6], widths = [.3, .25, .2, .16, .13];
  const next = () => { zw = widths[round]; zone = rand(zw / 2 + .05, 1 - zw / 2 - .05); zEl.style.left = ((zone - zw / 2) * 100) + '%'; zEl.style.width = (zw * 100) + '%'; hud.textContent = `${round + 1} / 5번째 · 성공 ${hits}`; t0 = performance.now(); stopped = false; };
  next();
  const frame = now => { if (!stopped) { x = .5 + .5 * Math.sin((now - t0) / 1000 * speeds[round] * 2 - 1.57); mk2.style.left = (x * 100) + '%'; } gameRaf = requestAnimationFrame(frame); };
  gameRaf = requestAnimationFrame(frame);
  const hit = () => {
    if (stopped) return; stopped = true;
    if (Math.abs(x - zone) <= zw / 2) { hits++; sfx('gold'); mk2.textContent = '🔥'; } else { sfx('bad'); mk2.textContent = '💦'; }
    gameTimers.push(setTimeout(() => { mk2.textContent = '🐵'; round++; if (round >= 5) done(hits * 7); else next(); }, 550));
  };
  $('ringBtn').onclick = hit; area.querySelector('.g-bar').addEventListener('pointerdown', hit);
}
$('showBtn').onclick = () => openGame();

// 새 탭의 클릭 처리 (true를 돌려주면 처리됨)
function extraAct(act, arg) {
  switch (act) {
    case 'achClaim': { const a = ACHS.find(x => x.id === arg); if (!a || !a.ok() || S.ach[arg]) return true; earn(achReward()); S.ach[arg] = 1; S.title = S.title || a.nm; toast('🏅 ' + a.nm + ' 보상 ' + fmt(achReward()) + '원!'); sfx('coin'); return true; }
    case 'titleUse': { const a = ACHS.find(x => x.id === arg); if (a && S.ach[arg]) S.title = a.nm; return true; }
    case 'titleOff': S.title = ''; return true;
    case 'qClaim': { const q = S.daily.q[+arg]; if (!q || q.claimed || q.prog < q.goal) return true; q.claimed = true; earn(questReward()); sfx('coin'); toast('📅 퀘스트 보상 ' + fmt(questReward()) + '원!');
      if (S.daily.q.every(x => x.claimed) && !S.daily.all) { S.daily.all = true; S.bonusTp = (S.bonusTp || 0) + 1; toast('🎁 오늘 퀘스트 전부 완료! 특성 포인트 +1'); finale('📅 오늘의 퀘스트 완료!', ['🎉', '⭐', '🍌']); } return true; }
    case 'evo': { const w = CREW.find(x => x.id === arg), lv = S.crewLv[arg] || 0; if (!w || lv >= MAX_EVO || !(S.crew[arg] > 0)) return true; const c = evoCost(w, lv); if (S.money < c) return true;
      S.money -= c; S.crewLv[arg] = lv + 1; toast('⭐ ' + w.ic + ' ' + EVO_NM[lv + 1] + w.nm.replace(/ \[.*\]/, '') + '(으)로 진화!'); sfx('gold'); return true; }
    case 'trait': { const tr = TRAITS.find(x => x.id === arg), l = traitLv(arg); if (!tr || l >= tr.max || tpLeft() < l + 1) return true; S.traits[arg] = l + 1; sfx('gold'); toast('🌟 ' + tr.nm + ' Lv.' + (l + 1)); return true; }
    case 'hatBuy': { const k = HATS.find(x => x.id === arg); if (!k || S.hats.includes(arg) || S.money < k.cost) return true; S.money -= k.cost; S.hats.push(arg); S.hat = arg; sfx('coin'); toast('🎉 ' + k.nm + ' 구매!'); return true; }
    case 'hatUse': if (S.hats.includes(arg)) S.hat = arg; return true;
    case 'fxBuy': { const k = FXS.find(x => x.id === arg); if (!k || S.fxs.includes(arg) || S.money < k.cost) return true; S.money -= k.cost; S.fxs.push(arg); S.fx = arg; sfx('coin'); toast('🎉 ' + k.nm + ' 이펙트 구매!'); return true; }
    case 'fxUse': if (S.fxs.includes(arg)) S.fx = arg; return true;
  }
  return false;
}

// ---------- 1초마다 도는 확장 기능 틱 ----------
function extraTick() {
  if (!ready || !S.nickname) return;
  const now = Date.now();
  ensureDaily();
  if (S.weekKey !== weekKeyNow()) { S.weekKey = weekKeyNow(); S.weekStart = lifeEarned(); dirty = true; }
  buffs = buffs.filter(b => b.until > now);
  const chips = buffs.map(b => `<span class="chip ${(b.tap < 1 || b.crew < 1) ? 'bad' : ''}">${b.ic} ${b.nm} ${Math.ceil((b.until - now) / 1000)}초</span>`).join('');
  if (chips !== extraTick.chips) { extraTick.chips = chips; $('buffs').innerHTML = chips; }
  const busy = document.querySelector('.modal.show') || gameOpen;
  if (now > nextGold && !busy) spawnGold();
  if (now > nextNews && !busy) fireNews();
  if (now > nextShow && !showUntil && !busy) { showUntil = now + 90000; $('showBtn').style.display = ''; }
  if (showUntil && now > showUntil) { showUntil = 0; $('showBtn').style.display = 'none'; nextShow = now + rand(150, 240) * 1000; }
  if (now > weather.until) changeWeather(false);
  if (performance.now() - lastTap > 1300 && combo) { combo = 0; $('combo').style.opacity = 0; }
  for (const a of ACHS) if (a.ok() && !achSeen.has(a.id)) { achSeen.add(a.id); toast('🏅 업적 달성! ' + a.ic + ' ' + a.nm + ' (업적 탭에서 보상을 받아요)'); sfx('gold'); }
  renderWx(); renderCrowd();
  $('fansInfo').textContent = `👥 팬 ${fanCount().toLocaleString()}명 (수입 +${((fanMult() - 1) * 100).toFixed(0)}%)` + (S.title ? ` · 『${S.title}』` : '');
  const dots = { ach:unclaimedAch().length > 0, quest:S.daily.q.some(q => !q.claimed && q.prog >= q.goal), trait:tpLeft() > 0 };
  for (const k in dots) { const e = $('dot-' + k); if (e) e.style.display = dots[k] ? '' : 'none'; }
  if (tab === 'quest' || tab === 'ach') buildPanel();
}

  const now = performance.now(), dt = (now - lastFrame) / 1000; lastFrame = now;
  if (!ready || !S.nickname) return;
  const g = crewRate() * dt;
  if (g > 0) { earn(g); checkUnlock(); }
  render();
  if (now - lastPanel > 250) { lastPanel = now; refreshDyn(); }
}, 100);

// ================= 저장 =================
let saving = false;   // 서버 저장은 한 번에 하나만 (겹치면 내 저장끼리 충돌해서 '다른 기기' 오탐이 생김)
async function save() {
  if (!ready) return;
  S.savedAt = Date.now();
  saveLocal();
  if (!online || !dirty) return;
  if (stale || saving) return;   // saving 중이면 dirty가 남아 있어 다음 저장(5초마다)에서 올라감
  saving = true; dirty = false;
  const ts = S.savedAt;
  try {
    // 다른 기기가 더 진행된 기록을 올려뒀다면 덮어쓰지 않는다 (오래된 기기가 기록을 날리는 것 방지)
    const ref = fb.doc(db, 'circus', uid);
    const res = await fb.runTransaction(db, async tx => {
      const snap = await tx.get(ref), sv = snap.exists() ? snap.data() : null;
      // 마지막으로 본 뒤 서버가 바뀌었을 때, 서버 쪽이 더 진행된 기록일 때만 막는다.
      // 진행도 = (구매·환생 등 직접 한 행동 수, 누적 수입). 오래된 화면이 서버를 되돌리는 것도, 더 진행된 내 기록이 버려지는 것도 막기 위함
      if (sv && num(sv.savedAt) !== syncedAt && (num(sv.acts) > S.acts || (num(sv.acts) === S.acts && num(sv.totalEarned) > lifeEarned()))) return 'stale';
      tx.set(ref, {
        nickname:S.nickname, money:S.money, totalEarned:lifeEarned(), runEarned:S.totalEarned, run:S.run, history:S.history, netWorth:netWorth(), taps:S.taps, dances:S.dances, crew:S.crew, estate:S.estate, skins:S.skins, skin:S.skin,
        tipLv:S.tipLv, wageLv:S.wageLv, stocks:S.stocks,
        venues:S.venues, venue:S.venue, dance:S.dance, acts:S.acts, savedAt:ts, ...extraOut(), weekEarned:Math.max(0, lifeEarned() - S.weekStart), updatedAt:fb.serverTimestamp()
      });
      return 'ok';
    });
    if (res === 'stale') {
      stale = true;
      alert('다른 기기에서 더 진행된 기록이 있어요. 최신 기록을 불러올게요.');
      location.reload();
    } else syncedAt = ts;
  } catch (e) { console.warn('저장 실패', e); dirty = true; }
  finally { saving = false; }
}
setInterval(save, 5000);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ================= 스코어보드 =================
let rankTab = 'earn';
function setRankTab(t) { rankTab = t; $('tabEarn').classList.toggle('on', t === 'earn'); $('tabWeek').classList.toggle('on', t === 'week'); $('tabNet').classList.toggle('on', t === 'net'); openRank(); }
$('tabEarn').onclick = () => setRankTab('earn'); $('tabWeek').onclick = () => setRankTab('week'); $('tabNet').onclick = () => setRankTab('net');
$('rankBtn').onclick = () => openRank();
$('rankClose').onclick = () => $('rankModal').classList.remove('show');
async function openRank() {
  $('rankModal').classList.add('show');
  const tbl = $('rankTable'), note = $('rankNote'), key = rankTab === 'earn' ? 'totalEarned' : rankTab === 'week' ? 'weekEarned' : 'netWorth';
  note.textContent = ''; tbl.innerHTML = '<tr><td>불러오는 중...</td></tr>';
  let rows = [];
  if (online) {
    try {
      const snap = await fb.getDocs(fb.query(fb.collection(db, 'circus'), fb.orderBy(key, 'desc'), fb.limit(rankTab === 'week' ? 120 : 30)));
      rows = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      if (rankTab === 'week') rows = rows.filter(r => r.weekKey === weekKeyNow()).slice(0, 30);
    } catch (e) { tbl.innerHTML = '<tr><td>스코어보드를 불러오지 못했어요.</td></tr>'; console.warn(e); return; }
  } else {
    rows = [{ id:uid, nickname:S.nickname, run:S.run, title:S.title, weekKey:weekKeyNow(), weekEarned:Math.max(0, lifeEarned() - S.weekStart), totalEarned:lifeEarned(), netWorth:netWorth() }];
    note.textContent = 'Firebase가 연결되지 않아 내 기록만 보여요.';
  }
  if (!rows.length) { tbl.innerHTML = '<tr><td>아직 기록이 없어요.</td></tr>'; return; }
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  tbl.innerHTML = `<tr><th>#</th><th>닉네임</th><th>${rankTab === 'earn' ? '누적 수입' : rankTab === 'week' ? '이번 주 수입' : '순자산'}</th></tr>` + rows.map((r, i) =>
    `<tr class="${r.id === uid ? 'me' : ''}"><td>${i + 1}</td><td>${r.title ? '<small>『' + esc(r.title) + '』</small> ' : ''}${esc(r.nickname)}${r.run > 1 ? ' <small>(' + num(r.run) + '회차)</small>' : ''}</td><td>${fmt(r[key] || 0)}원</td></tr>`).join('');
}

// ================= 시작 / 로그인 =================
let au = null, fba = null, newId = '';
async function initFirebase() {
  try {
    const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
    const [app, auth, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const a = app.initializeApp(firebaseConfig);
    au = auth.getAuth(a); fba = auth; db = fs.getFirestore(a); fb = fs;
    await au.authStateReady();
    online = true;
  } catch (e) { console.warn('Firebase 사용 불가, 로컬 모드로 실행', e); online = false; }
}
// 아이디 → 이메일 형태 (부타 다이어트와 같은 계정 체계)
const idEmail = id => 'u' + [...new TextEncoder().encode(id.toLowerCase())].map(b => b.toString(16).padStart(2, '0')).join('') + '@butadiet.game';
const AUTH_ERR = {
  'auth/email-already-in-use': '이미 사용 중인 아이디예요',
  'auth/invalid-credential': '아이디 또는 비밀번호가 맞지 않아요',
  'auth/wrong-password': '아이디 또는 비밀번호가 맞지 않아요',
  'auth/user-not-found': '아이디 또는 비밀번호가 맞지 않아요',
  'auth/weak-password': '비밀번호는 6자 이상이어야 해요',
  'auth/too-many-requests': '시도가 너무 많아요. 잠시 후 다시 해주세요',
  'auth/network-request-failed': '네트워크 오류예요. 다시 시도해주세요',
  'auth/operation-not-allowed': 'Firebase 콘솔에서 이메일/비밀번호 로그인을 켜야 해요',
};
function loginPrompt() {
  $('loginModal').classList.add('show');
  return new Promise(res => {
    const busy = on => { $('loginBtn').disabled = $('signupBtn').disabled = on; };
    const read = () => {
      const id = $('loginId').value.trim(), pw = $('loginPw').value;
      if (!id) { $('loginErr').textContent = '아이디를 입력해주세요'; return null; }
      if (new TextEncoder().encode(id).length > 30) { $('loginErr').textContent = '아이디가 너무 길어요'; return null; }
      if (pw.length < 6) { $('loginErr').textContent = '비밀번호는 6자 이상이어야 해요'; return null; }
      $('loginErr').textContent = ''; return { id, pw };
    };
    const run = fn => async () => {
      const c = read(); if (!c) return;
      busy(true);
      try { await fn(c); $('loginModal').classList.remove('show'); res(); }
      catch (e) { $('loginErr').textContent = AUTH_ERR[e.code] || ('오류: ' + (e.code || e.message)); busy(false); }
    };
    $('loginBtn').onclick = run(c => fba.signInWithEmailAndPassword(au, idEmail(c.id), c.pw));
    $('signupBtn').onclick = run(async c => {
      await fba.createUserWithEmailAndPassword(au, idEmail(c.id), c.pw);
      await fba.updateProfile(au.currentUser, { displayName:c.id }).catch(() => {});
      newId = c.id;
    });
    $('loginPw').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };
  });
}
$('logoutBtn').onclick = async e => { e.preventDefault(); await save(); await fba.signOut(au); location.reload(); };
function askNick() {
  return new Promise(res => {
    $('nickModal').classList.add('show');
    const ok = () => { const v = $('nickInput').value.trim().slice(0, 10); if (!v) return; $('nickModal').classList.remove('show'); res(v); };
    $('nickOk').onclick = ok;
    $('nickInput').onkeydown = e => { if (e.key === 'Enter') ok(); };
  });
}
const num = (v, d = 0) => Number.isFinite(+v) ? +v : d;

(async () => {
  buildTabs(); buildPanel(); setVenue(0); render(); requestAnimationFrame(loop);
  await initFirebase();
  let loaded = null;
  if (online) {
    if (!au.currentUser || au.currentUser.isAnonymous) { if (au.currentUser) await fba.signOut(au); await loginPrompt(); }
    uid = au.currentUser.uid;
    $('logoutBtn').style.display = 'inline';
    try { const d = await fb.getDoc(fb.doc(db, 'circus', uid)); if (d.exists()) loaded = d.data(); else loaded = null; }
    catch (e) { console.warn(e); online = false; loaded = readKey(lsKey()); }   // 읽기 실패 시 서버 기록을 덮어쓰지 않도록 이번엔 로컬로만
  } else loaded = readKey(lsKey());
  if (online && loaded) syncedAt = num(loaded.savedAt);
  if (loaded) {
    const d = newState();
    S = { ...d, nickname:loaded.nickname || '', money:num(loaded.money), totalEarned:num(loaded.runEarned ?? loaded.totalEarned),
      run:Math.max(1, Math.floor(num(loaded.run, 1))), history:(Array.isArray(loaded.history) ? loaded.history : []).map(h => ({ run:num(h.run), earned:num(h.earned), at:num(h.at) })), taps:num(loaded.taps),
      dances:{ ...(loaded.dances || {}) }, crew:Object.fromEntries(Object.entries(loaded.crew || {}).map(([k, v]) => [k, Math.min(MAX_CREW, num(v))])), estate:Object.fromEntries(ESTATES.map(e => [e.id, clamp(num(loaded.estate?.[e.id]), 0, MAX_ESTATE)])), tipLv:num(loaded.tipLv), wageLv:num(loaded.wageLv),
      stocks:Object.fromEntries(STOCKS.map(x => {
        const o = loaded.stocks?.[x.id] || (x.id === 'banana' && !loaded.stocks ? { shares:loaded.shares, basis:loaded.basis, realized:loaded.realized, price:loaded.price, conv:!loaded.krw } : {});
        return [x.id, { shares:num(o.shares), basis:num(o.basis), realized:num(o.realized), price:num(o.price), conv:!!o.conv }];
      })),
      venues:Array.isArray(loaded.venues) && loaded.venues.length ? loaded.venues : [0],
      venue:num(loaded.venue), dance:loaded.dance || 'sway', savedAt:num(loaded.savedAt), acts:num(loaded.acts) };
    S.skins = ['basic', ...(Array.isArray(loaded.skins) ? loaded.skins.filter(k => k !== 'basic' && SKINS.some(x => x.id === k)) : [])];
    S.skin = S.skins.includes(loaded.skin) ? loaded.skin : 'basic';
    for (const k of EXTRA_KEYS) if (loaded[k] != null && typeof loaded[k] === typeof d[k]) S[k] = loaded[k];
    S.lifeTaps = Math.max(num(S.lifeTaps), S.taps);
    if (!S.hats.includes('none')) S.hats.unshift('none'); if (!S.fxs.includes('coin')) S.fxs.unshift('coin');
    for (const k of Object.keys(S.traits)) { const tr = TRAITS.find(x => x.id === k); S.traits[k] = tr ? clamp(num(S.traits[k]), 0, tr.max) : 0; }
    for (const k of ['grape', 'cucumber']) {   // 예전 종목(테슬라·SK하이닉스) 보유분은 마지막 평가액만큼 돈으로 돌려줌
      const o = loaded.stocks?.[k], v = o && !o.conv ? num(o.shares) * num(o.price) : 0;
      if (v > 0) { S.money += v; dirty = true; setTimeout(() => toast('📈 종목이 바뀌어서 예전 주식 ' + fmt(v) + '원어치를 현금으로 돌려받았어요'), 1500); }
    }
    if (!S.venues.includes(S.venue)) S.venue = 0;
  }
  if (newId) { S.nickname = newId; dirty = true; }
  else if (!S.nickname && au?.currentUser?.displayName) { S.nickname = au.currentUser.displayName; dirty = true; }
  if (!S.nickname) { S.nickname = await askNick(); dirty = true; }
  // 자리를 비운 동안의 수입 (기본 절반 효율, 최대 8시간 / 특성으로 늘어남)
  const away = S.savedAt ? (Date.now() - S.savedAt) / 1000 : 0, rate = crewRate(), lines = [];
  let offGain = 0;
  if (away > 60 && rate > 0) {
    offGain = rate * Math.min(away, (8 + 2 * traitLv('offcap')) * 3600) * (.5 + .1 * traitLv('offline'));
    earn(offGain);
    lines.push(`😴 자리를 비운 동안 <b>${fmt(offGain)}원</b>을 벌었어요`);
  }
  for (const w of CREW) if (S.crew[w.id] > 0) S.dex[w.id] = Math.max(S.dex[w.id] || 0, S.crew[w.id]);
  ensureDaily();
  const tk = todayKey();
  if (S.lastDay !== tk) {   // 출석 보너스
    S.streak = S.lastDay === todayKey(new Date(Date.now() - 864e5)) ? S.streak + 1 : 1; S.lastDay = tk;
    const att = Math.max(1000, rate * 60) * (1 + Math.min(S.streak, 7) * .5);
    earn(att); lines.unshift(`📅 <b>${S.streak}일 연속 출석!</b> 출석 보너스 <b>${fmt(att)}원</b>`);
  }
  if (!S.weekKey) { S.weekKey = weekKeyNow(); S.weekStart = lifeEarned(); }
  dirty = true;
  knownUnlocked = unlocked().length;
  setVenue(S.venue);
  ready = true; await save();
  buildTabs(); buildPanel(); renderCrew(); render();
  ACHS.forEach(a => { if (a.ok()) achSeen.add(a.id); });
  changeWeather(true); syncSndBtns();
  if (lines.length) showWelcome(lines, offGain);
  for (const x of STOCKS) { tickStock(x.id); setInterval(() => tickStock(x.id), x.ivl); }
})();
</script>

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
