<!DOCTYPE html>
<html lang="ko">
<head>

<style>

  @keyframes puff { from { transform:translate(0,0) scale(.6); opacity:1; } to { transform:translate(var(--dx), var(--dy)) scale(1.1) rotate(40deg); opacity:0; } }
  @keyframes up { to { transform: translateY(-70px); opacity:0; } }
  #msg { position:absolute; top:10px; width:100%; text-align:center; font-weight:900; color:#fff; text-shadow:0 2px 0 var(--ink), 0 0 6px var(--ink); min-height:22px; pointer-events:none; z-index:2; }

  .row .tx small { display:block; font-size:12px; opacity:.75; line-height:1.35; }

  .row .btn.sell { background:var(--blue); }
  .row .btn.buy { background:var(--red); }

  .note { font-size:12px; color:#b36; margin-top:8px; }

  .card { background:#fff; border-radius:18px; padding:18px; width:min(420px,100%); max-height:85vh; overflow:auto; }

<script type="module">
// ===== Firebase 설정 (부타 다이어트와 같은 프로젝트) =====

const PI = Math.PI, sin = Math.sin, cos = Math.cos;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- 숫자 표시 (만/억/조/경/해/자) ----------
const UNITS = [[1e24, '자'], [1e20, '해'], [1e16, '경'], [1e12, '조'], [1e8, '억'], [1e4, '만']];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  n = Math.max(0, n);
  if (n < 1e4) return Math.floor(n).toLocaleString('ko-KR');
  if (n >= 1e28) return n.toExponential(2).replace('e+', '×10^');
  for (const [v, u] of UNITS) if (n >= v) { const x = n / v; return (x >= 100 ? Math.floor(x) : x >= 10 ? x.toFixed(1) : x.toFixed(2)) + u; }
}
const fmtRate = r => r < 1 ? r.toFixed(2) : r < 10 ? r.toFixed(1) : fmt(r);
const fmtSh = s => s < 1e4 ? (s >= 100 ? s.toFixed(1) : s >= 1 ? s.toFixed(3) : s.toFixed(6)) : fmt(s);

// ---------- 게임 데이터 ----------
// 묘기는 모두 같은 금액(TAP_PAY)을 줘요. need = 이 묘기를 해금하는 누적 수입 (고른 묘기 하나만 보여줌)
const TAP_PAY = 3;
const DANCES = [
  { id:'sway',   ic:'💃', nm:'덩실덩실 춤',       need:0,    dur:1100 },
  { id:'tree',   ic:'🌴', nm:'나무에서 춤추기',   need:1e2,  dur:1200 },
  { id:'hang',   ic:'🙃', nm:'거꾸로 매달리기',   need:1e3,  dur:1400 },
  { id:'hand',   ic:'🤸', nm:'물구나무 서기',     need:1e4,  dur:1300 },

  { id:'cycle',  ic:'🚲', nm:'외발자전거',        need:1e6,  dur:1500 },
  { id:'hula',   ic:'⭕', nm:'훌라후프',          need:1e7,  dur:1300 },
  { id:'juggle', ic:'🍌', nm:'바나나 저글링',     need:1e8,  dur:1500 },
  { id:'swing',  ic:'🎪', nm:'공중그네',          need:1e9,  dur:1700 },
  { id:'fire',   ic:'🔥', nm:'불붙은 링 통과',    need:1e10, dur:1200 },
];
// 알바(동물 친구들): cost = 기본 가격(고용할 때마다 15%씩 비싸짐), inc = 1마리당 초당 수입
const CREW = [
  { id:'parrot',   ic:'🦜', nm:'앵무새 호객꾼',    cost:15,    inc:.08 },
  { id:'penguin',  ic:'🐧', nm:'펭귄 표 판매원',   cost:120,   inc:.6 },
  { id:'elephant', ic:'🐘', nm:'코끼리 짐꾼',      cost:1100,  inc:3.6 },
  { id:'lion',     ic:'🦁', nm:'사자 조련 쇼',     cost:12e3,  inc:22 },
  { id:'otter',    ic:'🦦', nm:'수달 저글러',      cost:13e4,  inc:136 },
  { id:'bear',     ic:'🐻', nm:'곰 자전거 곡예',   cost:14e5,  inc:840 },
  { id:'giraffe',  ic:'🦒', nm:'기린 공중 곡예',   cost:2e7,   inc:5600 },
  { id:'unicorn',  ic:'🦄', nm:'유니콘 마술사',    cost:33e7,  inc:4e4 },
];
// bonus = 사용 중인 무대의 수입 배율(터치·알바 모두), puff = 터치할 때 튀는 효과
const VENUES = [
  { nm:'길거리 공연',     ic:'🏙️', cost:0,     bonus:1,    puff:'🪙', fx:'떠다니는 음표' },
  { nm:'동네 공원 무대',   ic:'🌳', cost:2e4,   bonus:1.1,  puff:'🍃', fx:'흘러가는 구름, 떨어지는 나뭇잎' },
  { nm:'동네 서커스',     ic:'🎪', cost:5e5,   bonus:1.25, puff:'🎈', fx:'깜빡이는 전구 장식' },
  { nm:'대형 서커스 텐트', ic:'🎡', cost:2e7,   bonus:1.5,  puff:'⭐', fx:'휘젓는 스포트라이트' },
  { nm:'도시 극장',       ic:'🎭', cost:1e9,   bonus:2,    puff:'🌹', fx:'색색의 조명 빔, 반짝이 가루' },
  { nm:'월드 투어',       ic:'🌍', cost:1e11,  bonus:3,    puff:'🎆', fx:'터지는 불꽃놀이, 반짝이는 별' },
];
const venueMult = () => VENUES[S.venue]?.bonus || 1;
// 주식: 1주 가격 = 실제 시세의 원화 가격 (바나나=비트코인, 포도=테슬라, 오이=SK하이닉스)
const STOCKS = [
  { id:'banana',   ic:'🍌', nm:'바나나 주식', src:'비트코인(BTC)',     ivl:3000 },
  { id:'grape',    ic:'🍇', nm:'포도 주식',   src:'테슬라(TSLA)',       ivl:30000 },
  { id:'cucumber', ic:'🥒', nm:'오이 주식',   src:'SK하이닉스(000660)', ivl:30000 },
];
const newStocks = () => Object.fromEntries(STOCKS.map(x => [x.id, { shares:0, basis:0, realized:0, price:0, conv:false }]));
const MAX_CREW = 30;   // 알바 종류별 최대 고용 수
const FEE = 0.005;   // 매수·매도 수수료 0.5%
const tipMult = () => Math.pow(1.5, S.tipLv), wageMult = () => Math.pow(1.3, S.wageLv);
const tipCost = L => Math.ceil(25 * Math.pow(2, L)), wageCost = L => Math.ceil(400 * Math.pow(3, L));
const crewCost = (w, n) => Math.ceil(w.cost * Math.pow(1.15, n));
const crewRate = () => CREW.reduce((s, w) => s + (S.crew[w.id] || 0) * w.inc, 0) * wageMult() * venueMult();
const unlocked = () => DANCES.filter(d => S.totalEarned >= d.need);
const netWorth = () => S.money + STOCKS.reduce((a, x) => a + S.stocks[x.id].shares * S.stocks[x.id].price, 0);

// ---------- 상태 ----------
let uid = 'local', db = null, fb = null, online = false;
const newState = () => ({ nickname:'', money:0, totalEarned:0, taps:0, dances:{}, crew:{}, tipLv:0, wageLv:0,
  stocks:newStocks(), venues:[0], venue:0, dance:'sway', savedAt:0 });
let S = newState();
let dirty = false, ready = false;
let tab = 'dance', bulkMode = '1', knownUnlocked = 1;

const LS_KEY = 'circus-local';
const lsKey = () => uid === 'local' ? LS_KEY : LS_KEY + '-' + uid;
const readKey = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const saveLocal = () => { try { localStorage.setItem(lsKey(), JSON.stringify(S)); } catch {} };
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2600); }
function earn(x) { S.money += x; S.totalEarned += x; dirty = true; }

// ================= 원숭이 그리기 (뼈대 + IK, 부타와 같은 도트 느낌) =================
const C = { base:'#9a6240', shade:'#7a4a2f', shadeD:'#4f2e1c', light:'#b98258', face:'#f5d6a8', face2:'#e6bd85', ink:'#2a2027', white:'#fff8e6',
  red:'#d9483b', redD:'#8d2a22', gold:'#f2c14e', cheek:'#ff9f8a' };
const GY = 244, CX = 150;
const LT = 30, LS = 28, UA = 26, FA = 24, TL = 48;
const FOOT_Y = GY - 7, STAND_Y = FOOT_Y - 50;
const TB = GY - 62, BY = 62;                               // 나무 가지 높이, 매달리는 가지 높이
const sh = (hip, th) => [hip[0] + TL * sin(th), hip[1] - TL * cos(th)];
const bp = (o, th, dx, dy) => [o[0] + cos(th) * dx - sin(th) * dy, o[1] + sin(th) * dx + cos(th) * dy];   // 몸 기준 좌표 → 화면 좌표
const lerp = (a, b, t) => a + (b - a) * t, lerp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
const smooth = t => t * t * (3 - 2 * t);

function ik(A, B, l1, l2, bend) {
  let dx = B[0] - A[0], dy = B[1] - A[1];
  let d = Math.hypot(dx, dy) || 1e-3;
  const reach = l1 + l2 - 0.01;
  if (d > reach) { B = [A[0] + dx / d * reach, A[1] + dy / d * reach]; d = reach; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / d, uy = dy / d;
  return [A[0] + ux * a + uy * h * bend, A[1] + uy * a - ux * h * bend, B[0], B[1]];
}
const SW = 11, HW = 8;   // 정면: 어깨/엉덩이 반폭 (near = 몸 기준 오른쪽, far = 왼쪽)
function ikOut(A, B, l1, l2, pr, sd) {   // 관절이 몸 바깥쪽으로 꺾이는 쪽을 고른다
  const r1 = ik(A, B, l1, l2, 1), r2 = ik(A, B, l1, l2, -1);
  const mx = (A[0] + r1[2]) / 2, my = (A[1] + r1[3]) / 2;
  return ((r1[0] - mx) * pr[0] + (r1[1] - my) * pr[1]) * sd >= 0 ? r1 : r2;
}
function build(o) {
  const hip = o.hip, th = o.th, s = sh(hip, th), pr = [cos(th), sin(th)];
  const at = (c, w) => [c[0] + pr[0] * w, c[1] + pr[1] * w];
  const nl = ikOut(at(hip, HW), o.nf, LT, LS, pr, 1), fl = ikOut(at(hip, -HW), o.ff, LT, LS, pr, -1);
  const na = ikOut(at(s, SW), o.nh || [s[0] + o.nhr[0], s[1] + o.nhr[1]], UA, FA, pr, 1);
  const fa = ikOut(at(s, -SW), o.fh || [s[0] + o.fhr[0], s[1] + o.fhr[1]], UA, FA, pr, -1);
  return { hx:hip[0], hy:hip[1], sx:s[0], sy:s[1], th, ha:o.ha || 0, hv:o.hv ?? 1, tw:o.tw || 0, mo:o.mo || 0,
    nkx:nl[0], nky:nl[1], nax:nl[2], nay:nl[3], fkx:fl[0], fky:fl[1], fax:fl[2], fay:fl[3],
    nex:na[0], ney:na[1], nhx:na[2], nhy:na[3], fex:fa[0], fey:fa[1], fhx:fa[2], fhy:fa[3] };
}

// 포즈: ph = 묘기 진행도(0~1)
const POSES = {
  idle(time) {
    const b = sin(time * 3);
    return build({ hip:[CX, STAND_Y + b * .4], th:.04, nf:[CX + 10, FOOT_Y], ff:[CX - 10, FOOT_Y], nhr:[14, 40 + b], fhr:[-14, 40 + b], tw:sin(time * 2) * .6 });
  },
  sway(ph) {
    const w = 2 * PI * ph * 2, d = sin(w), a = Math.max(0, d), b = Math.max(0, -d);
    return build({ hip:[CX + 10 * d, STAND_Y + 3 * Math.abs(d)], th:.14 * d, ha:.15 * d, nf:[CX + 12 + 6 * d, FOOT_Y - 7 * a], ff:[CX - 8 + 6 * d, FOOT_Y - 7 * b],
      nhr:[20 + 6 * d, -34 + 10 * sin(w + 1)], fhr:[-14, -32 - 12 * sin(w)], tw:d, mo:1 });
  },
  tree(ph) {
    const w = 2 * PI * ph * 2, d = sin(w), a = Math.max(0, d), b = Math.max(0, -d), fy = TB - 4;
    return build({ hip:[CX + 8 * d, fy - 50 - 3 * Math.abs(d)], th:.1 * d, ha:.12 * d, nf:[CX + 12, fy - 8 * a], ff:[CX - 8, fy - 8 * b],
      nhr:[22 * cos(w) + 6, -32 - 14 * sin(w)], fhr:[-20 * cos(w) - 4, -32 + 14 * sin(w)], tw:d, mo:1 });
  },
  hang(ph) {
    const a = .45 * sin(2 * PI * ph * 1.5), P = [CX, BY + 4];
    const hip = [P[0] + 52 * sin(a), P[1] + 52 * cos(a)];
    return build({ hip, th:PI - a, ha:.3 * a, hv:-1, nf:[P[0] - 6, P[1]], ff:[P[0] + 6, P[1]],
      nhr:[12 * sin(2 * a) - 8, 46], fhr:[12 * sin(2 * a) + 8, 46], tw:a * 2, mo:1 });
  },
  hand(ph) {
    const w = 2 * PI * ph * 2, t = .12 * sin(w), th = PI + t;
    const s = [CX + 3, GY - 6 - 46 + 3 * sin(w * 2)], hip = [s[0] - TL * sin(th), s[1] + TL * cos(th)];
    return build({ hip, th, hv:-1, nh:[CX - 8, GY - 6], fh:[CX + 14, GY - 6],
      nf:[hip[0] - 10 - 12 * sin(w), hip[1] - 52], ff:[hip[0] + 10 + 12 * sin(w), hip[1] - 52], mo:1, tw:sin(w) });
  },
  ball(ph) {
    const bx = CX + 22 * sin(2 * PI * ph), fy = GY - 55, w = 2 * PI * ph * 3;
    return build({ hip:[bx, fy - 50], th:.05 * cos(w), nf:[bx + 9, fy], ff:[bx - 9, fy],
      nhr:[26 + 8 * sin(w), -10 + 16 * sin(w + 1)], fhr:[-22 - 8 * sin(w), -10 - 16 * sin(w + 1)], tw:sin(w), mo:1 });
  },
  cycle(ph) {
    const wx = CX + 34 * sin(2 * PI * ph), WY = GY - 18, c = (wx - CX) / 18, w = 2 * PI * ph * 3;
    return build({ hip:[wx, WY - 42], th:.1, nf:[wx + 10 * cos(c), WY + 10 * sin(c)], ff:[wx - 10 * cos(c), WY - 10 * sin(c)],
      nhr:[34, -4 + 6 * sin(w)], fhr:[-28, -8 - 6 * sin(w)], tw:sin(w), mo:1 });
  },
  hula(ph) {
    const w = 2 * PI * ph * 3;
    return build({ hip:[CX + 8 * cos(w), STAND_Y + 2 * sin(2 * w)], th:.04, nf:[CX + 12, FOOT_Y], ff:[CX - 8, FOOT_Y],
      nhr:[10 + 6 * sin(w), -52], fhr:[-4, -54 + 6 * cos(w)], tw:cos(w), mo:1 });
  },
  juggle(ph) {
    const w = 2 * PI * ph * 2;
    return build({ hip:[CX, STAND_Y + 2 * Math.abs(sin(w))], th:.04, nf:[CX + 10, FOOT_Y], ff:[CX - 10, FOOT_Y],
      nhr:[30, 22 + 8 * sin(w)], fhr:[-30, 22 - 8 * sin(w)], ha:.1 * sin(w), tw:sin(w), mo:1 });
  },
  swing(ph) {
    const a = .55 * sin(2 * PI * ph), R = 90, Bx = CX + R * sin(a), By = -10 + R * cos(a);
    const s = [Bx + 44 * sin(a), By + 44 * cos(a)], hip = [s[0] + TL * sin(a), s[1] + TL * cos(a)], la = 1.4 * a;
    return build({ hip, th:-a, ha:-a * .5, nh:[Bx + 9, By], fh:[Bx - 9, By],
      nf:[hip[0] + 52 * sin(la) + 6, hip[1] + 52 * cos(la)], ff:[hip[0] + 52 * sin(la) - 6, hip[1] + 52 * cos(la)], tw:a * 2, mo:1 });
  },
  fire(ph) {
    const u = ph, hx = CX - 62 + 124 * u, air = sin(PI * clamp((u - .08) / .84, 0, 1)), hy = STAND_Y - 47 * air;
    const th = 2 * PI * smooth(clamp((u - .15) / .7, 0, 1)), hip = [hx, hy], s = sh(hip, th), tk = clamp(air * 1.6, 0, 1);
    return build({ hip, th, ha:th, nf:lerp2([hx + 10, FOOT_Y], bp(hip, th, 10, 22), tk), ff:lerp2([hx - 10, FOOT_Y], bp(hip, th, -8, 22), tk),
      nh:lerp2([s[0] + 14, s[1] + 40], bp(s, th, 16, 14), tk), fh:lerp2([s[0] - 6, s[1] + 42], bp(s, th, 6, 16), tk), tw:1, mo:1 });
  },
};

// 묘기 소품 (back = 원숭이 뒤, front = 앞)
const R = (x, y, w, h, f, st) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${st ? ` stroke="${st}" stroke-width="2"` : ''}/>`;
const CI = (x, y, r, f, st) => `<circle cx="${x.toFixed ? x.toFixed(1) : x}" cy="${y.toFixed ? y.toFixed(1) : y}" r="${r}" fill="${f}"${st ? ` stroke="${st}" stroke-width="2"` : ''}/>`;
const LN = (x1, y1, x2, y2, w, c) => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
function banana(x, y, r) { return `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(0)}) scale(1.5)" d="M-10,-5 Q0,12 10,-5 Q0,4 -10,-5Z" fill="#ffd84a" stroke="#8a6a1a" stroke-width="2" stroke-linejoin="round"/>`; }
const PROPS = {
  tree: { back() {
    return R(232, 24, 26, GY - 24, '#7a4a2b', C.ink) + CI(236, 36, 34, '#3fae6a', C.ink) + CI(262, 52, 26, '#4cc07a', C.ink) + CI(210, 52, 24, '#3fae6a', C.ink)
      + `<path d="M232 ${TB + 5} L70 ${TB + 5}" stroke="${C.ink}" stroke-width="15" stroke-linecap="round"/><path d="M232 ${TB + 5} L70 ${TB + 5}" stroke="#7a4a2b" stroke-width="11" stroke-linecap="round"/>`
      + CI(76, TB - 2, 10, '#4cc07a', C.ink) + CI(90, TB - 6, 8, '#3fae6a', C.ink); } },
  hang: { back() {
    return `<path d="M20 ${BY} L280 ${BY}" stroke="${C.ink}" stroke-width="15" stroke-linecap="round"/><path d="M20 ${BY} L280 ${BY}" stroke="#7a4a2b" stroke-width="11" stroke-linecap="round"/>`
      + CI(34, BY - 6, 18, '#3fae6a', C.ink) + CI(268, BY - 6, 18, '#3fae6a', C.ink) + CI(60, BY - 10, 10, '#4cc07a', C.ink) + CI(240, BY - 10, 10, '#4cc07a', C.ink); } },
  ball: { back(ph) {
    const bx = CX + 22 * sin(2 * PI * ph), cy = GY - 26, rot = -(bx - CX) / 26 * 57.3 * 1.2;
    return `<clipPath id="bc"><circle cx="${bx.toFixed(1)}" cy="${cy}" r="26"/></clipPath>` + CI(bx, cy, 26, '#e8504a')
      + `<g clip-path="url(#bc)"><g transform="rotate(${rot.toFixed(0)} ${bx.toFixed(1)} ${cy})">${R((bx - 30).toFixed(1), cy - 5, 60, 10, '#fff3c4')}${R((bx - 5).toFixed(1), cy - 30, 10, 60, '#fff3c4')}</g></g>`
      + CI(bx, cy, 26, 'none', C.ink).replace('stroke-width="2"', 'stroke-width="3"'); } },
  cycle: { back(ph) {
    const wx = CX + 34 * sin(2 * PI * ph), WY = GY - 18, c = (wx - CX) / 18;
    let o = '';
    for (let i = 0; i < 4; i++) { const a = c + i * PI / 4; o += LN(wx - 16 * cos(a), WY - 16 * sin(a), wx + 16 * cos(a), WY + 16 * sin(a), 2, '#9aa0b4'); }
    return CI(wx, WY, 18, 'none', '#3a3a46').replace('stroke-width="2"', 'stroke-width="5"') + o + CI(wx, WY, 4, C.gold, C.ink)
      + LN(wx, WY, wx, WY - 38, 5, C.ink) + R((wx - 12).toFixed(1), WY - 42, 24, 7, C.red, C.ink); } },
  hula: { back(ph, p) { return hoop(ph, p, true); }, front(ph, p) { return hoop(ph, p, false); } },
  juggle: { front(ph, p) {
    let o = '';
    const Rh = [p.nhx, p.nhy - 6], Lh = [p.fhx, p.fhy - 6];
    for (let i = 0; i < 3; i++) {
      const v = ph * 2 + i / 3, sg = Math.floor(v), u = v - sg, d = (sg + i) % 2 === 0;
      const f = d ? Rh : Lh, t = d ? Lh : Rh;
      o += banana(lerp(f[0], t[0], u), lerp(f[1], t[1], u) - 85 * 4 * u * (1 - u), u * 360 * (d ? 1 : -1));
    }
    return o; } },
  swing: { back(ph, p) {
    const a = .55 * sin(2 * PI * ph), Bx = CX + 90 * sin(a), By = -10 + 90 * cos(a);
    return LN(CX - 16, -10, Bx - 16, By, 3, '#c9b18a') + LN(CX + 16, -10, Bx + 16, By, 3, '#c9b18a') + LN(Bx - 22, By, Bx + 22, By, 6, C.ink) + LN(Bx - 22, By, Bx + 22, By, 3, '#c9972f'); } },
  fire: { back(ph) { return ring(true); }, front(ph) { return ring(false); } },
};
function hoop(ph, p, back) {
  const w = 2 * PI * ph * 3, cx = p.hx, cy = p.hy - 8, rx = 32 + 6 * cos(w), ry = 8, rot = 12 * sin(w);
  const d = back ? `M${(cx - rx).toFixed(1)} ${cy.toFixed(1)} A${rx.toFixed(1)} ${ry} 0 0 1 ${(cx + rx).toFixed(1)} ${cy.toFixed(1)}` : `M${(cx - rx).toFixed(1)} ${cy.toFixed(1)} A${rx.toFixed(1)} ${ry} 0 0 0 ${(cx + rx).toFixed(1)} ${cy.toFixed(1)}`;
  return `<g transform="rotate(${rot.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})"><path d="${d}" fill="none" stroke="${C.ink}" stroke-width="8"/><path d="${d}" fill="none" stroke="#ff5fa8" stroke-width="5"/><path d="${d}" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="6 8"/></g>`;
}
function ring(back) {
  const cx = CX, cy = GY - 104, rx = 16, ry = 46, t = performance.now() / 1000;
  const half = (left) => `M${cx} ${cy - ry} A${rx} ${ry} 0 0 ${left ? 0 : 1} ${cx} ${cy + ry}`;
  let o = `<path d="${half(!back)}" fill="none" stroke="${C.ink}" stroke-width="9"/><path d="${half(!back)}" fill="none" stroke="#ff8a1f" stroke-width="6"/>`;
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * 2 * PI, onRight = cos(a) > 0;
    if (onRight === back) continue;
    const x = cx + rx * cos(a), y = cy + ry * sin(a), l = 9 + 6 * sin(t * 14 + i * 2.1), ox = cos(a) * 3, oy = sin(a) * l;
    o += `<path d="M${(x - 4).toFixed(1)} ${y.toFixed(1)} Q${(x + ox).toFixed(1)} ${(y + oy * .6).toFixed(1)} ${(x + ox).toFixed(1)} ${(y + oy).toFixed(1)} Q${(x + 4).toFixed(1)} ${(y + oy * .3).toFixed(1)} ${(x + 4).toFixed(1)} ${y.toFixed(1)}Z" fill="${i % 2 ? '#ffd23f' : '#ff5a1f'}"/>`;
  }
  return o;
}

function drawMonkey(p, time, ph, id) {
  const lw = 11, T = 34, n = v => v.toFixed(1), pt = (x, y) => n(x) + ',' + n(y);
  const th = p.th, dir = [sin(th), -cos(th)], pr = [cos(th), sin(th)];
  const hip = [p.hx, p.hy], s = [p.sx, p.sy];
  const at = (c, w) => [c[0] + pr[0] * w, c[1] + pr[1] * w];
  let o = '';
  const poly = (pts, w, col, ol) => {
    const P = pts.map(q => pt(q[0], q[1])).join(' ');
    o += `<polyline points="${P}" fill="none" stroke="${ol}" stroke-width="${n(w + 4)}" stroke-linecap="round" stroke-linejoin="round"/>`
       + `<polyline points="${P}" fill="none" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  };
  const seg = (a, b, w, col, ol, cap = 'butt') => {
    if (ol) o += `<line x1="${n(a[0])}" y1="${n(a[1])}" x2="${n(b[0])}" y2="${n(b[1])}" stroke="${ol}" stroke-width="${n(w + 4)}" stroke-linecap="${cap}"/>`;
    o += `<line x1="${n(a[0])}" y1="${n(a[1])}" x2="${n(b[0])}" y2="${n(b[1])}" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="${cap}"/>`;
  };
  // 정면: 발끝은 바깥쪽(sd)으로 향함
  const leg = (A, kx, ky, ax, ay, sd) => { poly([A, [kx, ky], [ax, ay]], lw, C.base, C.shadeD); seg([ax - pr[0] * sd * 2, ay - pr[1] * sd * 2], [ax + pr[0] * sd * 9, ay + pr[1] * sd * 9], lw * .9, C.face2, C.shadeD, 'round'); };
  const hand = (x, y) => { o += `<circle cx="${n(x)}" cy="${n(y)}" r="6.5" fill="${C.face}" stroke="${C.shadeD}" stroke-width="2"/>`; };
  const arm = (A, ex, ey, hx, hy) => { poly([A, [ex, ey], [hx, hy]], lw * .85, C.base, C.shadeD); hand(hx, hy); };

  // 바닥 그림자 (나무/매달리기/그네는 공중이라 없음)
  if (id !== 'tree' && id !== 'hang' && id !== 'swing') {
    const air = id === 'fire' ? clamp((STAND_Y - p.hy) / 47, 0, 1) : 0;
    o += `<ellipse cx="${n(p.hx)}" cy="${GY + 2}" rx="${n(36 - 12 * air)}" ry="5" fill="#0003"/>`;
  }
  const pr0 = id && PROPS[id];
  if (pr0 && pr0.back) o += pr0.back(ph, p);

  // 꼬리 (몸 옆으로 삐져나와 위로 말림)
  const tb = at(hip, 8), tc = [tb[0] + pr[0] * 30 - dir[0] * 4, tb[1] + pr[1] * 30 - dir[1] * 4];
  const tip = [tb[0] + pr[0] * 30 + dir[0] * (16 + p.tw * 8), tb[1] + pr[1] * 30 + dir[1] * (16 + p.tw * 8)];
  o += `<path d="M${pt(tb[0], tb[1])} Q${pt(tc[0], tc[1])} ${pt(tip[0], tip[1])}" fill="none" stroke="${C.shadeD}" stroke-width="9" stroke-linecap="round"/>`
     + `<path d="M${pt(tb[0], tb[1])} Q${pt(tc[0], tc[1])} ${pt(tip[0], tip[1])}" fill="none" stroke="${C.base}" stroke-width="5" stroke-linecap="round"/>`;

  // 다리 → 몸통
  leg(at(hip, -HW), p.fkx, p.fky, p.fax, p.fay, -1);
  leg(at(hip, HW), p.nkx, p.nky, p.nax, p.nay, 1);
  const a = [hip[0] + dir[0] * T * .3, hip[1] + dir[1] * T * .3], b = [s[0] - dir[0] * T * .05, s[1] - dir[1] * T * .05];
  seg(a, b, T, C.base, C.shadeD, 'round');
  const bm = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], bl = Math.hypot(b[0] - a[0], b[1] - a[1]);
  o += `<ellipse transform="translate(${n(bm[0])} ${n(bm[1])}) rotate(${n(th * 180 / PI)})" rx="${n(T * .34)}" ry="${n(bl * .46 + T * .06)}" fill="${C.face2}"/>`;
  // 조끼: 가운데가 트인 빨간 조끼 두 쪽 + 금단추
  const v0 = [a[0] + (b[0] - a[0]) * .25, a[1] + (b[1] - a[1]) * .25];
  for (const sd of [-1, 1]) seg(at(v0, sd * T * .3), at(b, sd * T * .32), T * .36, C.red, C.redD, 'round');
  for (const f of [.45, .7]) o += CI(a[0] + (b[0] - a[0]) * f + pr[0] * T * .12, a[1] + (b[1] - a[1]) * f + pr[1] * T * .12, 2.4, C.gold);

  // 머리 (정면)
  const hc = [s[0] + dir[0] * 25, s[1] + dir[1] * 25];
  const blink = (time % 4) < .13;
  let hd = `<g transform="translate(${n(hc[0])} ${n(hc[1])}) rotate(${n(p.ha * 180 / PI)}) scale(1 ${n(p.hv)})">`;
  const rc = (x, y, w, h, f, st, rx = 0) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}"${st ? ` stroke="${st}" stroke-width="2"` : ''}/>`;
  for (const sd of [-1, 1]) hd += `<circle cx="${sd * 25}" cy="-1" r="10" fill="${C.base}" stroke="${C.shadeD}" stroke-width="2"/><circle cx="${sd * 25}" cy="-1" r="5.5" fill="${C.face}"/>`;
  hd += rc(-23, -22, 46, 42, C.base, C.shadeD, 10);
  hd += `<circle cx="-9" cy="-4" r="11" fill="${C.face}"/><circle cx="9" cy="-4" r="11" fill="${C.face}"/><ellipse cx="0" cy="8" rx="15" ry="11" fill="${C.face}"/>`;
  hd += `<ellipse cx="0" cy="9" rx="10" ry="7" fill="${C.face2}"/>`;
  for (const sd of [-1, 1]) {
    hd += blink ? rc(sd * 9 - 4, -5, 8, 2, C.ink) : rc(sd * 9 - 4.5, -10, 9, 10, C.white, C.shadeD, 2) + rc(sd * 9 - 2, -8, 5, 7, C.ink, null, 1);
    hd += rc(sd * 9 - 5, -14, 10, 3, C.shadeD, null, 1) + `<circle cx="${sd * 17}" cy="6" r="3.5" fill="${C.cheek}" opacity=".7"/>`;
  }
  hd += rc(-4, 5, 2.5, 3, C.ink) + rc(1.5, 5, 2.5, 3, C.ink);
  hd += p.mo > .5 ? `<path d="M-7 11 Q0 22 7 11Z" fill="#7a2e2e" stroke="${C.ink}" stroke-width="1.5" stroke-linejoin="round"/>` : `<path d="M-6 12 Q0 16 6 12" fill="none" stroke="${C.ink}" stroke-width="2" stroke-linecap="round"/>`;
  hd += rc(-14, -37, 28, 15, C.red, C.redD, 2) + rc(-14, -27, 28, 3, C.gold) + `<line x1="0" y1="-37" x2="-6" y2="-45" stroke="${C.gold}" stroke-width="3" stroke-linecap="round"/>${CI(-6, -46, 3, C.gold)}`;
  hd += '</g>';
  o += hd;

  // 팔 (머리 앞)
  arm(at(s, -SW), p.fex, p.fey, p.fhx, p.fhy);
  arm(at(s, SW), p.nex, p.ney, p.nhx, p.nhy);
  if (pr0 && pr0.front) o += pr0.front(ph, p);
  return o;
}

// ================= 무대 배경 (돈으로 구매) =================
const STARS = [[20,20],[48,60],[90,30],[130,70],[170,24],[210,56],[250,28],[280,80],[70,100],[240,110],[110,12],[190,92]];
function bgSvg(v) {
  let o = '';
  const g = GY + 3;
  if (v === 0) {                                   // 길거리 공연
    o += R(0, 0, 300, 260, '#bfe3f5') + R(0, 60, 64, 190, '#8d8f9e') + R(56, 96, 52, 154, '#a2a4b3') + R(196, 104, 50, 146, '#a2a4b3') + R(238, 52, 62, 198, '#8d8f9e');
    for (const [x, y] of [[10,76],[38,76],[10,108],[38,108],[10,140],[38,140],[64,112],[86,112],[64,144],[86,144],[206,120],[224,120],[206,152],[224,152],[246,70],[272,70],[246,102],[272,102],[246,134],[272,134]]) o += R(x, y, 14, 18, '#ffe08a');

const anim = { id:null, start:0, dur:1000, cur:null, drawn:0, last:performance.now(), queue:0 };
const curDance = () => DANCES.find(x => x.id === S.dance && S.totalEarned >= x.need) || DANCES[0];
function startDance() {
  const d = curDance();
  anim.id = d.id; anim.start = performance.now(); anim.dur = d.dur;
  $('exlabel').textContent = d.ic + ' ' + d.nm;
  showMsg(d.ic + ' ' + d.nm + '!');
}
let fxDrawn = 0;
function loop(now) {
  const dt = Math.min(.05, (now - anim.last) / 1000); anim.last = now;
  requestAnimationFrame(loop);
  if (document.hidden) return;
  let ph = 0, id = null;
  if (anim.id) {
    ph = (now - anim.start) / anim.dur;
    if (ph >= 1 && anim.queue > 0) { anim.queue--; startDance(); ph = 0; }   // 밀린 터치가 있으면 끊김 없이 다음 동작
    if (ph >= 1) { anim.id = null; anim.cur = null; } else id = anim.id;
  }
  const time = now / 1000;
  const tgt = id ? POSES[id](ph) : POSES.idle(time);
  if (!anim.cur) anim.cur = { ...tgt };
  const k = 1 - Math.exp(-dt * 22);
  let diff = 0;
  for (const key in tgt) { const d = tgt[key] - anim.cur[key]; diff += Math.abs(d); anim.cur[key] += d * k; }
  if (now - fxDrawn > 45) { fxDrawn = now; $('fx').innerHTML = fxSvg(S.venue, time); }
  if (id || diff > .3 || now - anim.drawn > 90) { anim.drawn = now; $('fg').innerHTML = drawMonkey(anim.cur, time, ph, id); }
}

  const n = S.crew[w.id] || 0, room = MAX_CREW - n;

function drawChart() {
  const svg = $('stChart'); if (!svg) return;
  const hist = mk().hist;
  const W = 340, H = 170, L = 64, Rm = 10, Tm = 10, B = 26, pw = W - L - Rm, ph = H - Tm - B;
  let o = `<text x="${L}" y="${H / 2}" font-size="11" fill="#999">시세를 모으는 중… (${stk().ivl / 1000}초마다 한 점)</text>`;
  if (hist.length > 1) {
    const vs = hist.map(h => h.v), t0 = hist[0].t, t1 = hist[hist.length - 1].t, ts = Math.max(1, t1 - t0);
    let mn = Math.min(...vs), mx = Math.max(...vs);
    const mid = (mn + mx) / 2, span = Math.max(mx - mn, mid * 2e-4), pad = span * .12;
    mn = mid - span / 2 - pad; mx = mid + span / 2 + pad;
    const X = t => L + (t - t0) / ts * pw, Y = v => Tm + (1 - (v - mn) / (mx - mn)) * ph;
    o = '';
    for (let i = 0; i <= 4; i++) {                       // y축: 가격 눈금 + 가로 보조선
      const v = mn + (mx - mn) * i / 4, y = Y(v);
      o += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W - Rm}" y2="${y.toFixed(1)}" stroke="#eadcc0" stroke-width="1"/>`
         + `<text x="${L - 5}" y="${(y + 3).toFixed(1)}" font-size="9.5" fill="#6b5a45" text-anchor="end">${Math.round(v).toLocaleString()}</text>`;
    }
    const fmtT = t => new Date(t).toLocaleTimeString('ko-KR', { hour12:false });
    for (let i = 0; i <= 2; i++) {                       // x축: 시각 눈금
      const t = t0 + ts * i / 2, x = X(t);
      o += `<line x1="${x.toFixed(1)}" y1="${Tm}" x2="${x.toFixed(1)}" y2="${Tm + ph}" stroke="#eadcc0" stroke-width="1"/>`
         + `<text x="${x.toFixed(1)}" y="${H - 9}" font-size="9.5" fill="#6b5a45" text-anchor="${i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}">${fmtT(t)}</text>`;
    }
    o += `<line x1="${L}" y1="${Tm}" x2="${L}" y2="${Tm + ph}" stroke="#6b5a45" stroke-width="1.5"/><line x1="${L}" y1="${Tm + ph}" x2="${W - Rm}" y2="${Tm + ph}" stroke="#6b5a45" stroke-width="1.5"/>`;
    const col = vs[vs.length - 1] >= vs[0] ? '#e8504a' : '#3a9bdc';
    o += `<polyline points="${hist.map(h => X(h.t).toFixed(1) + ',' + Y(h.v).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`
       + `<circle cx="${X(t1).toFixed(1)}" cy="${Y(vs[vs.length - 1]).toFixed(1)}" r="4" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
  }
  svg.innerHTML = o;
}
function trade(buy, pct) {
  const st = cs(), m = mk(), ic = stk().ic;
  if (!m.live || !(st.price > 0)) return;
  if (buy) {
    const spend = S.money * pct; if (spend < 1) return;
    const fee = spend * FEE;
    st.shares += (spend - fee) / st.price; st.basis += spend; S.money -= spend;
    toast(ic + ' 매수 ' + fmt(spend) + '원 (수수료 ' + fmt(fee) + '원)');
  } else {
    if (st.shares <= 0) return;
    const full = pct >= 1, sh = full ? st.shares : st.shares * pct, gross = sh * st.price, fee = gross * FEE, val = gross - fee, cost = full ? st.basis : st.basis * pct;
    st.realized += val - cost; S.money += val;
    st.shares = full ? 0 : st.shares - sh; st.basis = full ? 0 : st.basis - cost;
    toast(ic + ' 매도 ' + fmt(val) + '원 받음 (수수료 ' + fmt(fee) + '원) · 손익 ' + (val - cost >= 0 ? '+' : '-') + fmt(Math.abs(val - cost)) + '원');
  }
  dirty = true; save(); render(); renderStock(); refreshDyn();
}

    const d = newState();
    S = { ...d, nickname:loaded.nickname || '', money:num(loaded.money), totalEarned:num(loaded.totalEarned), taps:num(loaded.taps),
      dances:{ ...(loaded.dances || {}) }, crew:Object.fromEntries(Object.entries(loaded.crew || {}).map(([k, v]) => [k, Math.min(MAX_CREW, num(v))])), tipLv:num(loaded.tipLv), wageLv:num(loaded.wageLv),
      stocks:Object.fromEntries(STOCKS.map(x => {
        const o = loaded.stocks?.[x.id] || (x.id === 'banana' && !loaded.stocks ? { shares:loaded.shares, basis:loaded.basis, realized:loaded.realized, price:loaded.price, conv:!loaded.krw } : {});
        return [x.id, { shares:num(o.shares), basis:num(o.basis), realized:num(o.realized), price:num(o.price), conv:!!o.conv }];
      })),
      venues:Array.isArray(loaded.venues) && loaded.venues.length ? loaded.venues : [0],
      venue:num(loaded.venue), dance:loaded.dance || 'sway', savedAt:num(loaded.savedAt) };
    if (!S.venues.includes(S.venue)) S.venue = 0;
  }
  if (newId) { S.nickname = newId; dirty = true; }
  else if (!S.nickname && au?.currentUser?.displayName) { S.nickname = au.currentUser.displayName; dirty = true; }
  if (!S.nickname) { S.nickname = await askNick(); dirty = true; }
  // 자리를 비운 동안의 수입 (절반 효율, 최대 8시간)
  const away = S.savedAt ? (Date.now() - S.savedAt) / 1000 : 0, rate = crewRate();
  if (away > 60 && rate > 0) {
    const gain = rate * Math.min(away, 8 * 3600) * .5;
    earn(gain);
    toast('😴 자리를 비운 동안 ' + fmt(gain) + '원을 벌었어요');
  }
  knownUnlocked = unlocked().length;
  setVenue(S.venue);
  ready = true; await save();
  buildTabs(); buildPanel(); renderCrew(); render();
  for (const x of STOCKS) { tickStock(x.id); setInterval(() => tickStock(x.id), x.ivl); }
})();
</script>
</body>
</html>
