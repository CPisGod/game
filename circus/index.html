const GY = 244, CX = 150;
const LT = 30, LS = 28, UA = 26, FA = 24, TL = 48;
const FOOT_Y = GY - 7, STAND_Y = FOOT_Y - 50;
const TB = GY - 62, BY = 62;                               // 나무 가지 높이, 매달리는 가지 높이
const sh = (hip, th) => [hip[0] + TL * sin(th), hip[1] - TL * cos(th)];
const bp = (o, th, dx, dy) => [o[0] + cos(th) * dx - sin(th) * dy, o[1] + sin(th) * dx + cos(th) * dy];   // 몸 기준 좌표 → 화면 좌표
const lerp = (a, b, t) => a + (b - a) * t, lerp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
const smooth = t => t * t * (3 - 2 * t);

function ik(A, B, l1, l2, bend) {
  let dx = B[0] - A[0], dy = B[1] - A[1];
  let d = Math.hypot(dx, dy) || 1e-3;
  const reach = l1 + l2 - 0.01;
  if (d > reach) { B = [A[0] + dx / d * reach, A[1] + dy / d * reach]; d = reach; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / d, uy = dy / d;
  return [A[0] + ux * a + uy * h * bend, A[1] + uy * a - ux * h * bend, B[0], B[1]];
}
const SW = 11, HW = 8;   // 정면: 어깨/엉덩이 반폭 (near = 몸 기준 오른쪽, far = 왼쪽)
function ikOut(A, B, l1, l2, pr, sd) {   // 관절이 몸 바깥쪽으로 꺾이는 쪽을 고른다
  const r1 = ik(A, B, l1, l2, 1), r2 = ik(A, B, l1, l2, -1);
  const mx = (A[0] + r1[2]) / 2, my = (A[1] + r1[3]) / 2;
  return ((r1[0] - mx) * pr[0] + (r1[1] - my) * pr[1]) * sd >= 0 ? r1 : r2;
}
function build(o) {
  const hip = o.hip, th = o.th, s = sh(hip, th), pr = [cos(th), sin(th)];
  const at = (c, w) => [c[0] + pr[0] * w, c[1] + pr[1] * w];
  const nl = ikOut(at(hip, HW), o.nf, LT, LS, pr, 1), fl = ikOut(at(hip, -HW), o.ff, LT, LS, pr, -1);
  const na = ikOut(at(s, SW), o.nh || [s[0] + o.nhr[0], s[1] + o.nhr[1]], UA, FA, pr, 1);
  const fa = ikOut(at(s, -SW), o.fh || [s[0] + o.fhr[0], s[1] + o.fhr[1]], UA, FA, pr, -1);
  return { hx:hip[0], hy:hip[1], sx:s[0], sy:s[1], th, ha:o.ha || 0, hv:o.hv ?? 1, tw:o.tw || 0, mo:o.mo || 0,
    nkx:nl[0], nky:nl[1], nax:nl[2], nay:nl[3], fkx:fl[0], fky:fl[1], fax:fl[2], fay:fl[3],
    nex:na[0], ney:na[1], nhx:na[2], nhy:na[3], fex:fa[0], fey:fa[1], fhx:fa[2], fhy:fa[3] };
}

  sway(ph) {

      nhr:[26 + 6 * d, -50 + 5 * sin(w * 1.5)], fhr:[-34, 16 + 6 * sin(w)], tw:d, mo:1 });

function drawMonkey(p, time, ph, id) {

    o += `<polyline points="${P}" fill="none" stroke="${ol}" stroke-width="${n(w + 4)}" stroke-linecap="round" stroke-linejoin="round"/>`
       + `<polyline points="${P}" fill="none" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="round" stroke-linejoin="round"/>`;

    o += `<line x1="${n(a[0])}" y1="${n(a[1])}" x2="${n(b[0])}" y2="${n(b[1])}" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="${cap}"/>`;

     + `<path d="M${pt(tb[0], tb[1])} Q${pt(tc[0], tc[1])} ${pt(tip[0], tip[1])}" fill="none" stroke="${C.base}" stroke-width="5" stroke-linecap="round"/>`;

  hd += '</g>';
  o += hd;

  // 팔 (머리 앞)
  arm(at(s, -SW), p.fex, p.fey, p.fhx, p.fhy);
  arm(at(s, SW), p.nex, p.ney, p.nhx, p.nhy);
  if (pr0 && pr0.front) o += pr0.front(ph, p);
  return o;
}

  const n = S.crew[w.id] || 0, room = MAX_CREW - n;

const host = u => { try { return new URL(u).hostname.replace(/^(www|query\d|api|m)\./, ''); } catch { return u; } };
async function fetchText(u, unwrap) {
  try {
    const r = await fetch(u, { cache:'no-store', signal:AbortSignal.timeout(6000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const t = await r.text();
    delete ERR[host(u)];
    return unwrap ? JSON.parse(t).contents : t;
  } catch (e) { ERR[host(u)] = e.name === 'TimeoutError' ? '시간초과' : e.message === 'Failed to fetch' ? '차단/네트워크' : e.message; throw e; }
}

  if (!(v > 0)) try { v = +(await getJson('https://api.frankfurter.app/latest?from=USD&to=KRW')).rates.KRW; } catch {}
  if (!(v > 0)) throw new Error('환율 없음');

}
async function coinKrw(sym) {   // 업비트 → 빗썸 → 코인베이스 USD × 환율
  const srcs = [
    async () => +(await getJson('https://api.upbit.com/v1/ticker?markets=KRW-' + sym))[0].trade_price,
    async () => +(await getJson('https://api.bithumb.com/public/ticker/' + sym + '_KRW')).data.closing_price,
    async () => +(await getJson('https://api.coinbase.com/v2/prices/' + sym + '-USD/spot')).data.amount * await usdKrw(),
  ];
  for (const f of srcs) { try { const v = await f(); if (v > 0) return v; } catch {} }
  throw 0;
}

function renderStock() {
  const pr = $('stPrice'); if (!pr) return;
  const st = cs(), m = mk(), hist = m.hist;
  pr.textContent = st.price > 0 ? fmtP(st.price) + '원' : '시세 연결 중…';
  const base = hist[0]?.v || st.price, chg = base > 0 ? (st.price / base - 1) * 100 : 0;
  $('stChg').textContent = (chg >= 0 ? '▲ ' : '▼ ') + Math.abs(chg).toFixed(2) + '%';
  $('stChg').className = chg >= 0 ? 'up' : 'down';
  $('stLive').textContent = m.live ? (m.closed ? '🟡 장 마감 · 마지막 시세' : m.age > 20 ? '🟡 ' + Math.round(m.age) + '분 전 시세' : '🟢 실시간') + ' · ' + stk().src : '🔴 시세 연결 중… (거래 불가)';
  $('stErr').textContent = m.live || !m.err ? '' : '실패한 곳: ' + m.err;
  const val = st.shares * st.price, pl = val - st.basis, pct = st.basis > 0 ? pl / st.basis * 100 : 0;
  $('stHold').innerHTML = `보유 <b>${fmtSh(st.shares)}</b>주 · 평가액 <b>${fmt(val)}</b>원<br>`
    + `매수 원금(수수료 포함) ${fmt(st.basis)}원 · 평가손익 <b class="${pl >= 0 ? 'up' : 'down'}">${pl >= 0 ? '+' : '-'}${fmt(Math.abs(pl))}원 (${pl >= 0 ? '+' : ''}${pct.toFixed(2)}%)</b><br>`
    + `실현손익 <span class="${st.realized >= 0 ? 'up' : 'down'}">${st.realized >= 0 ? '+' : '-'}${fmt(Math.abs(st.realized))}원</span>`;
  drawChart();
  const bs = document.querySelectorAll('#panel .trade .buy'), ss = document.querySelectorAll('#panel .trade .sell');
  bs.forEach(b => b.disabled = !m.live || S.money < 1); ss.forEach(b => b.disabled = !m.live || st.shares <= 0);
}
function drawChart() {
  const svg = $('stChart'); if (!svg) return;
  const hist = mk().hist;
  const W = 340, H = 170, L = 64, Rm = 10, Tm = 10, B = 26, pw = W - L - Rm, ph = H - Tm - B;
  let o = `<text x="${L}" y="${H / 2}" font-size="11" fill="#999">시세를 모으는 중… (${stk().ivl / 1000}초마다 한 점)</text>`;
  if (hist.length > 1) {
    const vs = hist.map(h => h.v), t0 = hist[0].t, t1 = hist[hist.length - 1].t, ts = Math.max(1, t1 - t0);
    let mn = Math.min(...vs), mx = Math.max(...vs);
    const mid = (mn + mx) / 2, span = Math.max(mx - mn, mid * 2e-4), pad = span * .12;
    mn = mid - span / 2 - pad; mx = mid + span / 2 + pad;
    const X = t => L + (t - t0) / ts * pw, Y = v => Tm + (1 - (v - mn) / (mx - mn)) * ph;
    o = '';
    for (let i = 0; i <= 4; i++) {                       // y축: 가격 눈금 + 가로 보조선
      const v = mn + (mx - mn) * i / 4, y = Y(v);
      o += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W - Rm}" y2="${y.toFixed(1)}" stroke="#eadcc0" stroke-width="1"/>`
         + `<text x="${L - 5}" y="${(y + 3).toFixed(1)}" font-size="9.5" fill="#6b5a45" text-anchor="end">${fmtP(v)}</text>`;
    }
    const fmtT = t => new Date(t).toLocaleTimeString('ko-KR', { hour12:false });
    for (let i = 0; i <= 2; i++) {                       // x축: 시각 눈금
      const t = t0 + ts * i / 2, x = X(t);
      o += `<line x1="${x.toFixed(1)}" y1="${Tm}" x2="${x.toFixed(1)}" y2="${Tm + ph}" stroke="#eadcc0" stroke-width="1"/>`
         + `<text x="${x.toFixed(1)}" y="${H - 9}" font-size="9.5" fill="#6b5a45" text-anchor="${i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}">${fmtT(t)}</text>`;
    }
    o += `<line x1="${L}" y1="${Tm}" x2="${L}" y2="${Tm + ph}" stroke="#6b5a45" stroke-width="1.5"/><line x1="${L}" y1="${Tm + ph}" x2="${W - Rm}" y2="${Tm + ph}" stroke="#6b5a45" stroke-width="1.5"/>`;
    const col = vs[vs.length - 1] >= vs[0] ? '#e8504a' : '#3a9bdc';
    o += `<polyline points="${hist.map(h => X(h.t).toFixed(1) + ',' + Y(h.v).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`
       + `<circle cx="${X(t1).toFixed(1)}" cy="${Y(vs[vs.length - 1]).toFixed(1)}" r="4" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
  }
  svg.innerHTML = o;
}
function trade(buy, pct) {
  const st = cs(), m = mk(), ic = stk().ic;
  if (!m.live || !(st.price > 0)) return;
  if (buy) {
    const spend = S.money * pct; if (spend < 1) return;
    const fee = spend * FEE;
    st.shares += (spend - fee) / st.price; st.basis += spend; S.money -= spend;
    toast(ic + ' 매수 ' + fmt(spend) + '원 (수수료 ' + fmt(fee) + '원)');
  } else {
    if (st.shares <= 0) return;
    const full = pct >= 1, sh = full ? st.shares : st.shares * pct, gross = sh * st.price, fee = gross * FEE, val = gross - fee, cost = full ? st.basis : st.basis * pct;
    st.realized += val - cost; S.money += val;
    st.shares = full ? 0 : st.shares - sh; st.basis = full ? 0 : st.basis - cost;
    toast(ic + ' 매도 ' + fmt(val) + '원 받음 (수수료 ' + fmt(fee) + '원) · 손익 ' + (val - cost >= 0 ? '+' : '-') + fmt(Math.abs(val - cost)) + '원');
  }
  dirty = true; save(); render(); renderStock(); refreshDyn();
}


// ================= 환생 연출: 지난 회차 원숭이가 우주로 날아가고, 새 원숭이가 지켜봄 =================
function rebirthFx(oldRun) {
  const r = $('mk').getBoundingClientRect(), W = r.width, fg = $('fg');
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:9600;pointer-events:none;overflow:hidden;background:rgba(8,6,40,0);';
  let stars = '';
  for (let i = 0; i < 28; i++) stars += `<span style="position:absolute;left:${Math.random() * 100}%;top:${Math.random() * 100}%;font-size:${10 + Math.random() * 14}px;opacity:0">${Math.random() < .5 ? '✨' : '⭐'}</span>`;
  ov.innerHTML = stars + `<div class="rb-old" style="position:absolute;left:${r.left}px;top:${r.top}px;width:${W}px;transform-origin:50% 60%">
      <svg viewBox="0 0 300 260" style="width:100%;display:block;overflow:visible">${fg.innerHTML}</svg>
      <div class="rb-fire" style="position:absolute;left:0;right:0;top:78%;text-align:center;font-size:${W / 5}px;opacity:0">🔥</div></div>
    <div class="rb-cap" style="position:absolute;left:0;right:0;top:${r.bottom + 14}px;text-align:center;color:#fff;font-weight:900;font-size:20px;text-shadow:0 2px 6px #000;opacity:0">🚀 ${oldRun}회차 원숭이, 우주로 출발!</div>`;
  document.body.appendChild(ov);
  const old = ov.querySelector('.rb-old'), fire = ov.querySelector('.rb-fire'), cap = ov.querySelector('.rb-cap');
  const up = -(r.top + r.height + 120), T = 3600;
  ov.animate([{ background:'rgba(8,6,40,0)' }, { background:'rgba(8,6,40,.6)', offset:.15 }, { background:'rgba(8,6,40,.6)', offset:.8 }, { background:'rgba(8,6,40,0)' }], { duration:T });
  ov.querySelectorAll('span').forEach(e => e.animate([{ opacity:0 }, { opacity:1 }, { opacity:0 }], { duration:900 + Math.random() * 1200, delay:Math.random() * 2000, iterations:2 }));
  old.animate([
    { transform:'translate(0,0) rotate(0) scale(1)' },
    { transform:'translate(-4px,0) rotate(-4deg) scale(1)', offset:.05 }, { transform:'translate(4px,0) rotate(4deg) scale(1)', offset:.1 },
    { transform:'translate(-4px,0) rotate(-4deg) scale(1)', offset:.15 }, { transform:'translate(0,0) rotate(0) scale(1)', offset:.2 },
    { transform:`translate(0,${up}px) rotate(720deg) scale(.12)` },
  ], { duration:T, easing:'cubic-bezier(.5,0,.9,.6)', fill:'forwards' });
  fire.animate([{ opacity:0 }, { opacity:0, offset:.15 }, { opacity:1, offset:.22 }, { opacity:1 }], { duration:T, fill:'forwards' });
  cap.animate([{ opacity:0 }, { opacity:1, offset:.1 }, { opacity:1, offset:.7 }, { opacity:0 }], { duration:T });
  fg.style.opacity = 0;   // 새 원숭이는 출발을 본 뒤에 등장
  setTimeout(() => {
    fg.style.transition = 'opacity .5s'; fg.style.opacity = 1;
    toast('👋 잘 가, ' + oldRun + '회차의 나! ' + (oldRun + 1) + '회차 시작!');
  }, 1400);
  setTimeout(() => { ov.remove(); fg.style.transition = ''; fg.style.opacity = ''; }, T);
}

// ================= 시간 흐름 =================
let lastFrame = performance.now(), lastPanel = 0;
setInterval(() => {
  const now = performance.now(), dt = (now - lastFrame) / 1000; lastFrame = now;
  if (!ready || !S.nickname) return;
  const g = crewRate() * dt;
  if (g > 0) { earn(g); checkUnlock(); }
  render();
  if (now - lastPanel > 250) { lastPanel = now; refreshDyn(); }
}, 100);

// ================= 저장 =================
let saving = false;   // 서버 저장은 한 번에 하나만 (겹치면 내 저장끼리 충돌해서 '다른 기기' 오탐이 생김)
async function save() {
  if (!ready) return;
  S.savedAt = Date.now();
  saveLocal();
  if (!online || !dirty) return;
  if (stale || saving) return;   // saving 중이면 dirty가 남아 있어 다음 저장(5초마다)에서 올라감
  saving = true; dirty = false;
  const ts = S.savedAt;
  try {
    // 다른 기기가 더 진행된 기록을 올려뒀다면 덮어쓰지 않는다 (오래된 기기가 기록을 날리는 것 방지)
    const ref = fb.doc(db, 'circus', uid);
    const res = await fb.runTransaction(db, async tx => {
      const snap = await tx.get(ref), sv = snap.exists() ? snap.data() : null;
      if (sv && num(sv.savedAt) !== syncedAt) return 'stale';
      tx.set(ref, {
        nickname:S.nickname, money:S.money, totalEarned:lifeEarned(), runEarned:S.totalEarned, run:S.run, history:S.history, netWorth:netWorth(), taps:S.taps, dances:S.dances, crew:S.crew, estate:S.estate, skins:S.skins, skin:S.skin,
        tipLv:S.tipLv, wageLv:S.wageLv, stocks:S.stocks,
        venues:S.venues, venue:S.venue, dance:S.dance, savedAt:ts, updatedAt:fb.serverTimestamp()
      });
      return 'ok';
    });
    if (res === 'stale') {
      stale = true;
      alert('다른 기기에서 더 진행된 기록이 있어요. 최신 기록을 불러올게요.');
      location.reload();
    } else syncedAt = ts;
  } catch (e) { console.warn('저장 실패', e); dirty = true; }
  finally { saving = false; }
}
setInterval(save, 5000);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ================= 스코어보드 =================
let rankTab = 'earn';
function setRankTab(t) { rankTab = t; $('tabEarn').classList.toggle('on', t === 'earn'); $('tabNet').classList.toggle('on', t === 'net'); openRank(); }
$('tabEarn').onclick = () => setRankTab('earn'); $('tabNet').onclick = () => setRankTab('net');
$('rankBtn').onclick = () => openRank();
$('rankClose').onclick = () => $('rankModal').classList.remove('show');
async function openRank() {
  $('rankModal').classList.add('show');
  const tbl = $('rankTable'), note = $('rankNote'), key = rankTab === 'earn' ? 'totalEarned' : 'netWorth';
  note.textContent = ''; tbl.innerHTML = '<tr><td>불러오는 중...</td></tr>';
  let rows = [];
  if (online) {
    try {
      const snap = await fb.getDocs(fb.query(fb.collection(db, 'circus'), fb.orderBy(key, 'desc'), fb.limit(30)));
      rows = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    } catch (e) { tbl.innerHTML = '<tr><td>스코어보드를 불러오지 못했어요.</td></tr>'; console.warn(e); return; }
  } else {
    rows = [{ id:uid, nickname:S.nickname, run:S.run, totalEarned:lifeEarned(), netWorth:netWorth() }];
    note.textContent = 'Firebase가 연결되지 않아 내 기록만 보여요.';
  }
  if (!rows.length) { tbl.innerHTML = '<tr><td>아직 기록이 없어요.</td></tr>'; return; }
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  tbl.innerHTML = `<tr><th>#</th><th>닉네임</th><th>${rankTab === 'earn' ? '누적 수입' : '순자산'}</th></tr>` + rows.map((r, i) =>
    `<tr class="${r.id === uid ? 'me' : ''}"><td>${i + 1}</td><td>${esc(r.nickname)}${r.run > 1 ? ' <small>(' + num(r.run) + '회차)</small>' : ''}</td><td>${fmt(r[key] || 0)}원</td></tr>`).join('');
}

// ================= 시작 / 로그인 =================
let au = null, fba = null, newId = '';
async function initFirebase() {
  try {
    const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
    const [app, auth, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const a = app.initializeApp(firebaseConfig);
    au = auth.getAuth(a); fba = auth; db = fs.getFirestore(a); fb = fs;
    await au.authStateReady();
    online = true;
  } catch (e) { console.warn('Firebase 사용 불가, 로컬 모드로 실행', e); online = false; }
}
// 아이디 → 이메일 형태 (부타 다이어트와 같은 계정 체계)
const idEmail = id => 'u' + [...new TextEncoder().encode(id.toLowerCase())].map(b => b.toString(16).padStart(2, '0')).join('') + '@butadiet.game';
const AUTH_ERR = {
  'auth/email-already-in-use': '이미 사용 중인 아이디예요',
  'auth/invalid-credential': '아이디 또는 비밀번호가 맞지 않아요',
  'auth/wrong-password': '아이디 또는 비밀번호가 맞지 않아요',
  'auth/user-not-found': '아이디 또는 비밀번호가 맞지 않아요',
  'auth/weak-password': '비밀번호는 6자 이상이어야 해요',
  'auth/too-many-requests': '시도가 너무 많아요. 잠시 후 다시 해주세요',
  'auth/network-request-failed': '네트워크 오류예요. 다시 시도해주세요',
  'auth/operation-not-allowed': 'Firebase 콘솔에서 이메일/비밀번호 로그인을 켜야 해요',
};
function loginPrompt() {
  $('loginModal').classList.add('show');
  return new Promise(res => {
    const busy = on => { $('loginBtn').disabled = $('signupBtn').disabled = on; };
    const read = () => {
      const id = $('loginId').value.trim(), pw = $('loginPw').value;
      if (!id) { $('loginErr').textContent = '아이디를 입력해주세요'; return null; }
      if (new TextEncoder().encode(id).length > 30) { $('loginErr').textContent = '아이디가 너무 길어요'; return null; }
      if (pw.length < 6) { $('loginErr').textContent = '비밀번호는 6자 이상이어야 해요'; return null; }
      $('loginErr').textContent = ''; return { id, pw };
    };
    const run = fn => async () => {
      const c = read(); if (!c) return;
      busy(true);
      try { await fn(c); $('loginModal').classList.remove('show'); res(); }
      catch (e) { $('loginErr').textContent = AUTH_ERR[e.code] || ('오류: ' + (e.code || e.message)); busy(false); }
    };
    $('loginBtn').onclick = run(c => fba.signInWithEmailAndPassword(au, idEmail(c.id), c.pw));
    $('signupBtn').onclick = run(async c => {
      await fba.createUserWithEmailAndPassword(au, idEmail(c.id), c.pw);
      await fba.updateProfile(au.currentUser, { displayName:c.id }).catch(() => {});
      newId = c.id;
    });
    $('loginPw').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };
  });
}
$('logoutBtn').onclick = async e => { e.preventDefault(); await save(); await fba.signOut(au); location.reload(); };
function askNick() {
  return new Promise(res => {
    $('nickModal').classList.add('show');
    const ok = () => { const v = $('nickInput').value.trim().slice(0, 10); if (!v) return; $('nickModal').classList.remove('show'); res(v); };
    $('nickOk').onclick = ok;
    $('nickInput').onkeydown = e => { if (e.key === 'Enter') ok(); };
  });
}
const num = (v, d = 0) => Number.isFinite(+v) ? +v : d;

(async () => {
  buildTabs(); buildPanel(); setVenue(0); render(); requestAnimationFrame(loop);
  await initFirebase();
  let loaded = null;
  if (online) {
    if (!au.currentUser || au.currentUser.isAnonymous) { if (au.currentUser) await fba.signOut(au); await loginPrompt(); }
    uid = au.currentUser.uid;
    $('logoutBtn').style.display = 'inline';
    try { const d = await fb.getDoc(fb.doc(db, 'circus', uid)); if (d.exists()) loaded = d.data(); else loaded = null; }
    catch (e) { console.warn(e); online = false; loaded = readKey(lsKey()); }   // 읽기 실패 시 서버 기록을 덮어쓰지 않도록 이번엔 로컬로만
  } else loaded = readKey(lsKey());
  if (online && loaded) syncedAt = num(loaded.savedAt);
  if (loaded) {
    const d = newState();
    S = { ...d, nickname:loaded.nickname || '', money:num(loaded.money), totalEarned:num(loaded.runEarned ?? loaded.totalEarned),
      run:Math.max(1, Math.floor(num(loaded.run, 1))), history:(Array.isArray(loaded.history) ? loaded.history : []).map(h => ({ run:num(h.run), earned:num(h.earned), at:num(h.at) })), taps:num(loaded.taps),
      dances:{ ...(loaded.dances || {}) }, crew:Object.fromEntries(Object.entries(loaded.crew || {}).map(([k, v]) => [k, Math.min(MAX_CREW, num(v))])), estate:Object.fromEntries(ESTATES.map(e => [e.id, clamp(num(loaded.estate?.[e.id]), 0, MAX_ESTATE)])), tipLv:num(loaded.tipLv), wageLv:num(loaded.wageLv),
      stocks:Object.fromEntries(STOCKS.map(x => {
        const o = loaded.stocks?.[x.id] || (x.id === 'banana' && !loaded.stocks ? { shares:loaded.shares, basis:loaded.basis, realized:loaded.realized, price:loaded.price, conv:!loaded.krw } : {});
        return [x.id, { shares:num(o.shares), basis:num(o.basis), realized:num(o.realized), price:num(o.price), conv:!!o.conv }];
      })),
      venues:Array.isArray(loaded.venues) && loaded.venues.length ? loaded.venues : [0],
      venue:num(loaded.venue), dance:loaded.dance || 'sway', savedAt:num(loaded.savedAt) };
    S.skins = ['basic', ...(Array.isArray(loaded.skins) ? loaded.skins.filter(k => k !== 'basic' && SKINS.some(x => x.id === k)) : [])];
    S.skin = S.skins.includes(loaded.skin) ? loaded.skin : 'basic';
    for (const k of ['grape', 'cucumber']) {   // 예전 종목(테슬라·SK하이닉스) 보유분은 마지막 평가액만큼 돈으로 돌려줌
      const o = loaded.stocks?.[k], v = o && !o.conv ? num(o.shares) * num(o.price) : 0;
      if (v > 0) { S.money += v; dirty = true; setTimeout(() => toast('📈 종목이 바뀌어서 예전 주식 ' + fmt(v) + '원어치를 현금으로 돌려받았어요'), 1500); }
    }
    if (!S.venues.includes(S.venue)) S.venue = 0;
  }
  if (newId) { S.nickname = newId; dirty = true; }
  else if (!S.nickname && au?.currentUser?.displayName) { S.nickname = au.currentUser.displayName; dirty = true; }
  if (!S.nickname) { S.nickname = await askNick(); dirty = true; }
  // 자리를 비운 동안의 수입 (절반 효율, 최대 8시간)
  const away = S.savedAt ? (Date.now() - S.savedAt) / 1000 : 0, rate = crewRate();
  if (away > 60 && rate > 0) {
    const gain = rate * Math.min(away, 8 * 3600) * .5;
    earn(gain);
    toast('😴 자리를 비운 동안 ' + fmt(gain) + '원을 벌었어요');
  }
  knownUnlocked = unlocked().length;
  setVenue(S.venue);
  ready = true; await save();
  buildTabs(); buildPanel(); renderCrew(); render();
  for (const x of STOCKS) { tickStock(x.id); setInterval(() => tickStock(x.id), x.ivl); }
})();
