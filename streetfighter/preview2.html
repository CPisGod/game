<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>v2 신규 캐릭터 미리보기</title>
<style>body{background:#22203a;color:#fff;font-family:sans-serif;margin:16px}
canvas{image-rendering:pixelated;display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="sprites.js"></script>
<script>
const S=3, cw=SF.W*S, ch=SF.H*S, padL=90, cols=6, blockH=ch*2+34;
const c=document.getElementById('c'); c.width=padL+cw*cols; c.height=SF.NEWCHARS.length*blockH+170;
const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
x.fillStyle='#2e2b50'; x.fillRect(0,0,c.width,c.height);
x.font='13px sans-serif';
SF.NEWCHARS.forEach((chr,r)=>{
  const y0=r*blockH;
  x.fillStyle='#ffd866'; x.font='bold 16px sans-serif'; x.fillText(chr.name,10,y0+ch);
  x.font='12px sans-serif';
  chr.poses.forEach((p,i)=>{
    const cx=padL+(i%cols)*cw, cy=y0+18+Math.floor(i/cols)*(ch+14);
    x.drawImage(SF.canvas(chr,p),cx,cy,cw,ch);
    x.fillStyle='#9fd0ff'; x.fillText(p,cx+4,cy+2);
  });
  x.fillStyle='#3a3763'; x.fillRect(0,y0+blockH-6,c.width,2);
});
let fx=padL, fy=SF.NEWCHARS.length*blockH+30; x.fillStyle='#ffd866'; x.font='bold 16px sans-serif'; x.fillText('이펙트/투사체',10,fy+30);
x.font='12px sans-serif';
SF.FX.forEach(n=>{ const im=SF.effect(n); x.drawImage(im,fx,fy+20,im.width*4,im.height*4); x.fillStyle='#9fd0ff'; x.fillText(n,fx,fy+14); fx+=Math.max(im.width*4+16,70); });
</script></body></html>
