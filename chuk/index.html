<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>척추의 뼈해장국 가게</title>
<style>
  :root { --bg:#241713; --wood:#5a3a26; --wood2:#7a5236; --paper:#f6ecd6; --red:#cc4029; --gold:#ffd23f; --ink:#25211e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:12px;
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:var(--paper);
    background: radial-gradient(ellipse at 50% 0%, #4a2e20, var(--bg) 70%); user-select:none; }
  #game { width:min(560px,100%); background:var(--wood); border:4px solid #2e1b10; border-radius:16px; overflow:hidden;
    box-shadow:0 10px 40px #000a; position:relative; }
  #hud { display:flex; justify-content:space-between; padding:10px 14px; background:#2e1b10; font-weight:700; font-size:16px; }
  #hud b { color:var(--gold); }
  #shop { position:relative; height:240px; background:linear-gradient(#8a5a3a 0 55%, #3b2418 55%); display:flex; align-items:flex-end; justify-content:flex-start; padding-left:28px; }
  #shop::before { content:"뼈 해 장 국"; position:absolute; top:10px; left:50%; transform:translateX(-50%); padding:4px 22px;
    background:var(--red); color:#fff; font-weight:900; letter-spacing:8px; border:3px solid #fff3; border-radius:6px; font-size:18px; }
  #chuk { width:150px; height:170px; margin-bottom:-6px; }
  #chuk.bounce { animation: bounce .4s; }
  @keyframes bounce { 40% { transform:translateY(-14px); } }
  #bubble { position:absolute; right:12px; bottom:auto; top:62px; width:52%; background:#fff; color:var(--ink); padding:8px 12px; border-radius:12px;
    font-size:14px; font-weight:700; min-height:38px; display:flex; align-items:center; z-index:2; border:2px solid var(--ink); }
    #panel { padding:14px; min-height:290px; }
  h2 { margin:0 0 10px; font-size:18px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .ing { background:var(--wood2); border:3px solid #2e1b10; border-radius:12px; color:var(--paper); padding:8px 4px; cursor:pointer;
    font:700 14px inherit; font-family:inherit; }
  .ing span { display:block; font-size:30px; }
  .ing.on { background:var(--red); border-color:var(--gold); transform:translateY(-2px); }
  .btn { display:block; width:100%; margin-top:12px; padding:12px; border:0; border-radius:12px; background:var(--gold); color:var(--ink);
    font:900 18px inherit; font-family:inherit; cursor:pointer; }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn:active:not(:disabled) { transform:translateY(2px); }
  #cust { display:flex; align-items:center; gap:10px; background:#2e1b10; border-radius:12px; padding:8px 10px; margin-bottom:10px; }
  #cust .face { font-size:34px; }
  #cust .ord { flex:1; font-size:14px; font-weight:700; }
  #pat { height:8px; background:#1a0f08; border-radius:4px; margin-top:6px; overflow:hidden; }
  #patfill { height:100%; width:100%; background:#7fd36a; }
  .steps { font-size:12px; opacity:.85; margin-bottom:8px; text-align:center; }
  .steps b { color:var(--gold); }
  #pot { font-size:64px; text-align:center; }
  #gauge { position:relative; height:34px; margin:10px 0; background:#2e1b10; border-radius:17px; overflow:hidden; border:3px solid #1a0f08; }
  #zone { position:absolute; top:0; bottom:0; left:60%; width:20%; background:#3fa045aa; border-left:2px solid #7fd36a; border-right:2px solid #7fd36a; }
  #needle { position:absolute; top:0; bottom:0; width:6px; background:#fff; box-shadow:0 0 8px #fff; left:0; }
  .hint { font-size:13px; opacity:.8; text-align:center; }
  #result { text-align:center; }
  #stars { font-size:34px; letter-spacing:4px; }
  #money { font-size:28px; font-weight:900; color:var(--gold); margin:4px 0; }
  .overlay { position:absolute; inset:0; background:#000d; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; z-index:50; }
  .overlay.hidden { display:none; }
  .overlay h1 { margin:0 0 8px; font-size:30px; color:var(--gold); }
  .overlay p { line-height:1.6; margin:6px 0 14px; }
  .overlay .btn { width:auto; padding:12px 40px; }
  .home-btn { position: fixed; right: 12px; bottom: 12px; z-index: 9999; padding: 8px 14px; border-radius: 999px;
    background: #000a; color: #fff; font: 700 14px/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    text-decoration: none; border: 1px solid #fff6; }
  .home-btn:active { transform: translateY(2px); }
</style>
</head>
<body>
<a class="home-btn" href="../">🏠 메인 메뉴</a>

<div id="game">
  <div id="hud"><span>❤️ <b id="lives">3</b></span><span>🍲 <b id="count">0</b>그릇</span><span>💰 <b id="money-total">0</b>원</span></div>
  <div id="shop">
    <svg id="chuk" viewBox="0 0 150 170" shape-rendering="crispEdges" aria-label="척추">
      <!-- 뼈 다리 -->
      <g fill="#f2efd0" stroke="#b7b28b" stroke-width="2">
        <rect x="52" y="124" width="14" height="36"/><rect x="84" y="124" width="14" height="36"/>
        <rect x="44" y="156" width="26" height="10" fill="#25211e" stroke="none"/><rect x="80" y="156" width="26" height="10" fill="#25211e" stroke="none"/>
        <!-- 골반 -->
        <rect x="46" y="108" width="58" height="18" rx="2"/>
      </g>
      <!-- 척추뼈 -->
      <g fill="#b7b28b"><rect x="66" y="62" width="18" height="48"/></g>
      <g fill="#f2efd0" stroke="#b7b28b" stroke-width="1">
        <rect x="68" y="64" width="14" height="7"/><rect x="68" y="74" width="14" height="7"/><rect x="68" y="84" width="14" height="7"/><rect x="68" y="94" width="14" height="7"/>
      </g>
      <!-- 갈비뼈 -->
      <g fill="none" stroke="#fffbe3" stroke-width="5">
        <path d="M66 70 Q40 72 40 80"/><path d="M84 70 Q110 72 110 80"/>
        <path d="M66 82 Q38 84 40 94"/><path d="M84 82 Q112 84 110 94"/>
        <path d="M66 94 Q44 96 46 106"/><path d="M84 94 Q106 96 104 106"/>
      </g>
      <!-- 팔 (국자) -->
      <g fill="none" stroke="#f2efd0" stroke-width="7"><path d="M40 68 L22 92"/><path d="M110 68 L130 90"/></g>
      <rect x="126" y="62" width="4" height="40" fill="#8a5a3a"/><ellipse cx="128" cy="104" rx="10" ry="7" fill="#aaa"/>
      <!-- 해골 -->
      <g>
        <rect x="42" y="14" width="66" height="44" rx="12" fill="#f2efd0" stroke="#b7b28b" stroke-width="2"/>
        <rect x="52" y="52" width="46" height="16" fill="#f2efd0" stroke="#b7b28b" stroke-width="2"/>
        <rect x="50" y="26" width="20" height="18" fill="#25211e"/><rect x="80" y="26" width="20" height="18" fill="#25211e"/>
        <rect x="58" y="32" width="6" height="6" fill="#d9402e"/><rect x="86" y="32" width="6" height="6" fill="#d9402e"/>
        <rect x="72" y="44" width="6" height="7" fill="#25211e"/>
        <rect x="56" y="56" width="38" height="6" fill="#25211e"/>
        <g fill="#fffbe3"><rect x="58" y="54" width="5" height="9"/><rect x="66" y="54" width="5" height="9"/><rect x="74" y="54" width="5" height="9"/><rect x="82" y="54" width="5" height="9"/><rect x="90" y="54" width="4" height="9"/></g>
      </g>
      <!-- 세 갈래 붉은 목도리 -->
      <rect x="48" y="62" width="54" height="9" fill="#cc4029"/><rect x="90" y="60" width="16" height="14" fill="#e65a37"/>
      <g fill="#cc4029"><path d="M104 66 L146 52 L146 60 L106 72Z"/><path d="M104 68 L148 68 L148 76 L106 74Z"/><path d="M104 70 L144 84 L142 92 L104 76Z" fill="#842a20"/></g>
    </svg>
    <div id="bubble">어서 와라… 뼈해장국 한 그릇 말아주마.</div>
  </div>
  <div id="panel"></div>

  <div id="start" class="overlay">
    <h1>🦴 척추의 뼈해장국 가게</h1>
    <p>손님이 주문한 뼈해장국을 순서대로 만들어 내줘라!<br>
    <b>물 붓기 → 등뼈 → 양념 → 재료 → 끓이기 → 서빙</b><br>
    주문과 다른 재료를 넣으면 손님이 화낸다.<br>
    손님이 기다리다 지치면 ❤️가 줄어든다. (3번이면 영업 종료)</p>
    <button class="btn" id="startBtn">영업 시작</button>
    <div class="hint" id="best" style="margin-top:12px"></div>
  </div>
  <div id="end" class="overlay hidden">
    <h1>영업 종료!</h1>
    <p id="endText"></p>
    <button class="btn" id="againBtn">다시 영업하기</button>
  </div>
</div>

<script>
const INGS = [
  { id:'ugeoji', icon:'🥬', name:'우거지' },
  { id:'potato', icon:'🥔', name:'감자' },
  { id:'perilla',icon:'🌿', name:'들깨가루' },
  { id:'scallion',icon:'🧅', name:'대파' },
];
const ORDERS = [ ['ugeoji','potato'], ['ugeoji'], ['potato'], ['ugeoji','perilla'], ['ugeoji','scallion'], ['potato','perilla'], [] ];
const FACES = ['😀','😎','🥴','😴','🤠','🥱','😤'];
const STEP_NAMES = ['물 붓기','등뼈','양념','재료','끓이기','서빙'];
const $ = id => document.getElementById(id);
let lives, bowls, total, order, patMax, pat, step, running, raf, q, face, patTimer;

function say(t) { $('bubble').textContent = t; }
function bounce() { const c = $('chuk'); c.classList.remove('bounce'); void c.offsetWidth; c.classList.add('bounce'); }
function bestGet() { try { return +localStorage.getItem('chukBest') || 0; } catch (e) { return 0; } }
function bestSet(v) { try { localStorage.setItem('chukBest', v); } catch (e) {} }
function showBest() { $('best').textContent = bestGet() ? `최고 기록: ${bestGet().toLocaleString()}원` : ''; }
function updateHud() { $('lives').textContent = '❤️'.repeat(lives) || '💀'; $('count').textContent = bowls; $('money-total').textContent = total.toLocaleString(); }
const ordText = o => o.length ? '뼈해장국 + ' + o.map(id => { const i = INGS.find(x => x.id === id); return i.icon + i.name; }).join(', ') : '그냥 기본 뼈해장국 (재료 없이)';

function start() {
  lives = 3; bowls = 0; total = 0; running = true;
  $('start').classList.add('hidden'); $('end').classList.add('hidden');
  updateHud(); newCustomer();
}

function newCustomer() {
  order = ORDERS[Math.floor(Math.random() * ORDERS.length)];
  face = FACES[Math.floor(Math.random() * FACES.length)];
  patMax = Math.max(25, 50 - bowls * 1.5); pat = patMax;
  q = { water:0, ing:0, cook:0 }; step = 0;
  say('어서 와라. 주문 확인해라.');
  clearInterval(patTimer);
  patTimer = setInterval(() => {
    if (!running) return;
    pat -= .1; const f = $('patfill');
    if (f) { f.style.width = Math.max(0, pat / patMax * 100) + '%'; f.style.background = pat / patMax > .5 ? '#7fd36a' : pat / patMax > .25 ? '#ffd23f' : '#ff5a3c'; }
    if (pat <= 0) leave();
  }, 100);
  render();
}

function header() {
  return `<div id="cust"><div class="face">${face}</div><div class="ord">주문: ${ordText(order)}<div id="pat"><div id="patfill" style="width:${pat / patMax * 100}%"></div></div></div></div>
  <div class="steps">${STEP_NAMES.map((n, i) => i === step ? `<b>[${n}]</b>` : n).join(' › ')}</div>`;
}

function render() {
  cancelAnimationFrame(raf);
  const p = $('panel');
  if (step === 0) {
    p.innerHTML = header() + `<div id="pot">🍲</div><div id="gauge"><div id="zone" style="left:60%;width:20%"></div><div id="needle" style="width:auto;background:#4aa3ff;right:auto;left:0;width:0%;"></div></div>
      <div class="hint">버튼을 누르고 있으면 물이 차오른다. 초록 선에 맞춰 떼기!</div>
      <button class="btn" id="waterBtn">💧 물 붓기 (꾹 누르기)</button>`;
    setupWater();
  } else if (step === 1) {
    p.innerHTML = header() + `<div id="pot" style="font-size:80px">🦴🍲</div><button class="btn" id="go">🦴 등뼈 넣기</button>`;
    $('go').onclick = () => { bounce(); say('좋아, 뼈부터.'); step = 2; render(); };
  } else if (step === 2) {
    p.innerHTML = header() + `<div id="pot" style="font-size:80px">🌶️🍲</div><button class="btn" id="go">🌶️ 양념 (다대기) 넣기</button>`;
    $('go').onclick = () => { bounce(); step = 3; render(); };
  } else if (step === 3) {
    sel = [];
    p.innerHTML = header() + `<div class="grid" style="grid-template-columns:repeat(4,1fr)">${INGS.map(i => `<button class="ing" data-id="${i.id}"><span>${i.icon}</span>${i.name}</button>`).join('')}</div>
      <div class="hint" style="margin-top:6px">재료는 최대 2개</div><button class="btn" id="go">재료 넣기 완료</button>`;
    document.querySelectorAll('.ing').forEach(b => b.onclick = () => {
      const id = b.dataset.id, k = sel.indexOf(id);
      if (k >= 0) sel.splice(k, 1); else if (sel.length < 2) sel.push(id); else { say('두 개까지라고.'); return; }
      document.querySelectorAll('.ing').forEach(x => x.classList.toggle('on', sel.includes(x.dataset.id)));
    });
    $('go').onclick = () => {
      const miss = order.filter(x => !sel.includes(x)).length, extra = sel.filter(x => !order.includes(x)).length;
      q.ing = Math.max(0, 40 - (miss + extra) * 20);
      step = 4; render();
    };
  } else if (step === 4) {
    boilUI();
  } else if (step === 5) {
    p.innerHTML = header() + `<div id="pot" style="font-size:80px">🍲➡️${face}</div><button class="btn" id="go">🍽️ 손님에게 서빙</button>`;
    $('go').onclick = serve;
  }
}
let sel = [];

function setupWater() {
  let level = 0, holding = false, last = performance.now();
  const btn = $('waterBtn'), n = $('needle');
  n.style.cssText = 'position:absolute;top:0;bottom:0;left:0;width:0%;background:#4aa3ff;';
  $('zone').style.left = '70%'; $('zone').style.width = '15%';
  const down = e => { e.preventDefault(); holding = true; }, up = () => {
    if (!holding) return; holding = false;
    const d = Math.abs(level - 77.5);
    q.water = d <= 7.5 ? 20 : Math.max(0, Math.round(20 - (d - 7.5) * .8));
    cancelAnimationFrame(raf); step = 1; render();
  };
  btn.onmousedown = down; btn.ontouchstart = down; window.onmouseup = up; btn.ontouchend = up;
  const loop = now => {
    const dt = (now - last) / 1000; last = now;
    if (holding) level = Math.min(100, level + dt * 55);
    n.style.width = level + '%';
    if (level >= 100 && holding) { up(); return; }
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

function boilUI() {
  const zs = 50 + Math.random() * 30; let x = 0, dir = 1, last = performance.now();
  $('panel').innerHTML = header() + `<div id="pot">🍲🔥</div>
    <div id="gauge"><div id="zone" style="left:${zs}%"></div><div id="needle"></div></div>
    <div class="hint">초록 구간에서 불 끄기 (스페이스바 가능)</div><button class="btn" id="offBtn">🧯 불 끄기</button>`;
  window._off = () => {
    cancelAnimationFrame(raf);
    const d = Math.abs(x - (zs + 10));
    q.cook = d <= 10 ? Math.round(40 - d * 1.5) : Math.max(0, Math.round(25 - (d - 10) * .8));
    step = 5; window._off = null; render();
  };
  $('offBtn').onclick = window._off;
  const loop = now => {
    const dt = (now - last) / 1000; last = now;
    x += dir * dt * (80 + bowls * 2);
    if (x >= 100) { x = 100; dir = -1; } else if (x <= 0) { x = 0; dir = 1; }
    const n = $('needle'); if (n) n.style.left = `calc(${x}% - ${x * .06}px)`;
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

function serve() {
  clearInterval(patTimer); cancelAnimationFrame(raf);
  const Q = Math.min(100, q.water + q.ing + q.cook);
  const wrong = q.ing < 40;
  const stars = wrong ? 0 : Q >= 90 ? 3 : Q >= 65 ? 2 : 1;
  const bonus = 1 + (pat / patMax) * .3;
  const pay = Math.round(((1000 + Q * 140) * bonus) / 100) * 100;
  bowls++; total += pay; updateHud(); bounce();
  say(wrong ? '주문이랑 다르잖아…' : Q >= 90 ? '크으… 이게 정석이다.' : Q >= 65 ? '나쁘지 않군.' : '그냥 먹을 만은 하다.');
  $('panel').innerHTML = `<div id="result"><div style="font-size:56px">${wrong ? '😡' : face}</div>
    <div id="stars">${'⭐'.repeat(stars)}${'▫️'.repeat(3 - stars)}</div>
    <div>품질 <b>${Q}</b>점 (물 ${q.water} + 재료 ${q.ing} + 끓이기 ${q.cook})${wrong ? '<br>주문과 다른 재료!' : ''}</div>
    <div id="money">+${pay.toLocaleString()}원</div>
    <button class="btn" id="nextBtn">다음 손님 ▶</button></div>`;
  $('nextBtn').onclick = () => { if (running) newCustomer(); };
}

function leave() {
  clearInterval(patTimer); cancelAnimationFrame(raf);
  lives--; updateHud(); say('기다리다 그냥 갔군…');
  if (lives <= 0) return finish();
  $('panel').innerHTML = `<div id="result"><div style="font-size:56px">💢</div><div>손님이 화나서 나가버렸다!</div>
    <button class="btn" id="nextBtn">다음 손님 ▶</button></div>`;
  $('nextBtn').onclick = newCustomer;
}

function finish() {
  running = false; clearInterval(patTimer); cancelAnimationFrame(raf);
  const best = bestGet(); let note = '';
  if (total > best) { bestSet(total); note = '<br>🏆 신기록!'; }
  $('endText').innerHTML = `${bowls}그릇 판매<br>총 매출 <b style="color:var(--gold);font-size:26px">${total.toLocaleString()}원</b>${note}`;
  $('end').classList.remove('hidden');
}

document.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (step === 4 && window._off) window._off();
  else if (step === 5) $('go')?.click();
  else if ($('nextBtn')) $('nextBtn').click();
});
$('startBtn').onclick = start; $('againBtn').onclick = start;
showBest();
</script>
</body>
</html>
