<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>척추의 뼈해장국 가게</title>
<style>
  :root { --pink:#ff8fb8; --pink2:#ffc2d9; --pink3:#ffe3ee; --deep:#e0508a; --cream:#fff3d6; --gold:#ffd23f; --ink:#4a2a3a; --lcd:#3a1f4d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:8px;
    font-family:"Jua","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:var(--ink); background:#f7b8d0; user-select:none; }
  button { font-family:inherit; color:inherit; }
  #game { position:relative; width:min(940px,100%); border:5px solid #fff; border-radius:18px; overflow:hidden; box-shadow:0 8px 30px #a0306066;
    background: radial-gradient(circle at 12px 12px, #ffd9b0 3px, transparent 4px) 0 0/36px 36px, var(--cream); }

  /* 상단 바 */
  .top { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:8px 12px; background:var(--pink); border-bottom:5px solid var(--deep); color:#fff; }
  .title { font-size:18px; text-shadow:0 2px 0 var(--deep); margin-right:auto; white-space:nowrap; }
  .stat { background:#fff; color:var(--ink); border:3px solid var(--pink2); border-radius:14px; padding:2px 10px; font-size:13px; text-align:center; line-height:1.15; min-width:64px; }
  .stat b { display:block; font-size:18px; color:var(--deep); font-weight:400; }
  .stat.lcd { background:var(--lcd); border-color:#fff; color:var(--pink2); }
  .stat.lcd b { color:#ff7ac8; text-shadow:0 0 6px #ff7ac8; }
  #sndBtn { background:#fff; border:3px solid var(--pink2); border-radius:50%; width:40px; height:40px; font-size:20px; cursor:pointer; }
  .timebar { flex-basis:100%; height:10px; background:#fff; border-radius:6px; overflow:hidden; border:2px solid var(--pink2); }
  #timefill { height:100%; width:100%; background:linear-gradient(90deg,#ff6fa5,#ffb36f); }

  .main { display:flex; gap:10px; padding:10px; align-items:stretch; }
  .stovewrap { flex:1; min-width:0; background:linear-gradient(#ffb3d0,#ff9ac2); border:4px solid #fff; border-radius:16px; padding:8px; }
  .stove { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .side { width:200px; flex:none; display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--pink3); border:4px solid #fff; border-radius:16px; padding:8px; }
  #bubble { background:#fff; border:3px solid var(--pink); border-radius:16px; padding:6px 10px; font-size:14px; line-height:1.3; min-height:62px; width:100%; position:relative; display:flex; align-items:center; text-align:center; justify-content:center; }
  #bubble::after { content:""; position:absolute; left:50%; bottom:-12px; margin-left:-7px; border:7px solid transparent; border-top:12px solid var(--pink); }
  #chuk { width:104px; height:118px; }
  #chuk.bounce { animation: bounce .4s; }
  @keyframes bounce { 40% { transform:translateY(-12px); } }
  #customer { font-size:44px; line-height:1; }
  .sidelabel { font-size:11px; color:var(--deep); }
  #sel { font-size:13px; text-align:center; background:#fff; border:3px dashed var(--pink); border-radius:12px; padding:4px 6px; width:100%; }

  /* 냄비 카드 */
  .potcard { background:#fff7fb; border:3px solid #fff; border-radius:14px; padding:4px 4px 6px; display:flex; flex-direction:column; gap:3px; box-shadow:0 2px 0 #c0407a55; }
  .potcard.hit { cursor:pointer; }
  .pot { position:relative; height:128px; cursor:pointer; }
  .pot.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
  .pot .no { position:absolute; left:2px; top:0; font-size:11px; background:var(--pink); color:#fff; border-radius:8px; padding:0 6px; z-index:5; }
  .pan { position:absolute; left:14%; right:14%; top:30px; height:74px; border-radius:8px 8px 26px 26px; border:3px solid #b87a0a;
    background:linear-gradient(90deg,#ffe98a,#ffc928 45%,#e8a919); }
  .pan::before, .pan::after { content:""; position:absolute; top:10px; width:14px; height:16px; border-radius:50%; border:3px solid #b87a0a; background:#ffd84a; }
  .pan::before { left:-17px; } .pan::after { right:-17px; }
  .lid { position:absolute; left:-4px; right:-4px; top:-8px; height:10px; border-radius:6px; background:#ffd84a; border:3px solid #b87a0a; z-index:2; }
  .window { position:absolute; left:8px; right:8px; top:8px; bottom:8px; border-radius:6px 6px 18px 18px; background:#fff8e6; border:2px solid #b87a0a; overflow:hidden; }
  .liquid { position:absolute; left:0; right:0; bottom:0; height:0; background:#8ad4ff; transition:height .6s, background .4s; }
  .liquid.hot { background:#9ee0ff; }
  .liquid.broth { background:#c4521f; }
  .liquid.burnt { background:#2a1a12; }
  .bubbles span { position:absolute; bottom:0; width:7px; height:7px; border-radius:50%; background:#ffffffcc; border:1px solid #fff; animation: rise 1s infinite; }
  @keyframes rise { from { transform:translateY(0); opacity:1; } to { transform:translateY(-44px); opacity:0; } }
  .contents { position:absolute; left:0; right:0; bottom:12px; text-align:center; font-size:18px; line-height:1; letter-spacing:-1px; }
  .steam { position:absolute; left:0; right:0; top:-4px; text-align:center; font-size:20px; animation: bob .9s infinite; z-index:4; }
  .smoke { position:absolute; left:0; right:0; top:-6px; text-align:center; font-size:20px; animation: bob .7s infinite; z-index:4; filter:grayscale(1) brightness(.2); }
  @keyframes bob { 50% { transform:translateY(-4px); } }
  .burner { position:absolute; left:20%; right:20%; bottom:8px; height:16px; border-radius:50%; background:#5a2a40; border:3px solid #3a1a28; }
  .flame { position:absolute; left:0; right:0; bottom:16px; text-align:center; font-size:14px; letter-spacing:4px; animation: bob .5s infinite; }
  .pop { position:absolute; left:0; right:0; top:-6px; text-align:center; font-size:18px; color:#e8a000; text-shadow:0 0 3px #fff, 0 2px 0 #fff; z-index:9; pointer-events:none; animation: floatup 1.1s forwards; }
  @keyframes floatup { from { transform:translateY(20px); opacity:1; } to { transform:translateY(-14px); opacity:0; } }
  .pot.ready .pan { box-shadow:0 0 0 3px #fff, 0 0 12px 5px #ffe36b; }
  .pot.over .pan { box-shadow:0 0 0 3px #ffb36f; }
  .pot.burnt .pan { filter:grayscale(.6) brightness(.7); }

  .status { text-align:center; font-size:13px; font-weight:700; min-height:18px; }
  .status.s-raw { color:#2f7fd0; } .status.s-good { color:#2f9e44; } .status.s-soft { color:#d9822b; } .status.s-burnt { color:#222; } .status.s-wait { color:var(--deep); } .status.s-empty { color:#999; }
  .prog { position:relative; height:12px; border-radius:7px; overflow:hidden; background:#ddd; border:2px solid var(--deep); display:flex; }
  .prog i { display:block; height:100%; }
  .prog .m { position:absolute; top:0; bottom:0; width:3px; background:#4a2a3a; margin-left:-1px; }
  .btns { display:flex; gap:4px; }
  .btns button { flex:1; padding:5px 0; border-radius:12px; border:3px solid #fff; font-size:13px; cursor:pointer; box-shadow:0 2px 0 #00000033; }
  .btn-serve { background:var(--gold); } .btn-discard { background:#ffb0c8; }
  .btns button:disabled { opacity:.4; cursor:default; box-shadow:none; }
  .btns button:not(:disabled):active { transform:translateY(2px); }

  /* 재료대 */
  .shelf { margin:0 10px 10px; padding:8px; background:var(--pink3); border:4px solid var(--pink); border-bottom-width:8px; border-radius:14px; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .tool { background:#fff; border:4px solid var(--pink2); border-radius:16px; padding:4px 0 3px; font-size:13px; cursor:pointer; line-height:1.1; min-height:70px; }
  .tool span { display:block; font-size:32px; }
  .tool.sel { border-color:var(--deep); background:#fff0a8; transform:translateY(-3px); box-shadow:0 5px 0 var(--deep); }
  .tool small { display:block; font-size:10px; opacity:.7; }

  #hint { text-align:center; min-height:20px; padding:0 10px 6px; font-size:13px; color:var(--deep); }

  .overlay { position:absolute; inset:0; background:#ff8fb8ee; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; z-index:50; color:#fff; }
  .overlay.hidden { display:none; }
  .overlay h1 { margin:0 0 8px; font-size:32px; text-shadow:0 3px 0 var(--deep); }
  .overlay p { line-height:1.6; margin:6px 0 14px; font-size:15px; text-shadow:0 1px 0 var(--deep); max-width:520px; }
  .big { padding:12px 44px; border:4px solid #fff; border-radius:30px; background:var(--gold); color:var(--ink); font-size:20px; cursor:pointer; box-shadow:0 4px 0 var(--deep); }
  .big:active { transform:translateY(3px); box-shadow:0 1px 0 var(--deep); }
  .home-btn { position: fixed; right: 12px; bottom: 12px; z-index: 9999; padding: 8px 14px; border-radius: 999px;
    background: #000a; color: #fff; font: 700 14px/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    text-decoration: none; border: 1px solid #fff6; }
  .home-btn:active { transform: translateY(2px); }

  @media (max-width:760px) {
    .main { flex-direction:column; }
    .side { width:auto; flex-direction:row; flex-wrap:wrap; justify-content:center; }
    #bubble { width:auto; flex:1 1 150px; } #bubble::after { display:none; }
    #chuk { width:70px; height:80px; } #customer { font-size:34px; }
    #sel { flex-basis:100%; }
    .stove { grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:420px) {
    .shelf { grid-template-columns:repeat(5,1fr); gap:3px; padding:5px; }
    .tool { font-size:11px; min-height:60px; border-width:3px; } .tool span { font-size:24px; }
    .title { font-size:15px; }
  }
</style>
</head>
<body>
<a class="home-btn" href="../">🏠 메인 메뉴</a>

<div id="game">
  <div class="top">
    <div class="title">🦴 척추의 뼈해장국 가게</div>
    <div class="stat">남은 시간<b id="time">90</b></div>
    <div class="stat lcd">현재 매출<b id="money">0</b></div>
    <div class="stat">목표 매출<b id="target">0</b></div>
    <div class="stat">실수<b id="mistakes">0 / 5</b></div>
    <button id="sndBtn" aria-label="소리 켜기/끄기">🔊</button>
    <div class="timebar"><div id="timefill"></div></div>
  </div>

  <div class="main">
    <div class="stovewrap"><div class="stove" id="stove"></div></div>
    <div class="side">
      <div class="sidelabel">손님</div>
      <div id="customer">🙂</div>
      <div id="bubble">어서 와요! 뼈해장국 한 그릇 부탁해요.</div>
      <svg id="chuk" viewBox="30 -8 120 178" shape-rendering="crispEdges" aria-label="척추">
        <g fill="#f2efd0" stroke="#b7b28b" stroke-width="2">
          <rect x="52" y="124" width="14" height="36"/><rect x="84" y="124" width="14" height="36"/>
          <rect x="44" y="156" width="26" height="10" fill="#25211e" stroke="none"/><rect x="80" y="156" width="26" height="10" fill="#25211e" stroke="none"/>
          <rect x="46" y="108" width="58" height="18" rx="2"/>
        </g>
        <g fill="#b7b28b"><rect x="66" y="62" width="18" height="48"/></g>
        <g fill="#f2efd0" stroke="#b7b28b" stroke-width="1">
          <rect x="68" y="64" width="14" height="7"/><rect x="68" y="74" width="14" height="7"/><rect x="68" y="84" width="14" height="7"/><rect x="68" y="94" width="14" height="7"/>
        </g>
        <g fill="none" stroke="#fffbe3" stroke-width="5">
          <path d="M66 70 Q40 72 40 80"/><path d="M84 70 Q110 72 110 80"/><path d="M66 82 Q38 84 40 94"/><path d="M84 82 Q112 84 110 94"/><path d="M66 94 Q44 96 46 106"/><path d="M84 94 Q106 96 104 106"/>
        </g>
        <path d="M52 78 H98 V128 H52Z" fill="#fff3a8" opacity=".92" stroke="#f0c040" stroke-width="2"/>
        <path d="M68 96 q7 -10 14 0 q-7 14 -14 0z" fill="#ff8a3d"/><path d="M75 90 q2 -6 6 -6" stroke="#4aa83a" stroke-width="3" fill="none"/>
        <g fill="none" stroke="#f2efd0" stroke-width="7"><path d="M40 68 L22 92"/><path d="M110 68 L130 90"/></g>
        <rect x="126" y="62" width="4" height="40" fill="#8a5a3a"/><ellipse cx="128" cy="104" rx="10" ry="7" fill="#aaa"/>
        <rect x="42" y="14" width="66" height="44" rx="12" fill="#f2efd0" stroke="#b7b28b" stroke-width="2"/>
        <rect x="52" y="52" width="46" height="16" fill="#f2efd0" stroke="#b7b28b" stroke-width="2"/>
        <rect x="50" y="26" width="20" height="18" fill="#25211e"/><rect x="80" y="26" width="20" height="18" fill="#25211e"/>
        <rect x="58" y="32" width="6" height="6" fill="#d9402e"/><rect x="86" y="32" width="6" height="6" fill="#d9402e"/>
        <rect x="72" y="44" width="6" height="7" fill="#25211e"/><rect x="56" y="56" width="38" height="6" fill="#25211e"/>
        <g fill="#fffbe3"><rect x="58" y="54" width="5" height="9"/><rect x="66" y="54" width="5" height="9"/><rect x="74" y="54" width="5" height="9"/><rect x="82" y="54" width="5" height="9"/><rect x="90" y="54" width="4" height="9"/></g>
        <path d="M52 20 H98 L94 2 Q75 -6 56 2Z" fill="#fff3a8" stroke="#f0c040" stroke-width="2"/>
        <path d="M67 18 q4 -6 8 0 q4 -6 8 0 q-8 10 -16 0z" fill="#ff7aa8"/>
        <rect x="48" y="62" width="54" height="9" fill="#cc4029"/><rect x="90" y="60" width="16" height="14" fill="#e65a37"/>
        <g fill="#cc4029"><path d="M104 66 L146 52 L146 60 L106 72Z"/><path d="M104 68 L148 68 L148 76 L106 74Z"/><path d="M104 70 L144 84 L142 92 L104 76Z" fill="#842a20"/></g>
      </svg>
      <div id="sel">선택한 재료 없음</div>
    </div>
  </div>

  <div id="hint">재료를 클릭해 선택하고, 넣을 냄비를 클릭하세요.</div>
  <div class="shelf" id="shelf"></div>

  <div id="start" class="overlay">
    <h1>🦴 척추의 뼈해장국 가게 🍲</h1>
    <p id="rules"></p>
    <button class="big" id="startBtn">영업 시작</button>
    <div id="best" style="margin-top:12px;font-size:14px"></div>
  </div>
  <div id="pause" class="overlay hidden">
    <h1>⏸ 일시정지</h1>
    <p>화면을 벗어나서 잠시 멈췄어요.</p>
    <button class="big" id="resumeBtn">재개</button>
  </div>
  <div id="end" class="overlay hidden">
    <h1 id="endTitle"></h1>
    <p id="endText"></p>
    <button class="big" id="againBtn">다시 하기</button>
  </div>
</div>

<script>
// ───────────── 설정값 (여기만 고치면 밸런스 조정 가능) ─────────────
const CONFIG = {
  GAME_SECONDS: 90,          // 게임 시간
  TARGET_SALES: 30000,       // 목표 매출
  MAX_MISTAKES: 5,           // 실수 허용 한도 (도달 시 즉시 실패)
  POT_COUNT: 4,              // 냄비(버너) 개수
  HEAT_SECONDS: 3,           // 물이 끓기까지 걸리는 시간
  COOK: { RAW: 8, GOOD: 12, SOFT: 15 }, // 면(등뼈) 투입 후: <8 덜 끓음, <12 먹기 좋음, <15 너무 끓음, ≥15 탐
  PRICE: { PERFECT: 3000, PLAIN: 2000, SOFT: 1000 },
  DISCARD_PENALTY: 500,
};

// 재료: 라면 → 뼈해장국 (물 / 면=등뼈 / 수프=양념 / 달걀·파=우거지·감자)
const TOOLS = [
  { id:'water',  icon:'🫖', name:'물 주전자', kind:'water' },
  { id:'bone',   icon:'🦴', name:'등뼈',     kind:'bone' },
  { id:'soup',   icon:'🌶️', name:'양념',     kind:'soup' },
  { id:'ugeoji', icon:'🥬', name:'우거지',   kind:'topping' },
  { id:'potato', icon:'🥔', name:'감자',     kind:'topping' },
];
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString();

// ───────────── 효과음 (Web Audio) ─────────────
const Sound = {
  ctx:null, on:true,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  beep(freq, dur, type = 'sine', vol = .15, delay = 0, slide = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur);
  },
  add()  { this.beep(520, .09, 'triangle'); this.beep(780, .09, 'triangle', .12, .06); },
  pour() { this.beep(300, .3, 'sine', .12, 0, 200); },
  good() { [660, 880, 1100].forEach((f, i) => this.beep(f, .16, 'square', .09, i * .09)); },
  bad()  { this.beep(220, .25, 'sawtooth', .1); this.beep(150, .3, 'sawtooth', .1, .15); },
  hint() { this.beep(260, .06, 'square', .05); },
};

// ───────────── 게임 상태 ─────────────
let G = null;      // 현재 판 상태
let loopId = 0;    // 프레임 루프 식별자 (재시작 시 중복 실행 방지)
let tool = null;

const newPot = () => ({ phase:'empty', waterAt:0, boneAt:0, soup:false, toppings:[], soldFx:null });

function newGame() {
  return { clock:0, last:null, running:false, paused:false, over:false,
           sales:0, sold:0, mistakes:0, pots:Array.from({ length:CONFIG.POT_COUNT }, newPot) };
}

// ───────────── 조리 판정 ─────────────
function cookTime(p) { return p.phase === 'cooking' ? G.clock - p.boneAt : 0; }
function doneness(p) {
  if (p.phase === 'empty') return 'empty';
  if (p.phase === 'heating' || p.phase === 'boiling') return 'wait';
  const t = cookTime(p), C = CONFIG.COOK;
  return t < C.RAW ? 'raw' : t < C.GOOD ? 'good' : t < C.SOFT ? 'soft' : 'burnt';
}
const LABEL = { empty:'빈 냄비', wait:'', raw:'덜 끓음', good:'먹기 좋음!', soft:'너무 끓음', burnt:'탔음!' };

function statusText(p) {
  const d = doneness(p);
  if (d === 'wait') return p.phase === 'heating' ? `물 가열 중… ${Math.max(0, Math.ceil(CONFIG.HEAT_SECONDS - (G.clock - p.waterAt)))}` : '물이 끓었어요! 등뼈 넣기';
  return LABEL[d];
}

// ───────────── 렌더링 ─────────────
function say(t, mood) {
  $('bubble').textContent = t;
  if (mood) $('customer').textContent = mood;
}
function bounce() { const c = $('chuk'); c.classList.remove('bounce'); void c.getBoundingClientRect(); c.classList.add('bounce'); }
function hint(msg) { $('hint').textContent = msg; Sound.hint(); }

function buildStove() {
  $('stove').innerHTML = G.pots.map((_, i) => `
    <div class="potcard" id="card${i}">
      <div class="pot" id="pot${i}" data-i="${i}"></div>
      <div class="status" id="st${i}"></div>
      <div class="prog" id="pg${i}"></div>
      <div class="btns"><button class="btn-serve" data-serve="${i}">제공</button><button class="btn-discard" data-discard="${i}">버리기</button></div>
    </div>`).join('');
  document.querySelectorAll('.pot').forEach(el => el.onclick = () => tapPot(+el.dataset.i));
  document.querySelectorAll('[data-serve]').forEach(b => b.onclick = () => serve(+b.dataset.serve));
  document.querySelectorAll('[data-discard]').forEach(b => b.onclick = () => discard(+b.dataset.discard));
  G.pots.forEach((_, i) => renderPot(i));
}

// 냄비 모양/내용물은 상태가 바뀔 때만 다시 그린다.
function renderPot(i) {
  const p = G.pots[i], el = $('pot' + i), d = doneness(p);
  const level = p.phase === 'empty' ? 0 : 62;
  const liq = d === 'burnt' ? 'burnt' : p.soup ? 'broth' : p.phase === 'heating' ? '' : 'hot';
  const boiling = p.phase === 'boiling' || (p.phase === 'cooking' && d !== 'burnt');
  const icons = (p.phase === 'cooking' ? '🦴' : '') + p.toppings.map(id => TOOLS.find(t => t.id === id).icon).join('');
  el.className = 'pot' + (d === 'good' ? ' ready' : d === 'soft' ? ' over' : d === 'burnt' ? ' burnt' : '');
  el.innerHTML = `<div class="no">${i + 1}</div>
    ${boiling ? '<div class="steam">♨️</div>' : ''}${d === 'burnt' ? '<div class="smoke">💨💨</div>' : ''}
    <div class="pan"><div class="lid"></div><div class="window">
      <div class="liquid ${liq}" style="height:${level}%">${boiling ? '<div class="bubbles"><span style="left:18%;animation-delay:0s"></span><span style="left:45%;animation-delay:.35s"></span><span style="left:70%;animation-delay:.7s"></span></div>' : ''}</div>
      <div class="contents">${icons}</div></div></div>
    ${p.phase !== 'empty' ? '<div class="flame">🔥🔥</div>' : ''}<div class="burner"></div>`;
  $('card' + i).querySelector('[data-serve]').disabled = p.phase === 'empty' || d === 'burnt';
  $('card' + i).querySelector('[data-discard]').disabled = p.phase === 'empty';
  renderMeter(i);
}

function renderMeter(i) {
  const p = G.pots[i], d = doneness(p), C = CONFIG.COOK;
  const st = $('st' + i); st.textContent = statusText(p);
  st.className = 'status s-' + (d === 'burnt' ? 'burnt' : d);
  const pg = $('pg' + i);
  if (!pg.firstChild) {
    pg.innerHTML = `<i style="width:${C.RAW / C.SOFT * 100}%;background:#8ec5ff"></i><i style="width:${(C.GOOD - C.RAW) / C.SOFT * 100}%;background:#6fd47a"></i><i style="width:${(C.SOFT - C.GOOD) / C.SOFT * 100}%;background:#ffb36f"></i><span class="m" style="left:0"></span>`;
  }
  const t = p.phase === 'cooking' ? Math.min(C.SOFT, cookTime(p)) : p.phase === 'empty' ? null : 0;
  const m = pg.querySelector('.m');
  m.style.display = t === null ? 'none' : 'block';
  if (t !== null) m.style.left = (t / C.SOFT * 100) + '%';
  pg.style.opacity = p.phase === 'cooking' ? 1 : .5;
  pg.style.background = d === 'burnt' ? '#222' : '#ddd';
}

function renderHud() {
  const left = Math.max(0, Math.ceil(CONFIG.GAME_SECONDS - G.clock));
  $('time').textContent = left;
  $('timefill').style.width = Math.max(0, (1 - G.clock / CONFIG.GAME_SECONDS) * 100) + '%';
  $('money').textContent = fmt(G.sales);
  $('target').textContent = fmt(CONFIG.TARGET_SALES);
  $('mistakes').textContent = `${G.mistakes} / ${CONFIG.MAX_MISTAKES}`;
}

function buildShelf() {
  $('shelf').innerHTML = TOOLS.map(t => `<button class="tool" data-id="${t.id}"><span>${t.icon}</span>${t.name}</button>`).join('');
  document.querySelectorAll('.tool').forEach(b => b.onclick = () => pick(b.dataset.id));
}
function pick(id) {
  if (!G || !G.running) return;
  tool = tool === id ? null : id;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('sel', b.dataset.id === tool));
  const t = TOOLS.find(x => x.id === tool);
  $('sel').textContent = t ? `선택: ${t.icon} ${t.name}` : '선택한 재료 없음';
  $('hint').textContent = t ? `${t.name} 선택 중 — 넣을 냄비를 클릭하세요. (다시 누르면 해제)` : '재료를 클릭해 선택하고, 넣을 냄비를 클릭하세요.';
}

function shake(i) { const el = $('pot' + i); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function fx(i, text) {
  const el = $('pot' + i), s = document.createElement('div');
  s.className = 'pop'; s.textContent = text; el.appendChild(s); setTimeout(() => s.remove(), 1100);
}

// ───────────── 재료 투입 ─────────────
function reject(i, msg) { shake(i); hint(msg); }   // 실수로 세지 않는 안내

function tapPot(i) {
  if (!G || !G.running) return;
  const p = G.pots[i];
  if (!tool) return reject(i, '먼저 아래에서 재료를 선택하세요.');
  const t = TOOLS.find(x => x.id === tool);
  if (doneness(p) === 'burnt') return reject(i, '탄 냄비는 재료를 넣을 수 없어요. 버려야 해요!');

  if (t.kind === 'water') {
    if (p.phase !== 'empty') return reject(i, '이미 물이 들어 있어요.');
    p.phase = 'heating'; p.waterAt = G.clock; Sound.pour();
  } else if (p.phase === 'empty') {
    return reject(i, '먼저 물을 넣어야 해요!');
  } else if (p.phase === 'heating') {
    return reject(i, '물이 끓을 때까지 기다려 주세요.');
  } else if (t.kind === 'bone') {
    if (p.phase === 'cooking') return reject(i, '등뼈는 이미 들어 있어요.');
    p.phase = 'cooking'; p.boneAt = G.clock; Sound.add();
  } else if (t.kind === 'soup') {
    if (p.soup) return reject(i, '양념은 이미 넣었어요.');
    p.soup = true; Sound.add();
  } else if (t.kind === 'topping') {
    if (p.phase !== 'cooking') return reject(i, '우거지·감자는 등뼈를 넣은 뒤에 넣을 수 있어요.');
    if (p.toppings.includes(t.id)) return reject(i, `${t.name}는 이미 넣었어요.`);
    p.toppings.push(t.id); Sound.add();
  }
  $('hint').textContent = `${t.icon} ${t.name} 넣었어요! (${t.name} 선택 유지 중)`;
  renderPot(i);
}

// ───────────── 제공 / 버리기 ─────────────
function resetPot(i) { G.pots[i] = newPot(); renderPot(i); }

function serve(i) {
  if (!G || !G.running) return;
  const p = G.pots[i], d = doneness(p);
  if (p.phase === 'empty') return;
  if (d === 'burnt') return reject(i, '탄 해장국은 제공할 수 없어요. 버려야 해요!');
  const hasBase = p.phase === 'cooking' && p.soup;
  const full = p.toppings.length === 2;
  let pay = 0, msg, mood;
  if (hasBase && d === 'good') { pay = full ? CONFIG.PRICE.PERFECT : CONFIG.PRICE.PLAIN; }
  else if (hasBase && d === 'soft') pay = CONFIG.PRICE.SOFT;

  resetPot(i);   // 즉시 빈 냄비 → 연타해도 중복 판매 불가
  if (pay > 0) {
    G.sales += pay; G.sold++;
    msg = pay === CONFIG.PRICE.PERFECT ? '크으~ 정석 뼈해장국이다!' : pay === CONFIG.PRICE.PLAIN ? '맛있네요! 재료가 조금 아쉽지만요.' : '좀 퍼졌지만… 먹을 만해요.';
    mood = pay === CONFIG.PRICE.SOFT ? '😅' : '😋';
    fx(i, '+' + fmt(pay)); Sound.good(); bounce();
  } else {
    G.mistakes++;
    msg = !hasBase ? (p.phase !== 'cooking' ? '이건 등뼈가 없잖아요…' : '양념이 빠졌어요…') : '아직 덜 끓었어요…';
    mood = '😢'; fx(i, '실패!'); Sound.bad();
  }
  say(msg, mood); renderHud(); checkEnd();
}

function discard(i) {
  if (!G || !G.running) return;
  const p = G.pots[i];
  if (p.phase === 'empty') return;
  resetPot(i);
  G.sales = Math.max(0, G.sales - CONFIG.DISCARD_PENALTY); G.mistakes++;
  fx(i, '-' + fmt(CONFIG.DISCARD_PENALTY)); Sound.bad();
  say('아깝다… 다음엔 잘 끓여요.', '😢');
  renderHud(); checkEnd();
}

// ───────────── 진행 / 종료 ─────────────
function checkEnd() {
  if (G.over) return;
  if (G.sales >= CONFIG.TARGET_SALES) return finish(true, '목표 매출 달성!');
  if (G.mistakes >= CONFIG.MAX_MISTAKES) return finish(false, `실수 ${CONFIG.MAX_MISTAKES}회 — 가게 문을 닫았어요.`);
  if (G.clock >= CONFIG.GAME_SECONDS) return finish(false, '시간 종료 — 목표 매출에 못 미쳤어요.');
}

function finish(win, reason) {
  G.over = true; G.running = false; tool = null; loopId++;   // 루프 중단, 이후 모든 입력 무시
  const best = bestGet(); let note = '';
  if (win && G.sales > best) { bestSet(G.sales); note = '<br>🏆 최고 기록!'; }
  $('endTitle').textContent = win ? '🎉 영업 성공!' : '😢 영업 실패';
  $('endText').innerHTML = `${reason}<br><br>최종 매출 <b style="font-size:24px">${fmt(G.sales)}원</b> / 목표 ${fmt(CONFIG.TARGET_SALES)}원<br>판매한 해장국 ${G.sold}그릇 · 실수 ${G.mistakes}회${note}`;
  $('end').classList.remove('hidden');
  Sound.beep(win ? 880 : 200, .3, win ? 'square' : 'sawtooth', .1);
}

function frame(id, now) {
  if (id !== loopId || !G.running) return;
  const dt = G.last === null ? 0 : Math.min(.25, (now - G.last) / 1000);
  G.last = now; G.clock += dt;
  G.pots.forEach((p, i) => {
    if (p.phase === 'heating' && G.clock - p.waterAt >= CONFIG.HEAT_SECONDS) { p.phase = 'boiling'; renderPot(i); say('물이 끓었어요!'); }
    else if (p.phase === 'cooking') {
      const d = doneness(p);
      if (p.lastD !== d) { p.lastD = d; renderPot(i); if (d === 'burnt') { Sound.bad(); say('앗, 하나 탔어요!', '😱'); } }
      else renderMeter(i);
    } else if (p.phase === 'heating') renderMeter(i);
    else if (p.phase === 'boiling') renderMeter(i);
  });
  renderHud(); checkEnd();
  if (!G.over) requestAnimationFrame(t => frame(id, t));
}

function startLoop() {
  const id = ++loopId; G.last = null;
  requestAnimationFrame(t => frame(id, t));
}

function start() {
  Sound.init(); tool = null;
  G = newGame(); G.running = true;
  $('start').classList.add('hidden'); $('end').classList.add('hidden'); $('pause').classList.add('hidden');
  buildShelf(); buildStove(); pick(null); renderHud();
  say('어서 와요! 뼈해장국 한 그릇 부탁해요.', '🙂');
  startLoop();
}

function pauseGame() {
  if (!G || !G.running) return;
  G.running = false; G.paused = true; loopId++;
  $('pause').classList.remove('hidden');
}
function resumeGame() {
  if (!G || !G.paused || G.over) return;
  G.paused = false; G.running = true;
  $('pause').classList.add('hidden'); startLoop();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

function bestGet() { try { return +localStorage.getItem('chukBest') || 0; } catch (e) { return 0; } }
function bestSet(v) { try { localStorage.setItem('chukBest', v); } catch (e) {} }

$('startBtn').onclick = start; $('againBtn').onclick = start; $('resumeBtn').onclick = resumeGame;
$('sndBtn').onclick = () => { Sound.init(); Sound.on = !Sound.on; $('sndBtn').textContent = Sound.on ? '🔊' : '🔇'; };
$('target').textContent = fmt(CONFIG.TARGET_SALES);
$('time').textContent = CONFIG.GAME_SECONDS;
$('rules').innerHTML = `${CONFIG.GAME_SECONDS}초 안에 <b>${fmt(CONFIG.TARGET_SALES)}원</b>을 벌어요! (실수 ${CONFIG.MAX_MISTAKES}회면 실패)<br>
  재료를 <b>클릭해 선택</b>하고 → 넣을 <b>냄비를 클릭</b>해요. (선택은 유지돼요)<br>
  <b>물 주전자</b>(${CONFIG.HEAT_SECONDS}초 뒤 끓음) → <b>등뼈 + 양념</b> → <b>우거지 · 감자</b> → 먹기 좋을 때 <b>제공</b><br>
  등뼈를 넣은 뒤 ${CONFIG.COOK.RAW}~${CONFIG.COOK.GOOD}초가 먹기 좋아요. ${CONFIG.COOK.SOFT}초가 넘으면 타요!<br>
  3종 다 있고 먹기 좋으면 ${fmt(CONFIG.PRICE.PERFECT)}원, 재료 빠지면 ${fmt(CONFIG.PRICE.PLAIN)}원, 퍼지면 ${fmt(CONFIG.PRICE.SOFT)}원<br>
  덜 끓었거나 등뼈·양념이 빠진 걸 내면 실수, 내용물이 있는 냄비를 버리면 -${CONFIG.DISCARD_PENALTY}원 + 실수`;
const b0 = bestGet(); if (b0) $('best').textContent = `최고 기록: ${fmt(b0)}원`;
</script>
</body>
</html>
