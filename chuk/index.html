<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>척추의 뼈해장국 가게</title>
<style>
  :root { --pink:#ff8fb8; --pink2:#ffc2d9; --pink3:#ffe3ee; --deep:#e0508a; --cream:#fff3d6; --gold:#ffd23f; --ink:#4a2a3a; --lcd:#3a1f4d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:10px;
    font-family:"Jua","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:var(--ink); background:#f7b8d0; user-select:none; }
  #game { position:relative; width:min(600px,100%); border:5px solid #fff; border-radius:18px; overflow:hidden; box-shadow:0 8px 30px #a0306066;
    background:
      radial-gradient(circle at 12px 12px, #ffd9b0 3px, transparent 4px) 0 0/36px 36px,
      var(--cream); }

  /* 차양 + 간판 */
  .awning { height:62px; position:relative; background:repeating-linear-gradient(90deg, var(--pink) 0 36px, #fff 36px 72px); border-bottom:6px solid var(--deep); }
  .awning::after { content:""; position:absolute; left:0; right:0; bottom:-18px; height:14px;
    background:radial-gradient(circle at 18px 0, var(--pink) 17px, transparent 18px) 0 0/72px 14px,
               radial-gradient(circle at 54px 0, #fff 17px, transparent 18px) 0 0/72px 14px; }
  .awning .hearts { position:absolute; inset:0; display:flex; justify-content:space-around; align-items:flex-start; padding-top:4px; color:#fff; font-size:12px; text-shadow:0 0 2px var(--deep); }
  .sign { position:absolute; left:50%; top:10px; transform:translateX(-50%); background:#fff; border:4px solid var(--pink); border-radius:30px;
    padding:3px 22px; font-size:20px; color:var(--deep); white-space:nowrap; z-index:3; box-shadow:0 3px 0 var(--deep); }

  /* HUD */
  .hud { display:flex; align-items:center; gap:10px; padding:26px 12px 6px; }
  .timebox { flex:1; font-size:13px; color:var(--deep); }
  .timebar { height:14px; border-radius:8px; background:#fff; border:3px solid var(--pink); overflow:hidden; }
  #timefill { height:100%; width:100%; background:linear-gradient(90deg,#ff6fa5,#ffb36f); }
  .lcd { min-width:150px; background:var(--lcd); border:3px solid var(--pink); border-radius:14px; padding:3px 12px; text-align:right; box-shadow:inset 0 0 8px #000a; }
  .lcd small { display:block; text-align:left; font-size:11px; color:var(--pink2); }
  .lcd b { color:#ff7ac8; font-size:22px; text-shadow:0 0 6px #ff7ac8; font-weight:400; }
  .cnt { font-size:13px; text-align:center; color:var(--deep); }

  /* 선반 (재료 / 도구) */
  .shelf { margin:4px 10px; padding:6px; background:var(--pink3); border:3px solid var(--pink); border-bottom-width:7px; border-radius:12px;
    display:grid; grid-template-columns:repeat(8,1fr); gap:4px; }
  @media (max-width:460px) { .shelf { grid-template-columns:repeat(4,1fr); } }
  .tool { background:#fff; border:3px solid var(--pink2); border-radius:12px; padding:3px 0 2px; font-family:inherit; font-size:10px; color:var(--ink); cursor:pointer; line-height:1.1; }
  .tool span { display:block; font-size:26px; }
  .tool.sel { border-color:var(--deep); background:#fff0a8; transform:translateY(-3px); box-shadow:0 4px 0 var(--deep); }

  /* 셰프 + 쟁반 */
  .mid { display:flex; align-items:flex-end; justify-content:space-between; padding:0 10px; min-height:116px; position:relative; }
  #chuk { width:104px; height:118px; flex:none; }
  #chuk.bounce { animation: bounce .4s; }
  @keyframes bounce { 40% { transform:translateY(-12px); } }
  #bubble { position:relative; flex:1; margin:0 10px 40px; background:#fff; border:3px solid var(--pink); border-radius:18px; padding:7px 12px; font-size:14px; line-height:1.3; align-self:center; max-width:250px; }
  #bubble::before { content:""; position:absolute; left:-12px; top:50%; margin-top:-7px; border:7px solid transparent; border-right:12px solid var(--pink); }
  .tray { flex:none; width:116px; height:76px; margin-bottom:6px; background:#c78cc9; border:4px solid #8a4f90; border-radius:8px; position:relative; text-align:center; }
  .tray::before { content:"서빙 쟁반"; position:absolute; top:-18px; left:0; right:0; font-size:11px; color:var(--deep); }
  #bowl { font-size:34px; margin-top:6px; }
  #pay { position:absolute; left:0; right:0; bottom:2px; font-size:14px; color:#fff; text-shadow:0 1px 2px #5a2a60; }
  #pay.pop { animation: pop .8s; }
  @keyframes pop { 0% { transform:scale(.4); opacity:0; } 40% { transform:scale(1.3); opacity:1; } 100% { transform:scale(1); } }

  /* 조리대 */
  .counter { margin-top:2px; background:linear-gradient(#ffb3d0, #ff9ac2); border-top:8px solid #ffd9e8; padding:10px 8px 6px; }
  .stove { display:grid; grid-template-columns:repeat(3,1fr); gap:4px 8px; }
  .pot { position:relative; height:120px; cursor:pointer; }
  .pot .tag { position:absolute; left:2px; top:0; font-size:11px; background:#fff; border:2px solid var(--pink); border-radius:8px; padding:0 5px; color:var(--deep); z-index:3; }
  .pot .need { position:absolute; right:2px; top:-2px; font-size:20px; z-index:3; animation: bob 1s infinite; }
  @keyframes bob { 50% { transform:translateY(-3px); } }
  .pot .pg { position:absolute; left:10%; right:10%; top:20px; height:12px; background:#fff; border:2px solid var(--deep); border-radius:7px; overflow:hidden; z-index:3; }
  .pot .pg .z { position:absolute; top:0; bottom:0; background:#5ccf6aaa; border-left:2px solid #2f9e44; border-right:2px solid #2f9e44; }
  .pot .pg .n { position:absolute; top:0; bottom:0; width:5px; background:var(--deep); }
  .pan { position:absolute; left:12%; right:12%; bottom:20px; height:62px; border-radius:6px 6px 24px 24px; border:3px solid #b87a0a;
    background:linear-gradient(90deg,#ffe98a,#ffc928 45%,#e8a919); box-shadow:inset -6px -4px 0 #d99a10; }
  .pan::before, .pan::after { content:""; position:absolute; top:6px; width:14px; height:14px; border-radius:50%; border:3px solid #b87a0a; background:#ffd84a; }
  .pan::before { left:-16px; } .pan::after { right:-16px; }
  .rim { position:absolute; left:-3px; right:-3px; top:-12px; height:24px; border-radius:50%; border:3px solid #b87a0a; background:#6b4a14; overflow:hidden; }
  .soup { position:absolute; left:3px; right:3px; top:3px; bottom:3px; border-radius:50%; background:transparent; }
  .soup.water { background:#8ad4ff; } .soup.broth { background:#c4521f; } .soup.boil { background:#c4521f; animation: boil .5s infinite alternate; }
  @keyframes boil { to { filter:brightness(1.25); transform:scale(1.03); } }
  .items { position:absolute; left:0; right:0; top:-26px; text-align:center; font-size:16px; letter-spacing:-2px; z-index:2; text-shadow:0 0 2px #fff; }
  .face { position:absolute; left:0; right:0; bottom:8px; text-align:center; font-size:22px; }
  .burner { position:absolute; left:18%; right:18%; bottom:6px; height:16px; border-radius:50%; background:#5a2a40; border:3px solid #3a1a28; }
  .flame { position:absolute; left:0; right:0; bottom:10px; text-align:center; font-size:15px; letter-spacing:4px; z-index:1; }
  .steam { position:absolute; left:0; right:0; top:2px; text-align:center; font-size:18px; animation: bob .8s infinite; z-index:2; }
  .pot.ready .pan { box-shadow:0 0 0 4px #fff, 0 0 14px 6px #ffe36b; }
  .pot.burnt .pan { filter:grayscale(.8) brightness(.6); }
  .pot.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }

  .drawers { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:6px 8px 10px; background:#ff9ac2; }
  .drawers div { height:26px; background:var(--pink2); border:3px solid #fff; border-radius:6px; position:relative; text-align:center; font-size:12px; color:var(--deep); }
  .drawers div::before { content:""; position:absolute; left:50%; top:3px; width:30px; margin-left:-15px; height:4px; background:#c04a7a; border-radius:3px; }
  #hint { padding:4px 10px; text-align:center; font-size:13px; color:var(--deep); min-height:24px; }

  .overlay { position:absolute; inset:0; background:#ff8fb8ee; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; z-index:50; color:#fff; }
  .overlay.hidden { display:none; }
  .overlay h1 { margin:0 0 8px; font-size:30px; text-shadow:0 3px 0 var(--deep); }
  .overlay p { line-height:1.6; margin:6px 0 14px; font-size:15px; text-shadow:0 1px 0 var(--deep); }
  .big { padding:12px 44px; border:4px solid #fff; border-radius:30px; background:var(--gold); color:var(--ink); font:inherit; font-size:20px; cursor:pointer; box-shadow:0 4px 0 var(--deep); }
  .big:active { transform:translateY(3px); box-shadow:0 1px 0 var(--deep); }
  .home-btn { position: fixed; right: 12px; bottom: 12px; z-index: 9999; padding: 8px 14px; border-radius: 999px;
    background: #000a; color: #fff; font: 700 14px/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    text-decoration: none; border: 1px solid #fff6; }
  .home-btn:active { transform: translateY(2px); }
</style>
</head>
<body>
<a class="home-btn" href="../">🏠 메인 메뉴</a>

<div id="game">
  <div class="awning"><div class="hearts"><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span></div></div>
  <div class="sign">🦴 척추의 해장국집</div>

  <div class="hud">
    <div class="timebox">Time <span id="time">120</span>
      <div class="timebar"><div id="timefill"></div></div></div>
    <div class="cnt">🍲<br><b id="count">0</b>그릇</div>
    <div class="lcd"><small>수입금</small><b id="money-total">0</b></div>
  </div>

  <div class="shelf" id="shelf"></div>
  <div id="hint">재료를 고르고 → 냄비를 눌러요</div>

  <div class="mid">
    <svg id="chuk" viewBox="30 0 120 170" shape-rendering="crispEdges" aria-label="척추">
      <g fill="#f2efd0" stroke="#b7b28b" stroke-width="2">
        <rect x="52" y="124" width="14" height="36"/><rect x="84" y="124" width="14" height="36"/>
        <rect x="44" y="156" width="26" height="10" fill="#25211e" stroke="none"/><rect x="80" y="156" width="26" height="10" fill="#25211e" stroke="none"/>
        <rect x="46" y="108" width="58" height="18" rx="2"/>
      </g>
      <g fill="#b7b28b"><rect x="66" y="62" width="18" height="48"/></g>
      <g fill="#f2efd0" stroke="#b7b28b" stroke-width="1">
        <rect x="68" y="64" width="14" height="7"/><rect x="68" y="74" width="14" height="7"/><rect x="68" y="84" width="14" height="7"/><rect x="68" y="94" width="14" height="7"/>
      </g>
      <g fill="none" stroke="#fffbe3" stroke-width="5">
        <path d="M66 70 Q40 72 40 80"/><path d="M84 70 Q110 72 110 80"/>
        <path d="M66 82 Q38 84 40 94"/><path d="M84 82 Q112 84 110 94"/>
        <path d="M66 94 Q44 96 46 106"/><path d="M84 94 Q106 96 104 106"/>
      </g>
      <!-- 앞치마 -->
      <path d="M52 78 H98 V128 H52Z" fill="#fff3a8" opacity=".92" stroke="#f0c040" stroke-width="2"/>
      <path d="M68 96 q7 -10 14 0 q-7 14 -14 0z" fill="#ff8a3d"/><path d="M75 90 q2 -6 6 -6" stroke="#4aa83a" stroke-width="3" fill="none"/>
      <g fill="none" stroke="#f2efd0" stroke-width="7"><path d="M40 68 L22 92"/><path d="M110 68 L130 90"/></g>
      <rect x="126" y="62" width="4" height="40" fill="#8a5a3a"/><ellipse cx="128" cy="104" rx="10" ry="7" fill="#aaa"/>
      <g>
        <rect x="42" y="14" width="66" height="44" rx="12" fill="#f2efd0" stroke="#b7b28b" stroke-width="2"/>
        <rect x="52" y="52" width="46" height="16" fill="#f2efd0" stroke="#b7b28b" stroke-width="2"/>
        <rect x="50" y="26" width="20" height="18" fill="#25211e"/><rect x="80" y="26" width="20" height="18" fill="#25211e"/>
        <rect x="58" y="32" width="6" height="6" fill="#d9402e"/><rect x="86" y="32" width="6" height="6" fill="#d9402e"/>
        <rect x="72" y="44" width="6" height="7" fill="#25211e"/>
        <rect x="56" y="56" width="38" height="6" fill="#25211e"/>
        <g fill="#fffbe3"><rect x="58" y="54" width="5" height="9"/><rect x="66" y="54" width="5" height="9"/><rect x="74" y="54" width="5" height="9"/><rect x="82" y="54" width="5" height="9"/><rect x="90" y="54" width="4" height="9"/></g>
      </g>
      <!-- 요리사 모자 -->
      <path d="M52 16 H98 L94 -2 Q75 -10 56 -2Z" fill="#fff3a8" stroke="#f0c040" stroke-width="2" transform="translate(0,8)"/>
      <path d="M67 14 q4 -6 8 0 q4 -6 8 0 q-8 10 -16 0z" fill="#ff7aa8" transform="translate(0,-2)"/>
      <rect x="48" y="62" width="54" height="9" fill="#cc4029"/><rect x="90" y="60" width="16" height="14" fill="#e65a37"/>
      <g fill="#cc4029"><path d="M104 66 L146 52 L146 60 L106 72Z"/><path d="M104 68 L148 68 L148 76 L106 74Z"/><path d="M104 70 L144 84 L142 92 L104 76Z" fill="#842a20"/></g>
    </svg>
    <div id="bubble">지금부터 맛있는 뼈해장국을 끓여 볼까요?</div>
    <div class="tray"><div id="bowl"></div><div id="pay"></div></div>
  </div>

  <div class="counter"><div class="stove" id="stove"></div></div>
  <div class="drawers"><div></div><div></div><div></div></div>

  <div id="start" class="overlay">
    <h1>🦴 척추의 해장국집 🍲</h1>
    <p>버너 <b>6개</b>로 120초 동안 최대한 많은 뼈해장국을 끓여요!<br>
    선반에서 재료를 고르고 → 냄비를 눌러 넣어요.<br>
    <b>주전자(물) → 등뼈 → 양념 → 재료(최대 2개) → 불 → 끓이기</b><br>
    초록 구간에 맞출수록, 정석 재료일수록 돈을 많이 받아요.<br>
    끓이다 방치하면 타버려요!</p>
    <button class="big" id="startBtn">영업 시작</button>
    <div id="best" style="margin-top:12px;font-size:14px"></div>
  </div>
  <div id="end" class="overlay hidden">
    <h1>영업 종료!</h1>
    <p id="endText"></p>
    <button class="big" id="againBtn">다시 영업하기</button>
  </div>
</div>

<script>
const TOOLS = [
  { id:'kettle',   icon:'🫖', name:'주전자' },
  { id:'bone',     icon:'🦴', name:'등뼈' },
  { id:'season',   icon:'🌶️', name:'양념' },
  { id:'ugeoji',   icon:'🥬', name:'우거지', score:20 },
  { id:'potato',   icon:'🥔', name:'감자',   score:20 },
  { id:'perilla',  icon:'🌿', name:'들깨가루', score:10 },
  { id:'scallion', icon:'🧅', name:'대파',   score:8 },
  { id:'fire',     icon:'🔥', name:'불 켜기' },
];
const ING_IDS = ['ugeoji','potato','perilla','scallion'];
const GAME_TIME = 120, N = 6, COOK_SPEED = 11, BURN_AT = 100;
const STEP_TAG = { '-1':'빈 버너', 0:'물 붓는 중', 1:'등뼈', 2:'양념', 3:'재료', 4:'끓이는 중', 5:'완성!', 6:'탔다' };
const NEED = { '-1':'🫖', 0:'👆', 1:'🦴', 2:'🌶️', 3:'🥬', 4:'👆', 5:'🍽️', 6:'🗑️' };
const $ = id => document.getElementById(id);
let time, bowls, total, running, pots, timer, raf, tool = null;

function say(t) { $('bubble').textContent = t; }
function bounce() { const c = $('chuk'); c.classList.remove('bounce'); void c.getBoundingClientRect(); c.classList.add('bounce'); }
function bestGet() { try { return +localStorage.getItem('chukBest') || 0; } catch (e) { return 0; } }
function bestSet(v) { try { localStorage.setItem('chukBest', v); } catch (e) {} }
function showBest() { $('best').textContent = bestGet() ? `최고 기록: ${bestGet().toLocaleString()}원` : ''; }
function updateHud() { $('time').textContent = time; $('timefill').style.width = (time / GAME_TIME * 100) + '%'; $('count').textContent = bowls; $('money-total').textContent = total.toLocaleString(); }

// step: -1 빈 버너, 0 물, 1 등뼈, 2 양념, 3 재료, 4 끓이기, 5 완성, 6 탐
const mkPot = () => ({ step:-1, v:0, dir:1, sel:[], q:{ w:0, i:0, c:0 } });

function buildShelf() {
  $('shelf').innerHTML = TOOLS.map(t => `<button class="tool" data-id="${t.id}"><span>${t.icon}</span>${t.name}</button>`).join('');
  document.querySelectorAll('.tool').forEach(b => b.onclick = () => pick(b.dataset.id));
}
function pick(id) {
  if (!running) return;
  tool = tool === id ? null : id;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('sel', b.dataset.id === tool));
  const t = TOOLS.find(x => x.id === tool);
  $('hint').textContent = t ? `${t.icon} ${t.name} 선택! 냄비를 눌러요` : '재료를 고르고 → 냄비를 눌러요';
}

function start() {
  time = GAME_TIME; bowls = 0; total = 0; running = true; tool = null;
  pots = Array.from({ length:N }, mkPot);
  $('start').classList.add('hidden'); $('end').classList.add('hidden');
  buildShelf(); pick(null); $('bowl').textContent = ''; $('pay').textContent = '';
  $('stove').innerHTML = pots.map((_, i) => `<div class="pot" id="pot${i}"></div>`).join('');
  pots.forEach((_, i) => render(i));
  updateHud(); say('버너가 여섯 개예요. 쉬지 말고 끓여요!');
  clearInterval(timer);
  timer = setInterval(() => { time--; updateHud(); if (time <= 0) finish(); }, 1000);
  cancelAnimationFrame(raf); let last = performance.now();
  const loop = now => {
    if (!running) return;
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    pots.forEach((p, i) => tick(p, i, dt));
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

function tick(p, i, dt) {
  if (p.step === 0) { p.v += p.dir * dt * 95; if (p.v >= 100) { p.v = 100; p.dir = -1; } else if (p.v <= 0) { p.v = 0; p.dir = 1; } }
  else if (p.step === 4) { p.v += dt * COOK_SPEED; if (p.v >= BURN_AT) { p.step = 6; p.q.c = 0; render(i); say('앗, 하나 탔어요!'); return; } }
  else return;
  const n = $('n' + i); if (n) n.style.left = `calc(${p.v}% - ${p.v * .05}px)`;
}

function render(i) {
  const p = pots[i], el = $('pot' + i); if (!el) return;
  const s = p.step;
  const soup = s === 4 ? 'boil' : s >= 5 ? 'broth' : s === 2 || s === 3 ? 'water' : s === 1 ? 'water' : s === 0 ? 'water' : '';
  const broth = s >= 3 ? ' broth' : '';
  const gauge = s === 0 ? `<div class="pg"><div class="z" style="left:65%;width:20%"></div><div class="n" id="n${i}"></div></div>`
    : s === 4 ? `<div class="pg"><div class="z" style="left:55%;width:20%"></div><div class="n" id="n${i}"></div></div>` : '';
  const items = (s === 1 || s === 2 ? '' : '') + (s >= 2 ? '🦴' : '') + p.sel.map(id => TOOLS.find(t => t.id === id).icon).join('');
  const need = s === 3 ? (p.sel.length ? '🔥' : '🥬') : NEED[s];
  el.className = 'pot' + (s === 5 ? ' ready' : s === 6 ? ' burnt' : '');
  el.innerHTML = `<div class="tag">버너 ${i + 1} · ${STEP_TAG[s]}</div><div class="need">${need}</div>${gauge}
    ${s === 4 ? '<div class="steam">♨️</div>' : ''}
    <div class="pan"><div class="rim"><div class="soup ${soup}${s >= 3 && s !== 4 ? ' broth' : ''}"></div></div>
      <div class="items">${items}</div>${s === 5 ? '<div class="face">😋</div>' : s === 6 ? '<div class="face">💀</div>' : ''}</div>
    ${s === 4 ? '<div class="flame">🔥🔥</div>' : ''}<div class="burner"></div>`;
  el.onclick = () => tapPot(i);
}

function deny(i, msg) {
  const el = $('pot' + i); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  if (msg) say(msg);
}

function tapPot(i) {
  if (!running) return;
  const p = pots[i], s = p.step;
  if (s === -1) {
    if (tool !== 'kettle') return deny(i, '먼저 주전자로 물부터 부어요!');
    p.step = 0; p.v = 0; p.dir = 1;
  } else if (s === 0) {
    const d = Math.abs(p.v - 75);
    p.q.w = d <= 10 ? 20 : Math.max(0, Math.round(20 - (d - 10) * .8));
    p.step = 1; say(d <= 10 ? '물 양이 딱이에요!' : '물이 좀 어색해요…');
  } else if (s === 1) {
    if (tool !== 'bone') return deny(i, '등뼈를 넣을 차례예요!');
    p.step = 2;
  } else if (s === 2) {
    if (tool !== 'season') return deny(i, '양념을 넣을 차례예요!');
    p.step = 3;
  } else if (s === 3) {
    if (ING_IDS.includes(tool)) {
      if (p.sel.includes(tool)) return deny(i, '이미 넣었어요!');
      if (p.sel.length >= 2) return deny(i, '재료는 두 개까지예요!');
      p.sel.push(tool);
      if (p.sel.length < 2) return render(i);
    } else if (tool !== 'fire') return deny(i, '재료를 넣거나 불을 켜요!');
    p.q.i = Math.min(40, p.sel.reduce((a, id) => a + TOOLS.find(t => t.id === id).score, 0));
    p.step = 4; p.v = 0;
  } else if (s === 4) {
    const d = Math.abs(p.v - 65);
    p.q.c = d <= 10 ? Math.round(40 - d * 1.5) : Math.max(0, Math.round(25 - (d - 10) * .8));
    p.step = 5; say(d <= 10 ? '불 끄는 타이밍 완벽!' : '조금 아쉬워요…');
  } else if (s === 5) return serve(i);
  else if (s === 6) { pots[i] = mkPot(); say('다시 끓여봐요!'); }
  render(i);
}

function serve(i) {
  const p = pots[i], Q = Math.min(100, p.q.w + p.q.i + p.q.c);
  const pay = Math.round((1000 + Q * 140) / 100) * 100;
  bowls++; total += pay; updateHud(); bounce();
  $('bowl').textContent = Q >= 90 ? '🍲✨' : '🍲';
  const pe = $('pay'); pe.textContent = '+' + pay.toLocaleString(); pe.classList.remove('pop'); void pe.offsetWidth; pe.classList.add('pop');
  say(`${Q}점! ` + (Q >= 90 ? '이게 바로 정석이에요!' : Q >= 65 ? '맛있게 됐어요~' : '다음엔 더 잘할 수 있어요!'));
  pots[i] = mkPot(); render(i);
}

function finish() {
  running = false; clearInterval(timer); cancelAnimationFrame(raf);
  const best = bestGet(); let note = '';
  if (total > best) { bestSet(total); note = '<br>🏆 신기록!'; }
  $('endText').innerHTML = `${bowls}그릇 판매<br>총 수입금 <b style="font-size:26px">${total.toLocaleString()}원</b>${note}`;
  $('end').classList.remove('hidden');
}

$('startBtn').onclick = start; $('againBtn').onclick = start;
showBest();
</script>
