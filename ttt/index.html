<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>틱택토 VS 봇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 16px;
  }
  .hidden { display: none !important; }
  #app {
    background: #fff; border-radius: 28px; padding: 24px; width: 100%; max-width: 720px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  h1 {
    text-align: center; font-size: 2.2em; margin-bottom: 6px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { text-align: center; color: #6b7280; margin-bottom: 20px; font-size: .95em; }

  /* ---------- 메뉴 ---------- */
  .levels { display: grid; gap: 12px; margin-bottom: 18px; }
  .level-card {
    display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 2px solid #e5e7eb;
    border-radius: 18px; background: #f9fafb; cursor: pointer; text-align: left; font: inherit;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .level-card:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.12); border-color: var(--c); }
  .level-card .face {
    width: 64px; height: 64px; border-radius: 50%; background: #fff; border: 3px solid var(--c);
    display: flex; align-items: center; justify-content: center; font-size: 34px; overflow: hidden; flex: none;
  }
  .level-card .face img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .level-card .info { flex: 1; }
  .level-card .lv { font-weight: 800; font-size: 1.2em; color: var(--c); }
  .level-card .desc { color: #6b7280; font-size: .85em; margin-top: 2px; }
  .level-card .rec { text-align: right; font-size: .8em; color: #6b7280; white-space: nowrap; }
  .level-card .rec b { color: #111827; }
  .order { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
  .order label {
    flex: 1; text-align: center; padding: 10px; border-radius: 12px; background: #f3f4f6;
    font-weight: 700; cursor: pointer; border: 2px solid transparent; color: #374151;
  }
  .order input { display: none; }
  .order input:checked + span { color: #4f46e5; }
  .order label:has(input:checked) { border-color: #667eea; background: #eef2ff; }
  .reset-rec { display: block; margin: 12px auto 0; background: none; border: none; color: #9ca3af; font-size: .8em; cursor: pointer; text-decoration: underline; }

  /* ---------- 게임 ---------- */
  .stage { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 14px; min-height: 190px; }
  .char { width: 38%; max-width: 230px; flex: none; text-align: center; position: relative; }
  .char-frame {
    height: 190px; display: flex; align-items: flex-end; justify-content: center;
    border-radius: 20px; background: radial-gradient(circle at 50% 80%, var(--c-soft), transparent 70%);
  }
  .char img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; transition: transform .2s; }
  .char img.pop { animation: pop .35s ease; }
  @keyframes pop { 0% { transform: scale(.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .char .emoji { font-size: 110px; line-height: 1; padding-bottom: 8px; }
  .char .nameplate {
    display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 999px;
    background: var(--c); color: #fff; font-weight: 800; font-size: .8em;
  }
  .bubble {
    position: relative; flex: 1; min-height: 84px; padding: 14px 16px; border-radius: 18px;
    background: #f3f4f6; border: 2px solid var(--c); font-size: 1.05em; line-height: 1.5;
    color: #111827; margin-bottom: 36px; word-break: keep-all;
  }
  .bubble::before {
    content: ""; position: absolute; left: -12px; bottom: 22px; width: 0; height: 0;
    border: 10px solid transparent; border-right-color: var(--c); border-left: 0;
  }
  .status { text-align: center; font-weight: 800; height: 28px; margin-bottom: 8px; font-size: 1.1em; }
  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #f3f4f6;
    padding: 12px; border-radius: 20px; max-width: 360px; margin: 0 auto 12px;
  }
  .cell {
    aspect-ratio: 1; background: #fff; border: none; border-radius: 14px; font-size: 2.8em; font-weight: 800;
    cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,.1); transition: transform .15s;
  }
  .cell:hover:not(:disabled) { transform: scale(1.05); }
  .cell:disabled { cursor: default; }
  .cell.x { color: #3b82f6; } .cell.o { color: #ef4444; }
  .cell.win { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
  .cell.last { outline: 3px solid #a5b4fc; }
  .stats { text-align: center; color: #6b7280; font-size: .8em; margin-bottom: 14px; min-height: 1.2em; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    padding: 13px; border: none; border-radius: 14px; font-size: 1em; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }
  .btn.gray { background: linear-gradient(135deg, #6b7280, #4b5563); }
  .btn:active { transform: translateY(2px); }

  @media (max-width: 520px) {
    #app { padding: 16px; border-radius: 22px; }
    .stage { flex-direction: column; align-items: center; }
    .char { width: 55%; }
    .bubble { margin-bottom: 0; width: 100%; }
    .bubble::before { left: 50%; top: -12px; bottom: auto; margin-left: -10px; border: 10px solid transparent; border-bottom-color: var(--c); border-top: 0; }
  }

  /* 메인 메뉴로 돌아가기 버튼 (모든 게임 공통) */
  .home-btn { position: fixed; right: 12px; bottom: 12px; z-index: 9999; padding: 8px 14px; border-radius: 999px;
    background: #000a; color: #fff; font: 700 14px/1 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    text-decoration: none; border: 1px solid #fff6; }
  .home-btn:active { transform: translateY(2px); }
</style>

<body>
<a class="home-btn" href="../">🏠 메인 메뉴</a>

<div id="app">
  <h1>틱택토 VS 봇</h1>

  <!-- 난이도 선택 -->
  <section id="menu">
    <p class="sub">알파-베타 가지치기 봇에게 도전! 상대를 골라보세요.</p>

      <label><input type="radio" name="order" value="first" checked><span>⭕ 내가 선공 (X)</span></label>

    </div>

  </section>

    <div class="board" id="board"></div>
    <div class="stats" id="stats"></div>
    <div class="buttons">

<script>
/* =====================================================================
   캐릭터 / 대본 설정  ← 대본과 이미지는 여기만 고치면 됨
   - depth      : 알파-베타 탐색 깊이
   - img        : mood별 이미지 (ttt/img/ 아래). 파일이 없으면 emoji로 대체 표시됨
                  mood: start(시작/기본) · blunder(플레이어 블런더) · win(봇 승리) · lose(봇 패배)
                  지정 안 한 mood는 start 이미지를 씀
   - lines      : 상황별 대사 (여러 개 중 랜덤, 직전 대사는 반복 안 함)
       start   게임 시작
       move    평범한 수 뒤
       block   봇이 플레이어의 승리를 막았을 때
       threat  봇이 이기기 직전(리치)을 만들었을 때
       blunder 플레이어가 블런더(결과가 나빠지는 수)를 뒀을 때 (봇의 실수에는 반응 안 함)
       win     봇 승리   lose  봇 패배   draw  무승부
   ===================================================================== */
const LEVELS = {

      blunder: ['…(째려봄)', '방금 그 수 뭐야? 내가 다 민망하다.', '야… 진심이냐? 구라 안 치고 말한다. 그건 아니야.', '와, 이건 내 구라보다 심한데?'],
      win:     ['엥 내가 이겼네? 이거 운빨 아님? ㅋㅋ 눕는다~', '나 오늘 처음 해본 건데 이겼다. (구라)', '아 이겼다… 이제 좀 쉬자. 누워서.'],

      draw:    ['비겼네. 사실 내가 일부러 비긴 거다.', '무승부… 이기려면 이길 수 있었는데 봐준 거임.', '(담배 연기) 이게 내 실력의 50%다.'],

/* ============================ 알파-베타 탐색 ============================ */
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const other = p => (p === 'X' ? 'O' : 'X');
let nodes = 0, prunes = 0;

function winnerOf(b) {
  for (const [x, y, z] of LINES) if (b[x] && b[x] === b[y] && b[x] === b[z]) return { mark: b[x], line: [x, y, z] };
  return null;
}
const isFull = b => b.every(Boolean);

// me 입장의 점수. 빨리 이길수록 / 늦게 질수록 높다. depth 한계에 닿으면 0.
function search(b, turn, depth, alpha, beta, ply, me) {
  nodes++;
  const w = winnerOf(b);
  if (w) return w.mark === me ? 100 - ply : ply - 100;
  if (depth === 0 || isFull(b)) return 0;
  const maximizing = turn === me;
  let best = maximizing ? -Infinity : Infinity;
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = turn;
    const s = search(b, other(turn), depth - 1, alpha, beta, ply + 1, me);
    b[i] = null;
    if (maximizing) { if (s > best) best = s; if (best > alpha) alpha = best; }
    else            { if (s < best) best = s; if (best < beta) beta = best; }
    if (beta <= alpha) { prunes++; break; }
  }
  return best;
}

// depth만큼 읽어서 최고 점수 수 중 하나를 무작위로 고른다.
function chooseMove(b, mark, depth) {
  let bestScore = -Infinity, cands = [];
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = mark;
    const s = search(b, other(mark), depth - 1, -Infinity, Infinity, 1, mark);
    b[i] = null;
    if (s > bestScore) { bestScore = s; cands = [i]; }
    else if (s === bestScore) cands.push(i);
  }
  return cands[Math.floor(Math.random() * cands.length)];
}

// 끝까지 읽은 게임이론 값(-1 / 0 / 1), mark 입장
function perfectValue(b, turn, mark) {
  const sn = nodes, sp = prunes;
  const v = Math.sign(search(b, turn, 9, -Infinity, Infinity, 0, mark));
  nodes = sn; prunes = sp;   // 화면 통계에 섞이지 않게 복구
  return v;
}

// 플레이어가 둔 수가 결과를 나쁘게 만들었는가 (이기던 판 → 비김, 비기던 판 → 짐)
function isBlunder(before, idx, human) {
  const bot = other(human);
  const b = before.slice();
  const vBefore = perfectValue(b, human, human);
  b[idx] = human;
  const vAfter = perfectValue(b, bot, human);
  return vAfter < vBefore;
}

// mark가 한 수만 더 두면 이기는 칸 목록
function winningCells(b, mark) {
  const out = [];
  for (const l of LINES) {
    const m = l.filter(i => b[i] === mark).length, e = l.filter(i => !b[i]);
    if (m === 2 && e.length === 1) out.push(e[0]);
  }
  return out;
}

/* ============================== 게임 상태 ============================== */
const $ = id => document.getElementById(id);
let level = null, human = 'X', bot = 'O', board = [], turn = 'X', over = false, busy = false;
let lastIdx = -1, lastLine = '', typeTimer = null, botTimer = null, curLevelKey = 'beginner';

/* ============================== 전적 ============================== */
const REC_KEY = 'ttt_record_v2';
const loadRec = () => { try { return JSON.parse(localStorage.getItem(REC_KEY)) || {}; } catch (e) { return {}; } };
function addRec(key, r) {
  const rec = loadRec(); rec[key] = rec[key] || { w: 0, d: 0, l: 0 }; rec[key][r]++;
  try { localStorage.setItem(REC_KEY, JSON.stringify(rec)); } catch (e) {}
}

/* ============================== 메뉴 ============================== */
function renderMenu() {
  const rec = loadRec();
  $('levels').innerHTML = '';
  for (const [key, L] of Object.entries(LEVELS)) {
    const r = rec[key] || { w: 0, d: 0, l: 0 };
    const btn = document.createElement('button');
    btn.className = 'level-card'; btn.style.setProperty('--c', L.color);
    const face = L.img.start ? `<img src="${L.img.start}" alt="" onerror="this.replaceWith(document.createTextNode('${L.emoji.start}'))">` : L.emoji.start;
    btn.innerHTML = `<div class="face">${face}</div>
      <div class="info"><div class="lv">${L.name} · ${L.nick}</div><div class="desc">${L.desc}</div></div>
      <div class="rec"><b>${r.w}</b>승 <b>${r.d}</b>무 <b>${r.l}</b>패</div>`;
    btn.onclick = () => startGame(key);
    $('levels').appendChild(btn);
  }
}
$('resetRec').onclick = () => {
  if (confirm('전적을 모두 지울까요?')) { try { localStorage.removeItem(REC_KEY); } catch (e) {} renderMenu(); }
};

/* ============================== 캐릭터 ============================== */
function setMood(mood) {
  const L = level, img = $('charImg'), em = $('charEmoji');
  const src = L.img[mood] || L.img.start;
  em.textContent = L.emoji[mood] || L.emoji.start;
  const showEmoji = () => { img.classList.add('hidden'); em.classList.remove('hidden'); };
  if (src) {
    img.onerror = showEmoji;
    img.onload = () => { img.classList.remove('hidden'); em.classList.add('hidden'); };
    img.classList.remove('hidden'); em.classList.add('hidden');
    img.src = src;
  } else showEmoji();
  img.classList.remove('pop'); void img.offsetWidth; img.classList.add('pop');
  em.classList.remove('pop');
}

function say(kind) {
  const pool = level.lines[kind].filter(t => t !== lastLine);
  const text = pool[Math.floor(Math.random() * pool.length)] || level.lines[kind][0];
  lastLine = text;
  clearInterval(typeTimer);
  const el = $('bubble'); el.textContent = '';
  let i = 0;
  typeTimer = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) clearInterval(typeTimer);
  }, 28);
}

/* ============================== 진행 ============================== */
function startGame(key) {
  curLevelKey = key; level = LEVELS[key];
  human = document.querySelector('input[name=order]:checked').value === 'first' ? 'X' : 'O';
  bot = other(human);
  document.documentElement.style.setProperty('--c', level.color);
  document.documentElement.style.setProperty('--c-soft', level.soft);
  $('charName').textContent = `${level.name} · ${level.nick}`;
  $('menu').classList.add('hidden'); $('game').classList.remove('hidden');
  newRound();
}

function newRound() {
  clearTimeout(botTimer);
  board = Array(9).fill(null); turn = 'X'; over = false; busy = false; lastIdx = -1; lastLine = '';
  nodes = 0; prunes = 0;
  setMood('start'); say('start');
  renderBoard(); renderStatus(); renderStats();
  if (bot === 'X') { busy = true; botTimer = setTimeout(() => botMove(false), 1100); }
}

function renderBoard(winLine = []) {
  const el = $('board'); el.innerHTML = '';
  board.forEach((m, i) => {
    const c = document.createElement('button');
    c.className = 'cell' + (m ? ' ' + m.toLowerCase() : '') + (winLine.includes(i) ? ' win' : '') + (i === lastIdx ? ' last' : '');
    c.textContent = m || '';
    c.disabled = over || busy || !!m || turn !== human;
    c.onclick = () => humanMove(i);
    el.appendChild(c);
  });
}

function renderStatus(text, color) {
  const el = $('status');
  if (text) { el.textContent = text; el.style.color = color; return; }
  el.textContent = turn === human ? `내 차례 (${human})` : '봇이 생각 중…';
  el.style.color = turn === human ? (human === 'X' ? '#3b82f6' : '#ef4444') : '#6b7280';
}

function renderStats() {
  $('stats').textContent = nodes ? `🔍 봇이 탐색한 노드 ${nodes.toLocaleString()}개 · ✂️ 가지치기 ${prunes.toLocaleString()}번` : '';
}

function humanMove(i) {
  if (over || busy || board[i] || turn !== human) return;
  const blunder = isBlunder(board, i, human);
  board[i] = human; lastIdx = i;
  if (finishIfOver()) return;
  turn = bot; busy = true;
  renderBoard(); renderStatus();
  botTimer = setTimeout(() => botMove(blunder), 650);
}

function botMove(playerBlundered) {
  nodes = 0; prunes = 0;
  const humanThreats = winningCells(board, human);
  const idx = chooseMove(board, bot, level.depth);
  const blocked = humanThreats.includes(idx);
  board[idx] = bot; lastIdx = idx;
  renderStats();
  if (finishIfOver()) return;
  const threat = winningCells(board, bot).length > 0;

  let kind = 'move', mood = 'start';
  if (playerBlundered) { kind = 'blunder'; mood = 'blunder'; }
  else if (threat)     { kind = 'threat'; }
  else if (blocked)    { kind = 'block'; }
  setMood(mood); say(kind);

  turn = human; busy = false;
  renderBoard(); renderStatus();
}

function finishIfOver() {
  const w = winnerOf(board);
  if (!w && !isFull(board)) return false;
  over = true; busy = false;
  renderBoard(w ? w.line : []);
  if (w && w.mark === human) {
    addRec(curLevelKey, 'w'); setMood('lose'); say('lose'); renderStatus('🎉 승리!', '#16a34a');
  } else if (w) {
    addRec(curLevelKey, 'l'); setMood('win'); say('win'); renderStatus('😵 패배…', '#dc2626');
  } else {
    addRec(curLevelKey, 'd'); setMood('start'); say('draw'); renderStatus('🤝 무승부', '#6b7280');
  }
  return true;
}

$('again').onclick = newRound;
$('back').onclick = () => {
  clearTimeout(botTimer); clearInterval(typeTimer);
  $('game').classList.add('hidden'); $('menu').classList.remove('hidden'); renderMenu();
};

renderMenu();
</script>
</body>
</html>
