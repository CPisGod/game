<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임천국</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 32px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    background: #0f1115;
    color: #e8eaed;
  }
  h1 { margin: 0; font-size: clamp(28px, 6vw, 40px); font-weight: 700; letter-spacing: -0.5px; }
  .sub { margin: 0 0 20px; font-size: 15px; color: #8b93a1; }
  .menu { display: flex; flex-direction: column; gap: 12px; width: min(360px, 100%); }
  .menu a {
    display: block; padding: 18px 20px; border-radius: 14px;
    background: #1a1d24; border: 1px solid #2a2e38;
    color: #e8eaed; text-decoration: none; font-size: 20px; font-weight: 600;
    transition: transform .15s, border-color .15s, background .15s;
  }
  .menu a:hover { transform: translateY(-2px); border-color: #5b8cff; background: #1f232c; }
  .menu a small { display: block; margin-top: 4px; font-size: 13px; font-weight: 400; color: #8b93a1; }
  .foot { margin-top: 20px; font-size: 13px; color: #5d6574; }
</style>
</head>
<body>
  <h1>게임천국</h1>
  <p class="sub">하고 싶은 게임을 골라보세요</p>
  <div class="menu">
    <a href="mango/">🥭 mango<small>망고가 망고했다</small></a>
    <a href="doo/">💀 doo<small>죽음이 기다린다</small></a>
    <a href="knife/">🔪 knife<small>얼굴에 칼꽂기</small></a>
    <a href="ttt/">❌⭕ ttt<small>삼목 대결</small></a>
    <a href="streetfighter/">👊 streetfighter<small>도트 대전 격투 (2인)</small></a>
    <a href="tetris/">🧱 tetris<small>SRS · 젠 모드</small></a>
  </div>
  <p class="foot">누르면 후회할 수도 있고 안 할 수도 있음</p>
</body>
</html>
